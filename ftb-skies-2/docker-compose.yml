# Hinweise:
# - WORLD_NAME: Name der Welt-Datei (ZIP)
# - FORCE_WORLD_COPY: true = Welt bei jedem Start neu kopieren, false = nur beim ersten Start

services:
  ftb-skies-2:
    image: itzg/minecraft-server:2026.9.1-java25@sha256:e8640538dac5d54c2838d57fa9641e735ad0cf2b71fb0e8a68da3b542a315749
    container_name: ftb-skies-2
    hostname: ftb-skies-2
    pull_policy: daily
    stdin_open: true
    tty: true
    restart: unless-stopped
    ports:
      - "55485:25565"
    volumes:
      - /mnt/user/appdata/minecraft/ftb_skies_2:/data
      - /mnt/user/data/minecraft/ftb_skies_2/backups:/data/ftbbackups3
      - /mnt/user/data/minecraft/ftb_skies_2/worlds:/worlds
    environment:
      EULA: "TRUE"
      TYPE: "FTBA"
      FTB_MODPACK_ID: "129"
#      https://www.feed-the-beast.com/modpacks/129-ftb-skies-2/versions
      FTB_MODPACK_VERSION_ID: "100168"
      INIT_MEMORY: "6G"
      MAX_MEMORY: "8G"
      MAX_PLAYERS: "1"
      TZ: "Europe/Berlin"
      ONLINE_MODE: "true"
      FORCE_WORLD_COPY: ${FORCE_WORLD_COPY:-false}
      WORLD: /worlds/${WORLD_NAME:-world.zip}
      OPS: |-
        44b03ad5-bdea-4578-b500-7ea9916c611d
      ENABLE_WHITELIST: "true"
      WHITELIST: |-
        44b03ad5-bdea-4578-b500-7ea9916c611d
    healthcheck:
      test: mc-health
      start_period: 1m
      interval: 5s
      retries: 20