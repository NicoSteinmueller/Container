version: "3.9"

# ============================================
# KONFIGURIERBARE VARIABLEN (in Portainer ändern)
# ============================================
# KEYCLOAK_ADMIN_USER     - Admin-Benutzername (default: admin)
# KEYCLOAK_ADMIN_PASSWORD - Admin-Passwort (default: changeme)
# DB_PASSWORD             - Datenbank-Passwort (default: changeme)
# ============================================

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.0@sha256:5fdd7cda82e58775ed124294c7e16fabc33166d38dfc4aabebda7d64e7a964bf
    container_name: keycloak
    command: start
    environment:
      # Admin-Credentials
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN_USER:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-changeme}

      # Proxy-Konfiguration für Nginx Proxy Manager
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false

      # Datenbank-Konfiguration (PostgreSQL)
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://database:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${DB_PASSWORD:-changeme}

      # Health und Metrics
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    ports:
      - "61348:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - keycloak-network
    restart: unless-stopped

  database:
    image: postgres:18.1-alpine3.23@sha256:b40d931bd0e7ce6eecc59a5a6ac3b3c04a01e559750e73e7086b6dbd7f8bf545
    container_name: keycloak_postgres
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
    volumes:
      - postgres:/var/lib/postgresql
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  keycloak-network:
    driver: bridge

volumes:
  postgres:

