version: "3.9"

# ============================================
# KONFIGURIERBARE VARIABLEN (in Portainer ändern)
# ============================================
# KEYCLOAK_ADMIN_USER     - Admin-Benutzername (default: admin)
# KEYCLOAK_ADMIN_PASSWORD - Admin-Passwort (default: changeme)
# DB_PASSWORD             - Datenbank-Passwort (default: changeme)
# KEYCLOAK_PORT           - Externer Port (default: 8080)
# ============================================

services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start
    environment:
      # Admin-Credentials
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN_USER:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-changeme}

      # Proxy-Konfiguration für Nginx Proxy Manager
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false

      # Datenbank-Konfiguration (PostgreSQL)
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${DB_PASSWORD:-changeme}

      # Health und Metrics
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - keycloak-network
    restart: unless-stopped

  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  keycloak-network:
    driver: bridge

volumes:
  keycloak-db-data:

