version: "3.9"

# ============================================
# KONFIGURIERBARE VARIABLEN (in Portainer ändern)
# ============================================
# KEYCLOAK_ADMIN_USER     - Admin-Benutzername (default: admin)
# KEYCLOAK_ADMIN_PASSWORD - Admin-Passwort (default: changeme)
# DB_PASSWORD             - Datenbank-Passwort (default: changeme)
# ============================================

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5@sha256:a7b0cb7a43a1235a61872883414d3f1d9a3ceac9df6e5907bd12202778a6265c
    container_name: keycloak
    command: start
    environment:
      # Admin-Credentials
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USER:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-changeme}

      # Proxy-Konfiguration für Traefik
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=true
      - KC_HOSTNAME=keycloak.nico-steinmueller.de
      - KC_PROXY-HEADERS=xforwarded

      # Datenbank-Konfiguration (PostgreSQL)
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://database:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${DB_PASSWORD:-changeme}

      # Health und Metrics
      # Health-Checks sind standardmäßig auf Port 9000 (Management Interface)
      # Falls benötigt, kann mit --health-enabled=true beim Build aktiviert werden
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    # Port-Mapping für Traefik nicht nötig, da über Docker-Netzwerk kommuniziert wird
    # ports:
    #   - "61348:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "(exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && timeout 2 cat <&3) | head -1 | grep -q 200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - keycloak-network
      - proxy
    restart: unless-stopped
    labels:
      traefik.enable: true

      # Router für administrative Pfade - nur lokal erreichbar
      traefik.http.routers.keycloak-admin.rule: Host(`keycloak.nico-steinmueller.de`) && (PathPrefix(`/admin`) || PathPrefix(`/realms/master`))
      traefik.http.routers.keycloak-admin.entrypoints: websecure
      traefik.http.routers.keycloak-admin.priority: 100
      traefik.http.routers.keycloak-admin.middlewares: local-only@file, compress@file
      traefik.http.routers.keycloak-admin.service: keycloak

      # Router für alle anderen Pfade - öffentlich erreichbar
      traefik.http.routers.keycloak-public.rule: Host(`keycloak.nico-steinmueller.de`)
      traefik.http.routers.keycloak-public.entrypoints: websecure
      traefik.http.routers.keycloak-public.priority: 50
      traefik.http.routers.keycloak-public.middlewares: crowdsec@file, geoblock@file, compress@file
      traefik.http.routers.keycloak-public.service: keycloak

      # Service Definition (beide Router nutzen denselben Service)
      traefik.http.services.keycloak.loadbalancer.server.port: 8080

  database:
    image: postgres:18.3-alpine3.23@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
    container_name: keycloak_postgres
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
    volumes:
      - postgres:/var/lib/postgresql
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  keycloak-network:
    driver: bridge
  proxy:
    external: true

volumes:
  postgres:

