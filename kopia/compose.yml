name: kopia

services:
  kopia:
    # ------------ Identität ------------------------
    image: kopia/kopia:0.23.1@sha256:89fd95ee2942880ca00eae964266958a394421ddbdf69bca62e38afc55f5900e

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      # Nur prüfen, ob der Server antwortet (401 zählt als gesund) -
      # `kopia repository status` öffnet das Repository neu und läuft unter
      # Last in den Timeout.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:51515/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 2G
          pids: 128
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Speicher -----------
    read_only: true

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true

    # ---------- Environment -----------
    environment:
      TZ: Europe/Berlin