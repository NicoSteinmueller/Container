# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║                    Kopia Backup Server - Umgebungsvariablen                   ║
# ╠═══════════════════════════════════════════════════════════════════════════════╣
# ║ Variable                  │ Beschreibung                          │ Standard  ║
# ╠═══════════════════════════════════════════════════════════════════════════════╣
# ║ INSTANCE                  │ Bezeichnung der Instance              │ main      ║
# ║ KOPIA_DATA_DIR            │ Hauptverzeichnis für Kopia-Daten      │ ./kopia...║
# ║ KOPIA_REPOSITORY_DIR      │ Backup-Repository Speicherort         │ ./backup  ║
# ║ KOPIA_SOURCE_1..20        │ Quellordner Pfad (optional)           │ ./daten   ║
# ║ KOPIA_SOURCE_1..20_NAME   │ Quellordner Name in /data (optional)  │ daten     ║
# ║ KOPIA_REPOSITORY_PASSWORD │ Repository-Verschlüsselungspasswort   │ kopia1#   ║
# ║ KOPIA_SERVER_USERNAME     │ Web-UI Benutzername                   │ admin     ║
# ║ KOPIA_SERVER_PASSWORD     │ Web-UI Passwort                       │ kopia123  ║
# ║ KOPIA_PORT                │ Web-UI Port                           │ 51515     ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

services:
  kopia:
    image: kopia/kopia:0.22.3@sha256:4dcc208c1b191770bf4d0854f8deec06b4a16b35be4b63abdcfa9755cee7960e
    container_name: kopia_${INSTANCE:-main}
    hostname: kopia_${INSTANCE:-main}
    restart: unless-stopped
    networks:
      proxy:
    command:
      - server
      - start
      - --disable-csrf-token-checks
      - --insecure
      - --address=0.0.0.0:51515
      - --server-username=${KOPIA_SERVER_USERNAME:-admin}
      - --server-password=${KOPIA_SERVER_PASSWORD:-kopia123}
    environment:
      KOPIA_PASSWORD: ${KOPIA_REPOSITORY_PASSWORD:-kopia1#}
      TZ: Europe/Berlin
    healthcheck:
      test: ["CMD", "kopia", "repository", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      # Kopia Konfiguration und Cache
      - ${KOPIA_DATA_DIR:-./kopia-data}/config:/app/config
      - ${KOPIA_DATA_DIR:-./kopia-data}/cache:/app/cache
      - ${KOPIA_DATA_DIR:-./kopia-data}/logs:/app/logs

      # Zugriff auf eingebundene Snapshots
      - ${KOPIA_DATA_DIR:-./kopia-data}/snapshot:/tmp:shared

      # Backup-Zielordner (Repository)
      - ${KOPIA_REPOSITORY_DIR:-./backup}:/repository

      # Quellordner - hier die Daten die gesichert werden sollen
      # Jeder Ordner wird in /data/<name> gemappt
      # Produziert Fehler, wenn env nicht gesetzt ist
      - ${KOPIA_SOURCE_1:-./daten}:/data/${KOPIA_SOURCE_1_NAME:-daten}:ro
      - ${KOPIA_SOURCE_2}:/data/${KOPIA_SOURCE_2_NAME}:ro
      - ${KOPIA_SOURCE_3}:/data/${KOPIA_SOURCE_3_NAME}:ro
      - ${KOPIA_SOURCE_4}:/data/${KOPIA_SOURCE_4_NAME}:ro
      - ${KOPIA_SOURCE_5}:/data/${KOPIA_SOURCE_5_NAME}:ro
      - ${KOPIA_SOURCE_6}:/data/${KOPIA_SOURCE_6_NAME}:ro
#      - ${KOPIA_SOURCE_7}:/data/${KOPIA_SOURCE_7_NAME}:ro
#      - ${KOPIA_SOURCE_8}:/data/${KOPIA_SOURCE_8_NAME}:ro
#      - ${KOPIA_SOURCE_9}:/data/${KOPIA_SOURCE_9_NAME}:ro
#      - ${KOPIA_SOURCE_10}:/data/${KOPIA_SOURCE_10_NAME}:ro
#      - ${KOPIA_SOURCE_11}:/data/${KOPIA_SOURCE_11_NAME}:ro
#      - ${KOPIA_SOURCE_12}:/data/${KOPIA_SOURCE_12_NAME}:ro
#      - ${KOPIA_SOURCE_13}:/data/${KOPIA_SOURCE_13_NAME}:ro
#      - ${KOPIA_SOURCE_14}:/data/${KOPIA_SOURCE_14_NAME}:ro
#      - ${KOPIA_SOURCE_15}:/data/${KOPIA_SOURCE_15_NAME}:ro
#      - ${KOPIA_SOURCE_16}:/data/${KOPIA_SOURCE_16_NAME}:ro
#      - ${KOPIA_SOURCE_17}:/data/${KOPIA_SOURCE_17_NAME}:ro
#      - ${KOPIA_SOURCE_18}:/data/${KOPIA_SOURCE_18_NAME}:ro
#      - ${KOPIA_SOURCE_19}:/data/${KOPIA_SOURCE_19_NAME}:ro
#      - ${KOPIA_SOURCE_20}:/data/${KOPIA_SOURCE_20_NAME}:ro

    labels:
      - "traefik.enable=true"
      # Host rule configurable via env var KOPIA_HOST (default kopia.local)
      - "traefik.http.routers.kopia-${INSTANCE:-main}.rule=Host(`kopia-${INSTANCE:-main}.local.nico-steinmueller.de`)"
      - "traefik.http.routers.kopia-${INSTANCE:-main}.entrypoints=websecure"
      - "traefik.http.routers.kopia-${INSTANCE:-main}.middlewares=local-only@file"
      - "traefik.http.services.kopia-${INSTANCE:-main}.loadbalancer.server.port=51515"


networks:
  proxy:
    external: true
