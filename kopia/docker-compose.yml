# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║                    Kopia Backup Server - Umgebungsvariablen                   ║
# ╠═══════════════════════════════════════════════════════════════════════════════╣
# ║ Variable                  │ Beschreibung                          │ Standard  ║
# ╠═══════════════════════════════════════════════════════════════════════════════╣
# ║ INSTANCE                  │ Bezeichnung der Instance              │ main      ║
# ║ KOPIA_REPOSITORY_DIR      │ Backup-Repository Speicherort         │ ./backup  ║
# ║ KOPIA_REPOSITORY_PASSWORD │ Repository-Verschlüsselungspasswort   │ kopia1#   ║
# ║ KOPIA_SERVER_USERNAME     │ Web-UI Benutzername                   │ admin     ║
# ║ KOPIA_SERVER_PASSWORD     │ Web-UI Passwort                       │ kopia123  ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

services:
  kopia:
    image: kopia/kopia:0.23.0@sha256:bd6a449c263465c388339c0637dcd25562e99dcdde286c9d51ade81e138bbf2c
    container_name: kopia_${INSTANCE:-main}
    hostname: kopia_${INSTANCE:-main}
    restart: unless-stopped
    networks:
      proxy:
    command:
      - server
      - start
      - --disable-csrf-token-checks
      - --insecure
      - --address=0.0.0.0:51515
      - --server-username=${KOPIA_SERVER_USERNAME:-admin}
      - --server-password=${KOPIA_SERVER_PASSWORD:-kopia123}
    environment:
      KOPIA_PASSWORD: ${KOPIA_REPOSITORY_PASSWORD:-kopia1#}
      TZ: Europe/Berlin
    healthcheck:
      test: ["CMD", "kopia", "repository", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      # Kopia Konfiguration und Cache
      - /mnt/user/appdata/kopia/${INSTANCE:-main}/config:/app/config
      - /mnt/user/appdata/kopia/${INSTANCE:-main}/cache:/app/cache
      - /mnt/user/logs/kopia/${INSTANCE:-main}:/app/logs

      # Zugriff auf eingebundene Snapshots
      - /mnt/user/data/kopia/${INSTANCE:-main}:/tmp:shared

      # Backup-Zielordner (Repository)
      - ${KOPIA_REPOSITORY_DIR:-./backup}:/repository

      # Quellordner - hier die Daten die gesichert werden sollen
      # Jeder Ordner wird in /data/<name> gemappt
      # Produziert Fehler, wenn env nicht gesetzt ist
      - type: bind
        source: /mnt/user/Bilder
        target: /data/bilder
        read_only: true

      # Apps
      # Adguard
      - type: bind
        source: /mnt/user/appdata/adguard
        target: /data/adguard
        read_only: true

      # Immich
      - type: bind
        source: /mnt/user/data/immich/media
        target: /data/immich/media
        read_only: true

      # Keycloak
      - type: bind
        source: /mnt/user/data/keycloak/db-backup
        target: /data/keycloak/db-backup
        read_only: true

      # Minecraft
      - type: bind
        source: /mnt/user/appdata/minecraft
        target: /data/minecraft/appdata
        read_only: true
      - type: bind
        source: /mnt/user/data/minecraft
        target: /data/minecraft/data
        read_only: true

      # Nextcloud
      - type: bind
        source: /mnt/user/appdata/nextcloud/apps
        target: /data/nextcloud/apps
        read_only: true
      - type: bind
        source: /mnt/user/appdata/nextcloud/config
        target: /data/nextcloud/config
        read_only: true
      - type: bind
        source: /mnt/user/appdata/nextcloud/themes
        target: /data/nextcloud/themes
        read_only: true
      - type: bind
        source: /mnt/user/data/nextcloud/data
        target: /data/nextcloud/data
        read_only: true
      - type: bind
        source: /mnt/user/data/nextcloud/db-backup
        target: /data/nextcloud/db-backup
        read_only: true

      # Octoprint
      - type: bind
        source: /mnt/user/appdata/octoprint/octoprint
        target: /data/octoprint/octoprint
        read_only: true
      - type: bind
        source: /mnt/user/appdata/octoprint/plugins
        target: /data/octoprint/plugins
        read_only: true

      # Paperless
      - type: bind
        source: /mnt/user/appdata/paperless/data
        target: /data/paperless/data
        read_only: true
      - type: bind
        source: /mnt/user/data/paperless/consume
        target: /data/paperless/consume
        read_only: true
      - type: bind
        source: /mnt/user/data/paperless/export
        target: /data/paperless/export
        read_only: true
      - type: bind
        source: /mnt/user/data/paperless/media
        target: /data/paperless/media
        read_only: true

      # SFTPGo
      - type: bind
        source: /mnt/user/appdata/sftpgo/config
        target: /data/sftpgo/config
        read_only: true
      - type: bind
        source: /mnt/user/data/sftpgo/backups
        target: /data/sftpgo/backups
        read_only: true
      - type: bind
        source: /mnt/user/data/sftpgo/data
        target: /data/sftpgo/data
        read_only: true

      # Traefik
      - type: bind
        source: /mnt/user/appdata/traefik
        target: /data/traefik
        read_only: true

      # Linkwarden
      - type: bind
        source: /mnt/user/data/linkwarden/data
        target: /data/linkwarden/data
        read_only: true


    labels:
      - "traefik.enable=true"
      # Host rule configurable via env var KOPIA_HOST (default kopia.local)
      - "traefik.http.routers.kopia-${INSTANCE:-main}.rule=Host(`kopia-${INSTANCE:-main}.local.nico-steinmueller.de`)"
      - "traefik.http.routers.kopia-${INSTANCE:-main}.entrypoints=websecure"
      - "traefik.http.routers.kopia-${INSTANCE:-main}.middlewares=local-only"
      - "traefik.http.services.kopia-${INSTANCE:-main}.loadbalancer.server.port=51515"


networks:
  proxy:
    external: true
