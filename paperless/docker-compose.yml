# ============================================
# KONFIGURIERBARE VARIABLEN (in Portainer ändern)
# ============================================
#
# === INSTANZ-KONFIGURATION ===
# INSTANCE_NAME                - Instanz-Name für eindeutige Container/Volumes/Netzwerke (default: main)
#
# === DATENBANK & SICHERHEIT ===
# DB_PASSWORD                  - PostgreSQL Datenbank-Passwort (default: changeme)
# PAPERLESS_SECRET_KEY         - Django Secret Key mindestens 50 Zeichen (AlphaNum + Sonderzeichen)
#
# === KEYCLOAK / OIDC INTEGRATION ===
# KEYCLOAK_SECRET              - Client Secret fuer Keycloak OIDC (kein Default, nur bei OIDC noetig)
#                              - client_id=paperless_${INSTANCE_NAME:-main}
# PAPERLESS_ALLOW_SIGNUPS      - Automatisches Anlegen von Usern bei erstem SSO-Login (default: false)
# PAPERLESS_DISABLE_REGULAR_LOGIN - Deaktiviert Login-Formular, erzwingt SSO (default: true)
#
# === ERWEITERTE KONFIGURATION ===
# PAPERLESS_IGNORE_DATES       - Komma-getrennte Liste von Daten, die bei Erkennung ignoriert werden
#                                (z.B. Geburtsdaten: "25.04.1985,01.01.2000")
#                                (Default: leer)
# ============================================

services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.20.11@sha256:1919ba5edec278e81d2393efc82c97c9e3e18ef9dfcb43fdcfa7359dd3adfe99
    container_name: paperless_${INSTANCE_NAME:-main}
    environment:
      # https://docs.paperless-ngx.com/configuration/
      # Redis-Konfiguration
      PAPERLESS_REDIS: redis://redis:6379

      # Datenbank-Konfiguration (PostgreSQL)
      PAPERLESS_DBHOST: database
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${DB_PASSWORD:-changeme}

      # Tika und Gotenberg (gemeinsam genutzt)
      PAPERLESS_TIKA_ENABLED: true
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000

      # https://docs.paperless-ngx.com/advanced_usage/#file-name-handling
      PAPERLESS_FILENAME_FORMAT: '{{ document_type }}/{{ created_year }}/{{ created }}-{{ correspondent }}-{{ title }}'

      # Basis-Konfiguration
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-changeme}
      # URL ohe path, z.B. paperless.deine-domain.de
      PAPERLESS_URL: paperless-${INSTANCE_NAME:-main}.nico-steinmueller.de
      # Bei Einsatz hinter Reverse Proxy, um korrekte Host-Header zu verwenden
      PAPERLESS_USE_X_FORWARD_HOST: true
      PAPERLESS_USE_X_FORWARD_PORT: true
      # Cookie Prefix, wichtig bei mehreren Instanzen auf einem Host
      PAPERLESS_COOKIE_PREFIX: ${INSTANCE_NAME:-main}_

      # OpenID Connect für Keycloak SSO
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: '{"openid_connect":{"APPS":[{"provider_id":"keycloak","name":"Keycloak","client_id":"paperless_${INSTANCE_NAME:-main}","secret":"${KEYCLOAK_SECRET}","settings":{"server_url":"https://keycloak.nico-steinmueller.de/realms/mein-realm"}}],"OAUTH_PKCE_ENABLED":true}}'
      # Automatisches Anlegen von Usern bei erstem Login mit Keycloak
      PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: ${PAPERLESS_ALLOW_SIGNUPS:-false}
      # Deaktiviere regulären Login
      PAPERLESS_DISABLE_REGULAR_LOGIN: ${PAPERLESS_DISABLE_REGULAR_LOGIN:-true}
      # Single Logout URL für Keycloak
      PAPERLESS_LOGOUT_REDIRECT_URL: https://keycloak.nico-steinmueller.de/realms/mein-realm/protocol/openid-connect/logout?post_logout_redirect_uri=https://paperless-${INSTANCE_NAME:-main}.nico-steinmueller.de&&client_id=paperless_${INSTANCE_NAME:-main}
      PAPERLESS_SESSION_COOKIE_AGE: 86400  # 1 Tag

      # OCR Sprachen
      PAPERLESS_OCR_LANGUAGE: deu+eng
      # Erstellung von Archivdateien wird nie übersprungen
      PAPERLESS_OCR_SKIP_ARCHIVE_FILE: never
      # Seiten automatisch drehen (90°, 180°, 270°)
      PAPERLESS_OCR_ROTATE_PAGES: true
      # Rotationsschwelle für automatische Seitendrehung (niedriger = aggressiver, 15 = konservativ, 2 = aggressiv (führt oft zu falschen Drehungen))
      PAPERLESS_OCR_ROTATE_PAGES_THRESHOLD: 12
      # Entfernt digitale Signaturen aus PDFs während der OCR-Verarbeitung.
      PAPERLESS_OCR_USER_ARGS: '{"invalidate_digital_signatures": true}'

      # Zeitzone
      PAPERLESS_TIME_ZONE: Europe/Berlin

      # Document Consumption
      # When the consumer detects a duplicate document, it will not touch the original document.
      # Duplikate (Hash gleich) werden beim Import automatisch gelöscht.
      PAPERLESS_CONSUMER_DELETE_DUPLICATES: true
      # Dateien werden auch in Unterordnern des "consume"-Verzeichnisses gesucht.
      PAPERLESS_CONSUMER_RECURSIVE: true

      # Anzahl der vorgeschlagenen ersten gefundenen Daten
      PAPERLESS_NUMBER_OF_SUGGESTED_DATES: 6
      # Daten, die bei der Datumserkennung ignoriert werden sollen (z.B. Geburtsdatum, "25.04.1985,01.01.2000")
      PAPERLESS_IGNORE_DATES: ${PAPERLESS_IGNORE_DATES:-}

      # Sekunden, die der Consumer wartet, bevor er mit der Verarbeitung einer neuen Datei beginnt.
      PAPERLESS_CONSUMER_INOTIFY_DELAY: 30

      # Anzahl der Tage, die Dokumente im Papierkorb verbleiben, bevor sie endgültig gelöscht werden.
      PAPERLESS_EMPTY_TRASH_DELAY: 90

      # Name der Instanz im App-Titel
      PAPERLESS_APP_TITLE: Paperless-ngx ${INSTANCE_NAME:-main}

    volumes:
      # data bleibt als named volume (Container-intern)
      - data:/usr/src/paperless/data
      # consume/export/media werden vom Host gemappt: <BASE>/<INSTANCE>/<ordner>
      - /mnt/user/data/paperless/media/${INSTANCE_NAME:-main}:/usr/src/paperless/media
      - /mnt/user/data/paperless/export/${INSTANCE_NAME:-main}:/usr/src/paperless/export
      - /mnt/user/data/paperless/consume/${INSTANCE_NAME:-main}:/usr/src/paperless/consume
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - paperless-instance-network
      - paperless-shared-network
      - proxy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"

      # Router für /admin - nur lokal erreichbar
      - "traefik.http.routers.paperless-${INSTANCE_NAME:-main}-admin.rule=Host(`paperless-${INSTANCE_NAME:-main}.nico-steinmueller.de`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.paperless-${INSTANCE_NAME:-main}-admin.entrypoints=websecure"
      - "traefik.http.routers.paperless-${INSTANCE_NAME:-main}-admin.priority=100"
      - "traefik.http.routers.paperless-${INSTANCE_NAME:-main}-admin.middlewares=local-only@file, compress@file"
      - "traefik.http.routers.paperless-${INSTANCE_NAME:-main}-admin.service=paperless-${INSTANCE_NAME:-main}"

      # Router für alle anderen Pfade - öffentlich erreichbar
      - "traefik.http.routers.paperless-${INSTANCE_NAME:-main}.rule=Host(`paperless-${INSTANCE_NAME:-main}.nico-steinmueller.de`)"
      - "traefik.http.routers.paperless-${INSTANCE_NAME:-main}.entrypoints=websecure"
      - "traefik.http.routers.paperless-${INSTANCE_NAME:-main}.priority=50"
      # TODO: evtl. local-only@file entfernen, damit die Instanz auch von anderen Geräten im Netzwerk erreichbar ist (z.B. mobile App)
      - "traefik.http.routers.paperless-${INSTANCE_NAME:-main}.middlewares=local-only@file, crowdsec@file, geoblock@file, compress@file"
      - "traefik.http.routers.paperless-${INSTANCE_NAME:-main}.service=paperless-${INSTANCE_NAME:-main}"

      # Service Definition (beide Router nutzen denselben Service)
      - "traefik.http.services.paperless-${INSTANCE_NAME:-main}.loadbalancer.server.port=8000"

  database:
    image: postgres:18.3-alpine3.23@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
    container_name: paperless_${INSTANCE_NAME:-main}_postgres
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres:/var/lib/postgresql
    networks:
      - paperless-instance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: docker.io/valkey/valkey:9.0.3-alpine3.23@sha256:84c96f47ebe197e635cd3ddbe3ab74e8bdf783cf3befbfb1c36387275c1cd5d5
    container_name: paperless_${INSTANCE_NAME:-main}_redis
    networks:
      - paperless-instance-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  # Instanz-spezifisches Netzwerk (DB, Redis)
  paperless-instance-network:
    driver: bridge
    name: paperless_${INSTANCE_NAME:-main}_network

  # Gemeinsames Netzwerk für geteilte Services (Gotenberg, Tika)
  paperless-shared-network:
    external: true
    name: paperless_shared

  # Traefik Proxy Netzwerk
  proxy:
    external: true

volumes:
  postgres:
    name: paperless_${INSTANCE_NAME:-main}_postgres
  data:
    name: paperless_${INSTANCE_NAME:-main}_data
