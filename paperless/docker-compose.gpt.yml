# INSTANCE_NAME           - wird für Container-, Netzwerk- und Hostnamen verwendet.
# PAPERLESS_API_TOKEN     - muss zu der jeweiligen Paperless-Instanz passen.

services:
  paperless-gpt:
    container_name: paperless_${INSTANCE_NAME:-main}_gpt
    restart: unless-stopped
    # Use one of these image sources:
    image: icereed/paperless-gpt:v0.25.1 # Docker Hub
    # image: ghcr.io/icereed/paperless-gpt:latest  # GitHub Container Registry
    environment:
      # Direkte interne Verbindung zur passenden Paperless-Instanz via Netzwerk-Alias.
      PAPERLESS_BASE_URL: http://paperless:8000
      PAPERLESS_PUBLIC_URL: https://paperless-${INSTANCE_NAME:-main}.nico-steinmueller.de
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN} # Required

      MANUAL_TAG: "paperless-gpt" # Optional, default: paperless-gpt
      AUTO_TAG: "paperless-gpt-auto" # Optional, default: paperless-gpt-auto
      AUTO_GENERATE_TITLE: "true" # Optional, default: true
      AUTO_GENERATE_TAGS: "true" # Optional, default: true
      AUTO_GENERATE_CORRESPONDENTS: "true" # Optional, default: true
#      CORRESPONDENT_BLACK_LIST: # Optional, comma-separated list of blacklisted correspondents for auto-generation
      AUTO_GENERATE_DOCUMENT_TYPE: "true" # Optional, default: true
      AUTO_GENERATE_CREATED_DATE: "true" # Optional, default: true
      AUTO_OCR_TAG: "paperless-gpt-ocr-auto" # Optional, default: paperless-gpt-ocr-auto
      PDF_OCR_TAGGING: "true" # Optional, add tag to processed documents
      PDF_OCR_COMPLETE_TAG: "paperless-gpt-ocr-complete" # Optional, tag name

      # LLM Configuration - Ollama (Local)
      LLM_PROVIDER: "ollama"
      LLM_MODEL: "qwen3:8b"
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CONTEXT_LENGTH: "8192" # Sets Ollama NumCtx (context window)
      TOKEN_LIMIT: 1000 # Recommended for smaller models, 0 for no limit
      LLM_LANGUAGE: "German" # Optional, default: English
      LLM_REQUESTS_PER_MINUTE: "20" # Optional, Max requests per minute to LLM provider, default: 120

      # OCR Configuration - LLM-based OCR
      OCR_PROVIDER: "llm" # Default OCR provider
      OCR_PROCESS_MODE: "image" # Optional, default: image, other options: pdf, whole_pdf
      VISION_LLM_PROVIDER: "ollama" # openai, ollama, mistral, or anthropic
      VISION_LLM_MODEL: "glm-ocr:q8_0" # minicpm-v (ollama) or gpt-4o (openai) or claude-sonnet-4-5 (anthropic/claude)
      OCR_LIMIT_PAGES: "5" # TODO: Optional, default: 5. Set to 0 for no limit.minicpm-v
      # OCR Processing Mode
      PDF_SKIP_EXISTING_OCR: "false" # Optional, skip OCR for PDFs with existing OCR

      # Enhanced OCR Features
      PDF_UPLOAD: "false" # Optional, upload enhanced PDFs to paperless-ngx
      PDF_REPLACE: "false" # Optional and DANGEROUS, delete original after upload

      TZ: Europe/Berlin
      LOG_LEVEL: "info" # Optional: debug, warn, error
    volumes:
      - /mnt/user/appdata/paperless/gpt/${INSTANCE_NAME:-main}:/app/prompts
    healthcheck:
      # Prueft den lokalen HTTP-Endpunkt; nutzt curl oder wget je nach Image.
      test: ["CMD-SHELL", "(command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:8080/health >/dev/null) || (command -v wget >/dev/null 2>&1 && wget -q --spider http://localhost:8080/health) || (command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:8080/ >/dev/null) || (command -v wget >/dev/null 2>&1 && wget -q --spider http://localhost:8080/) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
#    ports:
#      - "8080:8080"
    networks:
      - paperless-instance-network
      - llm
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paperless-gpt-${INSTANCE_NAME:-main}.rule=Host(`paperless-gpt-${INSTANCE_NAME:-main}.nico-steinmueller.de`)"
      - "traefik.http.routers.paperless-gpt-${INSTANCE_NAME:-main}.entrypoints=websecure"
      - "traefik.http.routers.paperless-gpt-${INSTANCE_NAME:-main}.middlewares=local-only@file, crowdsec@file, geoblock@file, compress@file"
      - "traefik.http.routers.paperless-gpt-${INSTANCE_NAME:-main}.service=paperless-gpt-${INSTANCE_NAME:-main}"
      - "traefik.http.services.paperless-gpt-${INSTANCE_NAME:-main}.loadbalancer.server.port=8080"

networks:
  # Zugriff auf die laufende Paperless-Instanz (Container paperless_${INSTANCE_NAME}_*)
  paperless-instance-network:
    external: true
    name: paperless_${INSTANCE_NAME:-main}_network

  # Zugriff auf Ollama aus dem LLM-Stack
  llm:
    external: true
    name: llm

  # Traefik Proxy Netzwerk
  proxy:
    external: true

