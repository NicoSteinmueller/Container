# Umgebungsvariablen
# OAUTH_CLIENT_SECRET: Keycloak Client Secret für Open-WebUI

services:
  ollama:
    container_name: ollama
    image: ollama/ollama:0.32.4@sha256:10c13eb515db310990527d36ca14a136da4bcc0fbf2bf3b15e9c1f111e9d3cd4
    pull_policy: always
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      TZ: Europe/Berlin
#    ports:
#      - "11434:11434"
    volumes:
      - /mnt/user/appdata/llm/ollama:/root/.ollama
    networks:
      - llm
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.ollama-api.rule: Host(`ollama-api.local.nico-steinmueller.de`)
      traefik.http.routers.ollama-api.entrypoints: websecure
      traefik.http.routers.ollama-api.middlewares: local-only
      traefik.http.routers.ollama-api.service: ollama-api
      traefik.http.services.ollama-api.loadbalancer.server.port: 11434

  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      TZ: Europe/Berlin
      # https://docs.openwebui.com/reference/env-configuration
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "True"
      ENABLE_LOGIN_FORM: false
      CORS_ALLOW_ORIGIN: https://open-webui.local.nico-steinmueller.de
      WEBUI_URL: https://open-webui.local.nico-steinmueller.de

      ENABLE_COMMUNITY_SHARING: false

      # https://docs.openwebui.com/features/access-security/auth/sso/keycloak
      ENABLE_OAUTH_PERSISTENT_CONFIG: false
      # Enable OAuth2/OIDC Login
      ENABLE_OAUTH_SIGNUP: true
      # Keycloak Client Information
      OAUTH_CLIENT_ID: open-webui
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      # OIDC Discovery Document URL
      OPENID_PROVIDER_URL: https://keycloak.nico-steinmueller.de/realms/mein-realm/.well-known/openid-configuration
      # (Optional) SSO Button Label
      OAUTH_PROVIDER_NAME: Keycloak
      # (Optional) OAuth Callback URL
      OPENID_REDIRECT_URI: https://open-webui.local.nico-steinmueller.de/oauth/oidc/callback
      # Activate Role Management with Keycloak
      ENABLE_OAUTH_ROLE_MANAGEMENT: true
      # (Optional) Map Keycloak Realm Roles to Open-WebUI Roles (comma-separated)
      OAUTH_ROLES_CLAIM: realm_access.roles
      # Roles that are allowed to log in
      OAUTH_ALLOWED_ROLES: user
      # Roles that are allowed to log in as an admin
      OAUTH_ADMIN_ROLES: admin

#    ports:
#      - "8080:8080"
    volumes:
      - /mnt/user/appdata/llm/open-webui:/app/backend/data
    networks:
      - llm
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.open-webui.rule: Host(`open-webui.local.nico-steinmueller.de`)
      traefik.http.routers.open-webui.entrypoints: websecure
      traefik.http.routers.open-webui.middlewares: local-only
      traefik.http.routers.open-webui.service: open-webui
      traefik.http.services.open-webui.loadbalancer.server.port: 8080

networks:
  llm:
     name: llm
  proxy:
    external: true

volumes:
  ollama:

