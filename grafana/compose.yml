#https://signoz.io/guides/how-to-install-prometheus-and-grafana-on-docker/
# https://last9.io/blog/grafana-and-docker/
# https://grafana.com/oss/alloy-opentelemetry-collector/

# DB_PASSWORD
# KEYCLOAK_SECRET

name: monitoring

services:
  # Das Gehirn: Visualisierung
  # https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/
  grafana:
    # ------------ Identität ------------------------
    image: grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
    container_name: grafana

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      alloy:
        condition: service_healthy
      database:
        condition: service_healthy
        restart: true
        required: true
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 1G
          pids: 128
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true

    # ---------- Environment -----------
    environment:
      # https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/
      # https://grafana.com/grafana/plugins
      GF_PLUGINS_PREINSTALL: grafana-clock-panel
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: grafana_postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_ANALYTICS_REPORTING_ENABLED: false # Telemetrie deaktivieren
      GF_ANALYTICS_CHECK_FOR_UPDATES: false # Update-Checks deaktivieren
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: false # Plugin-Update-Checks deaktivieren
      GF_USERS_DEFAULT_LANGUAGE: de

      # smtp

      GF_DATE_FORMATS_FULL_DATE: DD.MM.YYYY HH:mm:ss
      GF_DATE_FORMATS_INTERVAL_SECOND: HH:mm:ss
      GF_DATE_FORMATS_INTERVAL_MINUTE: HH:mm
      GF_DATE_FORMATS_INTERVAL_HOUR: DD.MM. HH:mm
      GF_DATE_FORMATS_INTERVAL_DAY: DD.MM.
      GF_DATE_FORMATS_INTERVAL_MONTH: MM.YYYY
      GF_DATE_FORMATS_INTERVAL_YEAR: YYYY
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Europe/Berlin


  # Die Datenbank für Grafana
  database:
    image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
    container_name: grafana_postgres

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafana -d grafana"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 128M
          pids: 64
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true

    # ---------- Environment -----------
    environment:
      TZ: Europe/Berlin
      POSTGRES_DB: grafana
      POSTGRES_USER: grafana


  # Die Datenbank für Metriken (Performance)
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: grafana_prometheus

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512M
          pids: 128
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true

    # ---------- Environment -----------
    command:
#      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver' # WICHTIG: Damit Alloy Daten schicken darf
      - '--storage.tsdb.retention.time=30d' # Speicherzeit der Metriken (hier 30 Tage)
      - '--storage.tsdb.retention.size=10GB' # Optional: Maximale Größe der Datenbank (hier 10GB)
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'



  # Die Datenbank für Logs
  loki:
    image: grafana/loki:3.7.6@sha256:efd47c67f9bac88ca29bcf8cb997d9ab29d1848bd0aff579282295542a745952
    container_name: grafana_loki

    # ------------ Abhängigkeiten & Start -----------
    init: true
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512M
          pids: 128
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true


  # Der Sammler: Grafana Alloy
  alloy:
    image: grafana/alloy:v1.19.1@sha256:7a3b03064dcea51f2e867ee8a8b26ece6d1007ec37dbea26f7e3b71966d87bc9 # Version 1.6+ ist aktuell (2026)
    container_name: grafana_alloy

    # ------------ Abhängigkeiten & Start -----------
    init: true
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: "bash -c '(exec 3<>/dev/tcp/localhost/12345 && printf \"HEAD /-/healthy HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && timeout 2 head -1 <&3 | grep -q \"200\") && exit 0 || exit 1'"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 1.5
          memory: 3G
          pids: 128
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true

