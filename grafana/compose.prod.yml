# Einstellungen für die Produktion

services:
  grafana:
    user: 99:100
    networks:
      default:
      proxy:
    volumes:
      - type: bind
        source: /mnt/user/appdata/grafana/grafana
        target: /var/lib/grafana
        read_only: false
        bind:
          create_host_path: false
    environment:
      GF_DATABASE_PASSWORD: ${DB_PASSWORD}

      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: true # Admin-User wird über Umgebungsvariablen erstellt

      # oauth2: https://grafana.com/docs/grafana/latest/setup-grafana/configure-access/configure-authentication/keycloak/
      GF_AUTH_DISABLE_LOGIN_FORM: true # Login-Formular deaktivieren
      GF_AUTH_GENERIC_OAUTH_ENABLED: true
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: true
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${KEYCLOAK_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile offline_access roles
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_NAME: email
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_NAME: username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_NAME: full_name
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: contains(realm_access.roles[*], 'admin') && 'GrafanaAdmin' || contains(realm_access.roles[*], 'editor') && 'Editor' || 'Viewer'
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: true

      GF_SERVER_ROOT_URL: https://grafana.local.nico-steinmueller.de
      GF_AUTH_SIGNOUT_REDIRECT_URL: https://keycloak.nico-steinmueller.de/realms/mein-realm/protocol/openid-connect/logout?post_logout_redirect_uri=https://grafana.local.nico-steinmueller.de/login
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://keycloak.nico-steinmueller.de/realms/mein-realm/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://keycloak.nico-steinmueller.de/realms/mein-realm/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://keycloak.nico-steinmueller.de/realms/mein-realm/protocol/openid-connect/userinfo

    labels:
      traefik.enable: true
      traefik.http.routers.grafana.rule: Host(`grafana.local.nico-steinmueller.de`)
      traefik.http.routers.grafana.entrypoints: websecure
      traefik.http.routers.grafana.middlewares: local-only, compress
      traefik.http.routers.grafana.service: grafana
      traefik.http.services.grafana.loadbalancer.server.port: 3000


  database:
    user: 99:100
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - type: bind
        source: /mnt/user/appdata/grafana/postgres
        target: /var/lib/postgresql
        read_only: false
        bind:
          create_host_path: false


  prometheus:
    user: 99:100
    networks:
      default:
      proxy:
    volumes:
      - type: bind
        source: /mnt/user/data/grafana/prometheus
        target: /prometheus
        read_only: false
        bind:
          create_host_path: false

    labels:
      traefik.enable: true
      traefik.http.routers.prometheus.rule: Host(`prometheus.local.nico-steinmueller.de`)
      traefik.http.routers.prometheus.entrypoints: websecure
      traefik.http.routers.prometheus.middlewares: local-only, compress
      traefik.http.routers.prometheus.service: prometheus
      traefik.http.services.prometheus.loadbalancer.server.port: 9090


  loki:
    user: 99:100
    networks:
      default:
      proxy:
    volumes:
      - type: bind
        source: /mnt/user/data/grafana/loki
        target: /loki
        read_only: false
        bind:
          create_host_path: false


  alloy:
    # TODO WICHTIG: Alloy läuft standardmäßig als User "alloy".
    # Damit er den Docker-Socket und die Logs lesen kann,
    # muss er als root laufen oder der Gruppe "docker" angehören.
    user: root
    networks:
      monitoring:
      default:
      proxy:
    volumes:
      - type: bind
        source: /mnt/user/appdata/grafana/alloy
        target: /etc/alloy
        read_only: true
        bind:
          create_host_path: false
      # System-Metriken/Infos vom Host (CPU, RAM, Netzwerk, Prozesse, Docker-Stats, etc.)
      - /proc:/rootproc:ro # Host-Prozesse/Metriken
      - /var/run/docker.sock:/var/run/docker.sock:ro # Docker-API
      - /sys:/sys:ro # Kernel-/HW-Infos
      - /:/rootfs:ro # Host-Dateisystem
      - /dev/disk/:/dev/disk:ro # Disk-IDs/Devices
      - /var/lib/docker/:/var/lib/docker:ro # Docker-Daten/Logs
      - /var/log:/var/host-log:ro # Host-Logs (z.B. Syslog, Auth, etc.)
      # Hier alle Host-Pfade, in die Apps Logs schreiben.
      - type: bind
        source: /mnt/user/logs
        target: /var/docker_logs
        read_only: true
        bind:
          create_host_path: false

    labels:
      traefik.enable: true
      traefik.http.routers.alloy.rule: Host(`alloy.local.nico-steinmueller.de`)
      traefik.http.routers.alloy.entrypoints: websecure
      traefik.http.routers.alloy.middlewares: local-only, compress
      traefik.http.routers.alloy.service: alloy
      traefik.http.services.alloy.loadbalancer.server.port: 12345


networks:
  proxy:
    external: true
  monitoring:
    external: true

