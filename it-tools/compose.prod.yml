services:
  it-tools:
    user: 99:100
    networks:
      proxy:
    labels:
      traefik.enable: true
      traefik.http.routers.it-tools.rule: Host(`it-tools.local.nico-steinmueller.de`)
      traefik.http.routers.it-tools.entrypoints: websecure
      traefik.http.routers.it-tools.middlewares: local-only@file
      traefik.http.routers.it-tools.service: it-tools
      traefik.http.services.it-tools.loadbalancer.server.port: 8080

networks:
  proxy:
    external: true
