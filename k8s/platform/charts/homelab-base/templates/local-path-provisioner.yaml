{{- if .Values.localPath.enabled }}
{{/*
  local-path-provisioner: die StorageClass, ohne die im Cluster nichts
  Zustandsbehaftetes läuft.

  Sie legt PVCs als Verzeichnisse auf der Systemplatte des Nodes an. Das ist
  bewusst nur die halbe Antwort auf die Storage-Frage aus dem Konzept:

    hierher gehört  - Postgres und alles andere, was eine Datenbank ist.
                      Datenbanken über NFS sind eine Quelle für schwer
                      auffindbare Korruption.
    hierher gehört  - Nutzerdaten (Fotos, Dokumente). Die gehören auf einen
    NICHT             eigenen NFS-Export vom Unraid-Array, pro Dienst ein
                      Export, mit root_squash und all_squash, in einem
                      Storage-Netz, das nur der CSI-Treiber erreicht.

  Und: local-path ist kein Backup. Ein `talosctl reset` nimmt diese Daten
  mit. Das Backup-Ziel mit erzwungenem Append-only steht im Konzept als
  offener Punkt und ist es weiterhin.

  Übernommen von rancher/local-path-provisioner, angepasst an Talos
  (Pfad unter /var, das dort schreibbar ist und einen Reboot überlebt).
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner
  namespace: {{ .Values.namespaces.storage }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: local-path-provisioner
  namespace: {{ .Values.namespaces.storage }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: local-path-provisioner
  namespace: {{ .Values.namespaces.storage }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: local-path-provisioner
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner
    namespace: {{ .Values.namespaces.storage }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-provisioner
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-path-provisioner
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner
    namespace: {{ .Values.namespaces.storage }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner
  namespace: {{ .Values.namespaces.storage }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-path-provisioner
  template:
    metadata:
      labels:
        app: local-path-provisioner
      annotations:
        # Erzwingt einen Neustart, wenn sich der Pfad oder das Helper-Image
        # ändert - der Provisioner liest die Konfiguration beim Start.
        checksum/config: {{ toYaml .Values.localPath | sha256sum }}
    spec:
      serviceAccountName: local-path-provisioner
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: local-path-provisioner
          image: {{ .Values.localPath.image }}
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - start
            - --config
            - /etc/config/config.json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MOUNT_PATH
              value: /etc/config/
            #
            # Ohne diese Variable bleibt jedes PVC dauerhaft Pending.
            #
            # Der Provisioner legt fuer jedes Volume kurz einen Helper-Pod an,
            # der das Verzeichnis anlegt bzw. wieder entfernt. Welche
            # ServiceAccount dieser Pod bekommt, entscheidet nicht die
            # helperPod.yaml, sondern --service-account-name bzw. diese
            # Variable. Der eingebaute Standard ist
            # "local-path-provisioner-service-account" - so heisst die Account
            # im Upstream-Manifest. Unsere heisst kuerzer, und dann scheitert
            # die Pod-Erzeugung an:
            #
            #   pods "helper-pod-create-pvc-<uid>" is forbidden: error looking
            #   up service account
            #   local-path-storage/local-path-provisioner-service-account
            #
            # Der Fehler ist unangenehm zu finden, weil alles andere gesund
            # aussieht: Der Provisioner laeuft 1/1, die StorageClass ist da,
            # und die Meldung steht nur im PVC-Event, nicht am Pod. Sichtbar
            # wird sie als "Pending" bei step-ca und CrowdSec - und
            # `helm install` wartet darauf bis in seinen Timeout.
            #
            # Der naheliegende Fix, serviceAccountName in die helperPod.yaml zu
            # schreiben, funktioniert nicht: v0.0.36 beendet sich dann beim
            # Start ("must not set spec.serviceAccountName unless
            # allow-unsafe-helper-pod-template is enabled").
            #
            - name: SERVICE_ACCOUNT_NAME
              value: local-path-provisioner
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: config-volume
          configMap:
            name: local-path-config

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
  annotations:
    # Einzige StorageClass im Cluster - ein PVC ohne storageClassName soll
    # nicht dauerhaft Pending bleiben.
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
# Delete: Ein gelöschtes PVC nimmt seine Daten mit. Für Datenbanken, die aus
# einem Backup wiederhergestellt werden, ist das richtig - für alles andere
# gilt der Satz oben: local-path ist kein Backup.
reclaimPolicy: Delete

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: {{ .Values.namespaces.storage }}
data:
  config.json: |-
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": ["{{ .Values.localPath.path }}"]
        }
      ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      #
      # Kein serviceAccountName hier - der gehoert an den Provisioner, nicht in
      # diese Vorlage. Siehe SERVICE_ACCOUNT_NAME im Deployment oben.
      #
      # v0.0.36 lehnt ihn hier sogar ausdruecklich ab und beendet sich beim
      # Start mit:
      #
      #   helper pod template must not set spec.serviceAccountName
      #     unless allow-unsafe-helper-pod-template is enabled
      #
      priorityClassName: system-node-critical
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: helper-pod
          image: {{ .Values.localPath.helperImage }}
          imagePullPolicy: IfNotPresent
{{- end }}
