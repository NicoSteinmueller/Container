{{/*
  Namespaces mit zwei Sorten Labels:

    homelab.io/zone           - public oder internal. Daran hängt die
                                Kyverno-Regel auf ingressClassName und die
                                Auswahl der NetworkPolicies.
    pod-security.kubernetes.io/* - die PodSecurity-Stufe.

  Zur PodSecurity-Stufe: Der Cluster erzwingt clusterweit "restricted"
  (patches/cluster.yaml.tftpl in vm/talos). Ein Namespace-Label übersteuert
  das. Wo hier eine niedrigere Stufe steht, ist das keine Bequemlichkeit,
  sondern eine technische Notwendigkeit - und sie steht in jeder Zeile dabei.
*/}}

{{- range .Values.apps }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .name }}
  labels:
    homelab.io/zone: {{ .zone }}
    # Anwendungen haben keinen Grund, Host-Ressourcen anzufassen.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
{{- end }}

---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.traefikPublic }}
  labels:
    homelab.io/zone: dmz
    # privileged, weil der Controller hostPort verwendet - PodSecurity zählt
    # hostPorts bereits ab "baseline" als Verstoß. Die Bindung an genau eine
    # Adresse ist hier aber der Kern der Trennung zwischen öffentlichem und
    # privatem Ingress; ohne hostPort/hostIP bräuchte es LoadBalancer-IPAM
    # mit L2-Announcements, also eine zweite Zuordnungsebene.
    #
    # Kyverno begrenzt dafür, welche Ports hier überhaupt zulässig sind
    # (charts/homelab-policies).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline

---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.traefikInternal }}
  labels:
    homelab.io/zone: internal
    # Siehe oben - hostPort 80/443 auf der LAN-Adresse.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline

---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.certManager }}
  labels:
    homelab.io/zone: internal
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted

---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.stepCa }}
  labels:
    homelab.io/zone: internal
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted

---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.crowdsec }}
  labels:
    homelab.io/zone: internal
    # privileged, weil der Agent die Container-Logs vom Host liest
    # (/var/log/pods als hostPath). Genau dafür ist er da: Die Logs entstehen
    # dort, wo die Anwendung läuft, und nur ein paar hundert Byte pro Vorfall
    # gehen anschließend als Alarm über die Netzgrenze.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline

---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.kyverno }}
  labels:
    homelab.io/zone: internal
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted

{{- if .Values.headlamp.enabled }}
---
{{/*
  Das Cluster-Dashboard.

  Es steht hier bei der Infrastruktur und nicht in `apps`, obwohl es aus Sicht
  von ingress-internal eine gewöhnliche Anwendung ist. Der Grund ist der
  Unterschied zwischen Struktur und Konfiguration: An diesem Namespace hängt
  ein ClusterRole-Binding, das clusterweit lesen darf. Stünde er in
  var.app_namespaces, könnte ihn eine Zeile in terraform.tfvars auf
  zone = "public" umstellen - und damit ein Dashboard mit Cluster-Lesezugriff
  hinter den Ingress stellen, der aus dem Internet erreichbar ist.

  Als Infrastruktur-Namespace ist "internal" keine Einstellung mehr, sondern
  eine Eigenschaft.

  PodSecurity restricted, ohne Ausnahme: Headlamp ist ein einzelner
  Webserver, der mit der Kubernetes-API spricht. Es gibt keinen Host-Zugriff
  zu rechtfertigen - anders als bei CrowdSec oder den Ingress-Controllern.
*/}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.headlamp }}
  labels:
    homelab.io/zone: internal
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
{{- end }}

{{- if .Values.localPath.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.storage }}
  labels:
    homelab.io/zone: internal
    # privileged, weil die Helper-Pods Verzeichnisse auf dem Node anlegen.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
{{- end }}
