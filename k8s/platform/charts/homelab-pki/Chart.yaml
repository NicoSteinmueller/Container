apiVersion: v2
name: homelab-pki
description: |
  Das Serverzertifikat von ingress-public - ausgestellt dort, wo das
  Provisioner-Passwort ohnehin liegt, und als Secret in den Namespace des
  Ingress gelegt.

  Der Grund steht in templates/ingress-cert.yaml: Traefik bekommt mit
  namespaced RBAC Leserecht auf Secrets in seinem eigenen Namespace. Was dort
  liegt, ist nach einer Übernahme des Ingress lesbar - und ein
  Provisioner-Passwort wäre damit ein Schlüssel zur internen CA.
type: application
version: 0.1.0
appVersion: "1.0"
