{{/*
  Das Serverzertifikat von ingress-public.

  Vorher holte es sich der Ingress selbst: Ein Init-Container mit dem
  Provisioner-Passwort der internen CA, abgelegt als Secret im Namespace
  traefik-public. Das war der bequeme Weg und zugleich eine Abkürzung an der
  eigenen Argumentation vorbei - denn genau daneben steht in
  charts/homelab-base der Satz, warum das Wurzelzertifikat als ConfigMap
  kopiert wird statt Traefik den Namespace der CA lesen zu lassen:

    "Traefik bekommt in jedem beobachteten Namespace Leserecht auf Secrets."

  Das gilt auch für seinen eigenen Namespace, und damit auch für ein
  Provisioner-Passwort, das dort liegt. Wer den Ingress übernimmt, hätte
  damit einen Schlüssel zur internen CA gehabt: Zertifikate auf beliebige
  Namen, insbesondere auf den der Edge-VM. Das Konzept nennt genau diese
  Rechte als stärkstes Argument für die Edge-VM (E2) - eine CA-Berechtigung
  in dieselbe Komponente zu legen, hebt das auf.

  Deshalb dreht dieses Chart die Richtung um: Das Passwort bleibt im
  Namespace step-ca, wo der Chart es ohnehin ablegt. Ein kleiner Aussteller
  dort stellt das Zertifikat aus und legt es als gewöhnliches TLS-Secret in
  den Namespace des Ingress. Was Traefik dort lesen kann, ist damit sein
  eigener Schlüssel - und den hat es ohnehin.

  Warum kein cert-manager: Der kann nicht mit step-ca sprechen, dafür bräuchte
  es step-issuer als weiteren Controller. Warum kein Token wie auf der
  Edge-VM: Ein Token lebt fünf Minuten. Auf der Edge trägt es ein Mensch ein,
  hier müsste es alle paar Minuten erneuert werden - und ein Pod, der nach
  einem längeren Ausfall startet, fände ein abgelaufenes vor.

  Warum ein CronJob und kein Sidecar: Der Aussteller braucht das Passwort. Er
  gehört damit in den Namespace der CA, und ein Sidecar läuft nun einmal dort,
  wo sein Hauptcontainer läuft.
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingress-cert-issuer
  namespace: {{ .Values.namespaces.stepCa }}

---
{{/*
  Schreibrecht auf genau ein Secret in genau einem fremden Namespace.

  `create` lässt sich in RBAC nicht auf einen Namen einschränken - beim
  Anlegen gibt es noch keinen. Die zweite Regel fängt das für alles danach
  ein. Übrig bleibt: Der Aussteller könnte in traefik-public ein zusätzliches
  Secret anlegen, aber keines lesen und keines fremdes ändern.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ingress-cert-issuer
  namespace: {{ .Values.namespaces.traefikPublic }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.ingressPublic.tlsSecret }}"]
    verbs: ["get", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ingress-cert-issuer
  namespace: {{ .Values.namespaces.traefikPublic }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ingress-cert-issuer
subjects:
  - kind: ServiceAccount
    name: ingress-cert-issuer
    namespace: {{ .Values.namespaces.stepCa }}

---
{{/*
  Der Namespace step-ca trägt ein Default-Deny auf der Eingangsseite
  (charts/homelab-base). Ohne diese Regel käme der Aussteller nicht an die
  CA heran, obwohl er neben ihr steht.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-cert-issuer
  namespace: {{ .Values.namespaces.stepCa }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: step-certificates
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-cert-issuer
      ports:
        - protocol: TCP
          port: 9000

{{/*
  Der Pod, einmal definiert und zweimal verwendet: als Hook-Job beim Anwenden
  (sonst stünde ingress-public ohne Zertifikat da und käme nicht hoch) und als
  CronJob für die Erneuerung.
*/}}
{{- define "homelab-pki.issuerPod" -}}
metadata:
  labels:
    app.kubernetes.io/name: ingress-cert-issuer
spec:
  serviceAccountName: ingress-cert-issuer
  restartPolicy: Never

  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  initContainers:
    - name: issue
      image: {{ .Values.images.step }}
      command:
        - /bin/sh
        - -c
        - |
          set -eu

          CA_URL="{{ .Values.stepCa.url }}"
          CN="{{ .Values.ingressPublic.serverName }}"

          # Beides in den emptyDir: Das Wurzeldateisystem ist read-only.
          export STEPPATH=/shared/step
          export HOME=/shared
          mkdir -p /shared/step

          echo "[issue] warte auf $CA_URL"
          tries=0
          until step ca health --ca-url "$CA_URL" --root /ca/root_ca.crt >/dev/null 2>&1; do
            tries=$((tries + 1))
            if [ "$tries" -gt 60 ]; then
              echo "[issue] step-ca antwortet seit fuenf Minuten nicht" >&2
              exit 1
            fi
            sleep 5
          done

          echo "[issue] fordere Serverzertifikat fuer $CN an"
          step ca certificate "$CN" /shared/tls.crt /shared/tls.key \
            --ca-url "$CA_URL" \
            --root /ca/root_ca.crt \
            --provisioner "{{ .Values.stepCa.provisioner }}" \
            --provisioner-password-file /prov/password \
            --san "$CN" \
            --san "{{ .Values.ingressPublic.nodeDmzIp }}" \
            --not-after "{{ .Values.certLifetime }}" \
            --force

          #
          # Das fertige Manifest entsteht hier und nicht im kubectl-Container:
          # Das offizielle kubectl-Image ist distroless und bringt keine Shell
          # mit - also auch keine Pipe von `create secret --dry-run` nach
          # `apply`.
          #
          {
            echo 'apiVersion: v1'
            echo 'kind: Secret'
            echo 'metadata:'
            echo '  name: {{ .Values.ingressPublic.tlsSecret }}'
            echo '  namespace: {{ .Values.namespaces.traefikPublic }}'
            echo 'type: kubernetes.io/tls'
            echo 'data:'
            echo "  tls.crt: $(base64 < /shared/tls.crt | tr -d '\n')"
            echo "  tls.key: $(base64 < /shared/tls.key | tr -d '\n')"
          } > /shared/secret.yaml

          step certificate inspect /shared/tls.crt --short
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
      volumeMounts:
        - name: shared
          mountPath: /shared
        - name: root-ca
          mountPath: /ca
          readOnly: true
        - name: provisioner
          mountPath: /prov
          readOnly: true

  containers:
    - name: publish
      image: {{ .Values.images.kubectl }}
      args:
        - --cache-dir=/shared/.kube
        - apply
        - --server-side
        - --force-conflicts
        - -f
        - /shared/secret.yaml
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
      volumeMounts:
        - name: shared
          mountPath: /shared

  volumes:
    #
    # Der private Schluessel liegt nur im Arbeitsspeicher. Auf die Platte des
    # Nodes gehoert er nicht - dort landet er ohnehin gleich als Secret, und
    # zwei Kopien sind eine zu viel.
    #
    - name: shared
      emptyDir:
        medium: Memory
        sizeLimit: 1Mi
    - name: root-ca
      configMap:
        name: {{ .Values.stepCa.rootConfigMap }}
        items:
          - key: root_ca.crt
            path: root_ca.crt
    - name: provisioner
      secret:
        secretName: {{ .Values.stepCa.provisionerPasswordSecret }}
        defaultMode: 0400
{{- end }}

---
{{/*
  Beim Anwenden sofort ausstellen. Als Helm-Hook, weil ein Job unveraenderlich
  ist: Ein zweites `terraform apply` mit geaenderter Spezifikation wuerde an
  einem gewoehnlichen Job scheitern. `before-hook-creation` raeumt den alten
  weg, `hook-succeeded` den erfolgreichen danach.

  Helm wartet auf Hook-Jobs. Das ist der Punkt: Erst wenn das Secret steht,
  geht Terraform zu helm_release.traefik_public weiter - sonst haenge der Pod
  dort in ContainerCreating, weil sein Secret-Volume fehlt.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: ingress-cert-bootstrap
  namespace: {{ .Values.namespaces.stepCa }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
{{ include "homelab-pki.issuerPod" . | indent 4 }}

---
{{/*
  Die Erneuerung. Bei {{ .Values.certLifetime }} Laufzeit und diesem Takt
  bleiben drei Fehlversuche Puffer.

  Ausgestellt wird jedes Mal neu statt erneuert - `step ca renew` waere der
  Weg der Edge-VM, aber der braucht das alte Zertifikat, und das liegt hier
  bewusst nirgends ausser im Secret. Ein frisches Zertifikat kostet dasselbe,
  und das Passwort liegt in diesem Namespace ohnehin.
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingress-cert-renew
  namespace: {{ .Values.namespaces.stepCa }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 900
      template:
{{ include "homelab-pki.issuerPod" . | indent 8 }}
