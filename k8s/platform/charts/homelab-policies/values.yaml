#
# Gesetzt von k8s/platform/main.tf. Siehe charts/homelab-base/values.yaml.
#

namespaces:
  traefikPublic: traefik-public
  traefikInternal: traefik-internal
  stepCa: step-ca
  crowdsec: crowdsec
  certManager: cert-manager
  headlamp: headlamp

# Rechte des Cluster-Dashboards. Siehe templates/dashboard-rbac.yaml.
headlamp:
  enabled: true
  # Ein ServiceAccount mit cluster-admin, aber ohne Token - für kurzlebige
  # Admin-Sitzungen im Dashboard. Auf false, wenn dort nur gelesen wird.
  adminServiceAccount: true

# Namespaces, in denen ingressClassName: public zulässig ist. Nur zur
# Anzeige in der Fehlermeldung - erzwungen wird über das Namespace-Label
# homelab.io/zone.
publicNamespaces:
  - nextcloud
  - immich

stepCa:
  serviceFqdn: step-ca.step-ca.svc.cluster.local
  port: 9000

lapi:
  serviceFqdn: crowdsec-service.crowdsec.svc.cluster.local
  port: 8080

certLifetime: 24h
domain: domain.de

# ACME für die internen Namen. Aus heißt: interne CA, Browser warnt.
internalAcme:
  enabled: false
  email: ""
  server: https://acme-v02.api.letsencrypt.org/directory
  acme_dns_host: ""
  acme_dns_secret: acme-dns-internal
  acme_dns_secret_key: acmedns.json
