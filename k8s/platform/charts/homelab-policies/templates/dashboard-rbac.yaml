{{- if .Values.headlamp.enabled }}
{{/*
  Die Rechte des Dashboards.

  Sie stehen hier und nicht in den Werten der Headlamp-Release, weil das
  Chart von Headlamp seinen ServiceAccount standardmäßig an cluster-admin
  bindet. Das ist die Voreinstellung, nicht ein Versehen - und sie ist genau
  das, was in diesem Cluster nicht passieren soll: ein dauerhaft laufender
  Pod mit Vollzugriff, erreichbar über eine Weboberfläche.

  Die Aufteilung hier ist deshalb:

    headlamp        - der ServiceAccount, unter dem der Pod läuft. Darf
                      lesen, nichts ändern, und kommt an keine Secrets.
    headlamp-admin  - ein ServiceAccount ohne Pod. Er hat cluster-admin, aber
                      kein Token: Wer ändern will, erzeugt sich eines für eine
                      Stunde und fügt es im Dashboard ein.

        kubectl -n {{ .Values.namespaces.headlamp }} create token headlamp-admin --duration=1h

  Der Unterschied zwischen beiden ist der Kern: Ein übernommener
  Dashboard-Pod ist ein Leseleck, kein Cluster-Admin. Das Admin-Token
  entsteht nur, wenn jemand mit einem kubeconfig es ausdrücklich erzeugt,
  und es ist nach einer Stunde wertlos.
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: {{ .Values.namespaces.headlamp }}
{{/*
  Kein automatisch gemountetes Token wäre hier falsch: Headlamp spricht als
  dieser ServiceAccount mit der API und braucht es.
*/}}
automountServiceAccountToken: true

---
{{/*
  Erste Hälfte der Leserechte: die eingebaute Rolle `view`.

  Sie deckt ab, was in Namespaces liegt - Pods, Deployments, Services,
  ConfigMaps, Events, Logs. Wichtig ist, was sie ausdrücklich nicht enthält:
  Secrets. Das ist der Grund, `view` zu nehmen statt eine eigene Rolle mit
  "alles lesen" - die Ausnahme für Secrets ist dort schon eingebaut und geht
  beim Zusammenschreiben einer eigenen Liste erfahrungsgemäß verloren.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: {{ .Values.namespaces.headlamp }}

---
{{/*
  Zweite Hälfte: was `view` nicht kennt.

  `view` ist auf Objekte in Namespaces zugeschnitten. Alles Clusterweite
  fehlt darin - Nodes, PersistentVolumes, StorageClasses, CRDs. Ohne diese
  Rolle startet das Dashboard, zeigt aber auf der Übersichtsseite überall
  "Forbidden", und die Node-Ansicht bleibt leer.

  Ebenfalls hier: die CRDs, die in diesem Cluster tatsächlich vorkommen
  (Cilium, Kyverno, cert-manager, Traefik). Eine Regel mit apiGroups: ["*"]
  wäre kürzer und würde zugleich jede künftig installierte CRD einschließen -
  auch eine, die Zugangsdaten im Klartext in ihrer Spec trägt. Die Liste ist
  länger, aber sie sagt, was sie tut.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-cluster-read
rules:
  # Clusterweite Kernobjekte.
  - apiGroups: [""]
    resources:
      - nodes
      - persistentvolumes
    verbs: ["get", "list", "watch"]

  # Auslastung. Kommt vom metrics-server; ohne diese Regel bleiben die
  # CPU- und Speicheranzeigen leer, obwohl der metrics-server läuft.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - volumeattachments
      - csidrivers
      - csinodes
      - csistoragecapacities
    verbs: ["get", "list", "watch"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - mutatingwebhookconfigurations
      - validatingwebhookconfigurations
    verbs: ["get", "list", "watch"]

  {{/*
    RBAC lesen dürfen.

    Das ist die eine Regel hier, die eine Abwägung ist und keine
    Selbstverständlichkeit: Wer Rollen und Bindungen lesen kann, sieht, wo im
    Cluster die weitreichenden Rechte liegen - eine Landkarte für den
    nächsten Schritt nach einer Übernahme.

    Sie steht trotzdem drin, weil ein Dashboard, das die Rechtevergabe nicht
    zeigen kann, genau bei der Frage aussteigt, für die man es aufmacht.
    Lesen allein erlaubt keine Ausweitung: Ohne `escalate` oder `bind` kann
    dieser ServiceAccount keine Rolle vergeben, auch keine, die er sieht.

    Wenn das zu weit geht, ist es die erste Regel zum Streichen - es fällt
    dann nur die RBAC-Ansicht aus.
  */}}
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch"]

  {{/*
    Die CRDs dieses Clusters, namentlich. Siehe oben: bewusst keine
    Wildcard über alle apiGroups.
  */}}
  - apiGroups: ["cilium.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["kyverno.io", "policies.kyverno.io", "reports.kyverno.io", "wgpolicyk8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["cert-manager.io", "acme.cert-manager.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["traefik.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  {{/*
    Headlamp fragt beim Anmelden ab, was es überhaupt anzeigen darf, statt
    jede Ansicht in einen Fehler laufen zu lassen. Das geht über
    SelfSubjectRulesReview - eine Anfrage, die nur Auskunft über die eigenen
    Rechte gibt und keine gewährt.

    `system:basic-user` bringt das im Normalfall schon mit; ausdrücklich
    hier, damit die Oberfläche nicht davon abhängt.
  */}}
  - apiGroups: ["authorization.k8s.io"]
    resources:
      - selfsubjectaccessreviews
      - selfsubjectrulesreviews
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-cluster-read
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: {{ .Values.namespaces.headlamp }}

{{- if .Values.headlamp.adminServiceAccount }}
---
{{/*
  Der Weg zum Schreibzugriff, wenn er gebraucht wird.

  Dieser ServiceAccount wird von keinem Pod verwendet und hat kein Secret mit
  einem Token. Er ist damit im Ruhezustand nicht benutzbar: Ein Token
  entsteht erst durch einen ausdrücklichen Aufruf der TokenRequest-API, und
  der setzt ein kubeconfig mit Adminrechten voraus - wer das hat, ist
  ohnehin schon Cluster-Admin.

  Praktisch heißt das: Im Dashboard oben rechts abmelden, dann

    kubectl -n {{ .Values.namespaces.headlamp }} create token headlamp-admin --duration=1h

  und das Ergebnis als Token einfügen. Nach einer Stunde ist es abgelaufen,
  ohne dass jemand daran denken muss.

  Auf false in den Werten, wenn das Dashboard dauerhaft nur lesen soll - dann
  wird im Cluster ausschließlich per kubectl geändert.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: {{ .Values.namespaces.headlamp }}
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: {{ .Values.namespaces.headlamp }}
{{- end }}
{{- end }}
