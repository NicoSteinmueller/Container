{{/*
  Die Regel, ohne die die ganze Trennung nur eine Konvention wäre.

  Aus dem Konzept: "Die Netzwerkgrenze allein leistet dabei weniger, als es
  zunächst aussieht - sie verhindert, dass ein privat deklarierter Dienst aus
  Versehen öffentlich erreichbar wird, aber nicht, dass jemand
  ingressClassName: public an das falsche Manifest schreibt."

  Genau das wird hier abgelehnt: public ist nur in Namespaces zulässig, die
  als öffentlich gekennzeichnet sind (Label homelab.io/zone: public aus
  charts/homelab-base). Ein aus Nextcloud kopiertes Ingress-Manifest, das bei
  Paperless landet, kommt nicht durch - auch dann nicht, wenn es jemand
  eilig hat.

  Enforce, nicht Audit. Eine Regel, die nur protokolliert, verhindert nichts;
  sie erzeugt einen Bericht, den im Zweifel niemand liest.
*/}}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-public-ingress-class
  annotations:
    policies.kyverno.io/title: ingressClassName public nur in öffentlichen Namespaces
    policies.kyverno.io/category: Homelab
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Erzwingt Entscheidung E6 des Sicherheitskonzepts. Zulässig ist
      ingressClassName: public derzeit in: {{ join ", " .Values.publicNamespaces }}.
spec:
  background: true
  rules:
    - name: public-class-only-in-public-namespaces
      match:
        any:
          - resources:
              kinds:
                - Ingress
      exclude:
        any:
          - resources:
              namespaceSelector:
                matchLabels:
                  homelab.io/zone: public
      validate:
        failureAction: Enforce
        message: >-
          ingressClassName "public" macht diesen Dienst aus dem Internet
          erreichbar und ist nur in Namespaces mit dem Label
          homelab.io/zone=public zulässig. Für Dienste, die im Heimnetz
          bleiben sollen: ingressClassName "internal".
        pattern:
          spec:
            =(ingressClassName): "!public"

    {{/*
      Zweite Hälfte derselben Regel: Der Weg über die Traefik-eigene CRD darf
      nicht daran vorbeiführen. ingress-public beobachtet zwar ohnehin nur
      die öffentlichen Namespaces - aber diese Einschränkung steht in einer
      Helm-Wertedatei und nicht in einer Regel, die beim Anlegen greift.
    */}}
    - name: public-entrypoints-only-in-public-namespaces
      match:
        any:
          - resources:
              kinds:
                - IngressRoute
                - IngressRouteTCP
      exclude:
        any:
          - resources:
              namespaceSelector:
                matchLabels:
                  homelab.io/zone: public
          - resources:
              namespaces:
                - {{ .Values.namespaces.traefikPublic }}
      preconditions:
        all:
          - key: {{ `"{{ request.object.spec.entryPoints[] | length(@) }}"` }}
            operator: GreaterThan
            value: 0
      validate:
        failureAction: Enforce
        message: >-
          Die Entrypoints websecure, lapi und stepca von ingress-public sind
          aus diesem Namespace nicht zulässig - sie hängen an der DMZ-Adresse
          und damit am Weg aus dem Internet.
        deny:
          conditions:
            any:
              - key: {{ `"{{ request.object.spec.entryPoints[] }}"` }}
                operator: AnyIn
                value:
                  - websecure
                  - lapi
                  - stepca

    {{/*
      Dritte Regel, und sie deckt genau die Lücke der zweiten ab: Dort sind
      die öffentlichen Namespaces ausgenommen, weil `websecure` bei Nextcloud
      und Immich der Normalfall ist. `lapi` und `stepca` sind es nicht.

      Diese beiden Entrypoints tragen die CrowdSec-Entscheidungsdatenbank und
      die interne CA - eine IngressRoute darauf aus einem Anwendungs-Namespace
      könnte die vorhandene Route überstimmen und die Edge-VM auf einen
      eigenen Dienst umlenken. Beim TCP-Passthrough von step-ca wäre das der
      Punkt, an dem die Fingerprint-Prüfung der Edge ins Leere liefe.

      Sie gehören deshalb ausschließlich in den Namespace von ingress-public,
      wo sie charts/homelab-policies selbst anlegt - unabhängig davon, welche
      Zone der Namespace trägt.
    */}}
    - name: dmz-entrypoints-only-in-traefik-public
      match:
        any:
          - resources:
              kinds:
                - IngressRoute
                - IngressRouteTCP
      exclude:
        any:
          - resources:
              namespaces:
                - {{ .Values.namespaces.traefikPublic }}
      preconditions:
        all:
          - key: {{ `"{{ request.object.spec.entryPoints[] | length(@) }}"` }}
            operator: GreaterThan
            value: 0
      validate:
        failureAction: Enforce
        message: >-
          Die Entrypoints lapi und stepca führen zur CrowdSec-LAPI und zur
          internen CA. Sie sind nur im Namespace von ingress-public zulässig -
          auch in öffentlichen Namespaces nicht.
        deny:
          conditions:
            any:
              - key: {{ `"{{ request.object.spec.entryPoints[] }}"` }}
                operator: AnyIn
                value:
                  - lapi
                  - stepca
