{{/*
  Zertifikate für die internen Namen (ingress-internal).

  Zwei Varianten, umschaltbar über internalAcme.enabled:

    aus (Standard) - eine eigene interne CA, von cert-manager selbst erzeugt.
                     Funktioniert ohne jeden externen Zugang; der Browser
                     warnt, solange das Wurzelzertifikat nicht importiert ist.
    an             - ein ACME-ClusterIssuer mit acme-dns-Solver. Damit sind
                     auch die internen Namen im Browser gültig, obwohl sie
                     nie aus dem Internet erreichbar sind.

  Wichtig ist in beiden Fällen, was hier NICHT steht: kein Wildcard und kein
  Zertifikat für die öffentlichen Namen. Die holt die Edge-VM selbst. Ein
  Wildcard über die Zone würde den Schlüssel, der Paperless absichert, auf
  die Maschine mit Internetkontakt legen (E9).

  Und: Das ist eine andere CA als step-ca. step-ca sichert die Strecke
  Edge -> Cluster, diese hier die internen Namen. Eine gemeinsame CA wäre
  möglich (step-issuer als externer Aussteller für cert-manager), kostet aber
  einen weiteren Controller - und die beiden Bereiche haben ohnehin nichts
  miteinander zu tun.
*/}}

{{- if not .Values.internalAcme.enabled }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}

---
{{/*
  Die Wurzel für die internen Namen. Zehn Jahre Laufzeit, weil sie im
  Browser importiert wird - eine CA, die jährlich neu importiert werden
  muss, wird irgendwann nicht mehr importiert, sondern weggeklickt.
*/}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-lan-ca
  namespace: {{ .Values.namespaces.certManager }}
spec:
  isCA: true
  commonName: Homelab Internal LAN CA
  secretName: internal-lan-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: internal-lan-ca
{{- else }}
---
{{/*
  ACME über acme-dns - dieselbe Technik wie auf der Edge-VM, aber mit einem
  eigenen Konto. Die Trennung der beiden ACME-Clients ist Entscheidung E4;
  ein geteiltes Konto würde sie aufheben.

  Das Secret mit den Kontodaten muss vorher im Namespace cert-manager liegen:

    kubectl -n {{ .Values.namespaces.certManager }} create secret generic \
      {{ .Values.internalAcme.acme_dns_secret }} \
      --from-file={{ .Values.internalAcme.acme_dns_secret_key }}=acmedns.json
*/}}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-acme
spec:
  acme:
    email: {{ .Values.internalAcme.email | quote }}
    server: {{ .Values.internalAcme.server | quote }}
    privateKeySecretRef:
      name: internal-acme-account
    solvers:
      - dns01:
          acmeDNS:
            host: {{ .Values.internalAcme.acme_dns_host | quote }}
            accountSecretRef:
              name: {{ .Values.internalAcme.acme_dns_secret }}
              key: {{ .Values.internalAcme.acme_dns_secret_key }}
{{- end }}
