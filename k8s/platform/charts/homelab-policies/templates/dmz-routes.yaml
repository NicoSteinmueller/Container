{{/*
  Die beiden Wege, die außer dem Nutzverkehr über ingress-public laufen.

  Beide liegen bewusst im Namespace von ingress-public und zeigen über
  ExternalName-Services in ihren eigentlichen Namespace. Der Grund ist RBAC:
  Traefik bekommt in jedem beobachteten Namespace Leserecht auf Secrets. Im
  Namespace der CA läge dort der Wurzelschlüssel, im Namespace von CrowdSec
  die Zugangsdaten aller registrierten Maschinen und Bouncer. Über einen
  ExternalName-Service entsteht kein solches Leserecht - Traefik löst nur
  einen DNS-Namen auf.
*/}}

---
apiVersion: v1
kind: Service
metadata:
  name: crowdsec-lapi
  namespace: {{ .Values.namespaces.traefikPublic }}
spec:
  type: ExternalName
  externalName: {{ .Values.lapi.serviceFqdn }}
  ports:
    - name: lapi
      port: {{ .Values.lapi.port }}
      protocol: TCP

---
{{/*
  Die CrowdSec-LAPI, erreichbar über den Entrypoint "lapi" (Port 8443 auf der
  DMZ-Adresse).

  TLS terminiert hier, und es gilt die Default-TLSOption von ingress-public:
  RequireAndVerifyClientCert gegen die interne CA. Damit läuft der Zugang zur
  Entscheidungsdatenbank über dieselbe mTLS-Strecke wie der Nutzverkehr -
  genau die Anforderung aus dem Konzept ("LAPI-Zugang aus der DMZ
  ausschließlich über die bestehende mTLS-Strecke").

  Die zweite Hälfte davon - "NetworkPolicy auf genau diesen Port und genau
  diese Quell-IP" - steht in charts/homelab-base (allow-lapi) und in der
  Talos-Ingress-Firewall.
*/}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: crowdsec-lapi
  namespace: {{ .Values.namespaces.traefikPublic }}
spec:
  entryPoints:
    - lapi
  routes:
    - kind: Rule
      match: PathPrefix(`/`)
      services:
        - name: crowdsec-lapi
          port: {{ .Values.lapi.port }}
  tls: {}

---
apiVersion: v1
kind: Service
metadata:
  name: step-ca
  namespace: {{ .Values.namespaces.traefikPublic }}
spec:
  type: ExternalName
  externalName: {{ .Values.stepCa.serviceFqdn }}
  ports:
    - name: https
      port: {{ .Values.stepCa.port }}
      protocol: TCP

---
{{/*
  Die interne CA, erreichbar über den Entrypoint "stepca" (Port 9000 auf der
  DMZ-Adresse) - als TCP-Passthrough.

  Kein mTLS und keine Terminierung, und das ist Absicht: Die Edge prüft beim
  Bootstrap den Fingerprint des Wurzelzertifikats gegen den Wert aus ihrer
  eigenen Konfiguration. Eine terminierende Zwischenstation würde genau diese
  Prüfung aushebeln - und ein Client-Zertifikat kann die Edge hier noch nicht
  haben, weil sie es sich gerade erst holt.

  HostSNI(`*`) trifft auch Verbindungen ohne SNI. Das ist hier nötig: Die
  Edge spricht die CA über die IP an, und dabei wird kein Servername
  gesendet.
*/}}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: step-ca
  namespace: {{ .Values.namespaces.traefikPublic }}
spec:
  entryPoints:
    - stepca
  routes:
    - match: HostSNI(`*`)
      services:
        - name: step-ca
          port: {{ .Values.stepCa.port }}
  tls:
    passthrough: true
