#
# cert-manager - zuständig ausschließlich für die internen Namen.
#
# Die Aufteilung steht so im Konzept: Die Edge-VM holt die Zertifikate für die
# öffentlichen Namen selbst (ACME DNS-01 über eine delegierte acme-dns-
# Instanz), cert-manager die für ingress-internal. Zwei ACME-Clients, die
# nichts voneinander wissen - geteilte Zertifikate bräuchten entweder
# Cluster-Zugangsdaten auf der Edge oder Schreibzugriff vom Cluster in die
# DMZ, und beides hebt die Trennung auf, für die die Edge-VM existiert (E4).
#
# Für die Strecke Edge -> Cluster ist cert-manager ebenfalls nicht zuständig:
# Die Edge muss ihr Zertifikat alle 24 h selbst erneuern und braucht dafür
# eine Online-CA mit API. Das ist step-ca.
#
crds:
  enabled: true
  # Bleiben beim Deinstallieren stehen. Ein `helm uninstall`, das die CRDs
  # mitnimmt, löscht alle Certificates und Issuer im Cluster.
  keep: true

# Ein Node - keine Replikate, die ohnehin Pending blieben.
replicaCount: 1

webhook:
  replicaCount: 1

cainjector:
  replicaCount: 1

#
# DNS-01 gegen einen internen Resolver: Ohne diese Zeilen fragt cert-manager
# beim Prüfen der Challenge den clusterinternen DNS - der die öffentliche Zone
# nicht kennt. Die Prüfung liefe dann in einen Timeout statt in ein
# Zertifikat.
#
# Bewusst öffentliche Resolver: Es geht hier nur um die Frage, ob der
# TXT-Record weltweit sichtbar ist, und genau das kann der interne Resolver
# nicht beantworten.
#
extraArgs:
  - --dns01-recursive-nameservers-only
  - --dns01-recursive-nameservers=9.9.9.9:53,1.1.1.1:53

resources:
  requests:
    cpu: 10m
    memory: 64Mi

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
