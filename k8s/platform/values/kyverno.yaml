#
# Kyverno - erzwingt die Regeln, die die Topologie allein nicht durchsetzt.
#
# Die wichtigste steht in charts/homelab-policies: ingressClassName: public
# ist nur in Namespaces zulässig, die als öffentlich gekennzeichnet sind.
# Ohne diese Regel schützt die Trennung der beiden Ingress-Controller nur
# gegen den harmlosen Tippfehler - ein aus Nextcloud kopiertes
# Ingress-Manifest würde Paperless genau so exponieren, wie es verhindert
# werden soll.
#
# Ein Node: überall ein Replikat statt der Chart-Defaults mit
# Anti-Affinity, die sonst dauerhaft Pending blieben.
#
admissionController:
  replicas: 1
  container:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi

backgroundController:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

cleanupController:
  replicas: 1

reportsController:
  replicas: 1

#
# Kyverno hängt im Admission-Pfad. Fällt es aus, entscheidet failurePolicy,
# ob der Cluster weiterläuft oder steht.
#
# Fail (Standard des Charts) ist hier richtig: Eine Policy, die im Zweifel
# durchwinkt, ist genau in dem Moment wirkungslos, in dem sie zählt. Der Preis
# ist, dass bei kaputtem Kyverno keine Ressourcen mehr angelegt werden können
# - für einen Homelab-Cluster mit einem Node die bessere Seite des Tauschs.
#
config:
  # Ressourcen, die Kyverno nie sehen muss. Spart Admission-Latenz und
  # verhindert Schleifen über die eigenen Objekte.
  resourceFilters:
    - "[Event,*,*]"
    - "[*,kube-system,*]"
    - "[*,kube-public,*]"
    - "[*,kube-node-lease,*]"
    - "[Node,*,*]"
    - "[APIService,*,*]"
    - "[TokenReview,*,*]"
    - "[SubjectAccessReview,*,*]"
    - "[SelfSubjectAccessReview,*,*]"
    - "[Binding,*,*]"
    - "[ReplicaSet,*,*]"
    - "[EndpointSlice,*,*]"
    - "[*,kyverno,*]"
