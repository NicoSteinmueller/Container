# DNS-Allowlist für flux-system
#
# Fehlt hier ein Name, den der Sync selbst braucht (github.com, Gitea),
# repariert sich Flux nicht mehr aus Git.
# Dann diese Policies löschen
#
#   kubectl -n flux-system delete cnp flux-dns flux-source-dns flux-operator-dns
---
# nur Namen im Cluster
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-dns
  namespace: flux-system
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "**.cluster.local"

---
# alles aus den GitRepository- und HelmRepository-Objekten
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-source-dns
  namespace: flux-system
spec:
  endpointSelector:
    matchLabels:
      app: source-controller
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              # Git-Repos
              - matchName: github.com
              - matchName: release-assets.githubusercontent.com
              # csi-driver-nfs
              - matchName: raw.githubusercontent.com
              # homelab-secrets
              - matchName: git.local.nico-steinmueller.de
              # Helm-Repositories
              - matchName: charts.jetstack.io
              - matchName: cloudnative-pg.io
              - matchName: crowdsecurity.github.io
              - matchName: grafana.github.io
              - matchName: kubernetes-sigs.github.io
              - matchName: prometheus-community.github.io
              - matchName: stakater.github.io
              - matchName: traefik.github.io

---
# Flux-Manifeste als OCI-Artefakt
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-operator-dns
  namespace: flux-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: ghcr.io
              # Blobs liegen hinter einer Umleitung auf pkg-containers.githubusercontent.com.
              - matchName: pkg-containers.githubusercontent.com
