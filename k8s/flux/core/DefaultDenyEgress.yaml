# ausgehend geschlossen bis auf DNS für Namen im Cluster.
#
# cluster.local` beantwortet CoreDNS selbst.
# Weitere Namen gibt es nur zusammen mit einer Verbindung dorthin: als
# `rules.dns` neben den `toFQDNs` in `<name>-egress` der Komponente.
#
# Ausgenommen:
#   CoreDNS      ist der Resolver selbst.
#   flux-system  hat dieselbe Liste, damit im Notfall löschbar.
#
# Pods mit hostNetwork trifft die Regel nicht.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny-egress
# Zwei Specs, da ein Selektor kein "außer CoreDNS in kube-system" kennt.
specs:
  - endpointSelector:
      matchExpressions:
        - key: io.kubernetes.pod.namespace
          operator: Exists
        - key: io.kubernetes.pod.namespace
          operator: NotIn
          values:
            - kube-system
            - flux-system
    enableDefaultDeny: &defaultDeny
      ingress: false
      egress: true
    egress: &dns
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: kube-system
              k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
            rules:
              dns:
                # Auch die Suchdomänen-Varianten externer Namen
                # (`api.example.com.<ns>.svc.cluster.local`), die jeder Pod
                # wegen `ndots:5` zuerst fragt - sie enden mit NXDOMAIN.
                - matchPattern: "**.cluster.local"

  # kube-system ohne CoreDNS.
  - endpointSelector:
      matchLabels:
        io.kubernetes.pod.namespace: kube-system
      matchExpressions:
        - key: k8s-app
          operator: NotIn
          values:
            - kube-dns
    enableDefaultDeny: *defaultDeny
    egress: *dns
