# Alle Namespaces des Clusters - und ihre Pod-Security-Stufe.
#
# An einem Ort, damit jede Gruppe nur an `core` hängt; der Grund für
# `privileged` steht jeweils am Namespace.
#
---
# Die drei, die Kubernetes selbst anlegt.
#
# `default`: ohne `namespace:` angabe und ohne `enforce`-Label alles erlaubt
# Nebenwirkung: `kubectl run`/`debug` ohne securityContext wird abgelehnt.
#
# `prune: disabled`, weil ein gelöschter Namespace alles mitnimmt, was darin liegt.
#
apiVersion: v1
kind: Namespace
metadata:
  name: default
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-public
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-node-lease
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# platform - alle sprechen nur mit der API
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# CNPG-Operator; die Postgres-Instanzen liegen im Namespace ihres Dienstes.
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Reloader-Controller; startet neu, was ein geändertes Secret benutzt.
apiVersion: v1
kind: Namespace
metadata:
  name: reloader
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Der Ingress-Controller fürs Heimnetz; `homelab.io/zone` sagt, welcher
# Controller einen Namespace bedienen darf.
apiVersion: v1
kind: Namespace
metadata:
  name: traefik-internal
  labels:
    homelab.io/zone: internal
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Der Ingress-Controller aus dem Internet - der exponierteste Pod des
# Clusters, unter der strengsten Stufe.
apiVersion: v1
kind: Namespace
metadata:
  name: traefik-public
  labels:
    homelab.io/zone: public
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# `privileged` wegen des Agenten: Er liest die Container-Logs per hostPath.
# `warn`/`audit` auf `baseline`, damit auffällt, wenn sonst etwas sie braucht.
apiVersion: v1
kind: Namespace
metadata:
  name: crowdsec
  labels:
    homelab.io/zone: internal
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
---
# storage - `privileged` als Preis für echte Kernel-Mounts: Das NFS-Plugin
# mountet im Host-Namespace, local-path legt Volumes per hostPath an.
# Eingegrenzt wird über den Inhalt, nicht über die Policy: je ein Treiber.
apiVersion: v1
kind: Namespace
metadata:
  name: local-path-storage
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: csi-driver-nfs
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
---
# observability - `privileged` wegen zweier DaemonSets: node-exporter
# (hostNetwork, hostPID, /proc, /sys) und Alloy (/var/log).
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
---
# Das Cluster-Dashboard.
apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
  labels:
    homelab.io/zone: internal
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
