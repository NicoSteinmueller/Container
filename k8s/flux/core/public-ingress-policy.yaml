# Die zweite Sperre gegen "privater Dienst versehentlich öffentlich": Neben dem
# Eintrag in ../network/ingress-public.yaml braucht es das Label am Namespace.
#
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: public-ingress-nur-in-public-namespaces
spec:
  # Greift nur, wenn die CEL-Auswertung selbst scheitert.
  failurePolicy: Fail

  matchConstraints:
    resourceRules:
      - apiGroups:
          - networking.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - ingresses

  validations:
    # Zulässig, wenn die Klasse nicht `public` ist oder der Namespace
    # homelab.io/zone=public trägt.
    - expression: >-
        object.spec.?ingressClassName.orValue("") != "public" ||
        (has(namespaceObject.metadata.labels) &&
        "homelab.io/zone" in namespaceObject.metadata.labels &&
        namespaceObject.metadata.labels["homelab.io/zone"] == "public")
      message: >-
        ingressClassName "public" ist nur in Namespaces mit dem Label
        homelab.io/zone=public erlaubt. Dieser Ingress waere aus dem Internet
        erreichbar gewesen. Gewollt? Dann das Label am Namespace setzen UND
        den Namespace in ../network/ingress-public.yaml eintragen - beides, sonst wird
        er ohnehin nicht bedient.

---
# Erst das Binding schaltet die Policy scharf. `matchResources` leer: gilt cluster-weit.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: public-ingress-nur-in-public-namespaces
spec:
  policyName: public-ingress-nur-in-public-namespaces
  validationActions:
    - Deny
