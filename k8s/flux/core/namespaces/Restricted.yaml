# namespaces - Stufe `restricted`, der Normalfall.
#
# An einem Ort, damit jede Gruppe nur an `core` hängt. Braucht ein Namespace
# mehr, gehört er nach Privileged.yaml - mit dem Grund am Namespace.
---
# Die drei, die Kubernetes selbst anlegt.
#
# `default`: ohne `namespace:` angabe und ohne `enforce`-Label alles erlaubt
# Nebenwirkung: `kubectl run`/`debug` ohne securityContext wird abgelehnt.
#
# `prune: disabled`, weil ein gelöschter Namespace alles mitnimmt, was darin liegt.
#
apiVersion: v1
kind: Namespace
metadata:
  name: default
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-public
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-node-lease
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# platform - alle sprechen nur mit der API
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# CNPG-Operator; die Postgres-Instanzen liegen im Namespace ihres Dienstes.
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Reloader-Controller; startet neu, was ein geändertes Secret benutzt.
apiVersion: v1
kind: Namespace
metadata:
  name: reloader
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Der Ingress-Controller fürs Heimnetz; `homelab.io/zone` sagt, welcher
# Controller einen Namespace bedienen darf.
apiVersion: v1
kind: Namespace
metadata:
  name: traefik-internal
  labels:
    homelab.io/zone: internal
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Der Ingress-Controller aus dem Internet - der exponierteste Pod des
# Clusters, unter der strengsten Stufe.
apiVersion: v1
kind: Namespace
metadata:
  name: traefik-public
  labels:
    homelab.io/zone: public
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Der Testdienst. `public`, obwohl er auch intern hängt: Ein einziger
# öffentlicher Ingress macht den Namespace öffentlich - die Zone richtet sich
# nach der riskanteren Seite (siehe PublicIngressPolicy.yaml).
#
# Früher vom whoami-Chart angelegt; `keep`, damit Helm ihn bei der Übergabe
# nicht löscht.
apiVersion: v1
kind: Namespace
metadata:
  name: whoami
  annotations:
    helm.sh/resource-policy: keep
  labels:
    homelab.io/zone: public
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Das Cluster-Dashboard.
apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
  labels:
    homelab.io/zone: internal
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
