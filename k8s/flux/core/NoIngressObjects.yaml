# Beide Traefik-Controller lesen weder Ingress noch IngressRoute -
# ihre Routen stehen in ../network/ingress-*/DynamicConfig.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: keine-ingress-objekte
spec:
  # nur, wenn die CEL-Auswertung selbst scheitert
  failurePolicy: Fail

  # Nur Anlegen
  matchConstraints:
    resourceRules:
      - apiGroups:
          - networking.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - ingresses
      - apiGroups:
          - traefik.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
        resources:
          - ingressroutes
          - ingressroutetcps
          - ingressrouteudps

  validations:
    - expression: "false"
      message: >-
        Kein Controller liest Ingress- oder IngressRoute-Objekte. Routen stehen
        in k8s/flux/network/ingress-internal/DynamicConfig.yaml (Heimnetz) bzw.
        ingress-public/DynamicConfig.yaml (Internet); bei einem Chart
        `ingress.enabled: false` setzen.

---
# Erst das Binding schaltet die Policy scharf.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: keine-ingress-objekte
spec:
  policyName: keine-ingress-objekte
  validationActions:
    - Deny
