# Die zweite Sperre gegen "privater Dienst versehentlich öffentlich": Neben dem
# Eintrag in ../network/ingress-public/ braucht es das Label am Namespace.
# Gilt für Ingress und Traefiks IngressRoute(TCP/UDP) gleichermaßen.
#
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: public-ingress-nur-in-public-namespaces
spec:
  # Greift nur, wenn die CEL-Auswertung selbst scheitert.
  failurePolicy: Fail

  matchConstraints:
    resourceRules:
      - apiGroups:
          - networking.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - ingresses
      - apiGroups:
          - traefik.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - ingressroutes
          - ingressroutetcps
          - ingressrouteudps

  variables:
    # Wie Traefik die Klasse liest: das Feld, sonst die veraltete Annotation.
    - name: klasse
      expression: >-
        object.spec.?ingressClassName.orValue("") != ""
        ? object.spec.ingressClassName
        : object.metadata.?annotations[?"kubernetes.io/ingress.class"].orValue("")
    - name: publicZone
      expression: >-
        namespaceObject.metadata.?labels[?"homelab.io/zone"].orValue("") == "public"

  validations:
    - expression: variables.klasse != "public" || variables.publicZone
      message: >-
        Die Klasse "public" ist nur in Namespaces mit dem Label
        homelab.io/zone=public erlaubt. Dieses Objekt waere aus dem Internet
        erreichbar gewesen. Gewollt? Dann das Label am Namespace setzen UND
        den Namespace in network/ingress-public/ eintragen - beides, sonst wird
        er ohnehin nicht bedient.

---
# Erst das Binding schaltet die Policy scharf. `matchResources` leer: gilt cluster-weit.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: public-ingress-nur-in-public-namespaces
spec:
  policyName: public-ingress-nur-in-public-namespaces
  validationActions:
    - Deny
