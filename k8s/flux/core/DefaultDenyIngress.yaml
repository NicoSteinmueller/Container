# eingehend geschlossen, bis freigegeben.
#
# Die Freigaben stehen bei der Komponente (NetworkPolicies.yaml).
#
# Ausgenommen:
#   kube-system  Jeder Pod braucht DNS - ein Fehler hier legte den ganzen Cluster lahm.
#   flux-system  Ein Fehler dort sperrte genau den Weg, auf dem er repariert würde.
#
# Pods mit hostNetwork trifft die Regel nicht.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  endpointSelector:
    matchExpressions:
      # `Exists` zuerst: `NotIn` allein träfe auch Ciliums eigene Endpunkte
      - key: io.kubernetes.pod.namespace
        operator: Exists
      - key: io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
          - flux-system

  enableDefaultDeny:
    ingress: true
    egress: false

  # sorgt dafür, dass die Policy eingehend greift.
  ingress:
    - {}
