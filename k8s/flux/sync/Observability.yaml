# observability - kube-prometheus-stack, Loki/Alloy, metrics-server.
# `dependsOn: storage` wegen der Default-StorageClass: Prometheus und Loki
# fordern PVCs ohne `storageClassName` an und blieben sonst lautlos Pending.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./k8s/flux/observability
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: storage
  prune: true
  timeout: 10m
