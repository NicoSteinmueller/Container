# kube-prometheus-stack, Loki/Alloy, metrics-server.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./k8s/flux/observability
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    # Wegen Loki und Prometheus
    - name: storage
  prune: true
  timeout: 10m
