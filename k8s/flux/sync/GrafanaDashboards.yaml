# grafana-dashboards - eigene Dashboards als ConfigMaps.
# Eigene Gruppe, weil der `configMapGenerator` eine kustomization.yaml braucht
# und Flux die Ressourcenliste dann nicht mehr selbst erzeugt.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-dashboards
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./k8s/flux/grafana-dashboards
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Wegen des Namespace `monitoring`: der entsteht in core, Grafana selbst
  # aber in observability.
  dependsOn:
    - name: observability
  prune: true
  timeout: 2m
