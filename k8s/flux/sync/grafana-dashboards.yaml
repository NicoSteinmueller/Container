#
# grafana-dashboards - eigene Dashboards als ConfigMaps.
#
# Eine eigene Gruppe, weil ein `configMapGenerator` eine `kustomization.yaml`
# braucht: In einem Pfad mit eigener kustomization.yaml erzeugt Flux die
# Ressourcenliste nicht mehr selbst, jede Datei muesste von Hand eingetragen
# werden. Fuer diesen einen Pfad ist das richtig - das Eintragen ist dort der
# Arbeitsschritt, mit dem ein Dashboard dazukommt.
#
# Kein `wait`: Eine ConfigMap ist angewendet, sobald sie angewendet ist. Ob
# Grafana sie eingelesen hat, entscheidet der Sidecar Sekunden spaeter.
#
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-dashboards
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./k8s/flux/grafana-dashboards
  sourceRef:
    kind: GitRepository
    name: flux-system
  #
  # Nicht wegen der ConfigMaps, sondern wegen des Namespace `monitoring` - der
  # entsteht zwar in core, aber Grafana selbst in observability.
  #
  dependsOn:
    - name: observability
  prune: true
  timeout: 2m
