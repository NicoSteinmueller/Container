# cert-manager-issuers - die eigene CA und was aus ihr ausgestellt wird.
# `dependsOn: platform`, weil es die CRDs beim Dry-Run sonst noch nicht gibt.
# `wait: true`, weil `network` fertig ausgestellte Zertifikate braucht.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./k8s/flux/cert-manager-issuers
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform
  prune: true
  wait: true
  timeout: 5m
