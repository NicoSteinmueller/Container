#
# homelab-secrets - die zweite Git-Quelle, verschluesselt.
#
# Alle Zugangsdaten liegen SOPS-verschluesselt im Gitea-Repo `homelab-secrets`,
# nicht hier. Dieses Repo geht oeffentlich nach GitHub, und auch Ciphertext
# soll dort nicht liegen: Was einmal oeffentlich war, ist geklont und
# archiviert, und ein Jahre spaeter doch abhandengekommener Schluessel macht es
# rueckwirkend lesbar - auch die Geheimnisse, die laengst rotiert wurden.
#
# Hier steht deshalb nur der Verweis: wo das andere Repo liegt und womit
# entschluesselt wird. Die Werte selbst kommen nie durch diese Datei.
#
# Beim Neuaufbau zuerst sops-age, flux-git-auth und homelab-secrets-auth von
# Hand in den Cluster (Befehle in ../README.md), ab da zieht Flux alles Weitere
# selbst. Diese drei koennen strukturell nicht aus SOPS kommen: Ohne
# flux-git-auth erreicht Flux dieses Repo nicht, ohne dieses Repo kennt es
# homelab-secrets nicht, und ohne sops-age koennte es dort nichts lesen.
#
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab-secrets
  namespace: flux-system
spec:
  #
  # Kuerzer als das Intervall der Wurzel-Quelle: Ein rotiertes Passwort soll
  # nicht erst in einer Viertelstunde ankommen. Der Gitea steht im selben Haus,
  # die Abfrage kostet nichts.
  #
  interval: 5m
  url: https://git.local.nico-steinmueller.de/nico/homelab-secrets.git
  ref:
    branch: master
  secretRef:
    # Leer angelegt von ../main.tf, von Hand gefuellt (siehe ../README.md).
    name: homelab-secrets-auth
  #
  # Nur der Pfad dieses Clusters. Kaeme je ein zweiter dazu, zoege er sein
  # eigenes Verzeichnis - und saehe die Geheimnisse des ersten nicht.
  #
  ignore: |
    /*
    !/cluster
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-secrets
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster
  sourceRef:
    kind: GitRepository
    name: homelab-secrets
  #
  # Der eine Block, um den es geht: kustomize-controller entschluesselt die
  # Manifeste beim Anwenden. Ohne ihn landete ENC[AES256_GCM,...] woertlich als
  # Wert im Cluster - die Kustomization bliebe gruen, und der Fehler zeigte
  # sich erst daran, dass ein Dienst sich nicht an seiner Datenbank anmelden
  # kann.
  #
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  #
  # prune: Ein hier geloeschtes Secret verschwindet auch im Cluster. Genau das
  # will man bei Zugangsdaten.
  #
  prune: true
  #
  # wait: true, damit sich eine Anwendung darauf berufen kann
  # (`dependsOn: - name: homelab-secrets`). Kein dependsOn auf eine andere
  # Gruppe: Diese Quelle ist unabhaengig vom Rest.
  #
  wait: true
  #
  # Ein Fehlschlag beim Entschluesseln soll auffallen, nicht als "Unknown"
  # versickern - kurzes Timeout, damit der Status schnell auf Failed geht.
  #
  timeout: 2m
  retryInterval: 1m
