#
# apps - was der Cluster fuer Menschen bereitstellt: Headlamp und whoami.
#
# Die einzige Gruppe, die jederzeit scheitern darf, ohne dass eine andere
# davon erfaehrt - deshalb haengt hier nichts dran.
#
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./k8s/flux/apps
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: core
  prune: true
  timeout: 5m
