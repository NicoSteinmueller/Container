# apps - was der Cluster für Menschen bereitstellt: Headlamp und whoami.
# Darf jederzeit scheitern, deshalb hängt keine andere Gruppe daran.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./k8s/flux/apps
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: core
  prune: true
  timeout: 5m
