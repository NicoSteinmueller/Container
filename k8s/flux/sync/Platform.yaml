# cert-manager, CloudNativePG, Reloader.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./k8s/flux/platform
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: core
  prune: true
  wait: true
  timeout: 10m
