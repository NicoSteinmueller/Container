# die eigene CA und was aus ihr ausgestellt wird.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./k8s/flux/cert-manager-issuers
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    # Wegen CRD
    - name: platform
  prune: true
  wait: true
  timeout: 5m
