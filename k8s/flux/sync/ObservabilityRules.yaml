# observability-rules - eigene Objekte der Operator-CRDs: Alarmregeln
# (PrometheusRule) und Scrape-Ziele (PodMonitor).
# Eigene Gruppe, weil kube-prometheus-stack in `observability` die CRD erst
# mitbringt.
#
# `dependsOn` ordnet nur: `observability` ist ohne `wait` fertig, sobald
# angewendet, die HelmRelease installiert danach noch. Der erste Versuch
# scheitert deshalb womöglich mit "no matches for kind"; `retryInterval`
# holt ihn nach, und betroffen ist nur diese Gruppe.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-rules
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./k8s/flux/observability-rules
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: observability
  prune: true
  timeout: 2m
