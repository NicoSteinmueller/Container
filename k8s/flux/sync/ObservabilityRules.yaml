# eigene Objekte der Operator-CRDs: Alarmregeln
# (PrometheusRule) und Scrape-Ziele (PodMonitor).
# Eigene Gruppe, da in `observability` die CRD erst angelegt wird.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-rules
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./k8s/flux/observability-rules
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: observability
  prune: true
  timeout: 2m
