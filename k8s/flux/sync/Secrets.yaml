# homelab-secrets - die zweite Git-Quelle, verschlüsselt.
#
# Alle Zugangsdaten liegen SOPS-verschlüsselt im Gitea-Repo `homelab-secrets`.
# Dieses Repo geht öffentlich nach GitHub, und auch Ciphertext soll dort nicht
# liegen: Ein später abhandengekommener Schlüssel macht ihn rückwirkend lesbar.
#
# sops-age, flux-git-auth und homelab-secrets-auth können nicht aus SOPS
# kommen: Der Bootstrap legt sie leer an, die Werte kommen beim Neuaufbau von
# Hand (../../bootstrap/README.md).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab-secrets
  namespace: flux-system
spec:
  # Kürzer als bei der Wurzel-Quelle: Ein rotiertes Passwort soll schnell
  # ankommen, und der Gitea steht im selben Haus.
  interval: 5m
  url: https://git.local.nico-steinmueller.de/nico/homelab-secrets.git
  ref:
    branch: master
  secretRef:
    # Leer angelegt von ../../bootstrap/main.tf, von Hand gefüllt (siehe
    # ../../bootstrap/README.md).
    name: homelab-secrets-auth
  # Nur der Pfad dieses Clusters; ein zweiter zöge sein eigenes Verzeichnis.
  ignore: |
    /*
    !/cluster
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-secrets
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster
  sourceRef:
    kind: GitRepository
    name: homelab-secrets
  # Ohne diesen Block landet ENC[AES256_GCM,...] wörtlich als Wert im Cluster -
  # die Kustomization bleibt grün, der Fehler zeigt sich erst am Dienst.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # Ein hier gelöschtes Secret verschwindet auch im Cluster.
  prune: true
  # Damit Anwendungen per `dependsOn` darauf warten können.
  wait: true
  # Kurz, damit ein Fehlschlag beim Entschlüsseln schnell auf Failed geht.
  timeout: 2m
  retryInterval: 1m
