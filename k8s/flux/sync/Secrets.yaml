# homelab-secrets - die zweite Git-Quelle, verschlüsselt.
# Alle Zugangsdaten liegen SOPS-verschlüsselt im Gitea-Repo `homelab-secrets`.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab-secrets
  namespace: flux-system
spec:
  interval: 5m
  url: https://git.local.nico-steinmueller.de/nico/homelab-secrets.git
  ref:
    branch: master
  secretRef:
    name: homelab-secrets-auth
  # Nur der Pfad dieses Clusters
  ignore: |
    /*
    !/cluster
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-secrets
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster
  sourceRef:
    kind: GitRepository
    name: homelab-secrets
  # Ohne landet das Verschlüsselte Secret im Cluster, ohne Fehlermeldung.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # Gelöschtes Secret verschwindet auch im Cluster.
  prune: true
  # Damit Anwendungen per `dependsOn` darauf warten können.
  wait: true
  # Kurz, damit ein Fehlschlag beim Entschlüsseln schnell auf Failed geht.
  timeout: 2m
  retryInterval: 1m
