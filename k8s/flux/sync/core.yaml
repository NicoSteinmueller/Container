# core - Namespaces und die Admission-Policy. Wurzel des Abhängigkeitsbaums:
# Jede andere Gruppe wartet hierauf, weil hier ihre Namespaces entstehen.
# `wait: true` mit kurzem Timeout - reine API-Objekte stehen sofort.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./k8s/flux/core
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  timeout: 2m
