# network - die beiden Ingress-Controller, CrowdSec und die LoadBalancer-IPs.
# `dependsOn: cert-manager-issuers` wegen CrowdSec: Der Chart templatet
# `Certificate`-Objekte gegen den ClusterIssuer `homelab-ca`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./k8s/flux/network
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cert-manager-issuers
  prune: true
  timeout: 5m
