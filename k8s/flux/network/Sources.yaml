# Chart-Quellen der Gruppe network.
#
# Getrennt von den Komponenten, weil eine Quelle mehreren gehören kann - wer
# eine Komponente entfernt, soll nicht nebenbei einer anderen die Quelle
# wegnehmen. Die Version pinnt jeweils die HelmRelease, nicht die Quelle.
---
# ingress-internal und ingress-public
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1h
  url: https://traefik.github.io/charts
---
# crowdsec
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: crowdsec
  namespace: flux-system
spec:
  interval: 1h
  url: https://crowdsecurity.github.io/helm-charts
