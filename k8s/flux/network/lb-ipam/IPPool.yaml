# LAN-Adressen des Clusters
#
# Außerhalb des DHCP-Bereichs und ohne Kollision mit `lan_ip`:
#
#   192.168.178.230  Node selbst
#   192.168.178.231  ingress-internal - nur LAN
#   192.168.178.232  ingress-public   - Internet
#
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: traefik-internal
spec:
  blocks:
    - start: "192.168.178.231"
      stop: "192.168.178.231"
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: traefik-internal
      io.kubernetes.service.name: traefik-internal

---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: traefik-public
spec:
  blocks:
    - start: "192.168.178.232"
      stop: "192.168.178.232"
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: traefik-public
      io.kubernetes.service.name: traefik-public
