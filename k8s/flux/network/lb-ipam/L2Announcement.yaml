# lb-ipam - Ankündigung der Pool-Adressen im LAN
---
# Gratuitous ARP für ingress-internal unter der MAC des Nodes. Ohne sie bleibt
# der ARP-Request unbeantwortet.
#
# Nur ingress-internal: ingress-public sitzt auf eigenem Bein mit eigener MAC
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan
spec:
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: traefik-internal
      io.kubernetes.service.name: traefik-internal
  # LAN-Anschluss des Nodes, als Regex.
  interfaces:
    - ^enp1s0$
  loadBalancerIPs: true
  externalIPs: false
