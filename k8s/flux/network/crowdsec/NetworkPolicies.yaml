# crowdsec - Netzwerkregeln im Namespace `crowdsec`
---
# Der Namespace ist eingehend zu (core/DefaultDenyIngress.yaml): Die LAPI hat
# außer dem Bouncer-Schlüssel keine Authentifizierung.
#
# Erlaubt sind nur der Bouncer aus traefik-public und der Agent nebenan.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lapi-from-ingress-public
  namespace: crowdsec
spec:
  podSelector:
    # `k8s-app`, nicht `app.kubernetes.io/name` - das Chart setzt die alte
    # Schreibweise. Danebengegriffen ist die LAPI unerreichbar.
    matchLabels:
      k8s-app: crowdsec
      type: lapi
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-public
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: crowdsec
      ports:
        - protocol: TCP
          port: 8080

---
# Ausgehend - Sperre und `**.cluster.local` kommen aus
# core/DefaultDenyEgress.yaml. Je Rolle nur die Namen, die sie braucht, und
# nur dorthin eine Verbindung: Der Agent verarbeitet mit den Zugriffslogs
# Eingaben von außen und ist damit der wahrscheinlichste Einstieg.
#
# Gemessen (Logs, Hub-Index-Zeitstempel, Hubble):
#   hub-data.crowdsec.net  Hub-Index und -Inhalte, beide Rollen beim Start
#   version.crowdsec.net   `cscli hub update` wählt damit den Hub-Zweig;
#                          ohne startet der Agent nicht (CrashLoop, gemessen)
#   api.crowdsec.net       Central API (Anmeldung, Community-Blocklist,
#                          Metriken) - nur die LAPI
# Nicht eingetragen, weil nicht genutzt: papi.api.crowdsec.net (erst mit
# Console-Anmeldung), cti.api.crowdsec.net (CTI-Schlüssel).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec-egress
  namespace: crowdsec
spec:
  endpointSelector: {}
  egress:
    - toFQDNs:
        - matchName: hub-data.crowdsec.net
        - matchName: version.crowdsec.net
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

---
# Agent -> LAPI, derselbe Selektor wie im Ingress oben. Dazu Reverse-DNS:
# Die Postoverflows `rdns` und `seo-bots-whitelist` fragen den PTR-Namen der
# Angreifer-IP - ohne ihn würden echte Suchmaschinen-Crawler gesperrt. Nur
# IPv4 und genau vier Labels; ein Rückkanal darüber bräuchte eine eigene
# Reverse-Zone.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec-agent-egress
  namespace: crowdsec
spec:
  endpointSelector:
    matchLabels:
      k8s-app: crowdsec
      type: agent
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: crowdsec
            k8s-app: crowdsec
            type: lapi
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: hub-data.crowdsec.net
              - matchName: version.crowdsec.net
              - matchPattern: "*.*.*.*.in-addr.arpa"

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec-lapi-egress
  namespace: crowdsec
spec:
  endpointSelector:
    matchLabels:
      k8s-app: crowdsec
      type: lapi
  egress:
    - toFQDNs:
        - matchName: api.crowdsec.net
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: hub-data.crowdsec.net
              - matchName: version.crowdsec.net
              - matchName: api.crowdsec.net
