# CrowdSec: Der Agent wertet die Zugriffslogs von ingress-public aus.
# https://docs.crowdsec.net/u/getting_started/installation/kubernetes/
# https://docs.crowdsec.net/docs/next/configuration/values_parameters/
# TODO: AppSec, Metabase-Dashboard.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: flux-system
spec:
  interval: 10m
  releaseName: crowdsec
  targetNamespace: crowdsec
  storageNamespace: crowdsec
  chart:
    spec:
      chart: crowdsec
      version: "0.24.2"
      sourceRef:
        kind: HelmRepository
        name: crowdsec
        namespace: flux-system
  install:
    remediation:
      retries: 3
  # Kein Rollback
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: false
  timeout: 10m
  values:
    # Talos fährt containerd
    container_runtime: containerd

    # Ohne TLS registriert sich der Agent beim Start mit seinem Pod-Namen bei
    # der LAPI - nach einem Container-Neustart ohne neuen Pod folgt daraus
    # `403: user already exist` und CrashLoopBackOff.
    tls:
      enabled: true

      # ClusterIssuer, damit traefik-public dieselbe CA bekommt.
      certManager:
        enabled: true
        issuerRef:
          name: homelab-ca
          kind: ClusterIssuer

        # secretTemplate: wird immer ausgegeben, ohne Schlüssel abgelehnt
        secretTemplate:
          labels:
            app.kubernetes.io/part-of: crowdsec

      agent:
        tlsClientAuth: true

    lapi:
      replicas: 1

      env:
        # Schlüssel des Bouncers
        - name: BOUNCER_KEY_traefik_public
          valueFrom:
            secretKeyRef:
              name: crowdsec-bouncer-key
              key: traefik_public

        # Das Chart stellt die Zertifikate mit diesen OUs aus
        - name: AGENTS_ALLOWED_OU
          value: agent-ou
        - name: BOUNCERS_ALLOWED_OU
          value: bouncer-ou

        # Registrierung bei app.crowdsec.net läuft bei jedem Start.
        # Schon registriert: nur Warnung. Schlüssel ungültig oder CAPI nicht
        # erreichbar: Der Start bricht ab (`set -e` im Entrypoint).
        - name: ENROLL_KEY
          valueFrom:
            secretKeyRef:
              name: crowdsec-enroll-key
              key: enroll_key
        - name: ENROLL_INSTANCE_NAME
          value: talos-cp1

      # TODO: auf Postgres umstellen
      # SQLite mit Entscheidungen und Alarmen
      persistentVolume:
        data:
          enabled: true
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          size: 1Gi
        config:
          enabled: true
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          size: 128Mi

      strategy:
        # SQLite-Datei darf nicht doppelt gemountet werden
        type: Recreate

      # Der Chart-Default lässt alle Capabilities stehen.
      # Kein `runAsNonRoot`, weil die LAPI in ihre PVCs schreibt.
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 384Mi

    agent:
      env:
        # TODO: Parser fürs Zugriffslog
        # Prüfen für neue Anwendung: https://app.crowdsec.net/hub/conecllections
        # COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/appsec-crs crowdsecurity/appsec-crs-exclusion-plugin-nextcloud crowdsecurity/sshd crowdsecurity/linux crowdsecurity/iptables crowdsecurity/base-http-scenarios crowdsecurity/http-dos crowdsecurity/whitelist-good-actors crowdsecurity/nextcloud gauth-fr/immich"
        - name: COLLECTIONS
          value: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios"

      # `poll_without_inotify`, weil /var/log/containers/*.log Symlinks sind.
      additionalAcquisition:
        - source: file
          filenames:
            - /var/log/containers/traefik-public-*_traefik-public_*.log
          poll_without_inotify: true
          labels:
            type: containerd
            program: traefik

      hostVarLog: false

      extraVolumes:
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
        - name: varlogpods
          hostPath:
            path: /var/log/pods

      extraVolumeMounts:
        - name: varlogcontainers
          mountPath: /var/log/containers
          readOnly: true
        - name: varlogpods
          mountPath: /var/log/pods
          readOnly: true

      # Die Container-Logs sind root:root.
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 384Mi

    # TODO: Monitoring
    dashboard:
      enabled: false
