# CrowdSec: LAPI und Agent. Der Agent wertet die Zugriffslogs von
# ingress-public aus, der Bouncer im dortigen Traefik fragt die LAPI.
#
# TODO: AppSec, Console-Registrierung bei crowdsec.net, Metabase-Dashboard.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: flux-system
spec:
  interval: 10m
  releaseName: crowdsec
  targetNamespace: crowdsec
  storageNamespace: crowdsec
  chart:
    spec:
      chart: crowdsec
      version: "0.24.0"
      sourceRef:
        kind: HelmRepository
        name: crowdsec
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  # Kein Rollback: Er schriebe die local_api_credentials.yaml wieder mit
  # Passwort statt Zertifikat.
  # Preis: Ein kaputtes Upgrade heilt sich hier nicht selbst.
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: false
    timeout: 10m
  values:
    # Talos fährt containerd
    container_runtime: containerd

    # Ohne TLS registriert sich der Agent beim Start mit seinem Pod-Namen bei
    # der LAPI - nach einem Container-Neustart ohne neuen Pod folgt daraus
    # `403: user already exist` und CrashLoopBackOff.
    tls:
      enabled: true

      # ClusterIssuer statt des chart-eigenen Issuers, damit traefik-public
      # dieselbe CA bekommt, ohne Secrets zwischen Namespaces zu kopieren.
      certManager:
        enabled: true
        issuerRef:
          name: homelab-ca
          kind: ClusterIssuer

        # secretTemplate:` wird immer ausgegeben, ohne Labels aber leer
        # und einen leeren Schlüssel lehnt das CRD-Schema ab.
        secretTemplate:
          labels:
            app.kubernetes.io/part-of: crowdsec

      agent:
        tlsClientAuth: true

    lapi:
      replicas: 1

      env:
        # Schlüssel des Bouncers; das Chart registriert ihn beim Start selbst.
        - name: BOUNCER_KEY_traefik_public
          valueFrom:
            secretKeyRef:
              name: crowdsec-bouncer-key
              key: traefik_public

        # Das Chart stellt die Zertifikate mit diesen OUs aus, setzt die
        # Variablen aber nicht - die LAPI lehnte sonst ihren eigenen Agent ab.
        - name: AGENTS_ALLOWED_OU
          value: agent-ou
        - name: BOUNCERS_ALLOWED_OU
          value: bouncer-ou

      # `data`: SQLite mit Entscheidungen und Alarmen, sonst überlebt keine
      # Sperre den Pod-Wechsel. `config`: Zugangsdaten und Bouncer-Schlüssel.
      persistentVolume:
        data:
          enabled: true
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          size: 1Gi
        config:
          enabled: true
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          size: 128Mi

      strategy:
        # Recreate: Zwei Pods dürften dieselbe SQLite-Datei mounten.
        type: Recreate

      # Der Chart-Default lässt alle Capabilities stehen. Kein `runAsNonRoot`,
      # weil die LAPI in ihre PVCs schreibt.
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 384Mi

    agent:
      env:
        # `traefik` bringt die Parser fürs Zugriffslog, ohne sie sieht der
        # Agent Zeilen, aber keine Ereignisse.
        - name: COLLECTIONS
          value: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios"

      # `poll_without_inotify`, weil /var/log/containers/*.log Symlinks sind.
      additionalAcquisition:
        - source: file
          filenames:
            - /var/log/containers/traefik-public-*_traefik-public_*.log
          poll_without_inotify: true
          labels:
            type: containerd
            program: traefik

      # Der Chart-Default hängt das ganze /var/log ein, samt apid.log, etcd.log
      # und Audit-Log. Gebraucht werden nur die beiden Mounts unten.
      hostVarLog: false

      extraVolumes:
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
        - name: varlogpods
          hostPath:
            path: /var/log/pods

      extraVolumeMounts:
        - name: varlogcontainers
          mountPath: /var/log/containers
          readOnly: true
        - name: varlogpods
          mountPath: /var/log/pods
          readOnly: true

      # Kein `runAsNonRoot`: Die Container-Logs sind root:root, als Nicht-Root
      # käme der Agent lautlos nicht mehr an sie heran.
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 384Mi

    # Siehe TODO im Kopf der Datei.
    dashboard:
      enabled: false
