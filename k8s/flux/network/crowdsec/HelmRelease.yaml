# CrowdSec: Der Agent wertet die Zugriffslogs von ingress-public aus.
# https://docs.crowdsec.net/u/getting_started/installation/kubernetes/
# https://docs.crowdsec.net/docs/next/configuration/values_parameters/
# AppSec: eigener Pod, den der Bouncer vor jeder Anfrage mit der Anfrage
# selbst fragt (WAF). https://docs.crowdsec.net/docs/next/appsec/intro
# TODO: Metabase-Dashboard.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: flux-system
spec:
  interval: 10m
  releaseName: crowdsec
  targetNamespace: crowdsec
  storageNamespace: crowdsec
  chart:
    spec:
      chart: crowdsec
      version: "0.24.2"
      sourceRef:
        kind: HelmRepository
        name: crowdsec
        namespace: flux-system
  install:
    remediation:
      retries: 3
  # Kein Rollback
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: false
  timeout: 10m
  values:
    # Talos fährt containerd
    container_runtime: containerd

    # Ausdrücklich statt AppVersion des Charts: Der Init-Container `prestage`
    # von AppSec muss dasselbe Image haben. Renovate hebt beide Stellen im
    # selben PR (packageRules `crowdsec-image`).
    image:
      repository: crowdsecurity/crowdsec
      tag: v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a

    # Ohne TLS registriert sich der Agent beim Start mit seinem Pod-Namen bei
    # der LAPI - nach einem Container-Neustart ohne neuen Pod folgt daraus
    # `403: user already exist` und CrashLoopBackOff.
    tls:
      enabled: true

      # ClusterIssuer, damit traefik-public dieselbe CA bekommt.
      certManager:
        enabled: true
        issuerRef:
          name: homelab-ca
          kind: ClusterIssuer

        # secretTemplate: wird immer ausgegeben, ohne Schlüssel abgelehnt.
        # Die AppSec-Zertifikate schreiben auch `annotations:` immer hin -
        # leer wird daraus `null`, und cert-manager lehnt das Certificate ab.
        secretTemplate:
          labels:
            app.kubernetes.io/part-of: crowdsec
          annotations:
            homelab.io/issuer: homelab-ca

      agent:
        tlsClientAuth: true

    lapi:
      replicas: 1

      env:
        # Schlüssel des Bouncers
        - name: BOUNCER_KEY_traefik_public
          valueFrom:
            secretKeyRef:
              name: crowdsec-bouncer-key
              key: traefik_public

        # Das Chart stellt die Zertifikate mit diesen OUs aus. AppSec meldet
        # sich wie ein Agent an, mit eigener OU.
        - name: AGENTS_ALLOWED_OU
          value: agent-ou,appsec-ou
        - name: BOUNCERS_ALLOWED_OU
          value: bouncer-ou

        # Registrierung bei app.crowdsec.net läuft bei jedem Start.
        # Schon registriert: nur Warnung. Schlüssel ungültig oder CAPI nicht
        # erreichbar: Der Start bricht ab (`set -e` im Entrypoint).
        - name: ENROLL_KEY
          valueFrom:
            secretKeyRef:
              name: crowdsec-enroll-key
              key: enroll_key
        - name: ENROLL_INSTANCE_NAME
          value: talos-cp1

      # TODO: auf Postgres umstellen
      # SQLite mit Entscheidungen und Alarmen
      persistentVolume:
        data:
          enabled: true
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          size: 1Gi
        config:
          enabled: true
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          size: 128Mi

      strategy:
        # SQLite-Datei darf nicht doppelt gemountet werden
        type: Recreate

      # Der Chart-Default lässt alle Capabilities stehen.
      # Kein `runAsNonRoot`, weil die LAPI in ihre PVCs schreibt.
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 384Mi

    agent:
      env:
        # TODO: Parser fürs Zugriffslog
        # Prüfen für neue Anwendung: https://app.crowdsec.net/hub/conecllections
        # COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/appsec-crs crowdsecurity/appsec-crs-exclusion-plugin-nextcloud crowdsecurity/sshd crowdsecurity/linux crowdsecurity/iptables crowdsecurity/base-http-scenarios crowdsecurity/http-dos crowdsecurity/whitelist-good-actors crowdsecurity/nextcloud gauth-fr/immich"
        - name: COLLECTIONS
          value: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
        # Nimmt typische Nextcloud-Fehlalarme aus den HTTP-Szenarien: 404 bei
        # WebDAV (die App prüft so ihre Upload-Ordner), fehlende Vorschauen,
        # Avatare, Vorschaubilder der Fotos-App. Ohne sie sperrte
        # `http-probing` nach zehn solchen 404 die ganze Adresse.
        - name: PARSERS
          value: "crowdsecurity/nextcloud-whitelist"

      # `poll_without_inotify`, weil /var/log/containers/*.log Symlinks sind.
      additionalAcquisition:
        - source: file
          filenames:
            - /var/log/containers/traefik-public-*_traefik-public_*.log
          poll_without_inotify: true
          labels:
            type: containerd
            program: traefik

      hostVarLog: false

      extraVolumes:
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
        - name: varlogpods
          hostPath:
            path: /var/log/pods

      extraVolumeMounts:
        - name: varlogcontainers
          mountPath: /var/log/containers
          readOnly: true
        - name: varlogpods
          mountPath: /var/log/pods
          readOnly: true

      # Die Container-Logs sind root:root.
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 384Mi

      # Wartet per `nc -z` auf die LAPI. Chart-Default ist busybox 1.28 von
      # 2018 ohne Digest.
      wait_for_lapi: &waitForLapi
        image:
          repository: busybox
          tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault

    appsec:
      enabled: true

      # TLS mit dem Zertifikat, das das Chart für den Service ausstellt.
      # Der Bouncer prüft es gegen dieselbe CA wie die LAPI.
      acquisitions:
        - source: appsec
          listen_addr: 0.0.0.0:7422
          path: /
          cert_file: /etc/ssl/crowdsec-appsec-server/tls.crt
          key_file: /etc/ssl/crowdsec-appsec-server/tls.key
          appsec_configs:
            # blockt sofort: Virtual Patching für bekannte CVEs, generische Regeln
            - crowdsecurity/appsec-default
            # OWASP CRS, nur mitlesend: Treffer werden Alarme, wiederholte
            # Treffer über `crowdsec-appsec-outofband` ein Bann
            - crowdsecurity/crs
          labels:
            type: appsec

      env:
        # appsec-crs-exclusion-plugin-nextcloud: CRS hält sonst WebDAV
        # (PROPFIND, XML-Bodies unter /remote.php) für Angriffe und bannt die
        # Sync-Clients. CRS lädt das Plugin aus crs-plugins/ von selbst.
        - name: COLLECTIONS
          value: "crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/appsec-crs crowdsecurity/appsec-crs-exclusion-plugin-nextcloud"

      # AppSec liest jede Anfrage aus dem Internet samt Body - deshalb nicht
      # als root. Das Startskript schreibt nach /etc/crowdsec und
      # /var/lib/crowdsec/data; beides liegt auf emptyDirs, die `prestage`
      # vorher füllt.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        privileged: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      # Die Vorlagen in /staging gehören root mit 0600 - ohne root nicht
      # lesbar. `prestage` kopiert sie, wie es das Startskript sonst täte, und
      # übergibt sie an uid 1000. Root nur mit CHOWN, kurz, ohne Netz-Port.
      # Liegt dann config.yaml schon da, überspringt das Startskript sein
      # eigenes rsync; sind die Daten kopiert, legt es keine Symlinks auf
      # die unlesbaren Originale an.
      extraInitContainers:
        - name: prestage
          image: crowdsecurity/crowdsec:v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
          command: [sh, -c]
          args:
            - >-
              rsync -a /staging/etc/crowdsec/ /etc/crowdsec/ &&
              rsync -a /staging/var/lib/crowdsec/data/ /var/lib/crowdsec/data/ &&
              chown -R 1000:1000 /etc/crowdsec /var/lib/crowdsec/data
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: appsec-etc
              mountPath: /etc/crowdsec
            - name: appsec-data
              mountPath: /var/lib/crowdsec/data

      extraVolumes:
        - name: appsec-etc
          emptyDir:
            sizeLimit: 64Mi
        # GeoIP-Datenbanken aus dem Image (~75 MB) und Daten aus dem Hub
        - name: appsec-data
          emptyDir:
            sizeLimit: 512Mi
        - name: appsec-tmp
          emptyDir:
            sizeLimit: 64Mi

      extraVolumeMounts:
        - name: appsec-etc
          mountPath: /etc/crowdsec
        - name: appsec-data
          mountPath: /var/lib/crowdsec/data
        - name: appsec-tmp
          mountPath: /tmp

      wait_for_lapi: *waitForLapi

      # Chart-Default: 500m fest reserviert und als Limit. Gedrosselt bremste
      # AppSec jede öffentliche Anfrage - `null` nimmt das Limit heraus.
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          cpu: 2
          memory: 512Mi

    # TODO: Monitoring
    dashboard:
      enabled: false
