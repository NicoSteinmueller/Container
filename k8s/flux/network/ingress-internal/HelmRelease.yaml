# ingress-internal - Ingress-Controller fürs Heimnetz
# Namespace: traefik-internal
#
# Ohne Zugang zur Kubernetes-API: Die Routen stehen in DynamicConfig.yaml.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-internal
  namespace: flux-system
spec:
  interval: 10m
  releaseName: traefik-internal
  targetNamespace: traefik-internal
  storageNamespace: traefik-internal
  chart:
    spec:
      chart: traefik
      version: "41.3.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  # Das Chart schreibt `automountServiceAccountToken: true` fest ins
  # Pod-Template. Ohne Kubernetes-Provider braucht der Pod kein Token. `test`
  # vor `replace`: Ändert ein Chart-Update die Stelle, scheitert das Rendern
  # laut.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: traefik-internal
            patch: |
              - op: test
                path: /spec/template/spec/automountServiceAccountToken
                value: true
              - op: replace
                path: /spec/template/spec/automountServiceAccountToken
                value: false

  values:
    deployment:
      kind: Deployment
      replicas: 1

      additionalVolumes:
        # Routen und Middlewares (DynamicConfig.yaml)
        - name: dynamic-config
          configMap:
            name: traefik-internal-dynamic

        # BasicAuth fürs Dashboard: als Datei vom Kubelet eingehängt, nicht
        # über die API gelesen. Nur der Schlüssel `users`.
        - name: dashboard-auth
          secret:
            secretName: traefik-dashboard-auth
            items:
              - key: users
                path: users
            defaultMode: 0400

    additionalVolumeMounts:
      # Jede Datei einzeln per subPath: Ein ganzes ConfigMap-Volume brächte
      # die versteckten Verzeichnisse `..<zeitstempel>` mit, in die der
      # File-Provider hineinliest - jede Datei zweimal, und während eines
      # Updates womöglich die alte Fassung zuerst. subPath-Mounts sehen keine
      # Änderungen; eine neue Fassung kommt über den Reloader-Neustart.
      - name: dynamic-config
        mountPath: /etc/traefik/dynamic/routes.yaml
        subPath: routes.yaml
        readOnly: true
      - name: dynamic-config
        mountPath: /etc/traefik/dynamic/middlewares.yaml
        subPath: middlewares.yaml
        readOnly: true
      - name: dashboard-auth
        mountPath: /traefik-auth
        readOnly: true

    additionalArguments:
      - --providers.file.directory=/etc/traefik/dynamic

    # Recreate wegen acme.json: lego schreibt ohne Sperre
    updateStrategy:
      type: Recreate
      rollingUpdate: null

    podSecurityContext:
      runAsUser: 65532
      runAsGroup: 65532
      runAsNonRoot: true
      # Ohne fsGroup gehört das frische PVC-Verzeichnis root.
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    # Cilium vergibt die LAN-Adresse (../lb-ipam/) und kündigt sie per L2 an.
    ports:
      web:
        port: 8000
        exposedPort: 80
        expose:
          default: true
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true

      websecure:
        port: 8443
        exposedPort: 443
        expose:
          default: true
        http:
          tls:
            enabled: true
            # Wildcard am Entrypoint statt je Ingress
            certResolver: letsencrypt
            domains:
              - main: k8s.nico-steinmueller.de
                sans:
                  - "*.k8s.nico-steinmueller.de"
        forwardedHeaders:
          # Kein Proxy davor, ein mitgeschickter X-Forwarded-For wäre erfunden.
          trustedIPs: []
          insecure: false

    # Feste Adresse statt geratener Vergabereihenfolge.
    service:
      enabled: true
      annotations:
        lbipam.cilium.io/ips: "192.168.178.231"
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Local

        # NodePorts bedient Cilium in eBPF, an Talos' Ingress-Firewall vorbei -
        # sie wären die zweite Tür neben `allow-from-lan`.
        allocateLoadBalancerNodePorts: false

    # Wildcard von Let's Encrypt per DNS-01 über IONOS. Traefik macht es selbst,
    # weil cert-manager keinen IONOS-Solver hat.
    certificatesResolvers:
      letsencrypt:
        acme:
          email: nico.steinmueller@gmx.net
          storage: /data/acme.json
          # PRODUKTIV, Staging wäre acme-staging-v02.api.letsencrypt.org.
          # Dorthin erst testen: fünf Fehlversuche je Stunde und Hostname.
          # Bei jedem Wechsel muss acme.json weg, sie trägt Zertifikat und
          # ACME-Konto.
          caServer: https://acme-v02.api.letsencrypt.org/directory
          keyType: EC256
          dnsChallenge:
            provider: ionos
            # Öffentliche Resolver.
            resolvers:
              - 1.1.1.1:53
              - 8.8.8.8:53
            propagation:
              delayBeforeChecks: 30s

    # lego liest den Key nur aus der Umgebung.
    env:
      - name: IONOS_API_KEY
        valueFrom:
          secretKeyRef:
            name: traefik-ionos
            key: IONOS_API_KEY

    # acme.json muss den Neustart überleben, sonst droht das Rate Limit.
    persistence:
      enabled: true
      name: data
      accessMode: ReadWriteOnce
      size: 128Mi
      storageClass: local-path
      path: /data

    # Keine Rechte: Der Controller spricht nicht mit der API. Den
    # ServiceAccount legt das Chart an, gebunden ist er an nichts.
    rbac:
      enabled: false

    ingressClass:
      enabled: false

    # Kein Kubernetes-Provider: Jeder startete je beobachtetem Namespace einen
    # Secrets-Informer, und der Controller läse dort alle Secrets. Die Routen
    # kommen aus DynamicConfig.yaml (`additionalArguments` oben).
    providers:
      kubernetesIngress:
        enabled: false
      kubernetesCRD:
        enabled: false
      kubernetesGateway:
        enabled: false

    # Das Dashboard hängt als Router `dashboard` in DynamicConfig.yaml, mit
    # BasicAuth - die IngressRoute des Charts läse ohne CRD-Provider niemand.
    ingressRoute:
      dashboard:
        enabled: false
      healthcheck:
        enabled: false

    log:
      level: INFO

    accessLog:
      enabled: true
      format: json

    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        memory: 192Mi
