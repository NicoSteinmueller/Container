# ingress-internal - Ingress-Controller fürs Heimnetz
# Namespace: traefik-internal
#
# Ohne Zugang zur Kubernetes-API: Die Routen stehen in DynamicConfig.yaml.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-internal
  namespace: flux-system
spec:
  interval: 10m
  releaseName: traefik-internal
  targetNamespace: traefik-internal
  storageNamespace: traefik-internal
  chart:
    spec:
      chart: traefik
      version: "41.7.1"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  # feste `automountServiceAccountToken: true` aus Pod-Template wird entfernt
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: traefik-internal
            patch: |
              - op: test
                path: /spec/template/spec/automountServiceAccountToken
                value: true
              - op: replace
                path: /spec/template/spec/automountServiceAccountToken
                value: false

  values:
    deployment:
      kind: Deployment
      replicas: 1

      additionalVolumes:
        # Routen und Middlewares
        - name: dynamic-config
          configMap:
            name: traefik-internal-dynamic

        # BasicAuth fürs Dashboard
        - name: dashboard-auth
          secret:
            secretName: traefik-dashboard-auth
            items:
              - key: users
                path: users
            defaultMode: 0400

    additionalVolumeMounts:
      # Jede Datei einzeln per subPath
      - name: dynamic-config
        mountPath: /etc/traefik/dynamic/routes.yaml
        subPath: routes.yaml
        readOnly: true
      - name: dynamic-config
        mountPath: /etc/traefik/dynamic/middlewares.yaml
        subPath: middlewares.yaml
        readOnly: true
      - name: dashboard-auth
        mountPath: /traefik-auth
        readOnly: true

    additionalArguments:
      - --providers.file.directory=/etc/traefik/dynamic

    # Keine Versionsprüfung
    global:
      checkNewVersion: false

    # Recreate wegen acme.json
    updateStrategy:
      type: Recreate
      rollingUpdate: null

    podSecurityContext:
      runAsUser: 65532
      runAsGroup: 65532
      runAsNonRoot: true
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    # Cilium vergibt die LAN-Adresse
    ports:
      web:
        port: 8000
        exposedPort: 80
        expose:
          default: true
        http:
          aliasHeadersStrategy: delete
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true

      websecure:
        port: 8443
        exposedPort: 443
        expose:
          default: true
        http:
          aliasHeadersStrategy: delete
          tls:
            enabled: true
            # Wildcard am Entrypoint
            certResolver: letsencrypt
            domains:
              - main: k8s.nico-steinmueller.de
                sans:
                  - "*.k8s.nico-steinmueller.de"
        forwardedHeaders:
          trustedIPs: []
          insecure: false

    # Feste Adresse
    service:
      enabled: true
      annotations:
        lbipam.cilium.io/ips: "192.168.178.231"
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Local
        # NodePort würde Talos-Firewall umgehen.
        allocateLoadBalancerNodePorts: false

    # Wildcard von Let's Encrypt per DNS-01 über IONOS. Traefik macht es selbst,
    # weil cert-manager keinen IONOS-Solver hat.
    certificatesResolvers:
      letsencrypt:
        acme:
          email: nico.steinmueller@gmx.net
          storage: /data/acme.json
          # PRODUKTIV, Staging wäre acme-staging-v02.api.letsencrypt.org.
          # Bei jedem Wechsel muss acme.json weg, sie trägt Zertifikat und
          # ACME-Konto.
          caServer: https://acme-v02.api.letsencrypt.org/directory
          keyType: EC256
          dnsChallenge:
            provider: ionos
            # Öffentliche Resolver.
            resolvers:
              - 1.1.1.1:53
              - 8.8.8.8:53
            propagation:
              delayBeforeChecks: 30s
              # Keine Prüfung direkt bei IONOS' Nameservern
              disableANSChecks: true

    env:
      - name: IONOS_API_KEY
        valueFrom:
          secretKeyRef:
            name: traefik-ionos
            key: IONOS_API_KEY

    # acme.json muss den Neustart überleben
    persistence:
      enabled: true
      name: data
      accessMode: ReadWriteOnce
      size: 128Mi
      storageClass: local-path
      path: /data

    rbac:
      enabled: false

    ingressClass:
      enabled: false

    # läse alle Secrets im Node-Namespace, Routen in DynamicConfig.yaml
    providers:
      kubernetesIngress:
        enabled: false
      kubernetesCRD:
        enabled: false
      kubernetesGateway:
        enabled: false

    ingressRoute:
      dashboard:
        enabled: false
      healthcheck:
        enabled: false

    log:
      level: INFO

    accessLog:
      enabled: true
      format: json

    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        memory: 192Mi
