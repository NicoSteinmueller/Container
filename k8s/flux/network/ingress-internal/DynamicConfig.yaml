# Routen und Middlewares für den File-Provider
#
# ein neuer Dienst braucht einen Router, einen Service und einen
# `toEndpoints`-Block in NetworkPolicies.yaml.
#
# Eine Änderung hier wirkt erst über den Neustart, den Reloader auslöst.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-internal-dynamic
  namespace: traefik-internal
data:
  routes.yaml: |
    http:
      routers:
        headlamp:
          rule: Host(`dashboard.k8s.nico-steinmueller.de`)
          entryPoints:
            - websecure
          service: headlamp

        grafana:
          rule: Host(`grafana.k8s.nico-steinmueller.de`)
          entryPoints:
            - websecure
          service: grafana

        whoami:
          rule: Host(`whoami.k8s.nico-steinmueller.de`)
          entryPoints:
            - websecure
          service: whoami

        it-tools:
          rule: Host(`it-tools.k8s.nico-steinmueller.de`)
          entryPoints:
            - websecure
          service: it-tools

        # Traefiks eigenes Dashboard. Erst Passwort, dann Umleitung
        dashboard:
          rule: Host(`traefik.k8s.nico-steinmueller.de`)
          entryPoints:
            - websecure
          service: api@internal
          middlewares:
            - traefik-dashboard-auth
            - traefik-dashboard-root

      # Über den Service-Namen statt über Endpoints
      services:
        headlamp:
          loadBalancer:
            servers:
              - url: http://headlamp.headlamp.svc.cluster.local:80
        grafana:
          loadBalancer:
            servers:
              - url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80
        whoami:
          loadBalancer:
            servers:
              - url: http://whoami.whoami.svc.cluster.local:80
        it-tools:
          loadBalancer:
            servers:
              - url: http://it-tools.it-tools.svc.cluster.local:80

  middlewares.yaml: |
    http:
      middlewares:
        # Zugangsdaten aus dem Secret traefik-dashboard-auth
        # `removeHeader`: sonst geht der Benutzer als Authorization-Header weiter.
        traefik-dashboard-auth:
          basicAuth:
            usersFile: /traefik-auth/users
            realm: Traefik
            removeHeader: true

        # Von / auf /dashboard/ umleiten
        traefik-dashboard-root:
          redirectRegex:
            regex: ^https?://[^/]+/?$
            replacement: https://traefik.k8s.nico-steinmueller.de/dashboard/
            permanent: false
