# ingress-internal - Netzwerkregeln im Namespace `traefik-internal`
---
# Der Namespace ist eingehend zu (core/DefaultDenyIngress.yaml) - sonst umginge
# jeder Pod über die Pod-Adresse die Policies der Anwendungen.
#
# ipBlock greift nur, weil der Client als `world` ankommt - das hängt an
# `externalTrafficPolicy: Local` in HelmRelease.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-lan
  namespace: traefik-internal
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.178.0/24

---
# Ausgehend erlaubt; Sperre und DNS kommen aus (core/DefaultDenyEgress.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: traefik-internal-egress
  namespace: traefik-internal
spec:
  endpointSelector: {}
  egress:
    # Kein Weg zur API: Der Controller liest keine Kubernetes-Objekte
    # (DynamicConfig.yaml).

    # Die bedienten Dienste, passend zu den Services in DynamicConfig.yaml -
    # fehlt einer, steht die Route und erreicht das Backend nicht.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: headlamp
      toPorts:
        - ports:
            - port: "4466"
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: whoami
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP

    # DNS über CoreDNS mit DNS-Regel, damit Cilium die Adressen hinter den
    # Namen unten kennt - wie ../ingress-public/NetworkPolicies.yaml.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"

    # Internet nur für das Wildcard-Zertifikat (DNS-01), statt `0.0.0.0/0`.
    # Kein Plugin, keine Versionsprüfung (HelmRelease.yaml) - mehr braucht
    # dieser Controller nicht.
    - toFQDNs:
        - matchName: acme-v02.api.letsencrypt.org
        - matchName: api.hosting.ionos.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # DNS-01: Propagationsprüfung nur über die beiden Resolver aus
    # HelmRelease.yaml; die Prüfung bei den autoritativen Nameservern ist dort
    # abgeschaltet.
    - toCIDR:
        - 1.1.1.1/32
        - 8.8.8.8/32
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
