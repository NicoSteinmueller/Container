# Netzwerkregeln im Namespace `traefik-internal`
---
# ipBlock erlaubt nur Heimnetz
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-lan
  namespace: traefik-internal
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.178.0/24

---
# Ausgehend erlaubt; Sperre und DNS kommen aus (core/DefaultDenyEgress.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: traefik-internal-egress
  namespace: traefik-internal
spec:
  endpointSelector: {}
  egress:
    # Die bedienten Dienste, passend zu DynamicConfig.yaml -
    # fehlt einer, steht die Route und erreicht das Backend nicht.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: headlamp
      toPorts:
        - ports:
            - port: "4466"
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: whoami
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP

    # DNS für genau die Namen unten, zusätzlich zu `**.cluster.local`
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: acme-v02.api.letsencrypt.org
              - matchName: api.hosting.ionos.com

    # Internet nur für das Wildcard-Zertifikat (DNS-01)
    - toFQDNs:
        - matchName: acme-v02.api.letsencrypt.org
        - matchName: api.hosting.ionos.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # DNS-01: Propagationsprüfung nur über die beiden Resolver
    - toCIDR:
        - 1.1.1.1/32
        - 8.8.8.8/32
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

---
# Prometheus liest die Metriken (:9100)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-from-prometheus
  namespace: traefik-internal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9100
