# ingress-internal - Middlewares für das Traefik-Dashboard
---
# Die CRDs bringt erst der Chart (HelmRelease.yaml) - beim ersten Aufbau scheitert dieses
# Apply einmal und läuft nach `retryInterval` durch.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-dashboard-auth
  namespace: traefik-internal
spec:
  # Zugangsdaten in homelab-secrets
  basicAuth:
    secret: traefik-dashboard-auth
    realm: Traefik
    # Sonst geht der Benutzer als Authorization-Header an api@internal weiter.
    removeHeader: true

---
# Von / auf /dashboard/ umleiten
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-dashboard-root
  namespace: traefik-internal
spec:
  redirectRegex:
    regex: ^https?://[^/]+/?$
    replacement: https://traefik.k8s.nico-steinmueller.de/dashboard/
    permanent: false
