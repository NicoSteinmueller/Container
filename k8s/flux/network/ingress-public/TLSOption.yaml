# ingress-public - TLS-Einstellungen für alle Entrypoints
---
# `sniStrict` ohne `defaultCertificate`: unbekannte Namen enden im Handshake,
# nicht in einer Antwort. Scanner auf der IP kommen nicht bis zum Request.
#
# Der Name `default` ist Pflicht - Traefik nimmt sie für jeden Entrypoint, der
# keine andere nennt.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
  namespace: traefik-public
spec:
  minVersion: VersionTLS12
  sniStrict: true
  cipherSuites:
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
    - TLS_AES_128_GCM_SHA256
    - TLS_AES_256_GCM_SHA384
    - TLS_CHACHA20_POLY1305_SHA256
  curvePreferences:
    - CurveP521
    - CurveP384
