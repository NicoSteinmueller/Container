# ingress-public - Netzwerkregeln im Namespace `traefik-public`
---
# Der Namespace ist eingehend zu (core/DefaultDenyIngress.yaml) - sonst wären
# auch Ping- und Metrik-Port clusterweit erreichbar.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-world
  namespace: traefik-public
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  # Aus aller Welt - hier Absicht. Offen nur die beiden Entrypoint-Ports.
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8443

---
# Ausgehend erlaubt; Sperre und DNS kommen aus (core/DefaultDenyEgress.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: traefik-public-egress
  namespace: traefik-public
spec:
  endpointSelector: {}
  egress:
    # Kein Weg zur API: Der Controller liest keine Kubernetes-Objekte
    # (DynamicConfig.yaml).

    # Die LAPI, die der Bouncer fragt.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: crowdsec
            k8s-app: crowdsec
            type: lapi
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    # Die bedienten Dienste, je einer ein Block.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ntfy
            app.kubernetes.io/name: ntfy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    # DNS über CoreDNS - dieselbe Freigabe wie in core/DefaultDenyEgress.yaml,
    # hier mit DNS-Regel: Damit läuft die Auflösung durch Ciliums DNS-Proxy,
    # und nur so weiß Cilium, welche Adressen hinter den Namen unten stehen.
    # Aufgelöst werden darf alles (die Clusterregel erlaubt DNS ohnehin);
    # begrenzt ist, wohin danach eine Verbindung geht.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"

    # Internet nur zu diesen Namen, statt `0.0.0.0/0` - sonst hätte jeder, der
    # den Pod übernimmt, einen Rückkanal zu beliebigen Zielen. Gemessen mit
    # einem Traefik 3.7.11 hinter protokollierendem DNS und im lego-Quelltext:
    #   plugins.traefik.io            CrowdSec-Plugin beim Start (HelmRelease.yaml)
    #   acme-v02.api.letsencrypt.org  ACME
    #   api.hosting.ionos.com         DNS-01 (lego, Provider ionos)
    - toFQDNs:
        - matchName: plugins.traefik.io
        - matchName: acme-v02.api.letsencrypt.org
        - matchName: api.hosting.ionos.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # DNS-01: lego prüft die Propagation über genau diese beiden Resolver
    # (`dnsChallenge.resolvers` in HelmRelease.yaml). Die Prüfung gegen die
    # autoritativen Nameserver ist dort abgeschaltet - deren Adressen kennt
    # hier niemand im Voraus.
    - toCIDR:
        - 1.1.1.1/32
        - 8.8.8.8/32
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
