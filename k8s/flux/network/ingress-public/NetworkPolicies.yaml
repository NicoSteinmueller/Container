# Netzwerkregeln im Namespace `traefik-public`
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-world
  namespace: traefik-public
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  # Aus aller Welt - nur die beiden Entrypoint-Ports.
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8443

---
# Ausgehend erlaubt
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: traefik-public-egress
  namespace: traefik-public
spec:
  endpointSelector: {}
  egress:

    # Die LAPI, die der Bouncer fragt.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: crowdsec
            k8s-app: crowdsec
            type: lapi
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    # Die bedienten Dienste, je ein Block.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ntfy
            app.kubernetes.io/name: ntfy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: keycloak
            app.kubernetes.io/name: keycloak
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    # DNS für genau die Namen unten - zusätzlich zu `**.cluster.local`
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: plugins.traefik.io
              - matchName: acme-v02.api.letsencrypt.org
              - matchName: api.hosting.ionos.com

    # Internet nur zu diesen Namen:
    #   plugins.traefik.io            CrowdSec-Plugin beim Start
    #   acme-v02.api.letsencrypt.org  ACME
    #   api.hosting.ionos.com         DNS-01 (lego, Provider ionos)
    - toFQDNs:
        - matchName: plugins.traefik.io
        - matchName: acme-v02.api.letsencrypt.org
        - matchName: api.hosting.ionos.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # DNS-01: lego prüft die Propagation über genau diese beiden Resolver
    - toCIDR:
        - 1.1.1.1/32
        - 8.8.8.8/32
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

---
# Prometheus liest die Metriken (:9100)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-from-prometheus
  namespace: traefik-public
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9100
