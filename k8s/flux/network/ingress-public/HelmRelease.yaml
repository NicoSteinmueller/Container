# Ingress-Controller aus dem Internet
# Namespace: traefik-public
#
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-public
  namespace: flux-system
spec:
  interval: 10m
  releaseName: traefik-public
  targetNamespace: traefik-public
  storageNamespace: traefik-public
  chart:
    spec:
      chart: traefik
      version: "41.6.1"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  # feste `automountServiceAccountToken: true` aus Pod-Template wird entfernt
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: traefik-public
            patch: |
              - op: test
                path: /spec/template/spec/automountServiceAccountToken
                value: true
              - op: replace
                path: /spec/template/spec/automountServiceAccountToken
                value: false

  values:
    deployment:
      kind: Deployment
      replicas: 1

      # Secret crowdsec-bouncer-key
      additionalVolumes:
        - name: crowdsec-key
          secret:
            secretName: crowdsec-bouncer-key
            defaultMode: 0400

        # Die CA, gegen die das Plugin die LAPI prüft
        - name: crowdsec-ca
          secret:
            secretName: traefik-public-crowdsec-ca
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0444

        # Routen, Middlewares, TLS-Option (DynamicConfig.yaml)
        - name: dynamic-config
          configMap:
            name: traefik-public-dynamic

    # Recreate wegen acme.json
    updateStrategy:
      type: Recreate
      rollingUpdate: null

    podSecurityContext:
      runAsUser: 65532
      runAsGroup: 65532
      runAsNonRoot: true
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    # Traefik lädt das Plugin beim Start von plugins.traefik.io - C
    # Hash bei jedem Versionswechsel neu:
    #
    #   curl -sL https://plugins.traefik.io/public/download/<moduleName>/<version> | sha256sum
    #
    # Renovate hebt nur die Version (Regex-Manager in renovate.json5), den Hash
    # nicht - der PR sagt das und bringt den Befehl mit.
    experimental:
      abortOnPluginFailure: true
      plugins:
        crowdsec-bouncer:
          moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          version: v1.7.1
          hash: 500739fc1600c12a651433b13a81693470cd336dbc7864cb85ee42098c93d884

    global:
      checkNewVersion: false

    additionalVolumeMounts:
      - name: crowdsec-key
        mountPath: /crowdsec
        readOnly: true
      - name: crowdsec-ca
        mountPath: /crowdsec-ca
        readOnly: true
      # Jede Datei einzeln per subPath
      - name: dynamic-config
        mountPath: /etc/traefik/dynamic/routes.yaml
        subPath: routes.yaml
        readOnly: true
      - name: dynamic-config
        mountPath: /etc/traefik/dynamic/middlewares.yaml
        subPath: middlewares.yaml
        readOnly: true
      - name: dynamic-config
        mountPath: /etc/traefik/dynamic/tls.yaml
        subPath: tls.yaml
        readOnly: true

    additionalArguments:
      - --providers.file.directory=/etc/traefik/dynamic

    ports:
      web:
        port: 8000
        exposedPort: 80
        expose:
          default: true
        # Nur zum Weiterleiten
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true

      websecure:
        port: 8443
        exposedPort: 443
        expose:
          default: true
        http:
          # Am Entrypoint, damit kein Ingress die Kette vergessen kann.
          middlewares:
            - public-chain@file
          tls:
            enabled: true
            # Zertifikat je Router
            certResolver: letsencrypt

        forwardedHeaders:
          trustedIPs: []
          insecure: false

    service:
      enabled: true
      annotations:
        lbipam.cilium.io/ips: "192.168.178.232"
      spec:
        type: LoadBalancer
        # sonst ersetzt SNAT die Client-Adresse durch die des Nodes
        externalTrafficPolicy: Local
        # die Portfreigabe soll auf eine eigene Adresse zeigen
        allocateLoadBalancerNodePorts: false

    # Let's Encrypt per DNS-01
    # TODO: Auf TLS-ALPN-01 umstellen, sobald die Fritzbox 443 an .232 gibt
    certificatesResolvers:
      letsencrypt:
        acme:
          email: nico.steinmueller@gmx.net
          storage: /data/acme.json
          # PRODUKTIV, Staging wäre acme-staging-v02.api.letsencrypt.org.
          # Bei jedem Wechsel muss acme.json weg
          #   kubectl -n traefik-public exec deploy/traefik-public \
          #     -- rm -f /data/acme.json
          #   kubectl -n traefik-public rollout restart deploy/traefik-public
          caServer: https://acme-v02.api.letsencrypt.org/directory
          keyType: EC256
          dnsChallenge:
            provider: ionos
            resolvers:
              - 1.1.1.1:53
              - 8.8.8.8:53
            propagation:
              delayBeforeChecks: 30s
              # Keine Prüfung direkt bei IONOS' Nameservern
              disableANSChecks: true

    env:
      - name: IONOS_API_KEY
        valueFrom:
          secretKeyRef:
            name: traefik-ionos
            key: IONOS_API_KEY

    # Eigenes acme.json
    persistence:
      enabled: true
      name: data
      accessMode: ReadWriteOnce
      size: 128Mi
      storageClass: local-path
      path: /data

    # Keine Rechte
    rbac:
      enabled: false

    serviceAccount:
      name: traefik-public

    ingressClass:
      enabled: false

    # läse alle Secrets im Node-Namespace, Routen in DynamicConfig.yaml
    providers:
      kubernetesIngress:
        enabled: false
      kubernetesCRD:
        enabled: false
      kubernetesGateway:
        enabled: false

    # Kein Dashboard
    ingressRoute:
      dashboard:
        enabled: false
      healthcheck:
        enabled: false

    log:
      level: INFO

    accessLog:
      enabled: true
      format: json
      fields:
        general:
          defaultmode: keep
        names:
          clientUsername: drop
        headers:
          defaultmode: keep
          names:
            user-agent: keep
            x-forwarded-for: keep
            x-request-ip: keep
            cf-connecting-ip: keep
            referrer: keep
            content-type: keep
            accept: keep
            authorization: redact
            cookie: redact
            set-cookie: redact

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
