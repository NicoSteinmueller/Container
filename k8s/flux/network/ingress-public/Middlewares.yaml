# ingress-public - Middlewares; `public-chain` hängt am Entrypoint websecure
---
# Der Bouncer fragt vor jeder Anfrage die LAPI. `live` heißt ohne Cache - eine
# Sperre wirkt sofort.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec
  namespace: traefik-public
spec:
  plugin:
    crowdsec-bouncer:
      enabled: true
      crowdsecMode: live
      crowdsecLapiScheme: https
      crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
      crowdsecLapiKeyFile: /crowdsec/traefik_public
      # CA und Schlüssel als Datei statt im Manifest: cert-manager hält die CA
      # aktuell, und ohne Vertrauensanker startet das Plugin bei `https` nicht.
      crowdsecLapiTlsCertificateAuthorityFile: /crowdsec-ca/ca.crt
      # `clientTrustedIPs` ist das Heimnetz: ein Sync-Client von dort sieht für einen
      # Scanner-Detektor aus wie ein Scanner.
      clientTrustedIPs:
        - 192.168.178.0/24
      logLevel: INFO

---
# HSTS und Antwort-Kopfzeilen. Kein `sslRedirect` - in v3 wirkungslos, die
# Umleitung passiert am Entrypoint `web`.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: secure-headers
  namespace: traefik-public
spec:
  headers:
    frameDeny: true
    browserXssFilter: true
    contentTypeNosniff: true
    forceSTSHeader: true
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 31536000
    referrerPolicy: strict-origin-when-cross-origin
    customFrameOptionsValue: SAMEORIGIN

---
# Ratelimit Stufe 1: gilt für alle
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: traefik-public
spec:
  rateLimit:
    average: 100
    burst: 50
    period: 30s
    sourceCriterion:
      ipStrategy:
        depth: 0

---
# Stufe 2, Anmeldemasken: Login-Pfade der Dienste
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-auth
  namespace: traefik-public
spec:
  rateLimit:
    average: 10
    burst: 5
    period: 1m
    sourceCriterion:
      ipStrategy:
        depth: 0

---
# Stufe 3, Sync-Clients: hunderte Anfragen je Adresse
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-sync
  namespace: traefik-public
spec:
  rateLimit:
    average: 2000
    burst: 500
    period: 1m
    sourceCriterion:
      ipStrategy:
        depth: 0

---
# Reihenfolge: bekannte Angreifer fliegen raus, dann die Kopfzeilen, dann das Limit.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: public-chain
  namespace: traefik-public
spec:
  chain:
    middlewares:
      - name: crowdsec
      - name: secure-headers
      - name: rate-limit
