# ingress-public - IngressClass `public`
---
# Nicht vom Chart, weil namespaced RBAC nichts Clusterweites anlegen darf.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: public
  labels:
    homelab.io/zone: public
  annotations:
    homelab.io/beschreibung: >-
      Aus dem Internet erreichbar. Alles hinter dieser Klasse ist oeffentlich.
spec:
  controller: traefik.io/ingress-controller
