# Routen, Middlewares und TLS-Option
#
# Eine Änderung hier wirkt erst über den Neustart, den Reloader auslöst.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-public-dynamic
  namespace: traefik-public
data:
  # Sicherheitsgrenze: Was hier steht, ist öffentlich.
  # Ein neuer Dienst braucht Router, Service und `toEndpoints`-Block in NetworkPolicies.yaml.
  # Service-Namen statt Endpoints: Traefik braucht keine Leserechte im Namespace des Dienstes.
  routes.yaml: |
    http:
      routers:

        # Push-Benachrichtigungen
        ntfy:
          rule: Host(`ntfy.nico-steinmueller.de`)
          entryPoints:
            - websecure
          service: ntfy

        # Single Sign-On: nur was Clients und Browser brauchen. /admin und der
        # master-Realm gehen über ingress-internal, ebenso alles andere.
        keycloak:
          rule: >-
            Host(`keycloak.nico-steinmueller.de`) &&
            (PathPrefix(`/realms/`) || PathPrefix(`/resources/`) || PathPrefix(`/.well-known/`)) &&
            !PathRegexp(`^/realms/master(/|$)`)
          entryPoints:
            - websecure
          service: keycloak

        # Abgeschickte Anmeldeformulare zusätzlich mit Stufe 2
        keycloak-login:
          rule: >-
            Host(`keycloak.nico-steinmueller.de`) &&
            PathRegexp(`^/realms/[^/]+/login-actions/`) &&
            !PathRegexp(`^/realms/master(/|$)`)
          # Über `keycloak`, der denselben Pfad auch trifft
          priority: 1000
          entryPoints:
            - websecure
          middlewares:
            - rate-limit-auth
          service: keycloak

      services:
        ntfy:
          loadBalancer:
            servers:
              - url: http://ntfy.ntfy.svc.cluster.local:80
        keycloak:
          loadBalancer:
            servers:
              - url: http://keycloak.keycloak.svc.cluster.local:80

  middlewares.yaml: |
    http:
      middlewares:
        # Der Bouncer fragt vor jeder Anfrage die LAPI. 
        # `live` heißt ohne Cache - eine Sperre wirkt sofort.
        crowdsec:
          plugin:
            crowdsec-bouncer:
              enabled: true
              crowdsecMode: live
              crowdsecLapiScheme: https
              crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
              crowdsecLapiKeyFile: /crowdsec/traefik_public
              # cert-manager hält die CA aktuell
              crowdsecLapiTlsCertificateAuthorityFile: /crowdsec-ca/ca.crt
              # Das Heimnetz ist vertrauenswürdig
              clientTrustedIPs:
                - 192.168.178.0/24
              logLevel: INFO
        
        # TODO: crowdsec-appsec:

        # HSTS und Antwort-Kopfzeilen.
        secure-headers:
          headers:
            frameDeny: true
            browserXssFilter: true
            contentTypeNosniff: true
            forceSTSHeader: true
            stsIncludeSubdomains: true
            stsPreload: true
            stsSeconds: 31536000
            referrerPolicy: strict-origin-when-cross-origin
            customFrameOptionsValue: SAMEORIGIN
            customResponseHeaders:
              X-Forwarded-Proto: https

        # Ratelimit Stufe 1: gilt für alle
        rate-limit:
          rateLimit:
            average: 100
            burst: 50
            period: 30s
            sourceCriterion:
              ipStrategy:
                depth: 0

        # Stufe 2, Anmeldemasken: Login-Pfade der Dienste
        rate-limit-auth:
          rateLimit:
            average: 10
            burst: 5
            period: 1m
            sourceCriterion:
              ipStrategy:
                depth: 0

        # Stufe 3, Sync-Clients: hunderte Anfragen je Adresse
        rate-limit-sync:
          rateLimit:
            average: 2000
            burst: 500
            period: 1m
            sourceCriterion:
              ipStrategy:
                depth: 0

        # bekannte Angreifer fliegen raus, dann die Kopfzeilen, dann das Limit
        public-chain:
          chain:
            middlewares:
              - crowdsec
              - secure-headers
              - rate-limit

  tls.yaml: |
    # `default` gilt für jeden Router: nur TLS 1.3.
    # `kompatibel` erlaubt zusätzlich TLS 1.2 - für Dienste mit alten Clients
    # z.B.
    #   nextcloud:
    #     rule: Host(`cloud.nico-steinmueller.de`)
    #     entryPoints: [websecure]
    #     service: nextcloud
    #     tls:
    #       options: kompatibel
    #       # Mit eigenem tls-Block gilt der certResolver des Entrypoints
    #       # nicht mehr von selbst - ausdrücklich nennen.
    #       certResolver: letsencrypt
    tls:
      options:
        default:
          minVersion: VersionTLS13
          sniStrict: true
        kompatibel:
          minVersion: VersionTLS12
          sniStrict: true
          cipherSuites:
            - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
            - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
            - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
