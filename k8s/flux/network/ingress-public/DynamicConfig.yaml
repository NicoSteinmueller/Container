# Routen, Middlewares und TLS-Option
#
# Eine Änderung hier wirkt erst über den Neustart, den Reloader auslöst.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-public-dynamic
  namespace: traefik-public
data:
  # Sicherheitsgrenze: Was hier steht, ist öffentlich.
  # Ein neuer Dienst braucht Router, Service und `toEndpoints`-Block in NetworkPolicies.yaml.
  # Service-Namen statt Endpoints: Traefik braucht keine Leserechte im Namespace des Dienstes.
  routes.yaml: |
    http:
      routers:

        # Push-Benachrichtigungen
        ntfy:
          rule: Host(`ntfy.nico-steinmueller.de`)
          entryPoints:
            - websecure
          middlewares:
            - rate-limit
          service: ntfy

        # Single Sign-On: nur was Clients und Browser brauchen. /admin und der
        # master-Realm gehen über ingress-internal, ebenso alles andere.
        keycloak:
          rule: >-
            Host(`keycloak.nico-steinmueller.de`) &&
            (PathPrefix(`/realms/`) || PathPrefix(`/resources/`) || PathPrefix(`/.well-known/`)) &&
            !PathRegexp(`^/realms/master(/|$)`)
          entryPoints:
            - websecure
          middlewares:
            - rate-limit
          service: keycloak

        # Abgeschickte Anmeldeformulare zusätzlich mit Stufe 2
        keycloak-login:
          rule: >-
            Host(`keycloak.nico-steinmueller.de`) &&
            PathRegexp(`^/realms/[^/]+/login-actions/`) &&
            !PathRegexp(`^/realms/master(/|$)`)
          # Über `keycloak`, der denselben Pfad auch trifft
          priority: 1000
          entryPoints:
            - websecure
          middlewares:
            - rate-limit
            - rate-limit-auth
          service: keycloak

        # Dateien, Kalender, Kontakte. Ohne Stufe 1: Sync-Clients und schon
        # die Weboberfläche liegen weit darüber, es bleibt die Obergrenze aus
        # `public-chain`. TLS 1.2 für den Scanner, der per WebDAV ablegt.
        nextcloud:
          rule: Host(`cloud.nico-steinmueller.de`)
          entryPoints:
            - websecure
          service: nextcloud
          tls:
            options: kompatibel
            certResolver: letsencrypt

        # Das Anmeldeformular mit Stufe 2. Nur `/login` selbst - Login Flow
        # v2 (`/login/v2/poll`) fragt im Sekundentakt.
        nextcloud-login:
          rule: >-
            Host(`cloud.nico-steinmueller.de`) &&
            PathRegexp(`^/(index\.php/)?login$`)
          priority: 1000
          entryPoints:
            - websecure
          middlewares:
            - rate-limit-auth
          service: nextcloud
          tls:
            options: kompatibel
            certResolver: letsencrypt

        # Fotos und Videos. Ohne Stufe 1 wie Nextcloud: Die Zeitleiste lädt
        # Vorschaubilder zu Hunderten, die Mobil-Apps sichern Bild für Bild.
        immich:
          rule: Host(`immich.nico-steinmueller.de`)
          entryPoints:
            - websecure
          service: immich

        # Anmeldung mit Stufe 2: Passwort (abgeschaltet, bleibt trotzdem
        # gedrosselt), OAuth, PIN des gesperrten Ordners, Passwort geteilter
        # Links.
        immich-login:
          rule: >-
            Host(`immich.nico-steinmueller.de`) &&
            PathRegexp(`^/api/(auth/login|auth/session/unlock|oauth/authorize|oauth/callback|shared-links/login)$`)
          priority: 1000
          entryPoints:
            - websecure
          middlewares:
            - rate-limit-auth
          service: immich

        # Verwaltung nur aus dem Heimnetz. `/admin` ist nur eine Route im
        # Browser - was die Admin-Seiten tun, läuft über diese API-Pfade (alle
        # mit `admin: true` im Code von v3.2.4). Ein neuer Admin-Pfad in einer
        # späteren Version wäre von außen offen.
        immich-admin:
          rule: >-
            Host(`immich.nico-steinmueller.de`) &&
            (PathRegexp(`^/admin(/|$)`) ||
             PathRegexp(`^/api/(admin|system-config|system-metadata|jobs|queues|libraries)(/|$)`) ||
             PathRegexp(`^/api/server/(statistics|license)$`))
          # Über `immich-login`
          priority: 1100
          entryPoints:
            - websecure
          middlewares:
            - nur-heimnetz
          service: immich

      services:
        ntfy:
          loadBalancer:
            servers:
              - url: http://ntfy.ntfy.svc.cluster.local:80
        keycloak:
          loadBalancer:
            servers:
              - url: http://keycloak.keycloak.svc.cluster.local:80
        nextcloud:
          loadBalancer:
            servers:
              - url: http://nextcloud.nextcloud.svc.cluster.local:80
        immich:
          loadBalancer:
            servers:
              - url: http://immich-server.immich.svc.cluster.local:80

  middlewares.yaml: |
    http:
      middlewares:
        # Der Bouncer fragt vor jeder Anfrage die LAPI. 
        # `live` heißt ohne Cache - eine Sperre wirkt sofort.
        crowdsec:
          plugin:
            crowdsec-bouncer:
              enabled: true
              crowdsecMode: live
              crowdsecLapiScheme: https
              crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
              crowdsecLapiKeyFile: /crowdsec/traefik_public
              # cert-manager hält die CA aktuell
              crowdsecLapiTlsCertificateAuthorityFile: /crowdsec-ca/ca.crt

              # AppSec (WAF): jede Anfrage samt Body geht an crowdsec-appsec.
              crowdsecAppsecEnabled: true
              crowdsecAppsecScheme: https
              crowdsecAppsecHost: crowdsec-appsec-service.crowdsec.svc.cluster.local:7422
              crowdsecAppsecTlsCertificateAuthorityFile: /crowdsec-ca/ca.crt
              # 500 von AppSec und AppSec nicht erreichbar: blocken
              crowdsecAppsecFailureBlock: true
              crowdsecAppsecUnreachableBlock: true
              # Default 10 MB. Uploads darüber (Nextcloud-Chunks) prüft
              # AppSec nur am Anfang; der Body geht trotzdem ganz weiter.
              crowdsecAppsecBodyLimit: 10485760
              # Das Heimnetz ist vertrauenswürdig
              clientTrustedIPs:
                - 192.168.178.0/24
              logLevel: INFO
        
        # HSTS und Antwort-Kopfzeilen.
        secure-headers:
          headers:
            frameDeny: true
            browserXssFilter: true
            contentTypeNosniff: true
            forceSTSHeader: true
            stsIncludeSubdomains: true
            stsPreload: true
            stsSeconds: 31536000
            referrerPolicy: strict-origin-when-cross-origin
            customFrameOptionsValue: SAMEORIGIN
            customResponseHeaders:
              X-Forwarded-Proto: https

        # Ratelimit Stufe 1, je Router: alles außer Sync-Diensten
        rate-limit:
          rateLimit:
            average: 100
            burst: 50
            period: 30s
            sourceCriterion:
              ipStrategy:
                depth: 0

        # Stufe 2, Anmeldemasken: Login-Pfade der Dienste
        rate-limit-auth:
          rateLimit:
            average: 10
            burst: 5
            period: 1m
            sourceCriterion:
              ipStrategy:
                depth: 0

        # Stufe 3, Sync-Clients: hunderte Anfragen je Adresse. Steht in
        # `public-chain` und ist damit die Obergrenze für jeden Router.
        rate-limit-sync:
          rateLimit:
            average: 2000
            burst: 500
            period: 1m
            sourceCriterion:
              ipStrategy:
                depth: 0

        # Nur Quelladressen aus dem Heimnetz, sonst 403. Ohne ipStrategy zählt
        # die Adresse der Verbindung - X-Forwarded-For nimmt der Entrypoint
        # ohnehin von niemandem an (`forwardedHeaders.trustedIPs: []`).
        nur-heimnetz:
          ipAllowList:
            sourceRange:
              - 192.168.178.0/24

        # bekannte Angreifer fliegen raus, dann die Kopfzeilen, dann die
        # Obergrenze.
        public-chain:
          chain:
            middlewares:
              - crowdsec
              - secure-headers
              - rate-limit-sync

  tls.yaml: |
    # `default` gilt für jeden Router: nur TLS 1.3.
    # `kompatibel` erlaubt zusätzlich TLS 1.2 - für Dienste mit alten Clients
    # Mit eigenem tls-Block gilt der certResolver des
    # Entrypoints nicht mehr von selbst - am Router ausdrücklich nennen.
    tls:
      options:
        default:
          minVersion: VersionTLS13
          sniStrict: true
        kompatibel:
          minVersion: VersionTLS12
          sniStrict: true
          cipherSuites:
            - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
            - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
            - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
