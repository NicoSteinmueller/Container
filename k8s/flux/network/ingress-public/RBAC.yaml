# ingress-public - ServiceAccount und RBAC, von Hand statt aus dem Chart
---
# Eigener ServiceAccount, weil das Chart nur bei leerem `serviceAccount.name`
# einen anlegt - das RBAC unten braucht einen festen Namen.
#
# `automountServiceAccountToken: false` wirkt nur für fremde Pods mit diesem
# Account; im Traefik-Pod gewinnt das Pod-Template des Charts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-public
  namespace: traefik-public
automountServiceAccountToken: false

---
# RBAC von Hand
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-public-cluster
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingressclasses
    verbs:
      - get
      - list
      - watch

---
# ClusterRole, nur per RoleBinding gebunden - Traefik liest nur, wo eine steht.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-public-namespaced
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingresses/status
    verbs:
      - update
  - apiGroups:
      - traefik.io
    resources:
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewares
      - middlewaretcps
      - tlsoptions
      - tlsstores
      - traefikservices
      - serverstransports
      - serverstransporttcps
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-public-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-public-cluster
subjects:
  - kind: ServiceAccount
    name: traefik-public
    namespace: traefik-public

---
# Eigener Namespace: Middlewares, TLSOption und der Service
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik-public-namespaced
  namespace: traefik-public
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-public-namespaced
subjects:
  - kind: ServiceAccount
    name: traefik-public
    namespace: traefik-public

---
# je öffentlichem Dienst eine Bindung.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik-public-namespaced
  namespace: whoami
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-public-namespaced
subjects:
  - kind: ServiceAccount
    name: traefik-public
    namespace: traefik-public
