# ingress-public - ServiceAccount, bewusst ohne Rechte
---
# Eigener ServiceAccount, weil das Chart nur bei leerem `serviceAccount.name`
# einen anlegt. An nichts gebunden: Der Controller liest keine
# Kubernetes-Objekte (HelmRelease.yaml, `providers`), und das Token nimmt der
# postRenderer dort aus dem Pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-public
  namespace: traefik-public
automountServiceAccountToken: false
