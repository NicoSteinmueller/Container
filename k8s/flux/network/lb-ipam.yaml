# LAN-Adressen des Clusters: Vergabe (IPPool) und Ankündigung (L2Announcement).
# LoadBalancer statt hostPort, weil der Node nur ein Bein hat - sonst ginge nur
# ein Ingress auf 443.
#
# Die Ankündigung braucht zusätzlich `l2announcements.enabled: true` in
# vm/talos/values/cilium.yaml.tftpl.
---
# Außerhalb des DHCP-Bereichs und ohne Kollision mit `lan_ip`:
#
#   192.168.178.230  Node selbst
#   192.168.178.231  ingress-internal - nur LAN
#   192.168.178.232  ingress-public   - Internet
#
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan
spec:
  blocks:
    - start: "192.168.178.231"
      stop: "192.168.178.232"
---
# Gratuitous ARP für die Pool-Adressen unter der MAC des Nodes. Ohne sie bleibt
# der ARP-Request unbeantwortet.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan
spec:
  # LAN-Anschluss des Nodes, als Regex. Name prüfen mit
  #   talosctl -n 192.168.178.230 get links
  interfaces:
    - ^enp1s0$
  loadBalancerIPs: true
  externalIPs: false
