#
# Kyverno-Regeln - und warum sie nicht bei kyverno.yaml stehen.
#
# Dieses Verzeichnis ist nicht Teil der Wurzel-Kustomization
# (k8s/flux/clusters/talos-cp1). Es wird von einer eigenen Kustomization
# angewendet, die in kyverno.yaml daneben definiert ist.
#
# Der Grund ist eine Reihenfolge, die sich in einer einzigen Kustomization
# nicht ausdruecken laesst: Die CRD `ValidatingPolicy` kommt aus dem
# Kyverno-Chart. Stehen Chart und Regel im selben Verzeichnis, prueft
# kustomize-controller beide im selben Server-Side-Dry-Run - und der
# scheitert an der Regel, weil der API-Server die Art noch nicht kennt. Ein
# gescheiterter Dry-Run laesst die *ganze* Stufe scheitern, also auch die
# HelmRelease, die die CRD gebracht haette. Das Ergebnis ist kein langsamer
# Start, sondern ein Stillstand: die Wurzel-Kustomization bleibt rot und
# wendet gar nichts mehr an, fuer alle Dienste.
#
# Ein Unterverzeichnis unter talos-cp1/ half nicht - kustomize-controller
# erzeugt seine kustomization.yaml aus einem rekursiven Verzeichnislauf und
# saehe die Datei trotzdem. Deshalb liegt sie hier, eine Ebene ueber
# clusters/.
#
# ---------------------------------------------------------------------------
#
# Die Regel.
#
# `ValidatingPolicy` statt der aelteren `ClusterPolicy`: Sie ist seit
# Kyverno 1.19 die stabile API (policies.kyverno.io/v1) und formuliert die
# Bedingung in CEL - derselben Sprache, in der eine native
# ValidatingAdmissionPolicy sie spaeter erzwingen wuerde, falls der
# background-Controller einmal dazukommt.
#
# Gelesen: Ein Ingress ist zulaessig, wenn er NICHT die Klasse `public`
# traegt, ODER wenn sein Namespace das Label homelab.io/zone=public hat.
#
# `object.spec.?ingressClassName.orValue("")` statt eines direkten Zugriffs:
# Das Feld ist optional. Ohne den Optional-Zugriff wuerde die Regel bei
# jedem Ingress ohne Klassennamen mit einem CEL-Fehler abbrechen - und ein
# Fehler in der Auswertung ist bei validationActions: [Deny] eine
# Ablehnung. Ein Ingress ohne Klasse wird von keinem der beiden Controller
# bedient (keine `is-default-class`), er ist also harmlos und soll
# durchgehen.
#
# Das Label wird ueber `namespaceObject` gelesen, nicht ueber einen
# Namespace-Selektor im Match: Der Selektor wuerde den Ingress bei fehlendem
# Label gar nicht erst erfassen - und damit durchlassen. Hier ist es
# umgekehrt gewollt: Kein Label heisst nicht oeffentlich.
#
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: public-ingress-nur-in-public-namespaces
  annotations:
    homelab.io/beschreibung: >-
      ingressClassName public nur in Namespaces mit homelab.io/zone=public.
spec:
  #
  # Fail, nicht Ignore. Ist Kyverno unten, scheitern Aenderungen an
  # Ingresses - Flux versucht es beim naechsten Durchlauf erneut, und in der
  # Zwischenzeit entsteht kein oeffentlicher Ingress an der Regel vorbei.
  # Der umgekehrte Fall waere die stille Variante: Regel unwirksam, alles
  # gruen.
  #
  # Der Webhook erfasst nur Ingresses. Ein Kyverno-Ausfall haelt also nicht
  # den Cluster an, sondern genau die eine Ressourcenart, um die es geht.
  #
  failurePolicy: Fail

  validationActions:
    - Deny

  matchConstraints:
    resourceRules:
      - apiGroups:
          - networking.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - ingresses

  validations:
    - expression: >-
        object.spec.?ingressClassName.orValue("") != "public" ||
        (has(namespaceObject.metadata.labels) &&
        "homelab.io/zone" in namespaceObject.metadata.labels &&
        namespaceObject.metadata.labels["homelab.io/zone"] == "public")
      message: >-
        ingressClassName "public" ist nur in Namespaces mit dem Label
        homelab.io/zone=public erlaubt. Dieser Ingress waere aus dem Internet
        erreichbar gewesen. Gewollt? Dann das Label am Namespace setzen UND
        den Namespace in ingress-public.yaml eintragen - beides, sonst wird
        er ohnehin nicht bedient.
