# das CA-Zertifikat und was aus der CA ausgestellt wird
---
# Das CA-Zertifikat des Homelabs.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: homelab-ca
  secretName: homelab-ca
  # Ein Wechsel kostet einen gleichzeitigen Neustart aller Beteiligten.
  duration: 43800h    # 5 Jahre
  renewBefore: 8760h  # 1 Jahr vorher
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-root
    kind: ClusterIssuer
    group: cert-manager.io

---
# CA-Kopie für diesen Namespace: Das Plugin muss der LAPI vertrauen, darf aber
# keine Secrets aus `cert-manager` lesen. Genutzt wird nur ca.crt.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-public-crowdsec-ca
  namespace: traefik-public
spec:
  commonName: traefik-public bouncer
  secretName: traefik-public-crowdsec-ca
  duration: 2160h      # 90 Tage
  renewBefore: 720h    # 30 Tage vorher
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: homelab-ca
    kind: ClusterIssuer
    group: cert-manager.io
