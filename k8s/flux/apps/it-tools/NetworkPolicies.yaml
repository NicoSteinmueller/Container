# Netzwerkregeln im Namespace `it-tools`
#
# Ausgehend bleibt es bei der Sperre aus core/DefaultDenyEgress.yaml.
---
# Eingehend nur von ingress-internal
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-internal
  namespace: it-tools
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: it-tools
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
      ports:
        - protocol: TCP
          port: 8080
