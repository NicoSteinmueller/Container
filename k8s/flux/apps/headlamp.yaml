# Headlamp - Cluster-Dashboard.
#
#   headlamp        - Identität des Pods und des Lese-Tokens. Kein Schreiben,
#                     keine Secrets.
#   headlamp-admin  - ServiceAccount ohne Pod und ohne Token. Wer ändern will,
#                     erzeugt sich eines für eine Stunde.
#

# Namespace `headlamp`
---
# Spricht als dieser ServiceAccount mit der API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: headlamp
automountServiceAccountToken: true
---
# Erste Hälfte der Leserechte: die eingebaute Rolle `view` - alles in
# Namespaces, ausdrücklich ohne Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
---
# Zweite Hälfte: was `view` nicht kennt - Nodes, PersistentVolumes,
# StorageClasses, CRDs. Ohne sie zeigt die Übersicht überall "Forbidden".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-cluster-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  # Auslastung - ohne metrics-server wirkungslos, nicht falsch.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments", "csidrivers", "csinodes", "csistoragecapacities"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
  # Die CRD-Objekte selbst, nicht deren Inhalte - eine Wildcard schlösse jede
  # künftige CRD ein, auch eine mit Zugangsdaten in der Spec.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
  # Lesen allein erlaubt keine Ausweitung - ohne `escalate`/`bind` kann dieser
  # ServiceAccount keine Rolle vergeben, auch keine, die er sieht.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  # Damit die Oberfläche beim Anmelden abfragen kann, was sie zeigen darf.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews", "selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-cluster-read
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
---
# Schreibzugriff auf Abruf: kein Pod, kein Token. Eines entsteht per
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: headlamp
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: headlamp
---
# Eingehend nur von ingress-internal.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: headlamp
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-internal
  namespace: headlamp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
      ports:
        - protocol: TCP
          port: 4466

---
# Egress-Default-Deny. Headlamp spricht nur mit CoreDNS und dem kube-apiserver;
# Heimnetz und übrige Pods hat es nicht zu erreichen.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: headlamp-egress
  namespace: headlamp
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 10m
  releaseName: headlamp
  targetNamespace: headlamp
  storageNamespace: headlamp
  chart:
    spec:
      chart: headlamp
      version: "0.44.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Headlamp spricht mit der API als Identität des eingegebenen Tokens, nicht
    # als die des Pods:
    #
    #   Lesen:  kubectl -n headlamp create token headlamp --duration=8h
    #   Ändern: kubectl -n headlamp create token headlamp-admin --duration=1h
    #
    # unsafeUseServiceAccountToken bleibt false, sonst wäre jeder Aufrufer der
    # ServiceAccount des Pods.
    config:
      inCluster: true
      inClusterContextName: talos-cp1
      unsafeUseServiceAccountToken: false
      sessionTTL: 28800

      oidc:
        # Das Chart legt sonst ein leeres Secret "oidc" an, das niemand
        # einbindet. Kommt zurück, wenn hier Keycloak angebunden wird.
        secret:
          create: false

    # ServiceAccount und Rechte von den Manifesten oben - die Voreinstellung
    # des Charts ist cluster-admin.
    serviceAccount:
      create: false
      name: headlamp

    clusterRoleBinding:
      create: false

    # Für PodSecurity "restricted": Das Chart setzt nur runAsNonRoot und
    # runAsUser, der Rest steht hier - sonst lehnt der Namespace den Pod ab.
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      runAsNonRoot: true
      runAsUser: 100
      runAsGroup: 101
      privileged: false
      allowPrivilegeEscalation: false
      # Das Chart hängt dafür selbst ein leeres Volume auf /tmp ein.
      readOnlyRootFilesystem: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL

    # ClusterIP statt NodePort: Der Weg über ingress-internal ist verschlüsselt,
    # das eingefügte Token geht nicht im Klartext durchs LAN.
    service:
      type: ClusterIP
      port: 80

    ingress:
      enabled: true
      ingressClassName: internal
      hosts:
        - host: dashboard.k8s.nico-steinmueller.de
          paths:
            - path: /
              type: Prefix

    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 192Mi
