# Konfiguration aus Git: Nextcloud selbst und der nginx davor
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-config
  namespace: nextcloud
data:
  # Nextcloud liest config.php, dann diese Datei, und verschmilzt beide mit
  # array_replace_recursive: Einzelwerte gelten von hier, Listen werden aber
  # nach Index gemischt - ein längerer alter Eintrag in config.php lebt mit
  # seinen hinteren Elementen weiter.
  #
  # In config.php gehört nur, was Nextcloud selbst führt: version,
  # installed, maintenance. Geheimnisse kommen als NC_* aus der Umgebung.
  kubernetes.config.php: |
    <?php
    $CONFIG = [
      'dbtype' => 'pgsql',
      'dbtableprefix' => 'oc_',
      // TLS gegen die CA
      'pgsql_ssl' => [
        'mode' => 'verify-full',
        'rootcert' => '/pg-ca/ca.crt',
      ],

      'memcache.local' => '\OC\Memcache\APCu',
      'memcache.distributed' => '\OC\Memcache\Redis',
      'memcache.locking' => '\OC\Memcache\Redis',
      'filelocking.enabled' => true,
      'redis' => [
        'host' => 'valkey',
        'port' => 6379,
      ],

      // Mitgelieferte Apps aus dem Image, App-Store-Apps auf NFS
      'apps_paths' => [
        [
          'path' => OC::$SERVERROOT . '/apps',
          'url' => '/apps',
          'writable' => false,
        ],
        [
          'path' => OC::$SERVERROOT . '/custom_apps',
          'url' => '/custom_apps',
          'writable' => true,
        ],
      ],

      'datadirectory' => '/data',

      'trusted_domains' => ['cloud.nico-steinmueller.de'],
      'overwritehost' => 'cloud.nico-steinmueller.de',
      'overwriteprotocol' => 'https',
      'overwrite.cli.url' => 'https://cloud.nico-steinmueller.de',
      // TLS endet an Traefik. X-Forwarded-For nur von Pods
      'trusted_proxies' => ['10.244.0.0/16'],

      // Admin-Rechte nur aus dem Heimnetz; von außen ist ein Admin ein
      // normaler Nutzer.
      'allowed_admin_ranges' => ['192.168.178.0/24'],

      // Der Egress lässt nur die Namen aus NetworkPolicies.yaml hinaus; die
      // Standardliste (nextcloud.com, startpage.com, ...) meldete sonst
      // "keine Internetverbindung".
      'connectivity_check_domains' => ['apps.nextcloud.com'],

      // Updates kommen über das Image, nicht über den Web-Updater
      'upgrade.disable-web' => true,

      // Hintergrundjobs mit viel Last ab 1 Uhr UTC
      'maintenance_window_start' => 1,
      'default_phone_region' => 'DE',
      // 2 = Warnungen
      'loglevel' => 2,
    ];

  # Das php-Image startet mit pm.max_children = 5 - fünf gleichzeitige
  # Anfragen, zu wenig für mehrere Sync-Clients.
  zz-tuning.conf: |
    [www]
    pm = dynamic
    pm.max_children = 16
    pm.start_servers = 4
    pm.min_spare_servers = 2
    pm.max_spare_servers = 8
    pm.max_requests = 500

---
# nginx vor php-fpm
# TLS, HSTS, nosniff und Frame-Optionen setzt Traefik
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-nginx
  namespace: nextcloud
data:
  default.conf: |
    upstream php-handler {
        server 127.0.0.1:9000;
    }

    # `immutable` nur für Assets mit Versions-Parameter (?v=...)
    map $arg_v $asset_immutable {
        "" "";
        default ", immutable";
    }

    server {
        listen 8080;
        server_name _;
        server_tokens off;

        root /var/www/html;
        index index.php index.html /index.php$request_uri;

        # Weiterleitungen relativ. Sonst baut nginx sie aus eigenem Schema
        # und Port: /.well-known/caldav -> http://<host>:8080/remote.php/dav/
        absolute_redirect off;

        # mime.types im Image kennt .mjs nicht - Browser führen JavaScript-
        # Module als application/octet-stream nicht aus. `types` hier ersetzt
        # die Liste aus http{}, darum erst die ganze Liste, dann .mjs dazu.
        include mime.types;
        types {
            text/javascript mjs;
        }

        # Sync-Clients laden in Stücken; der Web-Upload ohne Chunking nicht
        client_max_body_size 16G;
        client_body_timeout 300s;
        fastcgi_buffers 64 4K;

        gzip on;
        gzip_vary on;
        gzip_comp_level 4;
        gzip_min_length 256;
        gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
        gzip_types application/atom+xml text/javascript application/javascript application/json application/ld+json application/manifest+json application/rss+xml application/vnd.geo+json application/vnd.ms-fontobject application/wasm application/x-font-ttf application/x-web-app-manifest+json application/xhtml+xml application/xml font/opentype image/bmp image/svg+xml image/x-icon text/cache-manifest text/css text/plain text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;

        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        fastcgi_hide_header X-Powered-By;

        # Windows-WebDAV-Client
        location = / {
            if ( $http_user_agent ~ ^DavClnt ) {
                return 302 /remote.php/webdav/$is_args$args;
            }
        }

        location = /robots.txt {
            allow all;
            log_not_found off;
            access_log off;
        }

        location ^~ /.well-known {
            location = /.well-known/carddav { return 301 /remote.php/dav/; }
            location = /.well-known/caldav  { return 301 /remote.php/dav/; }
            location /.well-known/acme-challenge { try_files $uri $uri/ =404; }
            location /.well-known/pki-validation { try_files $uri $uri/ =404; }
            return 301 /index.php$request_uri;
        }

        # Nie ausliefern
        location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/) { return 404; }
        location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console) { return 404; }

        location ~ \.php(?:$|/) {
            rewrite ^/(?!index|remote|public|cron|core\/ajax\/update|status|ocs\/v[12]|updater\/.+|ocs-provider\/.+|.+\/richdocumentscode(_arm64)?\/proxy) /index.php$request_uri;

            fastcgi_split_path_info ^(.+?\.php)(/.*)$;
            set $path_info $fastcgi_path_info;
            try_files $fastcgi_script_name =404;

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $path_info;
            fastcgi_param HTTPS on;
            fastcgi_param modHeadersAvailable true;
            fastcgi_param front_controller_active true;
            fastcgi_pass php-handler;

            fastcgi_intercept_errors on;
            # Uploads gleich an PHP, nicht erst nach /tmp
            fastcgi_request_buffering off;
            fastcgi_max_temp_file_size 0;
            fastcgi_read_timeout 3600s;
        }

        # Eigenes add_header hebt die geerbten auf - für Assets egal
        location ~ \.(?:css|js|mjs|svg|gif|ico|jpg|png|webp|wasm|tflite|map|ogg|flac)$ {
            try_files $uri /index.php$request_uri;
            add_header Cache-Control "public, max-age=15778463$asset_immutable";
            access_log off;

            location ~ \.wasm$ {
                default_type application/wasm;
            }
        }

        location ~ \.(otf|woff2?)$ {
            try_files $uri /index.php$request_uri;
            expires 7d;
            access_log off;
        }

        location /remote {
            return 301 /remote.php$request_uri;
        }

        location / {
            try_files $uri $uri/ /index.php$request_uri;
        }
    }
