# Postgres für Nextcloud
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-db
  namespace: nextcloud
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:79be0d10e78b7ac4520cf6c5db199a8bb7f6de53b3229f47e90cab5865528a0d

  # CNPG-Default 128MB; serverinfo (pg.cache_hit_ratio) empfiehlt 256MB.
  # Änderung startet die Instanz neu - bei einer Instanz kurz Downtime.
  postgresql:
    parameters:
      shared_buffers: "256MB"

  storage:
    size: 10Gi
  # Request mit shared_buffers angehoben: die 256MB sind belegt, sobald der
  # Cache warm ist.
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { memory: 1Gi }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dumps
  namespace: nextcloud
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-unraid
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-db-dump
  namespace: nextcloud
spec:
  schedule: "0 */12 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            homelab.io/db-client: nextcloud-db
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            fsGroup: 26
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:79be0d10e78b7ac4520cf6c5db199a8bb7f6de53b3229f47e90cab5865528a0d
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              env:
                - { name: PGHOST,     valueFrom: { secretKeyRef: { name: nextcloud-db-app, key: host } } }
                - { name: PGPORT,     valueFrom: { secretKeyRef: { name: nextcloud-db-app, key: port } } }
                - { name: PGUSER,     valueFrom: { secretKeyRef: { name: nextcloud-db-app, key: username } } }
                - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: nextcloud-db-app, key: password } } }
                - { name: PGDATABASE, valueFrom: { secretKeyRef: { name: nextcloud-db-app, key: dbname } } }
                # TLS gegen die CA, die der Operator für diesen Cluster erzeugt
                - { name: PGSSLMODE,     value: verify-full }
                - { name: PGSSLROOTCERT, value: /pg-ca/ca.crt }
                # Für den Dateinamen.
                - { name: TZ, value: Europe/Berlin }
              command: [/bin/bash, -c]
              args:
                - |
                  set -euo pipefail
                  out="/dumps/nextcloud-$(date +%Y.%m.%d_%H.%M.%S).dump"

                  # Kein halber Dump nach einem abgebrochenen Lauf
                  trap 'rm -f "${out}.part"' EXIT

                  # --compress=0: Kopia dedupliziert und komprimiert selbst
                  pg_dump --format=custom --compress=0 \
                          --no-owner --no-privileges --file="${out}.part"

                  # mv ist atomar - Kopia sieht nie einen halben Dump
                  mv "${out}.part" "${out}"

                  pg_restore --list "${out}" > /dev/null

                  # Lokale Vorhaltung; die Tiefe hat Kopia.
                  ls -1t /dumps/nextcloud-*.dump | tail -n +15 | xargs -r rm --
              volumeMounts:
                - { name: dumps, mountPath: /dumps }
                - { name: pg-ca, mountPath: /pg-ca, readOnly: true }
                - { name: tmp,   mountPath: /tmp }
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: dumps
            - name: pg-ca
              secret:
                secretName: nextcloud-db-ca
                items:
                  - { key: ca.crt, path: ca.crt }
            - name: tmp
              emptyDir: {}
