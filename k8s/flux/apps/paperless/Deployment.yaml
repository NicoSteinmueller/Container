# Paperless-ngx unter paperless.k8s.nico-steinmueller.de
#
# Ein Container, darin per s6 Webserver, Celery-Worker, Scheduler und
# Consumer.
---
apiVersion: v1
kind: Service
metadata:
  name: paperless
  namespace: paperless
spec:
  selector:
    app.kubernetes.io/name: paperless
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # data auf local-path, Migrationen mit Sperrdatei darin
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless
        homelab.io/db-client: paperless-db
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Keycloak über ingress-public
      hostAliases:
        - ip: 192.168.178.232
          hostnames:
            - keycloak.nico-steinmueller.de
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      # Laufende OCR und Migrationen nicht abwürgen
      terminationGracePeriodSeconds: 60

      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:3.3.1@sha256:cb91bfb468e63025a9d10c01b54c33665113668eee61b490db96de19b860b9c4
          ports:
            - name: http
              containerPort: 8000
          # https://docs.paperless-ngx.com/configuration/
          env:
            # /run ist ein emptyDir (root:root, 0777) - ohne root kann
            # s6-overlay das nicht auf uid 99 umstellen und bricht sonst ab.
            - name: S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES
              value: "1"
            - name: PAPERLESS_TIME_ZONE
              value: "Europe/Berlin"
            - name: PAPERLESS_APP_TITLE
              value: "Paperless-ngx"
            - name: PAPERLESS_URL
              value: "https://paperless.k8s.nico-steinmueller.de"
            - name: PAPERLESS_USE_X_FORWARD_HOST
              value: "true"
            - name: PAPERLESS_USE_X_FORWARD_PORT
              value: "true"
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless
                  key: secret-key

            - name: PAPERLESS_REDIS
              value: "redis://valkey:6379"

            # Datenbank aus dem Secret, das der CNPG-Operator anlegt; TLS
            # gegen die CA des Clusters.
            - name: PAPERLESS_DBENGINE
              value: "postgresql"
            - name: PAPERLESS_DBHOST
              valueFrom:
                secretKeyRef:
                  name: paperless-db-app
                  key: host
            - name: PAPERLESS_DBPORT
              valueFrom:
                secretKeyRef:
                  name: paperless-db-app
                  key: port
            - name: PAPERLESS_DBNAME
              valueFrom:
                secretKeyRef:
                  name: paperless-db-app
                  key: dbname
            - name: PAPERLESS_DBUSER
              valueFrom:
                secretKeyRef:
                  name: paperless-db-app
                  key: username
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-db-app
                  key: password
            # key=value mit Komma
            - name: PAPERLESS_DB_OPTIONS
              value: "sslmode=verify-full,sslrootcert=/pg-ca/ca.crt"

            - name: PAPERLESS_TIKA_ENABLED
              value: "true"
            - name: PAPERLESS_TIKA_ENDPOINT
              value: "http://tika:9998"
            - name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT
              value: "http://gotenberg:3000"

            # Anmeldung über Keycloak
            - name: PAPERLESS_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: paperless
                  key: oidc-client-secret
            - name: PAPERLESS_APPS
              value: "allauth.socialaccount.providers.openid_connect"
            - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
              value: >-
                {"openid_connect":{"OAUTH_PKCE_ENABLED":true,"APPS":[{
                "provider_id":"keycloak","name":"Keycloak","client_id":"paperless",
                "secret":"$(PAPERLESS_OIDC_CLIENT_SECRET)",
                "settings":{"server_url":"https://keycloak.nico-steinmueller.de/realms/mein-realm"}}]}}
            - name: PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS
              value: "false"
            - name: PAPERLESS_DISABLE_REGULAR_LOGIN
              value: "true"
            - name: PAPERLESS_LOGOUT_REDIRECT_URL
              value: "https://keycloak.nico-steinmueller.de/realms/mein-realm/protocol/openid-connect/logout?post_logout_redirect_uri=https://paperless.k8s.nico-steinmueller.de&client_id=paperless"
            # 1 Tag
            - name: PAPERLESS_SESSION_COOKIE_AGE
              value: "86400"

            # Dateiname-Format
            # https://docs.paperless-ngx.com/advanced_usage/#file-name-handling
            - name: PAPERLESS_FILENAME_FORMAT
              value: "{{ owner_username }}/{{ document_type }}/{{ created_year }}/{{ created }}-{{ correspondent }}-{{ title }}"

            # OCR
            - name: PAPERLESS_OCR_LANGUAGE
              value: "deu+eng"
            - name: PAPERLESS_ARCHIVE_FILE_GENERATION
              value: "always"
            - name: PAPERLESS_OCR_ROTATE_PAGES
              value: "true"
            # niedriger = aggressiver; 2 dreht oft falsch, 15 ist konservativ
            - name: PAPERLESS_OCR_ROTATE_PAGES_THRESHOLD
              value: "12"
            # Digitale Signaturen verhindern sonst die OCR
            - name: PAPERLESS_OCR_USER_ARGS
              value: '{"invalidate_digital_signatures": true}'
            # Geburtsdaten u. ä. - nicht in Git, daher aus dem Secret
            - name: PAPERLESS_IGNORE_DATES
              valueFrom:
                secretKeyRef:
                  name: paperless
                  key: ignore-dates
            - name: PAPERLESS_NUMBER_OF_SUGGESTED_DATES
              value: "6"

            # Worker
            - name: PAPERLESS_TASK_WORKERS
              value: "1"
            - name: PAPERLESS_THREADS_PER_WORKER
              value: "4"
            - name: PAPERLESS_WORKER_TIMEOUT
              value: "1800"

            # Eingangsordner
            - name: PAPERLESS_CONSUMER_DELETE_DUPLICATES
              value: "true"
            - name: PAPERLESS_CONSUMER_RECURSIVE
              value: "true"
            - name: PAPERLESS_CONSUMER_STABILITY_DELAY
              value: "30"
            # NFS meldet keine inotify-Ereignisse für Dateien, die ein anderer
            # Client schreibt (Nextcloud, der Host) - deshalb Abfragen.
            - name: PAPERLESS_CONSUMER_POLLING_INTERVAL
              value: "10"
            - name: PAPERLESS_EMPTY_TRASH_DELAY
              value: "90"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Vor dem Webserver laufen Migrationen und - wenn der Index fehlt,
          # etwa nach dem Umzug - ein vollständiger Neuaufbau des Suchindex.
          startupProbe:
            httpGet:
              path: /accounts/login/
              port: http
            periodSeconds: 10
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: /accounts/login/
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          # Großzügig: Unter OCR-Last antwortet der Webserver langsam
          livenessProbe:
            httpGet:
              path: /accounts/login/
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: consume
              mountPath: /usr/src/paperless/consume
            - name: export
              mountPath: /usr/src/paperless/export
            - name: pg-ca
              mountPath: /pg-ca
              readOnly: true
            # s6-overlay legt hier seinen Laufzeitzustand ab
            - name: run
              mountPath: /run
            # PAPERLESS_SCRATCH_DIR (/tmp/paperless): OCR-Zwischenstände
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: consume
          persistentVolumeClaim:
            claimName: consume
        - name: export
          persistentVolumeClaim:
            claimName: export
        # Nur ca.crt - das Secret enthält auch den Schlüssel der CA.
        - name: pg-ca
          secret:
            secretName: paperless-db-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: run
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
