# Postgres für Immich
#
# Wie im Beispiel von Immich (github.com/immich-app/immich-charts, local/):
# das gewöhnliche CNPG-Image, VectorChord als eigenes Image daneben. Die
# Extensions führt das Database-Objekt; angelegt und aktualisiert werden sie
# vom Operator als Superuser.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db
  namespace: immich
spec:
  instances: 1
  # selbe Image wie bei den anderen Diensten; pgvector bringt es mit.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:f89a40f4d74aa6e0900917eaf6299b125a6382eb02fd4ee5d46f55bcbf7e5726

  postgresql:
    shared_preload_libraries:
      - vchord.so
    # VectorChord per Image-Volume nach /extensions/vchord. Die Pfade gelten
    # im Image. Die Version steht ein zweites Mal im Database-Objekt unten -
    # Renovate hebt beide in einem PR.
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1@sha256:bdea43bed2a414e21bbf71767bf6f0739747ac480b267b51772dc214ac28dcb3
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18
    # Immich wärmt beim Start beide Vektor-Indizes vor.
    parameters:
      shared_buffers: "256MB"

  bootstrap:
    initdb:
      database: app
      owner: app
      # Deutsche Sortierung. Gilt ab initdb und ist danach nicht ändern
      localeCollate: de_DE.utf8
      localeCType: de_DE.utf8

  storage:
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { memory: 1Gi }
---
# Die Extensions, die Immich braucht.
# Der Operator legt fehlende an, auch nach einem DROP SCHEMA, und hebt vchord
# auf `version`.
# Reihenfolge zählt: vchord braucht vector, earthdistance braucht cube.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich-db
  namespace: immich
spec:
  name: app
  owner: app
  cluster:
    name: immich-db
  extensions:
    - name: vector
    - name: vchord
      # renovate: datasource=docker depName=ghcr.io/tensorchord/vchord-scratch extractVersion=^pg18-v(?<version>\d+\.\d+\.\d+)$
      version: "1.1.1"
    - name: cube
    - name: earthdistance
    - name: pg_trgm
    - name: unaccent
    - name: uuid-ossp
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dumps
  namespace: immich
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-unraid
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-db-dump
  namespace: immich
spec:
  schedule: "0 */12 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            homelab.io/db-client: immich-db
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            fsGroup: 26
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: dump
              # Dasselbe Image wie `imageName` oben
              image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:f89a40f4d74aa6e0900917eaf6299b125a6382eb02fd4ee5d46f55bcbf7e5726
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              env:
                - { name: PGHOST,     valueFrom: { secretKeyRef: { name: immich-db-app, key: host } } }
                - { name: PGPORT,     valueFrom: { secretKeyRef: { name: immich-db-app, key: port } } }
                - { name: PGUSER,     valueFrom: { secretKeyRef: { name: immich-db-app, key: username } } }
                - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: immich-db-app, key: password } } }
                - { name: PGDATABASE, valueFrom: { secretKeyRef: { name: immich-db-app, key: dbname } } }
                # TLS gegen die CA, die der Operator für diesen Cluster erzeugt
                - { name: PGSSLMODE,     value: verify-full }
                - { name: PGSSLROOTCERT, value: /pg-ca/ca.crt }
                # Für den Dateinamen.
                - { name: TZ, value: Europe/Berlin }
              command: [/bin/bash, -c]
              args:
                - |
                  set -euo pipefail
                  out="/dumps/immich-$(date +%Y.%m.%d_%H.%M.%S).dump"

                  # Kein halber Dump nach einem abgebrochenen Lauf
                  trap 'rm -f "${out}.part"' EXIT

                  # --compress=0: Kopia dedupliziert und komprimiert selbst
                  pg_dump --format=custom --compress=0 \
                          --no-owner --no-privileges --file="${out}.part"

                  # mv ist atomar - Kopia sieht nie einen halben Dump
                  mv "${out}.part" "${out}"

                  pg_restore --list "${out}" > /dev/null

                  # Lokale Vorhaltung; die Tiefe hat Kopia.
                  ls -1t /dumps/immich-*.dump | tail -n +15 | xargs -r rm --
              volumeMounts:
                - { name: dumps, mountPath: /dumps }
                - { name: pg-ca, mountPath: /pg-ca, readOnly: true }
                - { name: tmp,   mountPath: /tmp }
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: dumps
            - name: pg-ca
              secret:
                secretName: immich-db-ca
                items:
                  - { key: ca.crt, path: ca.crt }
            - name: tmp
              emptyDir: {}
