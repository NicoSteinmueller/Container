# Immich unter immich.nico-steinmueller.de
#
# Ein Container für API und Hintergrundjobs (Vorschaubilder, Umkodieren,
# Metadaten). Gesichtserkennung und Suche rechnet MachineLearning.yaml.
#
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  selector:
    app.kubernetes.io/name: immich-server
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  # TODO: 0 bis zum Umzug: Ein Start auf leerer Datenbank legte eine neue
  # Installation an (README.md, Abschnitt Umzug).
  replicas: 0
  revisionHistoryLimit: 2
  # Job-Sperren in der Datenbank, ein Pod genügt.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-server
        homelab.io/db-client: immich-db
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Keycloak über ingress-public
      hostAliases:
        - ip: 192.168.178.232
          hostnames:
            - keycloak.nico-steinmueller.de
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      # Migrationen nach einem Update nicht abwürgen
      terminationGracePeriodSeconds: 60

      initContainers:
        # Config.yaml plus Client-Secret -> /config/immich.json.
        - name: config
          image: ghcr.io/immich-app/immich-server:v3.2.4@sha256:d317916b28090c33eb36b308464ea391f8b7df1d850fcfea227a39ec879718c2
          workingDir: /usr/src/app/server
          command:
            - node
            - -e
            - |
              const fs = require('fs');
              const yaml = require('js-yaml');
              const config = yaml.load(fs.readFileSync('/template/immich.yaml', 'utf8'));
              config.oauth.clientSecret = process.env.OAUTH_CLIENT_SECRET;
              fs.writeFileSync('/config/immich.json', JSON.stringify(config, null, 2), { mode: 0o600 });
          env:
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: immich
                  key: oauth-client-secret
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: immich-config
              mountPath: /template
              readOnly: true
            - name: config
              mountPath: /config

      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v3.2.4@sha256:d317916b28090c33eb36b308464ea391f8b7df1d850fcfea227a39ec879718c2
          ports:
            - name: http
              containerPort: 2283
          env:
            - name: TZ
              value: "Europe/Berlin"
            - name: IMMICH_CONFIG_FILE
              value: "/config/immich.json"
            # TLS endet an Traefik. X-Forwarded-For nur von Pods
            - name: IMMICH_TRUSTED_PROXIES
              value: "10.244.0.0/16"
            - name: REDIS_HOSTNAME
              value: "valkey"
            - name: DB_VECTOR_EXTENSION
              value: "vectorchord"
            # Datenbank aus dem Secret, das der CNPG-Operator anlegt. `uri`
            # trägt das Passwort URL-kodiert; TLS gegen die CA des Clusters.
            - name: DB_APP_URI
              valueFrom:
                secretKeyRef:
                  name: immich-db-app
                  key: uri
            - name: DB_URL
              value: "$(DB_APP_URI)?sslmode=verify-full&sslrootcert=/pg-ca/ca.crt"
          securityContext: *containerSecurity
          # Der erste Start nach dem Umzug baut die Vektor-Indizes neu, ein
          # Update migriert die Datenbank - Immich lauscht erst danach.
          startupProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            # ffmpeg beim Umkodieren
            limits:
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            - name: pg-ca
              mountPath: /pg-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: immich-config
          configMap:
            name: immich-config
        # Die fertige Datei mit dem Secret - nur im Speicher
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # Nur ca.crt - das Secret enthält auch den Schlüssel der CA.
        - name: pg-ca
          secret:
            secretName: immich-db-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
