# llama-swap - Sprachmodelle auf gpu1, OpenAI-kompatibel unter
# http://llama-swap.llm.svc.cluster.local:8080/v1
#
# llama-swap startet je Modell einen llama-server (Vulkan) und wechselt beim
# ersten Request auf ein anderes Modell: altes beenden, neues laden.
#
# Welche Modelle es gibt, steht unten in der ConfigMap. Die Dateien holt
# nicht llama-server, sondern der Sidecar `model-sync` (ModelSync.yaml): aus
# dem Backup auf NFS oder von Hugging Face. llama-server läuft `--offline`
# und nimmt nur, was vollständig im Cache liegt - ein Modell, das noch lädt,
# scheitert sofort statt eine Chat-Anfrage warten zu lassen.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-swap
  namespace: llm
data:
  config.yaml: |
    # Nur noch das Laden in den VRAM - der Download liegt bei model-sync.
    # 25 GB von der NVMe plus Shader-Kompilierung beim ersten Mal.
    healthCheckTimeout: 600
    logLevel: info
    # Nicht benutzt, sonst wird jede Anfrage im Speicher mitgeschnitten.
    captureBuffer: 0

    macros:
      # -ngl 999       alle Layer auf die GPU
      # -fa on         Flash-Attention, Voraussetzung für den quantisierten
      #                KV-Cache
      # q8_0           halbiert den KV-Cache bei kaum messbarem Verlust
      # --no-webui     die Oberfläche ist Open WebUI
      # --offline      nur aus dem Cache, nie selbst herunterladen
      server: >-
        llama-server
        --host 127.0.0.1 --port ${PORT}
        -ngl 999 -fa on --jinja
        --cache-type-k q8_0 --cache-type-v q8_0
        --no-webui --offline

    models:
      # Hybrid: 16 von 64 Layern mit voller Attention, der KV-Cache ist
      # entsprechend klein (~34 KB/Token in q8_0). Gewichte 23,5 GB, mit
      # 64k Kontext und Vision rund 28 GB.
      qwen3.8-27b:
        name: Qwen3.8 27B
        cmd: ${server} -hf unsloth/Qwen3.8-27B-GGUF:UD-Q6_K_XL --ctx-size 65536
        # Nach 30 min ohne Anfrage entladen
        ttl: 1800
        filters:
          setParamsByID:
            # Für Dokumente (Paperless, paperless-gpt) - derselbe
            # llama-server, kein Wechsel.
            # 0.6/0.95/20 empfiehlt Qwen für den Denkmodus.
            "qwen3.8-27b:docs":
              temperature: 0.6
              top_p: 0.95
              top_k: 20
              max_tokens: 8192
            # Zum Testen: ohne Denkphase, etwa 9× schneller je Anfrage.
            # 0.7/0.8/20 empfiehlt Qwen ohne Denken.
            "qwen3.8-27b:docs-nothink":
              temperature: 0.7
              top_p: 0.8
              top_k: 20
              max_tokens: 8192
              chat_template_kwargs:
                enable_thinking: false

      # 50 von 60 Layern Sliding-Window (1024), aber 16 KV-Köpfe in den
      # übrigen - ~85 KB/Token. Gewichte 20,1 GB, mit 32k rund 26 GB.
      gemma-4-31b:
        name: Gemma 4 31B
        cmd: ${server} -hf unsloth/gemma-4-31B-it-GGUF:Q5_K_M --ctx-size 32768
        ttl: 1800

    # Lädt das Standardmodell beim Start in den VRAM. Liegt es noch nicht
    # im Cache (Neuaufbau), scheitert das und der erste Chat lädt es.
    hooks:
      on_startup:
        preload:
          - qwen3.8-27b

---
# GGUF-Cache. Auf gpu1, weil die Modelle dort von der Daten-Disk in den VRAM
# geladen werden; die Kopie auf NFS ist `models-backup` (ModelSync.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  namespace: llm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 500Gi

---
apiVersion: v1
kind: Service
metadata:
  name: llama-swap
  namespace: llm
spec:
  selector:
    app.kubernetes.io/name: llama-swap
  ports:
    - name: http
      port: 8080
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-swap
  namespace: llm
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # GPU und PVC auf genau einem Node - der alte Pod muss weg sein, bevor der
  # neue sie bekommt.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-swap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-swap
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        homelab/gpu: amd
      tolerations:
        - key: homelab/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llama-swap
          # Tag: llama-swap-Version und der llama.cpp-Build darin
          image: ghcr.io/mostlygeek/llama-swap:v264-vulkan-b11561-non-root@sha256:302a2f7382640608d0f98c60e6ef16c27f2a49745f9cec7a6cc678264b8c90af
          # Ohne -watch-config: Eine geänderte ConfigMap kommt über Reloader
          # als Neustart, ein Volume aus einer ConfigMap tauscht Symlinks,
          # die der Watcher nicht sicher sieht.
          command:
            - /app/llama-swap
            - -config
            - /config/config.yaml
            - -listen
            - :8080
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: "Europe/Berlin"
            # Download-Ziel von `-hf`
            - name: LLAMA_CACHE
              value: /models/gguf
            # Shader-Cache von Mesa - sonst kompiliert jeder Start neu
            - name: XDG_CACHE_HOME
              value: /models/cache
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
              homelab.io/gpu: 1
            # Die Gewichte liegen im VRAM; im RAM steht der Page-Cache der
            # GGUF-Datei während des Ladens. gpu1 hat 16 GB.
            limits:
              memory: 12Gi
              homelab.io/gpu: 1
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp

        # Hält den Cache vollständig und spiegelt ihn nach NFS - siehe
        # ModelSync.yaml. Gleiches Image: `llama download` schreibt genau das
        # Cache-Layout, das llama-server liest.
        - name: model-sync
          image: ghcr.io/mostlygeek/llama-swap:v264-vulkan-b11561-non-root@sha256:302a2f7382640608d0f98c60e6ef16c27f2a49745f9cec7a6cc678264b8c90af
          command:
            - python3
            - /scripts/model-sync.py
          env:
            - name: LLAMA_CACHE
              value: /models/gguf
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            # Kopien laufen durch den Page-Cache; der zählt mit, ist aber
            # freigebbar.
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: models
              mountPath: /models
            - name: models-backup
              mountPath: /backup
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: llama-swap
        - name: scripts
          configMap:
            name: model-sync
        - name: models-backup
          persistentVolumeClaim:
            claimName: models-backup
        - name: models
          persistentVolumeClaim:
            claimName: models
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
