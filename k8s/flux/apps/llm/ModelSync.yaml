# model-sync - Sidecar im Pod von llama-swap (LlamaSwap.yaml)
#
# Hält den GGUF-Cache auf `models` vollständig und spiegelt ihn auf
# `models-backup` (NFS). Nach einem Neuaufbau von gpu1 kommen die Modelle so
# aus dem LAN statt über die Internetleitung.
#
# Lokal getestet: Download mit Backup, Wiederherstellung ohne Netz,
# llama-server --offline auf dem wiederhergestellten Cache.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-sync
  namespace: llm
data:
  model-sync.py: |
    #!/usr/bin/env python3
    """
    Hält den GGUF-Cache von llama-swap vollständig - lokal und als Kopie auf NFS.

    Die Modelle sind die `-hf <repo>:<quant>` in der Config von llama-swap. Je
    Modell, in der Reihenfolge der Config:

      1. lokal vollständig?      weiter mit 4
      2. auf dem Backup?         von dort kopieren (LAN statt Internet)
      3. sonst                   `llama download` von Hugging Face
      4. Backup unvollständig?   lokal -> Backup kopieren

    Danach schläft das Skript bis zum nächsten Pod-Neustart - den löst Reloader
    aus, wenn sich die Config ändert.

    "Vollständig" entscheidet llama.cpp selbst: `llama download --offline` endet
    nur dann erfolgreich, wenn Modell und mmproj im Cache liegen.

    Kopiert wird unter `.partial` und erst danach umbenannt, Blobs vor refs/ und
    snapshots/. Ein abgebrochener Lauf hinterlässt so nie eine Datei, die als
    fertig gilt, und nie einen Verweis auf einen fehlenden Blob.
    """
    import os
    import re
    import shutil
    import subprocess
    import sys
    import time

    CONFIG = os.environ.get("SYNC_CONFIG", "/config/config.yaml")
    CACHE = os.environ["LLAMA_CACHE"]
    BACKUP = os.environ.get("SYNC_BACKUP", "/backup")
    LLAMA = os.environ.get("SYNC_LLAMA", "/app/llama")

    SKIP_SUFFIXES = (".downloadInProgress", ".partial")


    def log(msg):
        print(f"[model-sync] {msg}", flush=True)


    def models():
        with open(CONFIG) as f:
            text = f.read()
        seen = []
        for ref in re.findall(r"-hf\s+(\S+)", text):
            if ref not in seen:
                seen.append(ref)
        return seen


    def repo_dir(ref):
        repo = ref.split(":", 1)[0]
        return "models--" + repo.replace("/", "--")


    def complete(ref):
        r = subprocess.run(
            [LLAMA, "download", "--offline", "-hf", ref],
            stdout=subprocess.DEVNULL,
            stderr=subprocess.DEVNULL,
            env={**os.environ, "LLAMA_CACHE": CACHE},
        )
        return r.returncode == 0


    def same_file(src, dst):
        if not os.path.isfile(dst) or os.path.islink(dst):
            return False
        if os.path.getsize(src) != os.path.getsize(dst):
            return False
        # Blobs heißen nach ihrem Hash - gleiche Größe genügt. Kleine Dateien
        # (refs/main) können sich bei gleicher Größe unterscheiden.
        if os.path.getsize(src) > 1 << 20:
            return True
        with open(src, "rb") as a, open(dst, "rb") as b:
            return a.read() == b.read()


    def copy_tree(src_root, dst_root):
        copied = 0
        for dirpath, dirnames, filenames in os.walk(src_root):
            # blobs < refs < snapshots: erst die Daten, dann die Verweise
            dirnames.sort()
            rel = os.path.relpath(dirpath, src_root)
            dst_dir = os.path.normpath(os.path.join(dst_root, rel))
            os.makedirs(dst_dir, exist_ok=True)

            # Symlinks unter snapshots/ meldet os.walk als Datei oder Verzeichnis
            entries = sorted(filenames) + [d for d in dirnames if os.path.islink(os.path.join(dirpath, d))]
            for name in entries:
                if name.endswith(SKIP_SUFFIXES):
                    continue
                src = os.path.join(dirpath, name)
                dst = os.path.join(dst_dir, name)

                if os.path.islink(src):
                    target = os.readlink(src)
                    if os.path.islink(dst) and os.readlink(dst) == target:
                        continue
                    if os.path.lexists(dst):
                        os.remove(dst)
                    os.symlink(target, dst)
                    continue

                if same_file(src, dst):
                    continue
                tmp = dst + ".partial"
                log(f"  {os.path.relpath(src, src_root)} ({os.path.getsize(src) >> 20} MiB)")
                shutil.copyfile(src, tmp)
                os.replace(tmp, dst)
                copied += 1
        return copied


    def download(ref):
        delay = 30
        while True:
            r = subprocess.run([LLAMA, "download", "-hf", ref], env={**os.environ, "LLAMA_CACHE": CACHE})
            if r.returncode == 0 and complete(ref):
                return
            log(f"{ref}: Download fehlgeschlagen, neuer Versuch in {delay} s")
            time.sleep(delay)
            delay = min(delay * 2, 1800)


    def main():
        refs = models()
        log(f"{len(refs)} Modelle in {CONFIG}: {', '.join(refs)}")
        os.makedirs(CACHE, exist_ok=True)
        have_backup = os.path.isdir(BACKUP)
        if not have_backup:
            log(f"kein Backup unter {BACKUP} - nur Download")

        for ref in refs:
            name = repo_dir(ref)
            local = os.path.join(CACHE, name)
            backup = os.path.join(BACKUP, name)

            if complete(ref):
                log(f"{ref}: lokal vollständig")
            else:
                if have_backup and os.path.isdir(backup):
                    log(f"{ref}: aus dem Backup")
                    copy_tree(backup, local)
                if not complete(ref):
                    log(f"{ref}: Download von Hugging Face")
                    download(ref)
                log(f"{ref}: lokal vollständig")

            if have_backup:
                n = copy_tree(local, backup)
                log(f"{ref}: Backup {'aktualisiert, ' + str(n) + ' Dateien' if n else 'aktuell'}")

        log("fertig - warte auf den nächsten Neustart")
        while True:
            time.sleep(86400)


    if __name__ == "__main__":
        try:
            main()
        except Exception as e:  # sichtbar im Log statt stiller Neustartschleife
            log(f"FEHLER: {e!r}")
            sys.exit(1)

---
# Kopie der Modelle auf dem nfs-share.
# Wird nie direkt gelesen, nur kopiert - deshalb NFS trotz der Größe der
# Dateien. In Kopia ausschließen: Alles hier lädt model-sync auch wieder
# von Hugging Face.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-backup
  namespace: llm
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-unraid
  resources:
    requests:
      storage: 500Gi
