# whoami aus dem lokalen Chart k8s/whoami/chart.
# valuesFiles-Pfade sind relativ zur Repo-Wurzel
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whoami
  namespace: flux-system
spec:
  interval: 10m
  releaseName: whoami
  targetNamespace: whoami
  storageNamespace: whoami
  chart:
    spec:
      chart: ./k8s/whoami/chart
      sourceRef:
        kind: GitRepository
        name: flux-system
      # `Revision` statt der Voreinstellung `ChartVersion`: Das Chart liegt im
      # selben Repo und ändert sich, ohne dass `version` in Chart.yaml steigt.
      # Sonst bleibt jede Änderung lautlos wirkungslos und Flux meldet weiter
      # Ready - nachzusehen an der HelmChart, nicht an der HelmRelease.
      reconcileStrategy: Revision
      valuesFiles:
        - k8s/whoami/chart/values.yaml
        - k8s/whoami/chart/values-prod.yaml
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
