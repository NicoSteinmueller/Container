# homepage - ServiceAccount und RBAC
#
# Nur was Status und Auslastung brauchen: Pods, Nodes, Metriken. Kein
# Schreiben, keine Secrets, keine Ingress-Objekte (Config.yaml schaltet die
# Suche ab).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: homepage
automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage-read
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  # Auslastung je Dienst und Node, aus observability/MetricsServer.yaml
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage-read
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage
