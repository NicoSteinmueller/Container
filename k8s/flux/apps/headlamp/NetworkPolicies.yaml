# headlamp - Netzwerkregeln im Namespace `headlamp`
---
# Eingehend nur von ingress-internal; alles andere hält
# core/DefaultDenyIngress.yaml ab.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-internal
  namespace: headlamp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
      ports:
        - protocol: TCP
          port: 4466

---
# Ausgehend nur die API; Sperre und DNS kommen aus core/DefaultDenyEgress.yaml.
# Heimnetz und übrige Pods hat Headlamp nicht zu erreichen.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: headlamp-egress
  namespace: headlamp
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
