# Headlamp - Cluster-Dashboard.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 10m
  releaseName: headlamp
  targetNamespace: headlamp
  storageNamespace: headlamp
  chart:
    spec:
      chart: headlamp
      version: "0.45.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Headlamp spricht mit der API als Identität des eingegebenen Tokens:
    #
    #   Lesen:  kubectl -n headlamp create token headlamp --duration=8h
    #   Ändern: kubectl -n headlamp create token headlamp-admin --duration=1h
    config:
      inCluster: true
      inClusterContextName: talos-cp1
      # sonst jeder Aufrufer ServiceAccount des Pods
      unsafeUseServiceAccountToken: false
      sessionTTL: 28800

      oidc:
        # Das Chart legt sonst ein leeres Secret "oidc" an.
        # TODO: OIDC-Login mit Keycloak einrichten
        secret:
          create: false

    # ServiceAccount und Rechte aus RBAC.yaml
    serviceAccount:
      create: false
      name: headlamp

    clusterRoleBinding:
      create: false

    # Für PodSecurity "restricted": Das Chart setzt nur runAsNonRoot und
    # runAsUser, der Rest steht hier - sonst lehnt der Namespace den Pod ab.
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      runAsNonRoot: true
      runAsUser: 100
      runAsGroup: 101
      privileged: false
      allowPrivilegeEscalation: false
      # Das Chart hängt dafür selbst ein leeres Volume auf /tmp ein.
      readOnlyRootFilesystem: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL

    service:
      type: ClusterIP
      port: 80

    ingress:
      enabled: false

    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 192Mi
