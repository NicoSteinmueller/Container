# headlamp - ServiceAccounts und RBAC
#
#   headlamp        - Identität des Pods und des Lese-Tokens. Kein Schreiben,
#                     keine Secrets.
#   headlamp-admin  - ServiceAccount ohne Pod und ohne Token. Wer ändern will,
#                     erzeugt sich eines für eine Stunde.
---
# Spricht als dieser ServiceAccount mit der API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: headlamp
automountServiceAccountToken: true

---
# Erste Hälfte der Leserechte: die eingebaute Rolle `view` - alles in
# Namespaces, ausdrücklich ohne Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp

---
# Zweite Hälfte: was `view` nicht kennt - Nodes, PersistentVolumes,
# StorageClasses, CRDs. Ohne sie zeigt die Übersicht überall "Forbidden".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-cluster-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  # Auslastung - ohne metrics-server wirkungslos, nicht falsch.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments", "csidrivers", "csinodes", "csistoragecapacities"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
  # Die CRD-Objekte selbst, nicht deren Inhalte - eine Wildcard schlösse jede
  # künftige CRD ein, auch eine mit Zugangsdaten in der Spec.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
  # Lesen allein erlaubt keine Ausweitung - ohne `escalate`/`bind` kann dieser
  # ServiceAccount keine Rolle vergeben, auch keine, die er sieht.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  # Damit die Oberfläche beim Anmelden abfragen kann, was sie zeigen darf.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews", "selfsubjectrulesreviews"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-cluster-read
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp

---
# Schreibzugriff auf Abruf: kein Pod, kein Token. Eines entsteht per
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: headlamp
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: headlamp
