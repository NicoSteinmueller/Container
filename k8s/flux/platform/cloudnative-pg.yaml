# CloudNativePG - der Operator, dem die Postgres-Instanzen der migrierten
# Dienste gehören.
# Man deklariert einen `Cluster`, kein Passwort - der Operator
# würfelt es und legt es als Secret `<name>-app` ab
#
# Zu sichern ist damit nur der Dump - Operator und `Cluster`-CRs stehen in Git.
# Der Weg zurück: CR anwenden, leere Instanz, Dump einspielen.
---
# Namespace `cnpg-system`
---
# Egress-Default-Deny: Der Operator hält die Zugangsdaten jeder Datenbank im
# Cluster und hat im Heimnetz nichts verloren.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg-egress
  namespace: cnpg-system
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

    # Die Namespaces mit Postgres-Instanzen. Der Operator fragt den Instance
    # Manager jedes Pods nach dem Zustand (8000) und spricht für die
    # Rollenverwaltung Postgres selbst an (5432)
    # Je migriertem Dienst kommt ein `toEndpoints`-Block hinzu:
    #
    #   - toEndpoints:
    #       - matchLabels:
    #           io.kubernetes.pod.namespace: nextcloud
    #           cnpg.io/podRole: instance
    #     toPorts:
    #       - ports:
    #           - port: "5432"
    #             protocol: TCP
    #           - port: "8000"
    #             protocol: TCP
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 10m
  releaseName: cloudnative-pg
  targetNamespace: cnpg-system
  storageNamespace: cnpg-system
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.0"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Die CRDs liegen hier unter templates/crds/ und sind damit gewöhnliche
    # Templates - Helm zieht Feldänderungen beim Upgrade nach.
    crds:
      create: true

    config:
      # Cluster-weit, weil die Instanzen je Dienst in dessen Namespace liegen
      clusterWide: true

    # Fünf Instanzen zu verwalten kostet nichts - der Operator arbeitet nur bei Änderungen
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
      limits:
        memory: 256Mi

    # Aus, bis der erste Postgres-Dienst umgezogen ist - ein PodMonitor auf
    # null Instanzen beschreibt nichts. Dann braucht es zusätzlich eine
    # Ingress-Regel hier; die Metriken kommen aus Port 9187 der Instanzen.
    monitoring:
      podMonitorEnabled: false
      grafanaDashboard:
        create: false
