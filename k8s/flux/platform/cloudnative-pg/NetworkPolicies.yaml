# cloudnative-pg - Netzwerkregeln im Namespace `cnpg-system`
---
# Eingehend ist der Namespace zu (core/DefaultDenyIngress.yaml). Offen nur der
# Webhook des Operators, den der kube-apiserver anruft - ohne ihn nimmt der
# Cluster keine `Cluster`-, `Backup`- oder `Pooler`-Objekte an.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg-webhook
  namespace: cnpg-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP

---
# Ausgehend erlaubt; Sperre und DNS kommen aus core/DefaultDenyEgress.yaml.
# Eng, weil der Operator die Zugangsdaten jeder Datenbank im Cluster hält und
# im Heimnetz nichts verloren hat.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg-egress
  namespace: cnpg-system
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

    # Die Namespaces mit Postgres-Instanzen. Der Operator fragt den Instance
    # Manager jedes Pods nach dem Zustand (8000) und spricht für die
    # Rollenverwaltung Postgres selbst an (5432)
    # Je migriertem Dienst kommt ein `toEndpoints`-Block hinzu:
    #
    #   - toEndpoints:
    #       - matchLabels:
    #           io.kubernetes.pod.namespace: nextcloud
    #           cnpg.io/podRole: instance
    #     toPorts:
    #       - ports:
    #           - port: "5432"
    #             protocol: TCP
    #           - port: "8000"
    #             protocol: TCP
