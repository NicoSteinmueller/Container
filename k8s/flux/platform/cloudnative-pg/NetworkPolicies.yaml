# cloudnative-pg - Netzwerkregeln im Namespace `cnpg-system`
---
# Webhook des Operators, den der kube-apiserver anruft
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg-webhook
  namespace: cnpg-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP

---
# Ausgehend die API: Der Operator watcht die CNPG-CRDs, legt Pods, PVCs,
# Services und Secrets an, schreibt Status und Failover.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg-egress
  namespace: cnpg-system
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

    # Die Namespaces mit Postgres-Instanzen. Der Operator fragt den Instance
    # Manager jedes Pods nach dem Zustand (8000) und spricht für die
    # Rollenverwaltung Postgres selbst an (5432)
    # Je migriertem Dienst kommt ein `toEndpoints`-Block hinzu.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: keycloak
            cnpg.io/podRole: instance
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
