# Reloader - startet neu, was ein geändertes Secret benutzt.
#
# Ein `secretKeyRef` in `env` wird genau einmal aufgelöst, beim Start des Pods:
# Rotiert ein Passwort, schreibt Flux das Secret neu, der laufende Prozess
# arbeitet aber mit dem alten Wert weiter. Der übliche Helm-Trick greift nicht,
# weil unsere Secrets aus einem anderen Repo nur referenziert werden - das
# Pod-Template bleibt byte-gleich, Kubernetes hat keinen Anlass zu handeln.
#
# Reloader schreibt bei Änderung eine Annotation ins Pod-Template der
# Konsumenten. Das ist eine echte Änderung und läuft als gewöhnlicher Rolling
# Update, mit den Probes und dem Rollback des Dienstes.

apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: stakater
  namespace: flux-system
spec:
  interval: 1h
  url: https://stakater.github.io/stakater-charts
---
# Namespace `reloader`
---
# Egress-Default-Deny: Reloader spricht nur mit CoreDNS und dem kube-apiserver.
# Ein Controller, der Secrets liest und Workloads patcht, hat im Heimnetz
# nichts verloren.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: reloader-egress
  namespace: reloader
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 10m
  releaseName: reloader
  targetNamespace: reloader
  storageNamespace: reloader
  chart:
    spec:
      chart: reloader
      version: "2.2.16"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    reloader:
      # Scoped Mode: watchGlobally aus, dafür die Namespaces einzeln. Das Chart
      # legt dann Role und RoleBinding je Namespace an und keine ClusterRole.
      watchGlobally: false

      # Die Namespaces, in denen ein laufender Prozess ein Secret aus
      # homelab-secrets hält - und nur die.
      namespaces:
        - crowdsec
        - monitoring
        - traefik-internal
        - traefik-public

      # Innerhalb der Namespaces oben gilt jeder Workload als annotiert.
      autoReloadAll: true

      # "annotations" statt der Voreinstellung "default": Die hängt dem
      # Container eine Umgebungsvariable an und verändert damit die
      # Container-Spezifikation eines fremden Charts.
      reloadStrategy: annotations

      deployment:
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi

        # Der Pod-Teil steht in den Chart-Defaults, der Container-Teil fehlt:
        # allowPrivilegeEscalation, capabilities und readOnlyRootFilesystem
        # gibt es im PodSecurityContext nicht, dort lehnte die API sie ab.
        containerSecurityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

      # `true` allein genügt nicht: Dieser Namespace hat ein
      # default-deny-ingress und bräuchte zusätzlich eine Ingress-Regel für
      # Pods aus `monitoring`, sonst steht das Target auf DOWN.
      serviceMonitor:
        enabled: false
