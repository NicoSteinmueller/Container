# Reloader - startet neu, was ein geändertes Secret benutzt.
#
# Ein `secretKeyRef` in `env` wird genau einmal aufgelöst, beim Start des Pods:
# Der übliche Helm-Trick greift nicht, da die Secrets aus einem anderen Repo referenziert werden.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 10m
  releaseName: reloader
  targetNamespace: reloader
  storageNamespace: reloader
  chart:
    spec:
      chart: reloader
      version: "2.2.18"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    reloader:
      # Beobachtet nicht alle Namespaces.
      watchGlobally: false
      # Namespaces, die beobachtet werden sollen.
      namespaces:
        - crowdsec
        - keycloak
        - monitoring
        - navidrome
        - ntfy
        - traefik-internal
        - traefik-public
      # Reloads alles in den beobachteten Namespaces.
      autoReloadAll: true
      # Neustart wird durch Annotation ausgelöst.
      reloadStrategy: annotations

      deployment:
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi

        containerSecurityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

      # `true` allein genügt nicht: Der Namespace ist eingehend zu
      # (core/DefaultDenyIngress.yaml) und bräuchte zusätzlich eine
      # Ingress-Regel für Pods aus `monitoring`, sonst steht das Target auf DOWN.
      # TODO: Monitoring
      serviceMonitor:
        enabled: false
