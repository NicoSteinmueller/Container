# reloader - Netzwerkregeln im Namespace `reloader`
---
# Ausgehend nur die API; Sperre und DNS kommen aus core/DefaultDenyEgress.yaml.
# Ein Controller, der Secrets liest und Workloads patcht, hat im Heimnetz
# nichts verloren.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: reloader-egress
  namespace: reloader
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
