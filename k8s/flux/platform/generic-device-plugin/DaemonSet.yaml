# generic-device-plugin - macht die GPU als Ressource `homelab.io/gpu` anforderbar
#
# Ein Pod mit
#
#   resources:
#     limits:
#       homelab.io/gpu: 1
#
# bekommt /dev/kfd (ROCm) und /dev/dri/renderD128 (Vulkan, VA-API) in den
# Container, ohne privileged und ohne hostPath. Beide sind auf Talos 0666, ein
# Container ohne root kommt also ohne zusätzliche Gruppe an sie heran.
#
# `count: 4` statt 1: Die Ressource ist kein exklusiver Zugriff, sondern eine
# Erlaubnis. Ollama, Immich-ML und etc. teilen sich die eine Karte - den
# VRAM verteilt der Treiber, nicht Kubernetes. Das AMD-Device-Plugin könnte
# das nicht, es vergibt die GPU an genau einen Pod.
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: generic-device-plugin
spec:
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Ohne Plugin verschwindet die Ressource vom Node, und GPU-Pods ließen
      # sich nach einem Neustart nicht mehr einplanen.
      priorityClassName: system-node-critical
      # Label und Taint setzt vm/talos (nodes.gpu1 in den tfvars)
      nodeSelector:
        homelab/gpu: amd
      tolerations:
        - key: homelab/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: generic-device-plugin
          image: docker.io/squat/generic-device-plugin:0.2.0@sha256:66c8d5c270eb2b721f1064c549b9b7898152a6d2f0163380a5d37dc7636c20ff
          args:
            - --domain
            - homelab.io
            - --device
            - |
              name: gpu
              groups:
                - count: 4
                  paths:
                    - path: /dev/kfd
                    - path: /dev/dri/renderD128
          ports:
            - name: http
              containerPort: 8080
          # root, weil der Socket-Ordner des Kubelets root:root 0700 ist.
          # Nicht privileged: Für Gerätedateien liest das Plugin /dev nur;
          # erst USB-Geräte bräuchten mehr.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
              readOnly: true
      volumes:
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory
