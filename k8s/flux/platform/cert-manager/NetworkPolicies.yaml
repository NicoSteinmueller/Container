# cert-manager - Netzwerkregeln im Namespace `cert-manager`
---
# Eingehend ist der Namespace zu (core/DefaultDenyIngress.yaml). Offen nur der
# Webhook, den der kube-apiserver anruft - fehlt die Regel, wird jedes
# Certificate-Objekt mit einem Timeout abgelehnt. 10250 ist hier der Webhook,
# nicht das Kubelet.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-webhook
  namespace: cert-manager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: webhook
      app.kubernetes.io/instance: cert-manager
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP

---
# Ausgehend nur die API; Sperre und DNS kommen aus
# core/DefaultDenyEgress.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-egress
  namespace: cert-manager
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
