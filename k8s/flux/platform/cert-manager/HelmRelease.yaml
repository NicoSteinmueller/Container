# cert-manager - und eine eigene CA für clusterinterne Zertifikate.
#
# Der Anlass ist CrowdSec: Der Agent registriert sich beim Start mit seinem
# Pod-Namen bei der LAPI. Startet der Container neu, ohne dass der Pod neu
# entsteht, sind die lokalen Zugangsdaten weg und der Name noch da.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  releaseName: cert-manager
  targetNamespace: cert-manager
  storageNamespace: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: "1.21.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  timeout: 10m
  values:
    # `crds.keep` sorgt dafür, dass ein versehentlich entferntes HelmRelease
    # nicht jedes Certificate-Objekt im Cluster mitnimmt.
    crds:
      enabled: true
      keep: true

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 192Mi

    webhook:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 96Mi

    # hält alle Secrets und Webhook-Konfigurationen im Cache
    cainjector:
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          memory: 256Mi

    # Aus: Die passenden Alarmregeln (Ablauf naht, Ausstellung scheitert)
    prometheus:
      enabled: false
