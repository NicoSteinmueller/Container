# cert-manager - und eigene CA für clusterinterne Zertifikate.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  releaseName: cert-manager
  targetNamespace: cert-manager
  storageNamespace: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.2"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  timeout: 10m
  values:
    # `crds.keep`: Zertifikate werden beim Löschen eines HelmRelease nicht gelöscht, sondern behalten.
    crds:
      enabled: true
      keep: true

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 192Mi

    webhook:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 96Mi

    # hält alle Secrets und Webhook-Konfigurationen im Cache
    cainjector:
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          memory: 256Mi

    # Aus: Die passenden Alarmregeln (Ablauf naht, Ausstellung scheitert)
    # Todo: Monitoring
    prometheus:
      enabled: false
