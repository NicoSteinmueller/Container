# nfs-unraid
---
# Dynamischer Speicher auf NFS - für Bestände, nicht für Datenbanken.
# Nutzung: `storageClassName: nfs-unraid`
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-unraid
  annotations:
  # Storage Class wird neu angelegt
    kustomize.toolkit.fluxcd.io/force: enabled
provisioner: nfs.csi.k8s.io
parameters:
  # Der Export steht nur auf der Tunnel-Adresse des Nodes.
  server: 10.253.0.1
  share: /mnt/user/k8s
  # Ohne nimmt der Treiber den PV-Namen
  subDir: ${pvc.metadata.namespace}/${pvc.metadata.name}
  # Verzeichnis wird nie gelöscht.
  onDelete: retain

# Das Objekt verschwindet mit dem PVC, die Daten bleiben.
reclaimPolicy: Delete
allowVolumeExpansion: true
# Share ist überall direkt erreichbar
volumeBindingMode: Immediate

mountOptions:
  # v4.1 festgelegt, führt alles über 2049 aus und lockt im Protokoll.
  - nfsvers=4.1
  # hard: Bei einer Unterbrechung wiederholt der Client
  - hard
  - noatime
  # es dürfen keine setuid-Binaries ausgeführt werden
  - nosuid
  # es darf keine Geräte geben
  - nodev
  # es darf nichts ausgeführt werden
  - noexec
  # NFS selbst meldet sich nicht an, der Server vertraut der Quelladresse.
  # Dass sie echt ist, garantiert der WireGuard-Tunnel darunter.
  - sec=sys
