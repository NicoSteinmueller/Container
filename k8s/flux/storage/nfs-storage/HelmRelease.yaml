# NFS zum Host - der Weg an die Dateien
#
# Es mountet das kubelet, nicht der Pod: Die Exporte auf dem Host stehen
# deshalb auf der Node-Adresse, nicht auf dem Pod-CIDR.
#
# Hier steht bewusst keine Egress-Policy: Beide Pods des Treibers laufen auf
# hostNetwork und haben damit die Identität des Nodes - auf die greift keine
# NetworkPolicy. Eine Policy hier wäre gültig und täte nichts.
#
# Namespace `csi-driver-nfs`
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: csi-driver-nfs
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/kubernetes-csi/csi-driver-nfs
  ref:
    tag: v4.13.4
  ignore: |
    /*
    !/charts/v4.13.4

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: flux-system
spec:
  interval: 10m
  releaseName: csi-driver-nfs
  targetNamespace: csi-driver-nfs
  storageNamespace: csi-driver-nfs
  chart:
    spec:
      # Pfad im Repo statt Name im Index
      chart: ./charts/v4.13.4/csi-driver-nfs
      sourceRef:
        kind: GitRepository
        name: csi-driver-nfs
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      replicas: 1

      # Der csi-snapshotter-Sidecar setzt CRDs voraus, die dieser Chart nur mit
      # externalSnapshotter.enabled mitbringt.
      enableSnapshotter: false

      resources:
        csiProvisioner:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        livenessProbe:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        nfs:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

    node:
      resources:
        livenessProbe:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        nfs:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

    # Die StorageClass des Charts bleibt aus: Der Server gehört sichtbar in die
    # StorageClass.yaml, nicht in Chart-Werte.
    storageClass:
      create: false
