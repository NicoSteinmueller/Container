# NFS zum Host - der Weg an die Dateien
#
# Es mountet das kubelet, nicht der Pod: Die Exporte auf dem Host stehen
# deshalb auf der Tunnel-Adresse des Nodes (WireGuard, vm/talos), nicht auf
# dem Pod-CIDR.
#
# Hier steht bewusst keine Egress-Policy: Beide Pods des Treibers laufen auf
# hostNetwork und haben damit die Identität des Nodes - auf die greift keine
# NetworkPolicy. Eine Policy hier wäre gültig und täte nichts.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: csi-driver-nfs
  namespace: flux-system
spec:
  interval: 1h
  url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: flux-system
spec:
  interval: 10m
  releaseName: csi-driver-nfs
  targetNamespace: csi-driver-nfs
  storageNamespace: csi-driver-nfs
  chart:
    spec:
      chart: csi-driver-nfs
      version: 4.13.4
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      replicas: 1

      # Der csi-snapshotter-Sidecar setzt CRDs voraus
      enableSnapshotter: false

      resources:
        csiProvisioner:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        livenessProbe:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        nfs:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

    node:
      resources:
        livenessProbe:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        nfs:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

    # Der Server ist in StorageClass.yaml.
    storageClass:
      create: false
