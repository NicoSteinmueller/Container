# Der lokale Speicher des Clusters und seine Default-StorageClass.
#
# Die Aufteilung zu ../nfs-storage/ folgt dem Zugriffsmuster: hier alles mit
# fsync und Locking (Datenbanken, Indizes, Queues), auf NFS die Bestände
# (Medien, Uploads, Sicherungen).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/rancher/local-path-provisioner
  ref:
    tag: v0.0.37
  ignore: |
    /*
    !/deploy/chart

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  interval: 10m
  releaseName: local-path-provisioner
  targetNamespace: local-path-storage
  storageNamespace: local-path-storage
  chart:
    spec:
      chart: ./deploy/chart/local-path-provisioner
      sourceRef:
        kind: GitRepository
        name: local-path-provisioner
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Der Pfad, den Talos bereitstellt
    nodePathMap:
      - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
        paths:
          - /var/mnt/local-path

    storageClass:
      create: true
      name: local-path
      # Default des Clusters
      defaultClass: true
      defaultVolumeType: hostPath
      # keine automatische Bereinigung, um z.B. Datenbanken nicht zu verlieren
      reclaimPolicy: Retain
      volumeBindingMode: WaitForFirstConsumer

    helperImage:
      repository: docker.io/library/busybox
      tag: "1.37.0"

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
