# Netzwerkregeln
---
# Ausgehend nur die API
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: local-path-egress
  namespace: local-path-storage
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
