# local-path - Netzwerkregeln im Namespace `local-path-storage`
---
# Ausgehend nur die API; Sperre und DNS kommen aus core/DefaultDenyEgress.yaml.
# Gerade hier wichtig, wo `enforce: privileged` stehen muss: Was nicht heraus
# kann, trägt einen übernommenen Helfer-Pod nicht weiter als bis zum Node.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: local-path-egress
  namespace: local-path-storage
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
