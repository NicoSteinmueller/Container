# Der lokale Speicher des Clusters und seine Default-StorageClass.
#
# Die Aufteilung zu nfs-storage.yaml folgt dem Zugriffsmuster: hier alles mit
# fsync und Locking (Datenbanken, Indizes, Queues), auf NFS die Bestände
# (Medien, Uploads, Sicherungen).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/rancher/local-path-provisioner
  ref:
    tag: v0.0.37
  ignore: |
    /*
    !/deploy/chart
---
# Namespace `local-path-storage`
---
# Egress-Default-Deny, gerade hier, wo `enforce: privileged` stehen muss: Was
# nicht heraus kann, trägt einen übernommenen Helfer-Pod nicht weiter als bis
# zum Node. Der Provisioner spricht nur mit CoreDNS und dem kube-apiserver.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: local-path-egress
  namespace: local-path-storage
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  interval: 10m
  releaseName: local-path-provisioner
  targetNamespace: local-path-storage
  storageNamespace: local-path-storage
  chart:
    spec:
      chart: ./deploy/chart/local-path-provisioner
      sourceRef:
        kind: GitRepository
        name: local-path-provisioner
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Der Pfad, den Talos bereitstellt
    nodePathMap:
      - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
        paths:
          - /var/mnt/local-path

    storageClass:
      create: true
      name: local-path

      # Die Default-Klasse des Clusters: Ein PVC ohne storageClassName bekommt
      # lokalen Speicher, nicht NFS.
      defaultClass: true
      defaultVolumeType: hostPath

      # Retain gegen den Chart-Default: Ein `kubectl delete pvc` darf keine
      # Datenbank kosten. Der Preis ist Platz, den niemand aufräumt.
      reclaimPolicy: Retain

      # Das Volume ist ein Verzeichnis auf genau einem Node. Früher gebunden
      # könnte der Pod woanders landen und käme nie an seine Daten - auf einem
      # Ein-Node-Cluster unsichtbar, beim zweiten sofort.
      volumeBindingMode: WaitForFirstConsumer

    helperImage:
      repository: docker.io/library/busybox
      tag: "1.37.0"

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
