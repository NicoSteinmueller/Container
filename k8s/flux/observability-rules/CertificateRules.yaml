# Alarme zur Laufzeit der TLS-Zertifikate
#
# Ablaufzeit jedes Zertifikats, das Traefik hält
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: zertifikate
  namespace: monitoring
spec:
  groups:
    - name: zertifikate
      rules:
        - alert: ZertifikatLaeuftAb
          expr: |
            min by (namespace, cn) (traefik_tls_certs_not_after - time()) < 14 * 86400
          for: 1h
          labels:
            severity: warning
            thema: zertifikat
          annotations:
            summary: "Zertifikat {{ $labels.cn }} läuft in {{ $value | humanizeDuration }} ab"
            description: >-
              {{ $labels.namespace }} hat die Erneuerung seit über zwei Wochen
              nicht geschafft. kubectl -n {{ $labels.namespace }} logs
              deploy/{{ $labels.namespace }} | grep -i acme

        - alert: ZertifikatLaeuftBaldAb
          expr: |
            min by (namespace, cn) (traefik_tls_certs_not_after - time()) < 7 * 86400
          for: 1h
          labels:
            severity: critical
            thema: zertifikat
          annotations:
            summary: "Zertifikat {{ $labels.cn }} läuft in {{ $value | humanizeDuration }} ab - dringend"
            description: >-
              Danach lehnen Clients {{ $labels.cn }} ab. Ursache in
              kubectl -n {{ $labels.namespace }} logs deploy/{{ $labels.namespace }}
              | grep -i acme; zur Not acme.json löschen und neu holen lassen
              (Rate-Limits beachten).

        # Ohne Metrik wüssten die beiden Regeln oben nichts
        - alert: ZertifikatsdatenFehlen
          expr: |
            absent(traefik_tls_certs_not_after{namespace="traefik-public"})
            or
            absent(traefik_tls_certs_not_after{namespace="traefik-internal"})
          for: 30m
          labels:
            severity: warning
            thema: zertifikat
          annotations:
            summary: "Keine Zertifikatslaufzeiten von einem Traefik-Controller"
            description: >-
              Prometheus bekommt traefik_tls_certs_not_after nicht mehr - der
              Ablauf eines Zertifikats bliebe unbemerkt. Target prüfen:
              podMonitor/monitoring/traefik.
