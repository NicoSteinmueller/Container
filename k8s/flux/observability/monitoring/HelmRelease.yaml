# Monitoring - kube-prometheus-stack.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 10m
  releaseName: kube-prometheus-stack
  targetNamespace: monitoring
  storageNamespace: monitoring
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "91.4.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    # Die Operator-CRDs liegen in einem echten crds/-Verzeichnis, das Helm beim
    # Upgrade ab Werk unberührt lässt
    crds: CreateReplace
    remediation:
      retries: 3
  timeout: 20m

  # Die ClusterRole des Operators darf ab Werk jedes Secret im Cluster lesen
  # und schreiben. Das Chart kennt keine namespaced Variante, deshalb fliegt
  # die Regel hier heraus und kommt als Role in `monitoring` zurück (RBAC.yaml);
  # `prometheusOperator.namespaces` unten beschränkt die Informer passend.
  #
  # `test` vor `remove`: Verschiebt ein Chart-Update die Regel, scheitert das
  # Rendern laut, statt still eine andere Regel zu löschen.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ClusterRole
              name: kube-prometheus-stack-operator
            patch: |
              - op: test
                path: /rules/4/resources
                value: [configmaps, secrets]
              - op: remove
                path: /rules/4

  values:
    prometheus:
      enabled: true
      prometheusSpec:
        retention: 30d
        # Die wichtigere Grenze: `local-path` erzwingt die PVC-Größe nicht.
        retentionSize: 18GiB

        # Ab Werk `true` - dann beachtet Prometheus nur Objekte mit dem
        # Release-Label dieses Charts und ignoriert fremde stillschweigend.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false

        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  # `local-path`
                  storage: 20Gi

        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 2Gi

    alertmanager:
      enabled: true
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi

    prometheusOperator:
      enabled: true

      # Nur `monitoring` beobachten - Gegenstück zur Role in RBAC.yaml. Ein
      # ServiceMonitor in einem anderen Namespace wird damit nicht mehr
      # gesehen; er gehört hierher oder sein Namespace unter `additional`
      # (dann auch dort eine Role).
      namespaces:
        releaseNamespace: true
        additional: []

      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 192Mi
      admissionWebhooks:
        enabled: true
        # Beim Install `Ignore`, danach `Fail`
        failurePolicy: IgnoreOnInstallOnly
        # Zertifikate vom vorhandenen cert-manager
        certManager:
          enabled: true
        patch:
          enabled: false

    grafana:
      enabled: true
      defaultDashboardsEnabled: true

      # Secret `grafana-admin` mit `admin-user`/`admin-password`
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password

      # Ab Werk bekommen die Sidecars eine ClusterRole auf `configmaps` und
      # `secrets` im ganzen Cluster - und das Token steckt auch im
      # Grafana-Container.
      # Stattdessen eine Role nur auf ConfigMaps in `monitoring` (RBAC.yaml);
      # alle Dashboards und Datasources liegen ohnehin hier.
      rbac:
        namespaced: true
        useExistingRole: grafana-sidecar

      sidecar:
        dashboards:
          # kube-prometheus-stack setzt ALL
          searchNamespace: monitoring
          resource: configmap
        datasources:
          resource: configmap

      persistence:
        enabled: true
        size: 4Gi

      # Kein Ingress: Die Route `grafana.k8s.nico-steinmueller.de` steht in
      # network/ingress-internal/DynamicConfig.yaml.
      ingress:
        enabled: false

      # Prometheus legt die Charts selbst an, Loki nicht.
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100

      # Update-Pruefung, Plugin-Katalog, News, Telemetrie.
      grafana.ini:
        analytics:
          check_for_updates: false
          check_for_plugin_updates: false
          reporting_enabled: false
        news:
          news_feed_enabled: false
        plugins:
          # Deaktiviert das automatische Nachladen der Plugin-Liste von grafana.com.
          preinstall_disabled: true

      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          memory: 768Mi

    # Auf Talos nicht scrapebar
    # etcd steht hinter der Ingress-Firewall, Controller-Manager und Scheduler binden auf
    # 127.0.0.1. kubeProxy muss aktiv aus - Cilium ersetzt ihn, das Chart nimmt ihn aber an.
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false

    # Ungeprüftes HTTPS
    kubelet:
      enabled: true
      serviceMonitor:
        https: true
        insecureSkipVerify: true

    kube-state-metrics:
      # Die Default-Liste ohne `secrets`: Der Collector braucht `list` auf
      # Secrets im ganzen Cluster, und `list` liefert die Inhalte mit. Das
      # Chart leitet die RBAC aus dieser Liste ab.
      collectors:
        - certificatesigningrequests
        - configmaps
        - cronjobs
        - daemonsets
        - deployments
        - endpointslices
        - horizontalpodautoscalers
        - ingresses
        - jobs
        - leases
        - limitranges
        - mutatingwebhookconfigurations
        - namespaces
        - networkpolicies
        - nodes
        - persistentvolumeclaims
        - persistentvolumes
        - poddisruptionbudgets
        - pods
        - replicasets
        - replicationcontrollers
        - resourcequotas
        - services
        - statefulsets
        - storageclasses
        - validatingwebhookconfigurations
        - volumeattachments

      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 192Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 64Mi

    # Enthält `Watchdog` - eine Regel, die immer feuert und damit beweist, dass
    # die Alarmkette lebt.
    defaultRules:
      create: true
