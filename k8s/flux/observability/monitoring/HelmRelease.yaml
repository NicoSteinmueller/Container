# Monitoring - kube-prometheus-stack.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 10m
  releaseName: kube-prometheus-stack
  targetNamespace: monitoring
  storageNamespace: monitoring
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "91.8.2"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    # Die Operator-CRDs liegen in einem echten crds/-Verzeichnis, das Helm beim
    # Upgrade ab Werk unberührt lässt
    crds: CreateReplace
    remediation:
      retries: 3
  timeout: 20m

  # ClusterRole darf jedes Secret lesen und wird hier entfernt und als Role in `monitoring` wieder angelegt (RBAC.yaml).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ClusterRole
              name: kube-prometheus-stack-operator
            patch: |
              - op: test
                path: /rules/4/resources
                value: [configmaps, secrets]
              - op: remove
                path: /rules/4

  values:
    prometheus:
      enabled: true
      prometheusSpec:
        retention: 30d
        retentionSize: 18GiB

        # true: Prometheus beachtet nur Objekte mit dem Release-Label dieses Charts
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false

        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 20Gi

        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 2Gi

    alertmanager:
      enabled: true

      # Route und Empfänger vollständig, nicht nur ergänzt: Helm ersetzt
      # Listen, statt sie zusammenzuführen. `global`, `inhibit_rules` und
      # `templates` bleiben Chart-Default.
      config:
        route:
          group_by:
            - namespace
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: "null"
          routes:
            # beweist, dass die Kette lebt
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"

            # Dump-Alarme ins ntfy-Topic `db-backup`
            - receiver: ntfy-db-backup
              matchers:
                - thema = "db-backup"
              group_by:
                - alertname
                - namespace

            # Zertifikate und blockierter Verkehr ins ntfy-Topic `cluster`.
            - receiver: ntfy-cluster
              matchers:
                - thema =~ "zertifikat|dns"
              group_by:
                - alertname
                - source_namespace
                - cn

            # Alles Übrige mit Gewicht und jede künftige eigene
            # Regel ohne `thema` - ins ntfy-Topic `alarme`
            - receiver: ntfy-alarme
              matchers:
                - severity =~ "warning|critical"
              group_by:
                - alertname
                - namespace

        receivers:
          - name: "null"

          # Zugriff auf die ntfy-Topics über den internen Service `ntfy.ntfy.svc.cluster.local`.
          - name: ntfy-db-backup
            webhook_configs:
              - url: http://ntfy.ntfy.svc.cluster.local/db-backup?template=alertmanager
                send_resolved: true
                http_config:
                  authorization:
                    type: Bearer
                    credentials_file: /etc/alertmanager/secrets/ntfy-alertmanager/token
          - name: ntfy-cluster
            webhook_configs:
              - url: http://ntfy.ntfy.svc.cluster.local/cluster?template=alertmanager
                send_resolved: true
                http_config:
                  authorization:
                    type: Bearer
                    credentials_file: /etc/alertmanager/secrets/ntfy-alertmanager/token
          - name: ntfy-alarme
            webhook_configs:
              - url: http://ntfy.ntfy.svc.cluster.local/alarme?template=alertmanager
                send_resolved: true
                http_config:
                  authorization:
                    type: Bearer
                    credentials_file: /etc/alertmanager/secrets/ntfy-alertmanager/token

      alertmanagerSpec:
        secrets:
          - ntfy-alertmanager
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi

    prometheusOperator:
      enabled: true

      # Nur `monitoring` beobachten
      namespaces:
        releaseNamespace: true
        additional: []

      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 192Mi
      admissionWebhooks:
        enabled: true
        # Beim Install `Ignore`, danach `Fail`
        failurePolicy: IgnoreOnInstallOnly
        # Zertifikate vom vorhandenen cert-manager
        certManager:
          enabled: true
        patch:
          enabled: false

    grafana:
      enabled: true
      defaultDashboardsEnabled: true

      # Secret `grafana-admin`
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password

      # Sidecars nur auf ConfigMaps in `monitoring` eingeschränkt,
      # alle Dashboards und Datasources liegen ohnehin hier.
      rbac:
        namespaced: true
        useExistingRole: grafana-sidecar

      sidecar:
        dashboards:
          searchNamespace: monitoring
          resource: configmap
        datasources:
          resource: configmap

      persistence:
        enabled: true
        size: 4Gi

      ingress:
        enabled: false

      # Prometheus legt die Charts selbst an, Loki nicht.
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100

      # Update-Pruefung, Plugin-Katalog, News, Telemetrie.
      grafana.ini:
        analytics:
          check_for_updates: false
          check_for_plugin_updates: false
          reporting_enabled: false
        news:
          news_feed_enabled: false
        plugins:
          # Deaktiviert das automatische Nachladen der Plugin-Liste von grafana.com.
          preinstall_disabled: true
        security:
          # Avatare holt Grafana serverseitig von secure.gravatar.com
          disable_gravatar: true

      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          memory: 768Mi

    # Auf Talos nicht scrapebar
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false

    # Ungeprüftes HTTPS
    kubelet:
      enabled: true
      serviceMonitor:
        https: true
        insecureSkipVerify: true

    kube-state-metrics:
      # Die Default-Liste ohne `secrets`: Der Collector braucht `list` auf
      # Secrets im ganzen Cluster, und `list` liefert die Inhalte mit. Das
      # Chart leitet die RBAC aus dieser Liste ab.
      collectors:
        - certificatesigningrequests
        - configmaps
        - cronjobs
        - daemonsets
        - deployments
        - endpointslices
        - horizontalpodautoscalers
        - ingresses
        - jobs
        - leases
        - limitranges
        - mutatingwebhookconfigurations
        - namespaces
        - networkpolicies
        - nodes
        - persistentvolumeclaims
        - persistentvolumes
        - poddisruptionbudgets
        - pods
        - replicasets
        - replicationcontrollers
        - resourcequotas
        - services
        - statefulsets
        - storageclasses
        - validatingwebhookconfigurations
        - volumeattachments

      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 192Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 64Mi

    # Enthält `Watchdog`
    defaultRules:
      create: true
