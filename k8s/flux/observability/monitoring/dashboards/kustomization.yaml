# Eigene Grafana-Dashboards als ConfigMaps
#
# Dazunehmen: JSON von grafana.com holen, `${DS_*}` durch die uid ersetzen
# (`prometheus`/`loki`), unten eintragen.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

generatorOptions:
  # Der Sidecar findet die ConfigMaps über das Label.
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"

configMapGenerator:
  # Node Exporter Full (grafana.com ID 1860).
  - name: dashboard-node-exporter-full
    files:
      - node-exporter-full.json

  # Cilium und Hubble, aus dem Chart von Cilium 1.20.1
  # Beim Cilium-Update mitziehen.
  - name: dashboard-cilium-agent
    files:
      - cilium-dashboard.json
  - name: dashboard-cilium-operator
    files:
      - cilium-operator-dashboard.json
  - name: dashboard-hubble
    files:
      - hubble-dashboard.json
  # Blockierte und fehlgeschlagene DNS-Abfragen je Namespace
  - name: dashboard-hubble-dns
    files:
      - hubble-dns-namespace.json
  # Verworfene Pakete und Policy-Entscheidungen je Namespace
  - name: dashboard-hubble-network
    files:
      - hubble-network-overview-namespace.json


  # blockierte DNS-Abfragen und verworfene Pakete.
  - name: dashboard-dns-blockaden
    files:
      - dns-blockaden.json
