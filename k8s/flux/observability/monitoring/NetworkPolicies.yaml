# monitoring - Netzwerkregeln
---
# Prometheus scrapt den eigenen Namespace.
#
# Jeder andere Namespace ist eingehend zu und braucht eine eigene Regel.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-monitoring
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}

---
# Im LAN erreichbar ist nur Grafana.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-internal
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
      ports:
        - protocol: TCP
          port: 3000

---
# Der Admission-Webhook des Operators, angerufen vom kube-apiserver.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-operator-webhook
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app: kube-prometheus-stack-operator
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP

---
# Ausgehend erlaubt; Sperre und DNS kommen aus core/DefaultDenyEgress.yaml.
# Dieser Namespace hat keinen Weg ins Internet.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-egress
  namespace: monitoring
spec:
  endpointSelector: {}
  egress:
    # Prometheus (Targets), Operator (CRs), kube-state-metrics, Alloy (Pod-Metadaten).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

    # Hostprozesse, die auf dem Node lauschen.
    - toEntities:
        - host
      toPorts:
        - ports:
            # Kubelet
            - port: "10250"
              protocol: TCP
            # node-exporter
            - port: "9100"
              protocol: TCP
            # Cilium
            - port: "9962"
              protocol: TCP
            - port: "9963"
              protocol: TCP
            - port: "9964"
              protocol: TCP
            - port: "9965"
              protocol: TCP

    - toEndpoints:
        - {}

    # Namespaces mit Scrape-Zielen. Ohne Portangabe - den bestimmt der Exporter.
    # Nur die beiden, die das Default-Deny nicht trifft; jeder andere bräuchte
    # zusätzlich eine Ingress-Regel für `monitoring` in seiner NetworkPolicies.yaml.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
        - matchLabels:
            io.kubernetes.pod.namespace: flux-system

    # Beide Traefik-Controller, nur der Metrik-Port.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik-internal
            app.kubernetes.io/name: traefik
        - matchLabels:
            io.kubernetes.pod.namespace: traefik-public
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "9100"
              protocol: TCP

---
# Alertmanager -> ntfy
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alertmanager-to-ntfy
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ntfy
            app.kubernetes.io/name: ntfy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
