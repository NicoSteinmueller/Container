# monitoring - Netzwerkregeln im Namespace `monitoring`
---
# Prometheus scrapt den eigenen Namespace. `podSelector: {}` unter `from` heißt
# "alle Pods im selben Namespace", nicht "im Cluster".
#
# Jeder andere Namespace ist eingehend zu (core/DefaultDenyIngress.yaml) und
# braucht eine eigene Regel für Pods aus `monitoring`, sobald Prometheus ihn
# scrapen soll.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-monitoring
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}

---
# Im LAN erreichbar ist nur Grafana.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-internal
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
      ports:
        - protocol: TCP
          port: 3000

---
# Der Admission-Webhook des Operators, angerufen vom kube-apiserver.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-operator-webhook
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app: kube-prometheus-stack-operator
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP

---
# Ausgehend erlaubt; Sperre und DNS kommen aus core/DefaultDenyEgress.yaml.
# Dieser Namespace hat keinen Weg ins Internet.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-egress
  namespace: monitoring
spec:
  endpointSelector: {}
  egress:
    # Prometheus (Targets), Operator (CRs), kube-state-metrics, Alloy (Pod-Metadaten).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

    # Was auf dem Node lauscht, trägt die Identität `host` und ist über
    # `toEndpoints` nicht erreichbar: 10250 Kubelet, 9100 node-exporter,
    # 9962-9965 Cilium (Agent, Operator, Envoy, Hubble). Die andere Hälfte
    # steht in vm/talos/patches/firewall.yaml.tftpl.
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
            - port: "9100"
              protocol: TCP
            - port: "9962"
              protocol: TCP
            - port: "9963"
              protocol: TCP
            - port: "9964"
              protocol: TCP
            - port: "9965"
              protocol: TCP

    - toEndpoints:
        - {}

    # Namespaces mit Scrape-Zielen. Ohne Portangabe - den bestimmt der Exporter.
    # Nur die beiden, die das Default-Deny nicht trifft; jeder andere bräuchte
    # zusätzlich eine Ingress-Regel für `monitoring` in seiner
    # NetworkPolicies.yaml. Beides zusammen eintragen, sonst steht das Target
    # auf DOWN. hostNetwork-Pods (csi-driver-nfs) laufen als `host`, nicht hier.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
        - matchLabels:
            io.kubernetes.pod.namespace: flux-system

---
# Alertmanager -> ntfy (Dump-Alarme, HelmRelease.yaml). Eigene Regel statt eines
# Blocks in monitoring-egress: Nur Alertmanager darf dorthin, nicht Grafana
# oder Prometheus.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alertmanager-to-ntfy
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ntfy
            app.kubernetes.io/name: ntfy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
