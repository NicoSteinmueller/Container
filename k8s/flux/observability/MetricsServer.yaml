# metrics-server - Quelle für `kubectl top` und die Auslastungsanzeigen in
# Headlamp.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 10m
  releaseName: metrics-server
  targetNamespace: kube-system
  storageNamespace: kube-system
  chart:
    spec:
      chart: metrics-server
      version: "3.13.1"
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicas: 1

    podDisruptionBudget:
      enabled: false

    defaultArgs:
      - --cert-dir=/tmp
      - --kubelet-preferred-address-types=InternalIP
      - --kubelet-use-node-status-port
      - --metric-resolution=15s
      # Ein echtes Kubelet-Zertifikat setzte serverTLSBootstrap voraus, das
      # vm/talos bewusst weglässt.
      - --kubelet-insecure-tls

    args: []

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 40m
        memory: 64Mi
      limits:
        memory: 128Mi

---
# Ausgehend: kube-system steht unter core/DefaultDenyEgress.yaml (nur CoreDNS
# ist ausgenommen). metrics-server fragt die Kubelets ab und meldet sich bei
# der API; DNS braucht er keinen, die Kubelets spricht er über InternalIP an.
# Der Weg zum Kubelet braucht zusätzlich die Talos-Regel `kubelet`
# (vm/talos/patches/firewall.yaml.tftpl, pod_subnet).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metrics-server-egress
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: metrics-server
  egress:
    - toEntities:
        - kube-apiserver

    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
