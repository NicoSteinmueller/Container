# Loki - Speicher für die Logs; gesammelt werden sie von Alloy (Alloy.yaml).
# Namespace `monitoring`
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: monitoring
  # Kurz, weil Grafanas Datasource-URL in monitoring/HelmRelease.yaml darauf
  # zeigt.
  releaseName: loki
  chart:
    spec:
      chart: loki
      version: "7.3.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  timeout: 15m
  values:
    deploymentMode: SingleBinary

    loki:
      # Sonst erwartet Loki pro Anfrage einen X-Scope-OrgID-Header
      auth_enabled: false

      commonConfig:
        replication_factor: 1

      storage:
        type: filesystem

      # sonst nimmt das Chart seine Vorgabe mit Object Storage.
      schemaConfig:
        configs:
          - from: "2026-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      limits_config:
        retention_period: 720h     # 30 Tage

      compactor:
        # Ohne diese Zeile sammelt Loki für immer Logs.
        retention_enabled: true
        delete_request_store: filesystem

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        # Storage-Klasse: `local-path`. Die Zeitgrenze oben ist die
        # eigentliche Bremse - diese Größe wird nicht erzwungen.
        size: 20Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi

    # Replikation deaktivieren
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0

    # memcached ohne Gegenwert bei der Datenmenge
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    # Bündlung der Endpunkte nicht nötig.
    gateway:
      enabled: false

    # Der Canary prüft die Kette mit eigenen Logs.
    lokiCanary:
      enabled: false
    test:
      enabled: false

    # Sidecar für Lokis eigenen Ruler. Die Alarme kommen aus Prometheus.
    sidecar:
      rules:
        enabled: false
