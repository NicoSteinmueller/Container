# Loki - Speicher für die Logs
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 10m
  releaseName: loki
  targetNamespace: monitoring
  storageNamespace: monitoring
  chart:
    spec:
      chart: loki
      version: "7.3.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  timeout: 15m
  values:
    deploymentMode: SingleBinary

    loki:
      # X-Scope-OrgID-Header erwartet
      auth_enabled: false

      commonConfig:
        replication_factor: 1

      storage:
        type: filesystem

      # sonst Object Storage benötigt
      schemaConfig:
        configs:
          - from: "2026-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      limits_config:
        retention_period: 720h     # 30 Tage

      compactor:
        # Rolling-Index: 30 Tage
        retention_enabled: true
        delete_request_store: filesystem

      # Anonyme Nutzungsstatistik
      analytics:
        reporting_enabled: false

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 20Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi

    # Replikation deaktivieren
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0

    # memcached ohne Gegenwert
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    # Bündlung der Endpunkte nicht nötig.
    gateway:
      enabled: false

    # Der Canary prüft die Kette.
    lokiCanary:
      enabled: false
    test:
      enabled: false

    # Sidecar für Lokis eigenen Ruler.
    sidecar:
      rules:
        enabled: false
