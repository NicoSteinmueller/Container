# Logs - Loki als Speicher, Alloy als Sammler. Beide im Namespace `monitoring`
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 1h
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: monitoring
  # Kurz, weil Grafanas Datasource-URL in monitoring.yaml darauf zeigt.
  releaseName: loki
  chart:
    spec:
      chart: loki
      version: "7.3.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  timeout: 15m
  values:
    deploymentMode: SingleBinary

    loki:
      # Sonst erwartet Loki pro Anfrage einen X-Scope-OrgID-Header
      auth_enabled: false

      commonConfig:
        replication_factor: 1

      storage:
        type: filesystem

      # sonst nimmt das Chart seine Vorgabe mit Object Storage.
      schemaConfig:
        configs:
          - from: "2026-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      limits_config:
        retention_period: 720h     # 30 Tage

      compactor:
        # Ohne diese Zeile sammelt Loki für immer Logs.
        retention_enabled: true
        delete_request_store: filesystem

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        # Storage-Klasse: `local-path`. Die Zeitgrenze oben ist die
        # eigentliche Bremse - diese Größe wird nicht erzwungen.
        size: 20Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi

    # Replikation deaktivieren
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0

    # memcached ohne Gegenwert bei der Datenmenge
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    # Bündlung der Endpunkte nicht nötig.
    gateway:
      enabled: false

    # Der Canary prüft die Kette mit eigenen Logs.
    lokiCanary:
      enabled: false
    test:
      enabled: false

    # Sidecar für Lokis eigenen Ruler. Die Alarme kommen aus Prometheus.
    sidecar:
      rules:
        enabled: false
---
# Alloy
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: monitoring
  releaseName: alloy
  # kube-prometheus-stack bringt die monitoring.coreos.com-CRDs mit
  dependsOn:
    - name: kube-prometheus-stack
      namespace: flux-system
    - name: loki
      namespace: flux-system
  chart:
    spec:
      chart: alloy
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  timeout: 10m
  values:
    alloy:
      # anonyme Nutzungsstatistik an Grafana Labs
      enableReporting: false

      # /var/log als hostPath - der Grund für `privileged` am Namespace.
      mounts:
        varlog: true

      # Für die keep-Regel im Config: Ein DaemonSet-Pod soll nur die Logs
      # seines Nodes verfolgen. HOSTNAME ist in einem Pod der Pod-Name.
      extraEnv:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 384Mi

      configMap:
        content: |-
          logging {
            level  = "info"
            format = "logfmt"
          }

          // Dateien und nicht loki.source.kubernetes: Letzteres liest die Logs
          // durch den kube-apiserver, und damit haengt die Log-Sammlung an der
          // Komponente, deren Aussetzer man untersuchen will.
          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              action        = "keep"
              regex         = sys.env("NODE_NAME")
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            // /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log - die
            // UID ist der eindeutige Teil, daher das Sternchen davor.
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              action        = "replace"
              replacement   = "/var/log/pods/*$1/*.log"
              target_label  = "__path__"
            }
          }

          local.file_match "pod_logs" {
            path_targets = discovery.relabel.pod_logs.output
          }

          loki.source.file "pod_logs" {
            targets    = local.file_match.pod_logs.targets
            forward_to = [loki.process.pod_logs.receiver]
          }

          // stage.cri zerlegt das containerd-Zeilenformat. Ohne das steht der
          // Vorspann in jeder Zeile und der Zeitstempel ist der des Einlesens.
          loki.process "pod_logs" {
            stage.cri {}
            forward_to = [loki.write.default.receiver]
          }

          // Was `kubectl get events` zeigt, aber mit Geschichte statt nach
          // einer Stunde verfallen.
          loki.source.kubernetes_events "events" {
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
            }
          }

    controller:
      type: daemonset

    # Werk Requests kein Limit
    configReloader:
      resources:
        requests:
          cpu: 10m
          memory: 50Mi
        limits:
          memory: 128Mi

    # Prometheus scrapt selbst, Alloy sammelt nur Logs.
    crds:
      create: false

    # Ab Werk aus. Prometheus nimmt ihn auf, weil
    # serviceMonitorSelectorNilUsesHelmValues in monitoring.yaml `false` ist.
    serviceMonitor:
      enabled: true
