# Monitoring - kube-prometheus-stack.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
# Namespace `monitoring`
---
# Im LAN erreichbar ist nur Grafana
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Prometheus scrapt den eigenen Namespace. `podSelector: {}` unter `from` heißt
# "alle Pods im selben Namespace", nicht "im Cluster".
#
# Jeder Namespace mit eigenem default-deny-ingress braucht eine eigene Regel,
# sobald Prometheus ihn scrapen soll.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-monitoring
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-internal
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
      ports:
        - protocol: TCP
          port: 3000
---
# Der Admission-Webhook des Operators, angerufen vom kube-apiserver.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-operator-webhook
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app: kube-prometheus-stack-operator
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
---
# Egress-Default-Deny: Dieser Namespace hat keinen Weg ins Internet.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-egress
  namespace: monitoring
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # Prometheus (Targets), Operator (CRs), kube-state-metrics, Alloy (Pod-Metadaten).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

    # Was auf dem Node lauscht, trägt die Identität `host` und ist über
    # `toEndpoints` nicht erreichbar: 10250 Kubelet, 9100 node-exporter.
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
            - port: "9100"
              protocol: TCP

    - toEndpoints:
        - {}

    # Namespaces mit Scrape-Zielen. Kommt einer dazu, gehört er hierher, sonst
    # steht sein Target auf DOWN. Ohne Portangabe - den bestimmt der Exporter.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
        - matchLabels:
            io.kubernetes.pod.namespace: crowdsec
        - matchLabels:
            io.kubernetes.pod.namespace: csi-driver-nfs
        - matchLabels:
            io.kubernetes.pod.namespace: flux-system
        - matchLabels:
            io.kubernetes.pod.namespace: headlamp
        - matchLabels:
            io.kubernetes.pod.namespace: local-path-storage
        - matchLabels:
            io.kubernetes.pod.namespace: reloader
        - matchLabels:
            io.kubernetes.pod.namespace: traefik-internal
        - matchLabels:
            io.kubernetes.pod.namespace: traefik-public
        - matchLabels:
            io.kubernetes.pod.namespace: whoami
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: monitoring
  # Kurz
  releaseName: kube-prometheus-stack
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "91.4.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    # Die Operator-CRDs liegen in einem echten crds/-Verzeichnis, das Helm beim
    # Upgrade ab Werk unberührt lässt
    crds: CreateReplace
    remediation:
      retries: 3
  timeout: 20m
  values:
    prometheus:
      enabled: true
      prometheusSpec:
        retention: 30d
        # Die wichtigere Grenze: `local-path` erzwingt die PVC-Größe nicht.
        retentionSize: 18GiB

        # Ab Werk `true` - dann beachtet Prometheus nur Objekte mit dem
        # Release-Label dieses Charts und ignoriert fremde stillschweigend.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false

        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  # `local-path`
                  storage: 20Gi

        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 2Gi

    alertmanager:
      enabled: true
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi

    prometheusOperator:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 192Mi
      admissionWebhooks:
        enabled: true
        # Beim Install `Ignore`, danach `Fail`
        failurePolicy: IgnoreOnInstallOnly
        # Zertifikate vom vorhandenen cert-manager
        certManager:
          enabled: true
        patch:
          enabled: false

    grafana:
      enabled: true
      defaultDashboardsEnabled: true

      # Secret `grafana-admin` mit `admin-user`/`admin-password`
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password

      persistence:
        enabled: true
        size: 4Gi

      ingress:
        enabled: true
        ingressClassName: internal
        hosts:
          - grafana.k8s.nico-steinmueller.de

      # Prometheus legt die Charts selbst an, Loki nicht.
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
          jsonData:
            derivedFields: []

      # Update-Pruefung, Plugin-Katalog, News, Telemetrie.
      grafana.ini:
        analytics:
          check_for_updates: false
          check_for_plugin_updates: false
          reporting_enabled: false
        news:
          news_feed_enabled: false
        plugins:
          # Deaktiviert das automatische Nachladen der Plugin-Liste von grafana.com.
          preinstall_disabled: true

      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          memory: 768Mi

    # Auf Talos nicht scrapebar
    # etcd steht hinter der Ingress-Firewall, Controller-Manager und Scheduler binden auf
    # 127.0.0.1. kubeProxy muss aktiv aus - Cilium ersetzt ihn, das Chart nimmt ihn aber an.
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false

    # Ungeprüftes HTTPS
    kubelet:
      enabled: true
      serviceMonitor:
        https: true
        insecureSkipVerify: true

    kube-state-metrics:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 192Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 64Mi

    # Enthält `Watchdog` - eine Regel, die immer feuert und damit beweist, dass
    # die Alarmkette lebt.
    defaultRules:
      create: true
