#
# Kyverno - und dafuer gibt es genau eine Regel.
#
# Sie beantwortet die Frage, die seit ingress-public offen ist: Was hindert
# einen privaten Dienst daran, versehentlich oeffentlich zu werden?
#
# Bisher gab es dagegen eine einzige Sperre - die Namespace-Liste in
# ingress-public.yaml. Sie ist gut, aber sie ist eine: Ein Namespace zu viel
# in dieser Liste, und ein interner Dienst haengt am oeffentlichen
# Controller. Mit der Regel muessen es zwei Fehler gleichzeitig sein, der
# Eintrag in der Liste UND das Label am Namespace, und beide stehen in Git
# und sind im Review sichtbar.
#
# Die Regel steht nicht in dieser Datei, sondern in
# k8s/flux/policies/public-ingress.yaml - sie braucht eine CRD, die erst das
# Chart hier mitbringt. Die Begruendung steht bei der Kustomization ganz
# unten.
#
# Deshalb kommt Kyverno vor dem ersten echten oeffentlichen Dienst und nicht
# danach: Heute gibt es genau einen Ingress der Klasse `public` (whoami), an
# dem nichts haengt. Nach Schritt 7 waeren es Immich und Nextcloud, und ein
# Fehlversuch waere dann teuer.
#
# ---------------------------------------------------------------------------
# Nur der Admission-Controller.
#
# Das Chart bringt vier: admission, background, cleanup, reports. Fuer eine
# validierende Regel braucht es den ersten. Die anderen sind abgeschaltet,
# und das ist eine Speicherentscheidung mit Ansage - der Node stand beim
# Einbau bei 76 % Speicher und 73 % Requests, und Schritt 7 will davon noch
# etwas fuer Immich und Nextcloud uebrig lassen (siehe INBETRIEBNAHME.md,
# Abschnitt RAM-Budget).
#
# Was damit fehlt, ehrlich benannt:
#
#   - Keine PolicyReport-Objekte. Ein Verstoss zeigt sich als abgelehnte
#     Anfrage - bei Flux als Fehler in der Kustomization, bei kubectl direkt
#     auf der Konsole. Das ist fuer eine Enforce-Regel der lautere Weg;
#     Reports waeren fuer Audit-Regeln interessant, und die gibt es hier
#     nicht.
#   - Keine erzeugte ValidatingAdmissionPolicy. Kyverno koennte die Regel in
#     eine native VAP uebersetzen, die der API-Server selbst durchsetzt -
#     das macht aber der background-Controller. Ohne ihn laeuft die Regel
#     ueber Kyvernos eigenen Webhook.
#   - Kein generate/mutate-existing und keine CleanupPolicies. Beides wird
#     hier nicht gebraucht; die Reloader-Annotation, die Kyverno frueher
#     cluster-weit setzte, macht Reloader inzwischen selbst (reloader.yaml).
#
# Wer eine dieser Faehigkeiten braucht, schaltet den zugehoerigen Controller
# hier ein - und rechnet vorher nach, was der Node noch hat.
# ---------------------------------------------------------------------------
#
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 1h
  url: https://kyverno.github.io/kyverno

---
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  labels:
    homelab.io/zone: internal
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 10m
  releaseName: kyverno
  targetNamespace: kyverno
  storageNamespace: kyverno
  chart:
    spec:
      chart: kyverno
      version: "3.9.0"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      install: true

    admissionController:
      replicas: 1

      #
      # Enger als die Chart-Vorgabe (100m/384Mi). Ein Cluster mit einer
      # einzigen Regel auf einer Ressourcenart hat wenig zu tun; das Limit
      # bleibt grosszuegig, damit ein CRD-Update beim Start nicht am
      # Speicher scheitert.
      #
      container:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 384Mi

    #
    # Die drei anderen Controller - siehe Kopf der Datei.
    #
    backgroundController:
      enabled: false
    cleanupController:
      enabled: false
    reportsController:
      enabled: false

    #
    # Ohne reports-Controller erzeugt der Admission-Controller Berichte, die
    # niemand einsammelt und niemand aufraeumt. Das ist keine Kosmetik: Die
    # Objekte landen in etcd und wachsen mit jeder Anfrage.
    #
    # `reporting` hat als einziger Block hier kein `enabled`, sondern eine
    # Liste von Regelarten - der Schalter, den man dort erwartet, waere
    # wirkungslos und der gerenderte Container behielte
    # `--enableReporting=validate,mutate,...`. Deshalb jede Art einzeln.
    #
    features:
      admissionReports:
        enabled: false
      aggregateReports:
        enabled: false
      policyReports:
        enabled: false
      validatingAdmissionPolicyReports:
        enabled: false
      reporting:
        validate: false
        mutate: false
        mutateExisting: false
        imageVerify: false
        generate: false
      backgroundScan:
        enabled: false

---
#
# Die Regeln selbst - k8s/flux/policies, eine eigene Kustomization.
#
# Warum getrennt: Die CRD `ValidatingPolicy` kommt aus dem Chart oben. Steht
# eine Regel im selben Verzeichnis, prueft kustomize-controller sie im
# selben Server-Side-Dry-Run wie die HelmRelease - und lehnt sie ab, weil
# der API-Server die Art noch nicht kennt. Da ein gescheiterter Dry-Run die
# ganze Stufe scheitern laesst, kaeme dann auch die HelmRelease nie an, die
# die CRD gebracht haette. Genau das ist beim ersten Einbau passiert: Die
# Wurzel-Kustomization stand rot und wendete fuer *keinen* Dienst mehr etwas
# an.
#
# `dependsOn: flux-system` ordnet, gibt aber keine Garantie: Die
# Wurzel-Kustomization laeuft ohne `wait`, ist also fertig, sobald sie
# angewendet hat - die HelmRelease installiert dann noch. Beim allerersten
# Durchlauf steht diese Kustomization deshalb kurz auf `False` mit derselben
# "no matches for kind"-Meldung. Das ist hier folgenlos und behebt sich
# selbst: `retryInterval` versucht es im Minutentakt erneut, und beim ersten
# Versuch nach dem Start des Admission-Controllers geht es durch. Der
# Unterschied zu vorher ist, dass dieser Zustand nur eine Kustomization
# betrifft und nicht den ganzen Cluster-Sync.
#
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-policies
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: k8s/flux/policies
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: flux-system

