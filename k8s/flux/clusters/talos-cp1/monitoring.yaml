#
# Monitoring - kube-prometheus-stack. Logs stehen in logs.yaml, gleiche
# Namespace, also gilt monitoring-egress von hier fuer beide.
#
# Alertmanager laeuft ohne Route - jeder Alarm endet im `null`-Receiver der
# Chart. Der Weg dahin (ntfy im Cluster, Bruecke, Watchdog nach draussen).
#
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    #
    # `privileged` wegen zweier DaemonSets: node-exporter (hostNetwork,
    # hostPID, hostPath auf /proc, /sys, /) und Alloy (hostPath auf /var/log).
    # hostPath allein lehnt `baseline` schon ab. Erlaubt heisst nicht gesetzt -
    # die Charts setzen ihre eigenen securityContexts.
    #
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
---
# Von aussen erreichbar ist nur Grafana, und nur ueber ingress-internal.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
#
# Prometheus scrapt den eigenen Namespace. `podSelector: {}` unter `from` heisst
# "alle Pods im selben Namespace", nicht "im Cluster" - die Grenze nach aussen
# bleibt stehen.
#
# Jeder Namespace mit eigenem default-deny-ingress (crowdsec, headlamp,
# traefik-*) braucht eine eigene Regel, sobald Prometheus ihn scrapen soll.
#
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-monitoring
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-internal
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
      ports:
        - protocol: TCP
          port: 3000
---
#
# Der Admission-Webhook des Operators, angerufen vom kube-apiserver. Fehlt
# diese Ausnahme, nimmt der Cluster keine PrometheusRule- und
# ServiceMonitor-Objekte mehr an - und die Meldung redet von einem Timeout
# gegen einen Service, der laeuft.
#
# `fromEntities`, weil eine kind: NetworkPolicy es nicht kann: Der
# kube-apiserver ist auf Talos ein Static Pod mit hostNetwork.
#
# 10250 ist hier prometheusOperator.tls.internalPort, nicht das Kubelet.
#
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-operator-webhook
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app: kube-prometheus-stack-operator
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
---
#
# Egress-Default-Deny. Dieser Namespace hat **keinen Weg ins Internet**, fuer
# keinen Pod - Dashboards und Regeln kommen aus der Chart und aus
# grafana-dashboards.yaml.
#
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-egress
  namespace: monitoring
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # Prometheus (Targets), Operator (CRs), kube-state-metrics, Alloy
    # (Pod-Metadaten und Events). `toPorts` ist Pflicht, siehe headlamp.yaml.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

    #
    # Was auf dem Node lauscht, traegt die Identitaet `host` und ist ueber
    # `toEndpoints` nicht erreichbar: 10250 Kubelet, 9100 node-exporter.
    #
    # node-exporter laeuft mit hostNetwork und ist deshalb *kein* Pod-Endpunkt,
    # obwohl er in diesem Namespace steht - die toEndpoints-Regel unten deckt
    # ihn nicht ab.
    #
    # Ports statt `toEntities: [host]` allein: sonst waere auch apid auf 50000
    # offen.
    #
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
            - port: "9100"
              protocol: TCP

    # Eigener Namespace. node-exporter gehoert nicht hierher, siehe `host`.
    - toEndpoints:
        - {}

    #
    # Namespaces mit Scrape-Zielen. Kommt einer dazu, gehoert er hierher - sein
    # Target steht sonst auf DOWN. Ohne Portangabe: Welchen Port ein Exporter
    # hat, entscheidet dessen Chart.
    #
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
        - matchLabels:
            io.kubernetes.pod.namespace: crowdsec
        - matchLabels:
            io.kubernetes.pod.namespace: csi-driver-nfs
        - matchLabels:
            io.kubernetes.pod.namespace: flux-system
        - matchLabels:
            io.kubernetes.pod.namespace: headlamp
        - matchLabels:
            io.kubernetes.pod.namespace: local-path-storage
        - matchLabels:
            io.kubernetes.pod.namespace: reloader
        - matchLabels:
            io.kubernetes.pod.namespace: traefik-internal
        - matchLabels:
            io.kubernetes.pod.namespace: traefik-public
        - matchLabels:
            io.kubernetes.pod.namespace: whoami
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: monitoring
  # Kurz, sonst stellt Flux `<namespace>-<name>` davor und die Objektnamen
  # laufen in die 63-Zeichen-Grenze fuer Labels.
  releaseName: kube-prometheus-stack
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "91.4.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    # Die Operator-CRDs liegen in einem echten crds/-Verzeichnis, Helm laesst
    # die bei einem Upgrade ab Werk unberuehrt. Ohne CreateReplace laeuft der
    # Cluster mit alten CRDs und neuem Operator weiter.
    crds: CreateReplace
    remediation:
      retries: 3
  timeout: 20m
  values:
    prometheus:
      enabled: true
      prometheusSpec:
        retention: 30d
        # Zweite Grenze, und die wichtigere: `local-path` erzwingt die
        # PVC-Groesse nicht. Etwas unter 20Gi, weil Prometheus pro Block prueft.
        retentionSize: 18GiB

        #
        # Ab Werk `true`, und dann beachtet Prometheus nur Objekte mit dem
        # Release-Label dieser Chart. Alles aus fremden Charts wuerde
        # stillschweigend ignoriert - kein Fehler, das Target erscheint einfach
        # nicht. Deshalb ist `serviceMonitor.enabled: true` in reloader.yaml
        # ueberhaupt erst wirksam.
        #
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false

        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  # Ohne storageClassName, also `local-path` - die vDisk fuer
                  # alles mit fsync (README.md, Abschnitt Speicher).
                  storage: 20Gi

        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 2Gi

    alertmanager:
      enabled: true
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi

    prometheusOperator:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 192Mi
      admissionWebhooks:
        enabled: true
        #
        # Beim Install `Ignore`, danach `Fail`. Noetig, weil Helm die
        # PrometheusRules im selben Durchlauf anwendet wie das
        # Operator-Deployment und nicht auf dessen Readiness wartet - der
        # Webhook antwortet dann noch nicht.
        #
        failurePolicy: IgnoreOnInstallOnly
        # Zertifikate vom vorhandenen cert-manager
        certManager:
          enabled: true
        patch:
          enabled: false

    grafana:
      enabled: true
      defaultDashboardsEnabled: true

      # Secret `grafana-admin` mit `admin-user`/`admin-password` muss in
      # homelab-secrets liegen, sonst startet der Pod nicht.
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password

      persistence:
        enabled: true
        size: 4Gi

      ingress:
        enabled: true
        ingressClassName: internal
        hosts:
          - grafana.k8s.nico-steinmueller.de

      # Prometheus legt die Chart selbst an, Loki nicht. Beides sind
      # Core-Datasources - kein Plugin, kein eigenes Image.
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
          jsonData:
            derivedFields: []

      # Update-Pruefung, Plugin-Katalog, News, Telemetrie.
      grafana.ini:
        analytics:
          check_for_updates: false
          check_for_plugin_updates: false
          reporting_enabled: false
        news:
          news_feed_enabled: false

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 384Mi

    #
    # Auf Talos nicht scrapebar, waeren also dauerhaft rote Targets: etcd
    # lauscht auf 2379 mit Client-Zertifikaten und die Ingress-Firewall haelt
    # den Port zu (vm/talos/patches/firewall.yaml.tftpl), Controller-Manager
    # und Scheduler bindet Talos auf 127.0.0.1. Fuer die letzten beiden gaebe
    # es einen Machine-Config-Patch auf --bind-address - das gehoert dann nach
    # vm/talos.
    #
    # kubeProxy muss hier *aktiv* aus: Cilium ersetzt ihn, die Chart nimmt ihn
    # aber an.
    #
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false

    # Ungeprueftes HTTPS, dieselbe Luecke wie beim metrics-server und mit
    # demselben Grund: kein kubelet-csr-approver, also kein pruefbares
    # Serverzertifikat. Offener Punkt in k8s/CHECKLISTE.md, Abschnitt F.
    kubelet:
      enabled: true
      serviceMonitor:
        https: true
        insecureSkipVerify: true

    kube-state-metrics:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 192Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 64Mi

    # Enthaelt `Watchdog` - eine Regel, die immer feuert. Sie meldet keinen
    # Fehler, sie beweist, dass die Alarmkette lebt. Siehe uptime-kuma/todo.md.
    defaultRules:
      create: true
