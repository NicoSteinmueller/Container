#
# Reloader - startet neu, was ein geändertes Secret benutzt.
#
# Der Grund: Ein `secretKeyRef` in `env` wird genau einmal aufgelöst, beim
# Start des Pods. Rotiert ein Passwort in homelab-secrets, schreibt Flux das
# Secret neu - der laufende Prozess arbeitet aber bis zu seinem nächsten Start
# mit dem alten Wert weiter. Bei gemounteten Secret-Volumes aktualisiert das
# kubelet zwar die Datei, aber kaum eine Anwendung liest sie erneut.
#
# Der übliche Helm-Trick dagegen greift hier nicht: Charts hängen eine
# Prüfsumme ihres *eigenen* Secrets ins Pod-Template. Unsere Secrets kommen aus
# einem anderen Repo und werden nur referenziert - das Pod-Template bleibt
# byte-gleich, und Kubernetes hat keinen Anlass, irgendetwas zu tun.
#
# Reloader schließt genau diese Lücke: Er beobachtet Secrets und ConfigMaps und
# schreibt bei Änderung eine Annotation ins Pod-Template der Konsumenten. Das
# ist eine echte Änderung am Deployment und läuft damit als gewöhnlicher
# Rolling Update - mit den Probes und der Update-Strategie des Dienstes, und
# mit Rollback, wenn er nicht hochkommt.
#
# Wen er dabei anfasst, ist eine Einstellung - und die hat hier ihren Besitzer
# gewechselt. Reloader fasst von Haus aus nur Workloads mit der Annotation
# reloader.stakater.com/auto an; gesetzt hat sie früher Kyverno cluster-weit,
# mit den Plattform-Namespaces als Ausnahme. Kyverno ist mit dem
# Plattform-Stack entfernt worden, und damit trug die Annotation kein Workload
# mehr: Reloader lief, beobachtete und tat nichts.
#
# Jetzt macht Reloader das selbst - autoReloadAll mit ignoreNamespaces unten.
# Das ist dieselbe Regel wie vorher, nur ohne den Umweg: alles gilt als
# annotiert, bis auf eine benannte Liste. Der Unterschied ist, dass die Regel
# nicht mehr von einem zweiten Controller abhängt, den man dafür betreiben,
# aktualisieren und beim Wiederaufbau in der richtigen Reihenfolge hochziehen
# müsste.
#
# Wenn Kyverno zurückkommt, ist das kein Grund, das hier zurückzudrehen.
#
# Was Reloader *nicht* tut: das Passwort auf der Gegenseite ändern. Ein
# rotiertes Postgres-Passwort im Secret startet Nextcloud neu, und Nextcloud
# kommt dann nicht mehr an die Datenbank, weil dort noch das alte gilt. Diese
# Hälfte gehört einem Operator, der beide Seiten besitzt - siehe
# k8s/AUSBAUSTUFEN.md, CloudNativePG.
#

apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: stakater
  namespace: flux-system
spec:
  interval: 1h
  url: https://stakater.github.io/stakater-charts
---
apiVersion: v1
kind: Namespace
metadata:
  name: reloader
  labels:
    #
    # Der Controller braucht weder Privilegien noch Host-Zugriff - er spricht
    # ausschließlich mit der API. "restricted" ist deshalb kein Zugeständnis,
    # sondern der Normalfall.
    #
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 10m
  releaseName: reloader
  targetNamespace: reloader
  storageNamespace: reloader
  chart:
    spec:
      chart: reloader
      version: "2.2.16"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    reloader:
      #
      # Cluster-weit, nicht auf eine Namespace-Liste beschränkt: Eine Liste
      # müsste bei jedem neuen Dienst nachgezogen werden, und das Vergessen
      # fällt nicht auf - der Dienst läuft ja, nur eben mit dem alten Passwort.
      #
      # Der Preis steht im Klartext hier, damit er nicht untergeht: Reloader
      # bekommt damit get/list/watch auf Secrets in allen Namespaces. Ein
      # weiterer Leser aller Geheimnisse des Clusters, neben
      # kustomize-controller. Er wertet sie nicht aus - er vergleicht Hashes -
      # aber die Berechtigung ist dieselbe.
      #
      watchGlobally: true

      #
      # Jeder Workload gilt als annotiert. Das ist die Voreinstellung, die zu
      # einem Cluster passt, dessen Dienste ihre Geheimnisse aus einem
      # gemeinsamen Repo beziehen: Ein neuer Dienst ist von sich aus dabei,
      # ohne dass jemand daran denken muss.
      #
      # Die Richtung des Vergessens ist der Grund. Andersherum - Annotation je
      # Workload - läuft ein vergessener Dienst nach einer Rotation still mit
      # dem alten Passwort weiter, und niemand merkt es, denn er läuft ja. So
      # herum bedeutet ein vergessener Eintrag unten einen Neustart, der nicht
      # hätte sein sollen. Der fällt auf.
      #
      autoReloadAll: true

      #
      # Die Ausnahmen dazu - die Liste, die vorher in der Kyverno-Regel stand.
      #
      # kube-system: Dort liegt Cilium, und dessen Konfiguration kommt als
      #   Inline-Manifest aus der Machine-Config von Talos (siehe
      #   vm/talos/README.md). Ein Neustart des Agents auf Zuruf eines anderen
      #   Controllers wäre ein zweiter Schreiber auf demselben Datapath - und
      #   trifft ausgerechnet die Komponente, über die jeder Pod im Cluster
      #   spricht.
      # flux-system: Die Controller halten die Geheimnisse, aus denen die
      #   anderen Secrets überhaupt entstehen (sops-age, die Git-Zugänge).
      #   kustomize-controller schreibt ein Secret, Reloader startet daraufhin
      #   kustomize-controller neu - das ist eine Rückkopplung, kein Nutzen.
      # reloader: Er würde sich selbst neu starten.
      #
      # Was hier fehlt und dazugehört, sobald es wieder existiert: die
      # Namespaces des Plattform-Stacks (step-ca, cert-manager, traefik-*).
      # Die drehen ihre Zertifikate im eigenen Takt und werden von einem
      # Neustart nur gestört.
      #
      ignoreNamespaces: "kube-system,flux-system,reloader"

      #
      # Wie die Änderung ins Pod-Template kommt, nicht *ob*. Die Voreinstellung
      # "default" hängt dem Container eine Umgebungsvariable
      # STAKATER_<NAME>_SECRET an - das verändert die Container-Spezifikation
      # eines fremden Charts. "annotations" schreibt stattdessen eine
      # Annotation ins Pod-Template: derselbe Effekt (das Template ändert sich,
      # Kubernetes rollt neu aus), ohne in die Container hineinzufassen.
      #
      reloadStrategy: annotations

      deployment:
        # Nichts zu tun, solange kein Secret sich ändert.
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi

        #
        # Der Pod-Teil (runAsNonRoot, runAsUser 65534, seccompProfile) steht
        # schon so in den Chart-Defaults. Was fehlt, ist der Container-Teil -
        # und der ist ein eigener Wert: allowPrivilegeEscalation, capabilities
        # und readOnlyRootFilesystem gibt es im PodSecurityContext gar nicht,
        # dort eingetragen lehnte die API sie ab.
        #
        containerSecurityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

      # Braucht kein ServiceMonitor - es gibt keinen Prometheus in diesem
      # Cluster. Kommt einer, gehört hier serviceMonitor.enabled: true hin.
      serviceMonitor:
        enabled: false
