#
# Reloader - startet neu, was ein geändertes Secret benutzt.
#
# Der Grund: Ein `secretKeyRef` in `env` wird genau einmal aufgelöst, beim
# Start des Pods. Rotiert ein Passwort in homelab-secrets, schreibt Flux das
# Secret neu - der laufende Prozess arbeitet aber bis zu seinem nächsten Start
# mit dem alten Wert weiter. Bei gemounteten Secret-Volumes aktualisiert das
# kubelet zwar die Datei, aber kaum eine Anwendung liest sie erneut.
#
# Der übliche Helm-Trick dagegen greift hier nicht: Charts hängen eine
# Prüfsumme ihres *eigenen* Secrets ins Pod-Template. Unsere Secrets kommen aus
# einem anderen Repo und werden nur referenziert - das Pod-Template bleibt
# byte-gleich, und Kubernetes hat keinen Anlass, irgendetwas zu tun.
#
# Reloader schließt genau diese Lücke: Er beobachtet Secrets und ConfigMaps und
# schreibt bei Änderung eine Annotation ins Pod-Template der Konsumenten. Das
# ist eine echte Änderung am Deployment und läuft damit als gewöhnlicher
# Rolling Update - mit den Probes und der Update-Strategie des Dienstes, und
# mit Rollback, wenn er nicht hochkommt.
#
# Wen er dabei anfasst, ist eine Einstellung - und die hat hier ihren Besitzer
# gewechselt. Reloader fasst von Haus aus nur Workloads mit der Annotation
# reloader.stakater.com/auto an; gesetzt hat sie früher Kyverno cluster-weit,
# mit den Plattform-Namespaces als Ausnahme. Kyverno ist mit dem
# Plattform-Stack entfernt worden, und damit trug die Annotation kein Workload
# mehr: Reloader lief, beobachtete und tat nichts.
#
# Jetzt macht Reloader das selbst - autoReloadAll unten. Alles im Blickfeld
# gilt als annotiert, ohne den Umweg über einen zweiten Controller, den man
# dafür betreiben, aktualisieren und beim Wiederaufbau in der richtigen
# Reihenfolge hochziehen müsste.
#
# Wenn Kyverno zurückkommt, ist das kein Grund, das hier zurückzudrehen.
#
# Was sich seither geändert hat: Das Blickfeld ist eine Namespace-Liste
# geworden statt des ganzen Clusters (namespaces unten). Der Grund steht
# dort - kurz: Reloader darf Workloads patchen, und diese Berechtigung
# gehört nicht in jeden Namespace, nur weil sie in dreien gebraucht wird.
#
# Was Reloader *nicht* tut: das Passwort auf der Gegenseite ändern. Ein
# rotiertes Postgres-Passwort im Secret startet Nextcloud neu, und Nextcloud
# kommt dann nicht mehr an die Datenbank, weil dort noch das alte gilt. Diese
# Hälfte gehört einem Operator, der beide Seiten besitzt - siehe
# k8s/AUSBAUSTUFEN.md, CloudNativePG.
#

apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: stakater
  namespace: flux-system
spec:
  interval: 1h
  url: https://stakater.github.io/stakater-charts
---
apiVersion: v1
kind: Namespace
metadata:
  name: reloader
  labels:
    #
    # Der Controller braucht weder Privilegien noch Host-Zugriff - er spricht
    # ausschließlich mit der API. "restricted" ist deshalb kein Zugeständnis,
    # sondern der Normalfall.
    #
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 10m
  releaseName: reloader
  targetNamespace: reloader
  storageNamespace: reloader
  chart:
    spec:
      chart: reloader
      version: "2.2.16"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    reloader:
      #
      # Scoped Mode: watchGlobally aus, dafür die Namespaces einzeln. Das
      # Chart legt dann Role und RoleBinding je genanntem Namespace an und
      # gar keine ClusterRole - der Release-Namespace kommt automatisch dazu.
      #
      # Hier stand einmal watchGlobally: true, mit einer Begründung, die noch
      # gilt: Eine Liste muss bei jedem neuen Dienst nachgezogen werden, und
      # das Vergessen fällt nicht auf - der Dienst läuft ja, nur eben mit dem
      # alten Passwort. Diese Richtung des Vergessens ist der Preis dieser
      # Zeile, und sie ist der Grund, warum die Liste direkt neben den
      # Dienstdateien im selben Verzeichnis steht: Wer hier einen Namespace
      # anlegt, kommt an dieser Datei nicht vorbei.
      #
      # Dagegen stand, was cluster-weit tatsächlich verteilt wurde. Nicht nur
      # get/list/watch auf alle Secrets - das allein wäre der beschriebene
      # Preis gewesen, ein weiterer Leser neben kustomize-controller. Dazu
      # kam update/patch auf Deployments, DaemonSets und StatefulSets in
      # *jedem* Namespace, kube-system eingeschlossen. Damit ist der Weg vom
      # übernommenen Reloader-Pod zu einem privilegierten Container auf dem
      # Node zwei Schritte lang, und auf einem Ein-Node-Cluster ist der Node
      # der ganze Cluster. ignoreNamespaces hat das nie verhindert: Es filtert
      # im Programm, nicht im RBAC.
      #
      # Ein vergessener Eintrag kostet ein veraltetes Passwort, das beim
      # nächsten Neustart von selbst verschwindet. Die Berechtigung kostete
      # im Ernstfall den Cluster. Deshalb so herum.
      #
      watchGlobally: false

      #
      # Die Namespaces, in denen ein Secret aus homelab-secrets von einem
      # laufenden Prozess gehalten wird - und nur die:
      #
      # crowdsec:         crowdsec-bouncer-key als BOUNCER_KEY_traefik_public
      #                   in env, einmal beim Start gelesen.
      # traefik-internal: traefik-ionos in env (IONOS_API_KEY).
      # traefik-public:   traefik-ionos in env, dazu crowdsec-bouncer-key als
      #                   Datei unter /crowdsec - das Plugin liest sie beim
      #                   Start, nicht bei jeder Anfrage.
      #
      # Nicht dabei und mit Absicht: headlamp und whoami halten kein Secret;
      # csi-driver-nfs und local-path-storage auch nicht. kube-system und
      # flux-system standen vorher in ignoreNamespaces und sind jetzt schlicht
      # außerhalb des Blickfelds - dieselbe Wirkung, eine Zeile weniger. Die
      # Begründungen dafür sind es wert, aufgehoben zu werden:
      #
      #   kube-system  - dort liegt Cilium, dessen Konfiguration als
      #     Inline-Manifest aus der Machine-Config kommt (vm/talos/README.md).
      #     Ein Neustart des Agents auf Zuruf wäre ein zweiter Schreiber auf
      #     demselben Datapath, und zwar auf der Komponente, über die jeder
      #     Pod im Cluster spricht.
      #   flux-system  - die Controller halten die Geheimnisse, aus denen die
      #     anderen Secrets erst entstehen (sops-age, die Git-Zugänge).
      #     kustomize-controller schreibt ein Secret, Reloader startet
      #     daraufhin kustomize-controller neu: eine Rückkopplung, kein Nutzen.
      #   reloader     - er würde sich selbst neu starten. Der Release-
      #     Namespace lässt sich im Scoped Mode nicht ausschließen, das Chart
      #     nimmt ihn immer mit. Hier ist das folgenlos: Es läuft nur Reloader
      #     selbst darin, und er hält kein Secret, das sich ändert.
      #
      namespaces:
        - crowdsec
        - traefik-internal
        - traefik-public

      #
      # Innerhalb der Namespaces oben gilt jeder Workload als annotiert -
      # niemand muss je Dienst daran denken.
      #
      # Die Richtung des Vergessens ist der Grund. Andersherum - Annotation je
      # Workload - läuft ein vergessener Dienst nach einer Rotation still mit
      # dem alten Passwort weiter, und niemand merkt es, denn er läuft ja. So
      # herum bedeutet ein überflüssiger Workload im Blickfeld einen Neustart,
      # der nicht hätte sein müssen. Der fällt auf.
      #
      # Die Grenze ist damit der Namespace und nicht die Annotation. Genau
      # deshalb ist die Liste oben so kurz gehalten: Sie ist jetzt beides -
      # Blickfeld und Berechtigung.
      #
      # ignoreNamespaces stand hier einmal darunter und ist weg. Nicht nur,
      # weil die Ausnahmen jetzt schon durch die Liste oben fallen: Das Chart
      # setzt --namespaces-to-ignore ausschließlich bei watchGlobally: true.
      # Der Wert wäre stehengeblieben und hätte nichts mehr getan.
      #
      autoReloadAll: true

      #
      # Wie die Änderung ins Pod-Template kommt, nicht *ob*. Die Voreinstellung
      # "default" hängt dem Container eine Umgebungsvariable
      # STAKATER_<NAME>_SECRET an - das verändert die Container-Spezifikation
      # eines fremden Charts. "annotations" schreibt stattdessen eine
      # Annotation ins Pod-Template: derselbe Effekt (das Template ändert sich,
      # Kubernetes rollt neu aus), ohne in die Container hineinzufassen.
      #
      reloadStrategy: annotations

      deployment:
        # Nichts zu tun, solange kein Secret sich ändert.
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi

        #
        # Der Pod-Teil (runAsNonRoot, runAsUser 65534, seccompProfile) steht
        # schon so in den Chart-Defaults. Was fehlt, ist der Container-Teil -
        # und der ist ein eigener Wert: allowPrivilegeEscalation, capabilities
        # und readOnlyRootFilesystem gibt es im PodSecurityContext gar nicht,
        # dort eingetragen lehnte die API sie ab.
        #
        containerSecurityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

      # Braucht kein ServiceMonitor - es gibt keinen Prometheus in diesem
      # Cluster. Kommt einer, gehört hier serviceMonitor.enabled: true hin.
      serviceMonitor:
        enabled: false
