#
# Die Flux-Statusseite hinter ingress-internal.
#
# Jetzt also der regulaere Weg: eine Adresse, TLS, eine Zugangsregel.
#
# Warum der Ingress in flux-system liegen muss und nicht in traefik-internal:
# Ein Ingress erreicht nur Services im eigenen Namespace. Und weil die
# Middleware-Annotation beim kubernetesIngress-Provider ueber Namespaces
# hinweg `crossProviderNamespaces` braucht (aus, und das soll so bleiben),
# muss auch die Middleware hierher.
#
# Damit steht die eigentliche Frage dieser Datei: Was darf Traefik in
# flux-system? Hier liegen `sops-age` und `flux-git-auth` - der Schluessel,
# aus dem sich jedes andere Geheimnis ergibt, und der Zugang zum Repo, aus
# dem der Cluster gebaut wird. Die Antwort ist: keine Secrets. Wie das geht,
# steht bei `traefik-internal-namespaced-nosecrets` in ingress-internal.yaml.
# Die beiden Objekte hier sind so gebaut, dass es aufgeht:
#
#   - kein `tls`-Block am Ingress; das Wildcard *.k8s.nico-steinmueller.de
#     haengt am Entrypoint, wie bei whoami und headlamp
#   - eine ipAllowList statt BasicAuth; die traegt ihre Adressen inline und
#     liest kein Secret
#
# Der Preis dieser Wahl steht offen im Raum: Das ist Zugangsbeschraenkung,
# keine Authentisierung. Wer eine der Adressen unten uebernimmt oder faelscht,
# sieht den GitOps-Zustand. Die Seite zeigt weder Secrets noch ConfigMaps,
# und gegenueber dem NodePort davor - offen fuer ganz RFC 1918, ohne TLS,
# ohne Namen - ist es in jeder Hinsicht enger.
#
# Soll daraus ein echtes Passwort werden, ist der Weg vorgezeichnet: eine
# BasicAuth-Middleware mit `users:` inline statt `secret:`, das Manifest
# SOPS-verschluesselt in homelab-secrets. Dann bleibt die Rolle secretfrei,
# und die Chain unten bekommt ein zweites Glied.
#
---
#
# Wer durchdarf. Dieselben Adressen wie `admin_sources` in
# vm/talos/terraform.tfvars, also die Rechner, von denen aus verwaltet wird.
#
# Bewusst nicht das ganze 192.168.178.0/24: Das waere die Reichweite, die der
# NodePort hatte, und dann haette der Umzug nur TLS gebracht.
#
# Die Adressen stehen hier im Klartext und nicht in den tfvars, weil diese
# Datei von Flux kommt und nicht von Terraform. Wer `admin_sources` aendert,
# aendert das hier mit - eine Kopie, die sich nicht von selbst nachzieht.
#
# Traefik sieht die echte Client-Adresse, und das haengt an zwei Dingen
# weiter oben: `externalTrafficPolicy: Local` am Service (ohne SNAT bliebe
# nur die Node-Adresse uebrig, und die Liste liesse jeden durch) und
# `forwardedHeaders.trustedIPs: []` (kein X-Forwarded-For wird geglaubt).
# Wer eines von beiden aendert, macht diese Middleware wirkungslos.
#
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: flux-web-ipallow
  namespace: flux-system
spec:
  ipAllowList:
    sourceRange:
      - 192.168.178.21/32
      - 192.168.178.3/32
      - 192.168.178.202/32

---
#
# Der Ingress.
#
# Kein `tls`-Block - siehe oben. Die Middleware wird mit dem eigenen
# Namespace davor referenziert (`flux-system-...@kubernetescrd`); das ist
# das Format, das Traefik erwartet, auch wenn die Middleware im selben
# Namespace liegt.
#
# Der Name muss im Heimnetz auf 192.168.178.231 zeigen (AdGuard oder
# Fritzbox) - im oeffentlichen DNS hat er nichts verloren. Gegenprobe:
#
#   dig +short flux.k8s.nico-steinmueller.de @192.168.178.1
#
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flux-web
  namespace: flux-system
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: flux-system-flux-web-ipallow@kubernetescrd
spec:
  ingressClassName: internal
  rules:
    - host: flux.k8s.nico-steinmueller.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flux-operator
                port:
                  name: http-web
