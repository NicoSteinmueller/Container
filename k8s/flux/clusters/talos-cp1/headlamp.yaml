#
# Headlamp - Cluster-Dashboard für den Node aus vm/talos-simple.
#
# Anders als whoami.yaml ist der Chart hier kein lokaler im selben Repo,
# sondern kommt aus einem fremden Helm-Repository - deshalb die zusätzliche
# HelmRepository-Quelle weiter unten, statt sourceRef auf die GitRepository
# flux-system zu setzen.
#
# Warum Headlamp und nicht das Kubernetes-Dashboard oder Rancher: siehe
# k8s/flux/clusters/talos-cp1/README.md.
#
# Namespace und RBAC stehen hier als eigene Manifeste und nicht im Chart,
# aus demselben Grund wie zuvor im Terraform-Modul k8s/dashboard:
#
#   - Das Chart legt den Namespace ohne PodSecurity-Label an - "restricted"
#     kommt deshalb von hier.
#   - Das Chart bindet seinen ServiceAccount ab Werk an cluster-admin
#     (clusterRoleBinding.clusterRoleName: cluster-admin). Diese Voreinstellung
#     wird unten mit clusterRoleBinding.create: false abgeschaltet und durch
#     eine engere Aufteilung ersetzt:
#
#       headlamp        - Identität des Pods und des Lese-Tokens. Darf lesen,
#                         nichts ändern, kommt an keine Secrets.
#       headlamp-admin  - ein ServiceAccount ohne Pod und ohne Token. Wer
#                         ändern will, erzeugt sich eines für eine Stunde.
#

apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Spricht als dieser ServiceAccount mit der API - braucht das Token im Pod,
# anders als headlamp-admin unten.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: headlamp
automountServiceAccountToken: true
---
# Erste Hälfte der Leserechte: die eingebaute Rolle `view`. Deckt ab, was in
# Namespaces liegt (Pods, Deployments, Services, ConfigMaps, Events, Logs) -
# ausdrücklich ohne Secrets. Deshalb `view` und nicht eine eigene "alles
# lesen"-Rolle, in der die Secrets-Ausnahme beim Zusammenschreiben leicht
# verloren geht.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
---
# Zweite Hälfte: was `view` nicht kennt. `view` ist auf Objekte in
# Namespaces zugeschnitten - Nodes, PersistentVolumes, StorageClasses, CRDs
# fehlen darin. Ohne diese Rolle startet das Dashboard, zeigt aber auf der
# Übersichtsseite überall "Forbidden", und die Node-Ansicht bleibt leer.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-cluster-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  # Auslastung - wirkungslos ohne metrics-server (metrics-server.yaml),
  # nicht falsch.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments", "csidrivers", "csinodes", "csistoragecapacities"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
  # Die CRD-Objekte selbst, nicht deren Inhalte. Eine Wildcard über alle
  # apiGroups wäre kürzer und würde jede künftige CRD einschließen - auch
  # eine, die Zugangsdaten im Klartext in ihrer Spec trägt.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
  # Lesen allein erlaubt keine Ausweitung - ohne `escalate`/`bind` kann dieser
  # ServiceAccount keine Rolle vergeben, auch keine, die er sieht.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  # Damit die Oberfläche beim Anmelden abfragen kann, was sie anzeigen darf,
  # statt jede Ansicht in einen Fehler laufen zu lassen.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews", "selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-cluster-read
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
---
# Der Weg zum Schreibzugriff, wenn er gebraucht wird. Kein Pod verwendet
# diesen ServiceAccount und kein Secret trägt ein Token dafür - im
# Ruhezustand ist er damit nicht benutzbar. Ein Token entsteht erst durch
# einen ausdrücklichen Aufruf der TokenRequest-API:
#
#   kubectl -n headlamp create token headlamp-admin --duration=1h
#
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: headlamp
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: headlamp
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/headlamp/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 10m
  releaseName: headlamp
  targetNamespace: headlamp
  storageNamespace: headlamp
  chart:
    spec:
      chart: headlamp
      version: "0.44.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    #
    # Wie sich hier jemand anmeldet - und warum das die eigentliche
    # Entscheidung ist:
    #
    # Headlamp fragt beim Aufruf nach einem Token und spricht anschließend
    # mit genau der Identität mit der API, zu der dieses Token gehört. Nicht
    # mit der des Pods. Was jemand sieht und ändern darf, richtet sich also
    # nach RBAC des angemeldeten ServiceAccounts, nicht danach, wer die
    # Adresse aufrufen kann.
    #
    #   Lesen:    kubectl -n headlamp create token headlamp --duration=8h
    #   Ändern:   kubectl -n headlamp create token headlamp-admin --duration=1h
    #
    # unsafeUseServiceAccountToken bleibt false: würde jeden Aufrufer als der
    # ServiceAccount des Pods anmelden - dann wäre die Netzgrenze die
    # einzige Kontrolle, und die ist in diesem Aufbau das Heimnetz.
    #
    config:
      inCluster: true
      inClusterContextName: talos-cp1
      unsafeUseServiceAccountToken: false
      sessionTTL: 28800

      oidc:
        # Das Chart legt sonst ein leeres Secret namens "oidc" an, das kein
        # Container einbindet. Wenn hier später Keycloak angebunden wird,
        # kommt es zurück - dann aber mit Inhalt.
        secret:
          create: false

    # ServiceAccount und Rechte kommen von den Manifesten oben, nicht von
    # diesem Chart - dessen Voreinstellung ist cluster-admin, siehe Kopf
    # dieser Datei.
    serviceAccount:
      create: false
      name: headlamp

    clusterRoleBinding:
      create: false

    # PodSecurity "restricted" im Namespace headlamp. Das Chart setzt von
    # sich aus nur runAsNonRoot und runAsUser; der Rest steht hier, weil
    # "restricted" das Anlegen sonst ablehnt.
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      runAsNonRoot: true
      runAsUser: 100
      runAsGroup: 101
      privileged: false
      allowPrivilegeEscalation: false
      # Das Chart hängt dafür selbst ein leeres Volume auf /tmp ein.
      readOnlyRootFilesystem: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL

    # Erreichbar aus dem gesamten Heimnetz ohne kubectl - das Token geht
    # dabei als unverschlüsseltes HTTP übers LAN, eine bewusste Entscheidung
    # (siehe README). Kein Ingress: dieser Cluster hat weder Controller noch
    # cert-manager.
    service:
      type: NodePort
      port: 80
      nodePort: 30080

    ingress:
      enabled: false

    # Knapp bemessen, weil der RAM auf diesem Node die knappe Größe ist.
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 192Mi
