#
# Headlamp - Cluster-Dashboard. Fremder Chart, deshalb eine eigene
# HelmRepository weiter unten statt der GitRepository flux-system.
#
# Namespace und RBAC stehen hier als eigene Manifeste, weil das Chart den
# Namespace ohne PodSecurity-Label anlegt und seinen ServiceAccount ab Werk an
# cluster-admin bindet. Stattdessen (clusterRoleBinding.create: false):
#
#   headlamp        - Identität des Pods und des Lese-Tokens. Kein Schreiben,
#                     keine Secrets.
#   headlamp-admin  - ServiceAccount ohne Pod und ohne Token. Wer ändern will,
#                     erzeugt sich eines für eine Stunde.
#

apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
  labels:
    #
    # Die Zone ist hier eine Eigenschaft, keine Einstellung: An diesem
    # Namespace haengt ein ClusterRoleBinding, das clusterweit lesen darf.
    # Ein Dashboard mit Cluster-Lesezugriff hinter dem Ingress, der aus dem
    # Internet erreichbar ist, waere genau der Fall, den die Trennung
    # verhindern soll.
    #
    # Ausgewertet wird das Label noch von niemandem - der Waechter dazu war
    # Kyverno, und der kam mit dem Plattform-Stack weg. Bis er zurueck ist,
    # ist es eine Markierung, keine Kontrolle. Die tatsaechliche Grenze zieht
    # unten die NetworkPolicy.
    #
    homelab.io/zone: internal
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Spricht als dieser ServiceAccount mit der API - braucht das Token im Pod,
# anders als headlamp-admin unten.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: headlamp
automountServiceAccountToken: true
---
# Erste Hälfte der Leserechte: die eingebaute Rolle `view` - alles in
# Namespaces, ausdrücklich ohne Secrets. Eine selbstgeschriebene "alles
# lesen"-Rolle verliert diese Ausnahme leicht.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
---
# Zweite Hälfte: was `view` nicht kennt - Nodes, PersistentVolumes,
# StorageClasses, CRDs. Ohne sie zeigt die Übersicht überall "Forbidden".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-cluster-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  # Auslastung - wirkungslos ohne metrics-server (metrics-server.yaml),
  # nicht falsch.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments", "csidrivers", "csinodes", "csistoragecapacities"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
  # Die CRD-Objekte selbst, nicht deren Inhalte - eine Wildcard schlösse
  # jede künftige CRD ein, auch eine mit Zugangsdaten in der Spec.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
  # Lesen allein erlaubt keine Ausweitung - ohne `escalate`/`bind` kann dieser
  # ServiceAccount keine Rolle vergeben, auch keine, die er sieht.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  # Damit die Oberfläche beim Anmelden abfragen kann, was sie zeigen darf.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews", "selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-cluster-read
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
---
# Schreibzugriff auf Abruf: kein Pod nutzt diesen ServiceAccount, kein Secret
# trägt ein Token. Eines entsteht erst per TokenRequest-API:
#
#   kubectl -n headlamp create token headlamp-admin --duration=1h
#
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: headlamp
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: headlamp
---
#
# Eingehend nur von ingress-internal - also nur, was aus dem Heimnetz durch
# den LAN-Controller kommt.
#
# Ohne diese Regel waere die Weboberflaeche fuer jeden Pod im Cluster ueber
# die Pod-Adresse erreichbar. Bei einem Dashboard mit clusterweitem
# Lesezugriff ist das ein anderer Umstand als bei einer gewoehnlichen
# Anwendung: Wer es erreicht, sieht sonst jeden Namespace, jedes Deployment
# und jedes Event - ohne dazu das LAN betreten zu haben.
#
# Der Port ist der des Containers (4466), nicht der des Service (80):
# NetworkPolicies wirken auf der Pod-Ebene, die Umsetzung des Service-Ports
# ist zu diesem Zeitpunkt schon passiert.
#
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: headlamp
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-internal
  namespace: headlamp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
      ports:
        - protocol: TCP
          port: 4466

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/headlamp/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 10m
  releaseName: headlamp
  targetNamespace: headlamp
  storageNamespace: headlamp
  chart:
    spec:
      chart: headlamp
      version: "0.44.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    #
    # Headlamp spricht mit der API als die Identität des beim Aufruf
    # eingegebenen Tokens, nicht als die des Pods - RBAC des angemeldeten
    # ServiceAccounts entscheidet, nicht wer die Adresse erreicht.
    #
    #   Lesen:    kubectl -n headlamp create token headlamp --duration=8h
    #   Ändern:   kubectl -n headlamp create token headlamp-admin --duration=1h
    #
    # unsafeUseServiceAccountToken bleibt false: sonst wäre jeder Aufrufer der
    # ServiceAccount des Pods und die Netzgrenze die einzige Kontrolle.
    #
    config:
      inCluster: true
      inClusterContextName: talos-cp1
      unsafeUseServiceAccountToken: false
      sessionTTL: 28800

      oidc:
        # Das Chart legt sonst ein leeres Secret "oidc" an, das niemand
        # einbindet. Kommt zurück, wenn hier Keycloak angebunden wird.
        secret:
          create: false

    # ServiceAccount und Rechte von den Manifesten oben - die Voreinstellung
    # des Charts ist cluster-admin, siehe Kopf dieser Datei.
    serviceAccount:
      create: false
      name: headlamp

    clusterRoleBinding:
      create: false

    # Für PodSecurity "restricted": Das Chart setzt nur runAsNonRoot und
    # runAsUser, der Rest steht hier - sonst lehnt der Namespace den Pod ab.
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      runAsNonRoot: true
      runAsUser: 100
      runAsGroup: 101
      privileged: false
      allowPrivilegeEscalation: false
      # Das Chart hängt dafür selbst ein leeres Volume auf /tmp ein.
      readOnlyRootFilesystem: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL

    # ClusterIP statt NodePort: Erreichbar ist das Dashboard jetzt über
    # ingress-internal unter seinem Hostnamen, nicht mehr über
    # http://<node-ip>:30080. Damit ist der Weg dorthin verschlüsselt - und
    # das Token, das man beim Aufruf einfügt, geht nicht mehr im Klartext
    # durchs LAN.
    service:
      type: ClusterIP
      port: 80

    #
    # Das Zertifikat ist vorerst das selbstsignierte, das Traefik ohne
    # konfigurierten Aussteller ausliefert - der Browser warnt. Ein `tls:`
    # -Block steht hier deshalb noch nicht: Er verweist auf ein Secret, das
    # niemand füllt, und Traefik fiele auf genau dasselbe Zertifikat zurück,
    # nur eine Erklärung später — das Wildcard hängt am Entrypoint von
    # ingress-internal und gilt für jeden Router dort.
    #
    ingress:
      enabled: true
      ingressClassName: internal
      hosts:
        - host: dashboard.k8s.nico-steinmueller.de
          paths:
            - path: /
              type: Prefix

    # Knapp bemessen - RAM ist auf diesem Node die knappe Größe.
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 192Mi
