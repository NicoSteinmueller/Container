#
# Erster Workload, den Flux tatsächlich ausrollt (siehe README.md in diesem
# Verzeichnis und k8s/flux/README.md, Abschnitt "Erster Workload: whoami").
#
# HelmRelease statt Kustomization: k8s/whoami/chart ist ein lokales Chart im
# selben Repo (chart.spec.sourceRef zeigt auf dieselbe GitRepository, die auch
# die kustomize-controller-Kustomizations beobachten würden - kein zweites
# Source-Objekt nötig). valuesFiles wählt die Umgebung; values-prod.yaml
# setzt aktuell den NodePort-Zugriff (siehe k8s/whoami/README.md).
#
# valuesFiles-Pfade sind relativ zur Wurzel der GitRepository, NICHT relativ
# zu chart.spec.chart - deshalb der volle Pfad ab k8s/whoami/chart/ statt nur
# des Dateinamens. Ohne das: "values files merge error: no values file found
# at path '/values.yaml'" (HelmChart sucht an der Repo-Wurzel).
#
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whoami
  namespace: flux-system
spec:
  interval: 10m
  chart:
    spec:
      chart: ./k8s/whoami/chart
      sourceRef:
        kind: GitRepository
        name: flux-system
      valuesFiles:
        - k8s/whoami/chart/values.yaml
        - k8s/whoami/chart/values-prod.yaml
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
