#
# Erster Workload, den Flux tatsächlich ausrollt (siehe README.md in diesem
# Verzeichnis und k8s/flux/README.md, Abschnitt "Was hier bewusst fehlt").
#
# Bewusst nur base/, nicht overlays/prod: overlays/prod/ingress.yaml geht von
# einem NGINX-Ingress-Controller aus (ingressClassName: nginx), dieser Cluster
# hat aber nur die Traefik-basierten IngressClasses "public"/"internal" aus
# k8s/platform/charts/homelab-base (siehe dortiges "Offen" in
# k8s/whoami/README.md). Ohne Anpassung würde der Ingress nie ready werden.
# Schrittweise: erst Deployment/Service/NetworkPolicy zum Laufen bringen,
# Ingress kommt als eigener Schritt, sobald die IngressClass-Frage geklärt ist.
#
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: whoami
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/whoami/base
  prune: true
  wait: true
  timeout: 2m
