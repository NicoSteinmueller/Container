#
# Erster Workload, den Flux tatsächlich ausrollt (siehe README.md in diesem
# Verzeichnis und k8s/flux/README.md, Abschnitt "Erster Workload: whoami").
#
# HelmRelease statt Kustomization: k8s/whoami/chart ist ein lokales Chart im
# selben Repo (chart.spec.sourceRef zeigt auf dieselbe GitRepository, die auch
# die kustomize-controller-Kustomizations beobachten würden - kein zweites
# Source-Objekt nötig). valuesFiles wählt die Umgebung; values-prod.yaml
# setzt ingressClassName: internal, weil dieser Cluster nur die
# Traefik-basierten IngressClasses "public"/"internal" aus
# k8s/platform/charts/homelab-base kennt, kein NGINX (siehe values-prod.yaml
# im Chart).
#
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whoami
  namespace: flux-system
spec:
  interval: 10m
  chart:
    spec:
      chart: ./k8s/whoami/chart
      sourceRef:
        kind: GitRepository
        name: flux-system
      valuesFiles:
        - values.yaml
        - values-prod.yaml
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
