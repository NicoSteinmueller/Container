#
# Eigene Grafana-Dashboards, gleiche Bauart wie cert-manager-issuers.
#
# Sie liegen ausserhalb dieses Verzeichnisses, weil ein `configMapGenerator`
# eine `kustomization.yaml` braucht - und sobald eine hier liegt, erzeugt Flux
# sie nicht mehr selbst aus allen YAML-Dateien, sondern jede muesste von Hand
# eingetragen werden. Eine vergessene Zeile hiesse: Manifest wird nicht mehr
# angewendet, ohne Fehlermeldung.
#
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-dashboards
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./k8s/flux/grafana-dashboards
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  #
  # Kein `wait: true`: Eine ConfigMap ist angewendet, sobald sie angewendet ist.
  # Ob Grafana sie eingelesen hat, entscheidet der Sidecar Sekunden spaeter.
  #
  # Der Namespace `monitoring` entsteht in monitoring.yaml, also in der
  # Wurzel-Kustomization. Laeuft diese hier zuerst, scheitert sie einmal und
  # kommt ueber `retryInterval` von selbst zurecht. Ein `dependsOn` zeigte auf
  # die Kustomization, in deren Pfad diese Datei selbst liegt.
  #
  timeout: 2m
