#
# Die Secrets des Clusters - zweite Git-Quelle, verschlüsselt.
#
# Alle Zugangsdaten liegen SOPS-verschlüsselt im Gitea-Repo `homelab-secrets`,
# nicht hier. Dieses Repo geht öffentlich nach GitHub, und auch Ciphertext soll
# dort nicht liegen: Was einmal öffentlich war, ist geklont und archiviert, und
# ein Jahre später doch abhandengekommener Schlüssel macht es rückwirkend
# lesbar - auch die Geheimnisse, die längst rotiert wurden.
#
# Was hier steht, ist deshalb nur der Verweis: wo das andere Repo liegt und
# womit entschlüsselt wird. Die Werte selbst kommen nie durch diese Datei.
#
# Reihenfolge beim Neuaufbau:
#
#   1. sops-age, flux-git-auth, homelab-secrets-auth von Hand in den Cluster
#      (die Befehle dafuer stehen in k8s/flux/README.md)
#   2. ab hier zieht Flux alles Weitere selbst
#
# Diese drei können strukturell nicht aus SOPS kommen: Ohne flux-git-auth
# erreicht Flux dieses Repo nicht, ohne dieses Repo kennt es homelab-secrets
# nicht, und ohne sops-age könnte es dort nichts lesen.
#

apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab-secrets
  namespace: flux-system
spec:
  #
  # Kürzer als das Intervall der Wurzel-Quelle: Ein rotiertes Passwort soll
  # nicht erst in einer Viertelstunde ankommen. Der Gitea steht im selben Haus,
  # die Abfrage kostet nichts.
  #
  interval: 5m
  url: https://git.local.nico-steinmueller.de/nico/homelab-secrets.git
  ref:
    branch: master
  secretRef:
    # Leer angelegt von k8s/flux/main.tf, von Hand gefüllt (siehe README).
    name: homelab-secrets-auth
  #
  # Nur der Pfad dieses Clusters. Kommt ein zweiter dazu, zieht er sein eigenes
  # Verzeichnis - und sieht die Geheimnisse des ersten nicht.
  #
  ignore: |
    /*
    !/clusters/talos-cp1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-secrets
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/talos-cp1
  sourceRef:
    kind: GitRepository
    name: homelab-secrets
  #
  # Der eine Block, um den es geht: kustomize-controller entschlüsselt die
  # Manifeste beim Anwenden. Ohne ihn landete ENC[AES256_GCM,...] wörtlich als
  # Wert im Cluster - die Kustomization bliebe grün, und der Fehler zeigte sich
  # erst daran, dass ein Dienst sich nicht an seiner Datenbank anmelden kann.
  #
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  #
  # prune: Ein hier gelöschtes Secret verschwindet auch im Cluster. Genau das
  # will man bei Zugangsdaten - ein zurückgenommenes Geheimnis, das im Cluster
  # weiterlebt, ist der Normalfall, wenn niemand aufräumt.
  #
  prune: true
  #
  # wait: true, und das ist hier die nützliche Richtung. Diese Kustomization
  # meldet sich erst fertig, wenn die Secrets tatsächlich im Cluster stehen -
  # damit kann eine Anwendung sich darauf berufen:
  #
  #   dependsOn:
  #     - name: homelab-secrets
  #
  # Umgekehrt darf hier *kein* dependsOn auf flux-system stehen: Die
  # Wurzel-Kustomization legt dieses Objekt erst an. Beide aufeinander warten
  # zu lassen ist ein Deadlock, der sich als zwei ewig "Unknown" stehende
  # Kustomizations zeigt und nichts darüber sagt, woran es liegt.
  #
  wait: true
  #
  # Ein Fehlschlag beim Entschlüsseln soll auffallen, nicht als "Unknown"
  # versickern - kurzes Timeout, damit der Status schnell auf Failed geht.
  #
  timeout: 2m
  retryInterval: 1m
