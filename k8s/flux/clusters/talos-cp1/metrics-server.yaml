#
# metrics-server - Quelle für `kubectl top` und die Auslastungsanzeigen in
# Headlamp.
#
# targetNamespace kube-system: Er meldet sich als APIService
# v1beta1.metrics.k8s.io an, der kube-apiserver reicht Anfragen an ihn weiter -
# ein eigener Namespace mit Default-Deny müsste diesen Weg wieder öffnen.
#
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/metrics-server/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 10m
  releaseName: metrics-server
  targetNamespace: kube-system
  storageNamespace: kube-system
  chart:
    spec:
      chart: metrics-server
      version: "3.13.1"
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    #
    # --kubelet-insecure-tls, anders als in k8s/platform: Der Weg dort
    # (echtes Kubelet-Zertifikat per CSR-Approver) setzt serverTLSBootstrap
    # voraus, das vm/talos bewusst weglässt - sonst scheitert der
    # Abruf an "x509: certificate signed by unknown authority".
    #
    # Die Verbindung bleibt verschlüsselt, aber ungeprüft: Wer im Node-Netz
    # steht, könnte sich als Kubelet ausgeben. Im Ein-Node-LAN vertretbar,
    # sollte beim Umstieg auf serverTLSBootstrap aber als Erstes weichen.
    #
    replicas: 1

    podDisruptionBudget:
      enabled: false

    defaultArgs:
      - --cert-dir=/tmp
      - --kubelet-preferred-address-types=InternalIP
      - --kubelet-use-node-status-port
      - --metric-resolution=15s
      - --kubelet-insecure-tls

    args: []

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 40m
        memory: 64Mi
      limits:
        memory: 128Mi
