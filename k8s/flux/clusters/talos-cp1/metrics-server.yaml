#
# metrics-server - Quelle für `kubectl top` und für die Auslastungsanzeigen
# (CPU, Speicher) in Headlamp (headlamp.yaml). Ohne ihn bleiben die
# entsprechenden Felder dort leer, obwohl die RBAC-Regel für metrics.k8s.io
# schon bereitsteht (ClusterRole headlamp-cluster-read).
#
# targetNamespace kube-system, nicht ein eigener Namespace: metrics-server
# meldet sich als APIService v1beta1.metrics.k8s.io an, der kube-apiserver
# reicht Anfragen an ihn weiter. Ein eigener Namespace mit Default-Deny-
# Policies müsste genau diesen Weg wieder öffnen.
#
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/metrics-server/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 10m
  releaseName: metrics-server
  targetNamespace: kube-system
  storageNamespace: kube-system
  chart:
    spec:
      chart: metrics-server
      version: "3.13.1"
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    #
    # Anders als in k8s/platform steht hier --kubelet-insecure-tls.
    #
    # Der sichere Weg dort - ein echtes Kubelet-Serverzertifikat statt eines
    # selbstsignierten, ausgestellt über einen CSR, den kubelet-csr-approver
    # genehmigt - setzt serverTLSBootstrap in der Talos-Machine-Config
    # voraus. Genau das fehlt in vm/talos-simple bewusst; siehe dessen
    # README unter "Was hier bewusst fehlt". Ohne serverTLSBootstrap bleibt
    # das Kubelet-Zertifikat selbstsigniert, und metrics-server kann es
    # nicht gegen eine bekannte CA prüfen - der Abruf schlägt mit "x509:
    # certificate signed by unknown authority" fehl.
    #
    # --kubelet-insecure-tls verzichtet auf genau diese Prüfung. Die
    # Verbindung bleibt verschlüsselt, aber ungeprüft: Ein Angreifer mit
    # Stellung im Node-Netz (10.244.0.0/16 bzw. das Heimnetz selbst) könnte
    # sich als Kubelet ausgeben. Für den Ein-Node-Aufbau im eigenen LAN ist
    # das vertretbar - es ist aber der Punkt, der beim Umstieg auf
    # serverTLSBootstrap (und die CSR-Approver-Kette aus k8s/platform) als
    # Erstes wieder verschwinden sollte.
    #
    replicas: 1

    podDisruptionBudget:
      enabled: false

    defaultArgs:
      - --cert-dir=/tmp
      - --kubelet-preferred-address-types=InternalIP
      - --kubelet-use-node-status-port
      - --metric-resolution=15s
      - --kubelet-insecure-tls

    args: []

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 40m
        memory: 64Mi
      limits:
        memory: 128Mi
