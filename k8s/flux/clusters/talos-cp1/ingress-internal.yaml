#
# ingress-internal - der erste Ingress-Controller dieses Clusters.
#
# Erreichbar ausschliesslich aus dem Heimnetz. Was aus dem Internet kommen
# soll, braucht einen zweiten Controller auf einer eigenen Adresse
# (ingress-public); der steht noch aus, und deshalb legt diese Datei auch nur
# die IngressClass `internal` an, nicht das Klassenpaar. Eine Klasse ohne
# Controller waere eine Falle: Ein Ingress mit `ingressClassName: public`
# wuerde angenommen und nie bedient.
#
# Die Vertrauensgrenze ist hier das Heimnetz. Keine WAF, kein
# CrowdSec-Bouncer - wer im LAN steht, hat ohnehin mehr Wege als diesen.
#
# Was noch fehlt und bewusst nicht hier steht:
#
#   - ingress-public: eigener Namespace, eigene Adresse, eigener
#     Zertifikatsspeicher. Das Wildcard dieses Namespace bekommt er nicht zu
#     sehen; die Trennung laeuft ueber Namespace und RBAC, nicht ueber ein
#     Client-Zertifikat auf einer Zwischenstrecke - es gibt keine mehr.
#   - Kyverno. Die Regel "ingressClassName: public nur in Namespaces mit
#     homelab.io/zone=public" gibt es damit nicht. Solange die Klasse `public`
#     gar nicht existiert, fehlt ihr auch der Anwendungsfall. Mit dem
#     oeffentlichen Controller wird sie tragend, nicht ergaenzend.
#
---
#
# PodSecurity `privileged`, und das ist hier kein Schlendrian: Der Controller
# belegt hostPort 80 und 443 auf dem Node, und PodSecurity zaehlt hostPorts
# bereits ab `baseline` als Verstoss. Ein Ingress-Controller ohne die
# Standard-Ports waere aber keiner.
#
# `warn` und `audit` bleiben deshalb auf `baseline` stehen: Jede andere
# Abweichung - privilegierte Container, Host-Namespaces, hostPath - taucht
# weiterhin als Warnung auf. Nur der hostPort ist die Ausnahme, und der
# Namespace enthaelt nichts als diesen Controller.
#
apiVersion: v1
kind: Namespace
metadata:
  name: traefik-internal
  labels:
    homelab.io/zone: internal
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline

---
#
# Die IngressClass.
#
# Sie wird hier angelegt und nicht vom Chart: Mit namespaced RBAC
# (`rbac.namespaced` unten) darf der Controller keine clusterweiten Objekte
# anlegen oder lesen. Der Klassenname steht deshalb statisch in seiner
# Konfiguration (`providers.kubernetesIngress.ingressClass`), und Traefik
# vergleicht ihn direkt mit `spec.ingressClassName` des Ingress - es schlaegt
# dieses Objekt hier gar nicht nach.
#
# Gebraucht wird es trotzdem: `kubectl get ingressclass` soll zeigen, was es
# gibt, und eine spaetere Kyverno-Regel prueft gegen diesen Namen.
#
# Bewusst ohne `is-default-class`-Annotation. Eine Default-Klasse waere genau
# der Fall, den das Konzept verhindern will: ein Ingress ohne
# `ingressClassName`, der irgendwo landet.
#
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: internal
  labels:
    homelab.io/zone: internal
  annotations:
    homelab.io/beschreibung: >-
      Nur aus dem Heimnetz erreichbar. Kein Weg aus dem Internet hierher.
spec:
  controller: traefik.io/ingress-controller

---
#
# Eingehend nur aus dem LAN.
#
# Der Grund: hostPort ist nicht der einzige Weg an diesen Pod. Jeder Pod im
# Cluster koennte die Pod-Adresse direkt auf 8000/8443 ansprechen - und damit
# jeden Router dieses Controllers benutzen, ohne je im LAN gewesen zu sein.
# Der Ingress waere dann der Umweg, der die Policies der Anwendungen aushebelt:
# `allow-from-ingress-internal` im Namespace headlamp laesst Verkehr aus
# traefik-internal zu, und aus traefik-internal kaeme er ja auch. Mit dieser
# Policy hier gar nicht erst.
#
# `--api.dashboard=true`
# legt nur den Handler `api@internal` an; bedient wird er ausschliesslich von
# einem Router, und der einzige steht auf websecure und traegt die
# BasicAuth-Middleware. Auf dem Entrypoint `traefik` laege die API erst mit
#
#   --api.insecure=true   "Activate API directly on the entryPoint named
#                          traefik" (traefik v3.7.11 --help)
#
# und dieses Flag setzt der Chart nicht (`api.insecure` bleibt leer). Uebrig
# bleibt dort `/ping`, an dem die Kubelet-Probes haengen.
#
# Dass die ipBlock-Regel hier greift, ist nicht selbstverstaendlich und im
# Repo schon einmal falsch verallgemeinert worden: Cilium wertet ipBlock nicht
# gegen die reservierten Identitaeten `host` und `remote-node` aus. Ein
# LAN-Client, dessen Paket ueber hostPort hereinkommt, traegt aber `world` -
# und dagegen greift ipBlock sehr wohl (nachgemessen fuer NodePort, siehe
# k8s/whoami/chart/templates/networkpolicy.yaml).
#
# Die Health-Probes des Kubelets fallen nicht darunter: Sie kommen als `host`,
# und Cilium laesst den lokalen Host per Voreinstellung zu Pods durch.
#
# Sollte der Ingress nach dem Anwenden nicht mehr antworten, ist das die erste
# Stelle zum Nachsehen:
#
#   kubectl -n traefik-internal delete networkpolicy allow-from-lan
#
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: traefik-internal
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-lan
  namespace: traefik-internal
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.178.0/24


#
# Kein Egress-Default-Deny in diesem Namespace, und das ist eine Entscheidung,
# keine Luecke: Der Controller muss die Kubernetes-API erreichen, und die
# liegt hinter einer ClusterIP, deren Backend die Node-Adresse ist - also die
# Identitaet `host`, gegen die ipBlock-Regeln nicht greifen. Eine Egress-Policy
# hier waere schwer zu schreiben und noch schwerer zu debuggen. Die Zusage
# "kein Pod erreicht das LAN" gehoert ohnehin zu den Anwendungs-Namespaces;
# dort kommt sie mit dem ersten migrierten Dienst.
#

---
#
# RBAC von Hand statt aus dem Chart - und das ist die Stelle, an der dieser
# Controller sich vom Chart-Normalfall unterscheidet. Der Grund ist eine
# Kopplung im Chart, die man erst bemerkt, wenn ein Ingress lautlos nicht
# bedient wird:
#
#   `rbac.namespaced: true` setzt zugleich das Flag
#   --providers.kubernetesingress.disableClusterScopeResources=true.
#
# Und damit holt Traefik die Liste der IngressClasses gar nicht erst
# (pkg/provider/kubernetes/ingress/kubernetes.go):
#
#   if !p.DisableIngressClassLookup && !p.DisableClusterScopeResources {
#       ics, err := client.GetIngressClasses()
#   ...
#   if ingress.Spec.IngressClassName != nil {
#       return slices.ContainsFunc(ingressClasses, ...)   // leere Liste
#   }
#
# Ein Ingress mit `spec.ingressClassName` wird dann gegen eine leere Liste
# geprueft und faellt durch - ohne Logzeile, mit 404 am Ingress. Uebrig
# bliebe die seit Traefik v2 deprecated Annotation
# `kubernetes.io/ingress.class`, und die greift nur, wenn `ingressClassName`
# ganz fehlt.
#
# Der Ausweg: `rbac.enabled: false`. Dann erzeugt das Chart keine RBAC - und
# emittiert das Flag auch nicht, denn es haengt allein an `rbac.namespaced`.
# Die Rechte stehen dafuer hier, und zwar aufgeteilt nach dem, worauf es
# ankommt:
#
#   cluster-scoped  nodes, namespaces, ingressclasses   - keine Geheimnisse
#   namespaced      configmaps, services, endpointslices, pods, SECRETS,
#                   ingresses, traefik.io-CRDs
#
# `secrets` steht in der zweiten Zeile. Genau darum ging es bei namespaced
# RBAC, und genau das bleibt erhalten: Traefik liest Secrets nur in den drei
# Namespaces unten, nicht clusterweit. Wer den Ingress uebernimmt, bekommt
# nicht die Zugangsdaten des ganzen Clusters dazu.
#
# Der Preis, ehrlich benannt: Diese Regeln spiegeln, was sonst das Chart
# pflegt. Aendert ein Traefik-Update die noetigen Rechte, muss das hier
# nachziehen. Das ist aber der laute Fehlerfall - Traefik protokolliert
# RBAC-Fehler - und nicht der stille von oben.
#
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-internal-cluster
rules:
  #
  # `nodes` wird hier nicht gebraucht - NodePortLB ist aus. Es steht
  # trotzdem drin: Ohne das disableClusterScopeResources-Flag richtet der
  # Client die Informer fuer Cluster-Ressourcen ein, und ein fehlendes Recht
  # dort erzeugt Warnschleifen statt einer klaren Fehlermeldung.
  #
  - apiGroups:
      - ""
    resources:
      - nodes
      - namespaces
    verbs:
      - get
      - list
      - watch
  #
  # Die eine Zeile, um die es geht.
  #
  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingressclasses
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-internal-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-internal-cluster
subjects:
  - kind: ServiceAccount
    name: traefik-internal
    namespace: traefik-internal

---
#
# Eine ClusterRole, die nirgends clusterweit gebunden wird.
#
# Das ist kein Widerspruch, sondern das uebliche Mittel gegen dreimal
# dasselbe YAML: Eine RoleBinding darf eine ClusterRole referenzieren, und
# die Rechte gelten dann nur in ihrem Namespace. Ein Namespace mehr ist
# damit eine RoleBinding mehr, keine kopierte Regelliste.
#
# Inhalt ist eins zu eins das, was `rbac.namespaced: true` erzeugt haette -
# nachgelesen in templates/rbac/role.yaml des Charts 41.3.0.
#
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-internal-namespaced
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingresses/status
    verbs:
      - update
  - apiGroups:
      - traefik.io
    resources:
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewares
      - middlewaretcps
      - tlsoptions
      - tlsstores
      - traefikservices
      - serverstransports
      - serverstransporttcps
    verbs:
      - get
      - list
      - watch

---
#
# Je Namespace eine Bindung. Diese Liste und die beiden Namespace-Listen in
# den Werten unten muessen zusammenpassen: Steht ein Namespace nur dort,
# sieht Traefik ihn nicht (RBAC fehlt); steht er nur hier, schaut Traefik
# nicht hin. Beim naechsten migrierten Dienst sind es also drei Stellen.
#
# Der Name weicht bewusst von dem ab, den das Chart vergeben wuerde
# (`traefik-internal`): `roleRef` einer RoleBinding ist unveraenderlich. Wo
# schon eine Bindung dieses Namens auf eine *Role* zeigt - naemlich aus einer
# frueheren Release mit `rbac.namespaced: true` -, scheitert jedes Apply mit
#
#   RoleBinding ... is invalid: roleRef: ... cannot change roleRef
#
# Unter eigenem Namen entsteht sie daneben; die alte raeumt Helm beim Upgrade
# selbst weg, weil sie nicht mehr gerendert wird.
#
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik-internal-namespaced
  namespace: traefik-internal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-internal-namespaced
subjects:
  - kind: ServiceAccount
    name: traefik-internal
    namespace: traefik-internal

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik-internal-namespaced
  namespace: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-internal-namespaced
subjects:
  - kind: ServiceAccount
    name: traefik-internal
    namespace: traefik-internal

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik-internal-namespaced
  namespace: whoami
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-internal-namespaced
subjects:
  - kind: ServiceAccount
    name: traefik-internal
    namespace: traefik-internal

---
#
# Die beiden Middlewares des Dashboards.
#
# Sie sind CRDs und stehen damit vor einem Henne-Ei-Problem: Die CRDs
# installiert erst der Chart weiter unten. Beim allerersten Aufbau des
# Clusters scheitert dieses Apply deshalb einmal und die Kustomization geht
# auf Failed - bis kustomize-controller es nach `retryInterval` wiederholt und
# die CRDs inzwischen da sind. Kein Handgriff noetig; wer beim Bootstrap
# zusieht, soll nur wissen, dass diese eine rote Meldung dazugehoert.
#
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-dashboard-auth
  namespace: traefik-internal
spec:
  #
  # Die Zugangsdaten stehen SOPS-verschluesselt in homelab-secrets
  # (clusters/talos-cp1/traefik-dashboard-auth.sops.yaml), nicht hier - dieses
  # Repo geht oeffentlich nach GitHub. Ein bcrypt-Hash ist zwar kein Passwort
  # im Klartext, aber ein oeffentlich lesbarer Hash ist ein Hash, an dem
  # beliebig lange geraten werden darf.
  #
  # Traefik liest das Secret ueber seinen Informer, also bei jeder Aenderung
  # neu - ein rotiertes Passwort gilt sofort, ohne Pod-Neustart.
  #
  basicAuth:
    secret: traefik-dashboard-auth
    realm: Traefik
    # Ohne das reicht Traefik den angemeldeten Benutzer als
    # Authorization-Header an das Backend weiter. Backend ist hier
    # api@internal, also Traefik selbst - der Header waere dort nutzlos und
    # stuende trotzdem in jeder Anfrage.
    removeHeader: true

---
#
# Von / auf /dashboard/.
#
# Der abschliessende Schraegstrich ist nicht kosmetisch: Die
# Dashboard-Oberflaeche laedt ihre Ressourcen relativ, und auf /dashboard
# ohne Slash bleibt die Seite leer. Traefik leitet in dem Fall zwar selbst
# weiter, aber nur von /dashboard - nicht von /.
#
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-dashboard-root
  namespace: traefik-internal
spec:
  redirectRegex:
    regex: ^https?://[^/]+/?$
    replacement: https://traefik.k8s.nico-steinmueller.de/dashboard/
    permanent: false

---
#
# Fremder Chart, deshalb eine eigene HelmRepository - wie bei headlamp und
# metrics-server.
#
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1h
  url: https://traefik.github.io/charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-internal
  namespace: flux-system
spec:
  interval: 10m
  releaseName: traefik-internal
  targetNamespace: traefik-internal
  storageNamespace: traefik-internal
  chart:
    spec:
      chart: traefik
      version: "41.3.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deployment:
      kind: Deployment
      replicas: 1

    #
    # Recreate statt RollingUpdate - sonst blockiert sich jedes Upgrade
    # selbst.
    #
    # Der Scheduler behandelt hostPorts wie Node-Ports, und der Node hat nur
    # einen Satz davon. Die Chart-Voreinstellung ist maxUnavailable: 0 /
    # maxSurge: 1: Der neue Pod soll starten, BEVOR der alte geht - und bleibt
    # dann Pending mit
    #
    #   0/1 nodes are available: 1 node(s) didn't have free ports for the
    #   requested pod ports
    #
    # waehrend der alte auf den neuen wartet. Ein Deadlock, der erst beim
    # naechsten Upgrade auffaellt und wie ein Scheduling-Problem aussieht.
    #
    # Der Preis ist eine kurze Luecke beim Rollout. Bei einem Ingress auf
    # einem Ein-Node-Cluster ist die ohnehin unvermeidbar.
    #
    updateStrategy:
      type: Recreate
      rollingUpdate: null

    podSecurityContext:
      runAsUser: 65532
      runAsGroup: 65532
      runAsNonRoot: true
      # Damit Traefik in das PVC unter /data schreiben darf. Ohne das gehoert
      # das frisch angelegte Verzeichnis root, und acme.json entsteht nie.
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    #
    # hostPort statt hostNetwork - und das ist der Unterschied zum frueheren
    # Plattform-Stack, deshalb ausfuehrlich:
    #
    # Damals liefen zwei Controller auf einem Node mit zwei Beinen (LAN und
    # DMZ). Beide brauchten 443, nebeneinander ging das nur ueber je eine
    # eigene Node-Adresse - also `hostIP`. Das Chart schreibt `hostIP` aber an
    # ZWEI Stellen: in den containerPort (gewollt) und in die
    # Entrypoint-Adresse (templates/_podtemplate.tpl:223, in Chart 41.3.0
    # unveraendert). Im Pod-Netz gibt es die Node-Adresse nicht, Traefik
    # scheitert dann beim Start an
    #
    #   error opening listener: listen tcp 192.168.178.230:8443:
    #     bind: cannot assign requested address
    #
    # Der Ausweg war hostNetwork - und der kostete den Sysctl
    # net.ipv4.ip_unprivileged_port_start=0 auf dem Node, weil Traefik als UID
    # 65532 sonst 80 und 443 nicht binden darf (capabilities.add:
    # [NET_BIND_SERVICE] hilft nicht: ein Nicht-Root-Prozess behaelt
    # Capabilities ueber execve nur per File-Capability, und das Image hat
    # keine).
    #
    # Heute hat der Node ein Bein und dieser Cluster einen Controller. Damit
    # faellt der Grund fuer `hostIP` weg - und ohne `hostIP` faellt der Grund
    # fuer hostNetwork weg, und ohne hostNetwork faellt der Sysctl weg:
    # Traefik bindet 8000/8443 im eigenen Pod-Netz, wo es kein Privileg
    # braucht, und Cilium bildet Node:80/443 darauf ab. Das kann es, weil
    # kube-proxy durch Cilium ersetzt ist (vm/talos/values/cilium.yaml.tftpl,
    # "Dienste von aussen erreicht man spaeter ueber hostPort").
    #
    # Der Node hat derzeit nur die LAN-Adresse; ohne `hostIP` lauscht der
    # hostPort auf allen Adressen des Nodes, was heute dasselbe ist. Sobald
    # das DMZ-Bein und ingress-public zurueckkommen, ist es das nicht mehr -
    # DANN ist die Stelle, an der `hostIP` und mit ihm hostNetwork und der
    # Sysctl zurueckmuessen. Wer das hier liest, bevor er den zweiten
    # Controller baut: Diese Datei ist die zu aendernde.
    #
    ports:
      web:
        port: 8000
        hostPort: 80
        expose:
          default: false
        # Nur zum Weiterleiten. Ein Passwortfeld auf einer unverschluesselten
        # Verbindung im eigenen LAN ist immer noch ein Passwortfeld auf einer
        # unverschluesselten Verbindung.
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true

      websecure:
        port: 8443
        hostPort: 443
        expose:
          default: false
        http:
          tls:
            enabled: true
            #
            # Hier haengt das Wildcard am Entrypoint, nicht an den einzelnen
            # Ingress-Objekten - und das ist der Unterschied, der die Arbeit
            # spart: Ein neuer Dienst braucht keinen `tls:`-Block und kein
            # eigenes Secret, er ist mit seinem Namen einfach abgedeckt.
            #
            # Traefik fordert dieses eine Zertifikat an und benutzt es als
            # Vorgabe fuer jeden Router auf diesem Entrypoint. `main` muss
            # dabei mit dabei stehen: Ein Wildcard deckt nur *eine* Ebene ab,
            # `k8s.nico-steinmueller.de` selbst faellt nicht darunter.
            #
            certResolver: letsencrypt
            domains:
              - main: k8s.nico-steinmueller.de
                sans:
                  - "*.k8s.nico-steinmueller.de"
        forwardedHeaders:
          # Vor diesem Controller steht kein Proxy. Ein vom Client gesetzter
          # X-Forwarded-For darf hier deshalb niemals geglaubt werden - er
          # wuerde in den Logs der Anwendungen als echte Herkunft auftauchen.
          trustedIPs: []
          insecure: false

    #
    # Kein Service: Erreicht wird der Controller ueber den hostPort, und ein
    # Service, den niemand anspricht, ist ein Objekt, das beim Lesen erklaert
    # werden muss. Folge davon: `kubectl get ingress` zeigt keine ADDRESS -
    # das Chart traegt sie nur aus einem eigenen Service nach.
    #
    service:
      enabled: false

    #
    # Das Zertifikat: ein Wildcard von Let's Encrypt, per DNS-01 ueber IONOS.
    #
    # Warum Traefik das selbst macht und nicht cert-manager: cert-manager hat
    # keinen IONOS-Solver. Eingebaut sind nur Akamai, AzureDNS, CloudDNS,
    # Cloudflare, DigitalOcean, Route53, RFC2136 und acmeDNS - fuer IONOS
    # braeuchte es einen Webhook eines Drittanbieters, der dann den
    # Zonen-Token bekaeme. Traefik bringt lego mit, und lego kennt IONOS;
    # damit faellt ein Controller mitsamt Webhook weg. Es ist ausserdem
    # derselbe Weg, den der Traefik-Container auf dem Host schon geht.
    #
    # Warum ein Wildcard und nicht ein Zertifikat je Name: Jedes von Let's
    # Encrypt ausgestellte Zertifikat landet in den oeffentlichen
    # Certificate-Transparency-Logs. Bei Einzelzertifikaten stuende dort
    # jeder Dienstname - eine Landkarte des Heimnetzes fuer jeden, der die
    # Domain kennt. Beim Wildcard steht dort nur, dass es eine `k8s.`-Zone
    # gibt, nicht was darin liegt. Dazu: ein Antrag statt einem pro Dienst,
    # und keine eigene Wurzel, der irgendein Geraet erst vertrauen muesste.
    #
    # Der Preis steht im Secret traefik-ionos: Der API-Key kann die ganze
    # Zone umschreiben - fuer einen Controller, der nur aus dem LAN
    # erreichbar ist, ist das vertretbar.
    #
    certificatesResolvers:
      letsencrypt:
        acme:
          email: nico.steinmueller@gmx.net
          storage: /data/acme.json
          #
          # PRODUKTIV. Vorher stand hier das Staging-Verzeichnis, und der
          # Weg dorthin zurueck ist dieselbe Zeile:
          #
          #   https://acme-staging-v02.api.letsencrypt.org/directory
          #
          # Der Grund fuer die Reihenfolge - erst Staging, dann hier - sind
          # die Rate Limits: fuenf fehlgeschlagene Validierungen je Konto und
          # Hostname pro Stunde, und ein falscher API-Key verbraucht die in
          # Minuten. Wer an der DNS-01-Challenge etwas aendert, probiert das
          # also wieder drueben aus, nicht hier.
          #
          # ACHTUNG beim Umstellen in BEIDE Richtungen: acme.json muss weg.
          # Es traegt zwei Dinge, die zum Verzeichnis gehoeren und die
          # Traefik NICHT von allein verwirft:
          #
          #   - das ausgestellte Zertifikat. Es ist gueltig, also nimmt
          #     Traefik es weiter - der Browser warnt danach genauso wie
          #     vorher, und es sieht aus, als haette die Umstellung nicht
          #     gewirkt.
          #   - das ACME-Konto samt Registrierungs-URI. Die zeigt auf
          #     Staging; gegen das Produktivverzeichnis vorgelegt, antwortet
          #     es mit "account does not exist".
          #
          #   kubectl -n traefik-internal exec deploy/traefik-internal \
          #     -- rm -f /data/acme.json
          #   kubectl -n traefik-internal rollout restart deploy/traefik-internal
          #
          caServer: https://acme-v02.api.letsencrypt.org/directory
          keyType: EC256
          dnsChallenge:
            provider: ionos
            #
            # Oeffentliche Resolver fuer die Propagationspruefung. Der
            # interne Resolver wuerde die eigene, noch nicht propagierte
            # Antwort sehen und zu frueh gruen melden.
            #
            resolvers:
              - 1.1.1.1:53
              - 8.8.8.8:53
            propagation:
              delayBeforeChecks: 30s

    #
    # Der API-Key kommt aus homelab-secrets, nicht aus diesem Repo - dieses
    # geht oeffentlich nach GitHub. lego liest ihn ausschliesslich aus der
    # Umgebung, daher env und nicht eine Datei.
    #
    env:
      - name: IONOS_API_KEY
        valueFrom:
          secretKeyRef:
            name: traefik-ionos
            key: IONOS_API_KEY

    #
    # acme.json braucht einen Ort, der einen Neustart ueberlebt - sonst holt
    # Traefik bei jedem Pod-Start ein neues Zertifikat und laeuft in genau
    # die Rate Limits von oben.
    #
    # local-path und damit ReadWriteOnce: Das passt zu `replicas: 1` und zu
    # updateStrategy Recreate weiter oben. Mit RollingUpdate haetten sich
    # hier zwei Pods um dasselbe Volume gestritten.
    #
    persistence:
      enabled: true
      name: data
      accessMode: ReadWriteOnce
      size: 128Mi
      storageClass: local-path
      path: /data

    #
    # Keine RBAC aus dem Chart - sie steht als eigene Objekte weiter oben,
    # samt Begruendung. Kurz: `rbac.namespaced: true` haette das Flag
    # disableClusterScopeResources mitgesetzt, und damit funktioniert
    # `spec.ingressClassName` nicht mehr.
    #
    # Den ServiceAccount legt das Chart weiterhin an - der haengt an
    # `serviceAccount.name`, nicht an `rbac.enabled`.
    #
    rbac:
      enabled: false

    # Die Klasse steht als Objekt weiter oben, damit sie nicht am Lebenszyklus
    # der Release haengt.
    ingressClass:
      enabled: false

    providers:
      kubernetesIngress:
        enabled: true
        ingressClass: internal
        allowExternalNameServices: false
        #
        # Jeder neue Namespace muss hier eingetragen werden - das ist die
        # Bremse, die namespaced RBAC einbaut, und sie ist gewollt: Ein
        # Ingress in einem nicht gelisteten Namespace wird schlicht nicht
        # bedient, statt still bedient zu werden.
        #
        namespaces:
          - headlamp
          - whoami

      kubernetesCRD:
        enabled: true
        allowCrossNamespace: false
        allowExternalNameServices: false
        #
        # Hier steht der eigene Namespace mit drin, bei kubernetesIngress
        # oben nicht: In traefik-internal liegen die IngressRoute des
        # Dashboards und seine BasicAuth-Middleware - beides CRDs. Ohne
        # diesen Eintrag legt Flux beide an, Traefik sieht sie nie, und das
        # Dashboard antwortet mit 404 statt mit einem Passwortfeld.
        #
        namespaces:
          - traefik-internal
          - headlamp
          - whoami

      kubernetesGateway:
        enabled: false

    #
    # Das Dashboard - unter https://traefik.k8s.nico-steinmueller.de, und nur
    # mit Passwort.
    #
    # Es kennt selbst keine Authentifizierung, und "nur im LAN erreichbar" ist
    # keine: Wer es oeffnet, sieht jeden Router, jeden Service und jede
    # Middleware dieses Clusters - also eine Liste dessen, was es hier
    # ueberhaupt zu erreichen gibt. Die Bedingung, unter der es aufgemacht
    # ist, steht deshalb als erste Middleware unten und als eigenes Objekt
    # weiter oben.
    #
    # Die Regel ist bewusst nur `Host(...)` und nicht die Voreinstellung
    # PathPrefix(`/dashboard`) || PathPrefix(`/api`): Der Hostname gehoert
    # allein diesem Dashboard, und mit der Voreinstellung waere ausgerechnet
    # https://traefik.k8s.nico-steinmueller.de/ - das, was man eintippt - ein
    # 404. Den Weg von dort auf /dashboard/ macht die zweite Middleware.
    #
    # /api liegt damit unter demselben Namen offen. Das ist die API, aus der
    # das Dashboard seine Anzeige speist; sie ist lesend (die Konfiguration
    # kommt aus Kubernetes, nicht von dort) und liegt hinter derselben
    # Authentifizierung. Der unauthentifizierte Zwilling auf Port 8080 bleibt
    # unerreichbar - dafuer sorgt die NetworkPolicy weiter oben.
    #
    ingressRoute:
      dashboard:
        enabled: true
        entryPoints:
          - websecure
        matchRule: Host(`traefik.k8s.nico-steinmueller.de`)
        # Reihenfolge zaehlt: erst Passwort, dann Umleitung. Andersherum
        # verriete schon der Redirect auf /dashboard/, dass es hier etwas
        # gibt.
        middlewares:
          - name: traefik-dashboard-auth
          - name: traefik-dashboard-root
      healthcheck:
        enabled: false

    log:
      level: INFO

    accessLog:
      enabled: true
      format: json

    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        memory: 192Mi
