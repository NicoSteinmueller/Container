# Vorlage: einen Dump aus CnpgDatabase.yaml zurückspielen - oder beim Umzug
# den `migration-`-Dump aus dem Docker-Container (Ablauf:
# k8s/flux/platform/cloudnative-pg/README.md). Von Hand anwenden, nie über
# Flux - ein Job läuft beim Anlegen los.
#
#   ssh root@192.168.178.3 ls -lt /mnt/user/k8s/nextcloud/dumps/   # Dump wählen
#   # DUMP unten eintragen, `nextcloud` durch den Dienst ersetzen
#   kubectl apply -f CnpgRestore.yaml
#   kubectl -n nextcloud logs -f job/nextcloud-db-restore
#   kubectl -n nextcloud delete job nextcloud-db-restore
#
# `--clean --if-exists` ersetzt, was da ist. Die Anwendung vorher anhalten
# (replicas: 0), sonst schreibt sie in eine halb zurückgespielte Datenbank.
# Ziel ist die Datenbank aus dem Secret `nextcloud-db-app` - nach einem
# Neuaufbau eine leere Instanz mit neuem Passwort, die Anwendung liest es per
# secretKeyRef und merkt davon nichts.
#
# Extensions aus dem Dump spielt der Job nie zurück: Die legt der Operator
# als Superuser an (`Database`-Objekt, siehe apps/immich), und `app` dürfte
# sie weder löschen (`--clean`) noch anlegen. Was sonst draußen bleiben soll,
# nennt `EXCLUDE` als Regex auf die Zeilen von `pg_restore --list`.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nextcloud-db-restore
  namespace: nextcloud
spec:
  backoffLimit: 0                 # kein zweiter Versuch auf halbem Stand
  template:
    metadata:
      labels:
        homelab.io/db-client: nextcloud-db
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: restore
          # Dasselbe Image wie `imageName` im Cluster.
          image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:79be0d10e78b7ac4520cf6c5db199a8bb7f6de53b3229f47e90cab5865528a0d
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - { name: DUMP, value: /dumps/nextcloud-JJJJ-MM-TTTHHMMZ.dump }
            - { name: EXCLUDE, value: "" }
            - { name: PGHOST,     valueFrom: { secretKeyRef: { name: nextcloud-db-app, key: host } } }
            - { name: PGPORT,     valueFrom: { secretKeyRef: { name: nextcloud-db-app, key: port } } }
            - { name: PGUSER,     valueFrom: { secretKeyRef: { name: nextcloud-db-app, key: username } } }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: nextcloud-db-app, key: password } } }
            - { name: PGDATABASE, valueFrom: { secretKeyRef: { name: nextcloud-db-app, key: dbname } } }
            - { name: PGSSLMODE,     value: verify-full }
            - { name: PGSSLROOTCERT, value: /pg-ca/ca.crt }
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail
              # Inhaltsverzeichnis ohne Extensions und ohne EXCLUDE
              pg_restore --list "${DUMP}" |
                grep -vE "^[0-9]+; [0-9]+ [0-9]+ (EXTENSION|COMMENT - EXTENSION) ${EXCLUDE:+|${EXCLUDE}}" \
                > /tmp/toc

              # --exit-on-error: lieber abbrechen als still halb zurückspielen
              pg_restore --clean --if-exists --no-owner --no-privileges \
                         --exit-on-error --use-list=/tmp/toc \
                         --dbname="${PGDATABASE}" "${DUMP}"
              echo "zurückgespielt: ${DUMP}"
          volumeMounts:
            - { name: dumps, mountPath: /dumps, readOnly: true }
            - { name: pg-ca, mountPath: /pg-ca, readOnly: true }
            - { name: tmp,   mountPath: /tmp }
      volumes:
        - name: dumps
          persistentVolumeClaim:
            claimName: dumps
        - name: pg-ca
          secret:
            secretName: nextcloud-db-ca
            items:
              - { key: ca.crt, path: ca.crt }
        - name: tmp
          emptyDir: {}
