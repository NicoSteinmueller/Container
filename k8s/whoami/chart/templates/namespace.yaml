{{- if .Values.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  annotations:
    # Fällt der Namespace aus dem Chart (createNamespace: false), löschte Helm
    # ihn beim Upgrade - samt allem, was darin liegt. `keep` lässt ihn stehen.
    helm.sh/resource-policy: keep
  labels:
    # Zone: ob der Dienst von außen erreichbar ist. Reine Dokumentation -
    # die Routen stehen in k8s/flux/network/ingress-*/DynamicConfig.yaml.
    homelab.io/zone: {{ .Values.zone }}
    # Pod Security Admission: verweigert jedes Deployment/Pod-Update, das nicht
    # den "restricted" Anforderungen entspricht (non-root, keine Privilege
    # Escalation, ALL Capabilities gedroppt, RuntimeDefault-Seccomp, ...).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
{{- end }}
