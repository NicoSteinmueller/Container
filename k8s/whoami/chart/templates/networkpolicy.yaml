# Default-Deny: ohne explizite allow-Regel darf whoami weder angesprochen
# werden noch selbst etwas ansprechen (Zero-Trust innerhalb des Clusters).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: whoami-default-deny
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

{{- with .Values.networkPolicy.ingressControllerNamespaces }}
---
# Erlaubt eingehenden Traffic ausschließlich von den Ingress-Controllern der
# jeweiligen Umgebung (values-<env>.yaml,
# networkPolicy.ingressControllerNamespaces).
#
# Eine Liste, kein Einzelwert: whoami hängt seit ingress-public an zwei
# Controllern - traefik-internal für den LAN-Namen, traefik-public für den
# öffentlichen. Beide brauchen denselben Weg an denselben Port, und eine
# zweite Policy daneben wäre eine Regel, die man beim Lesen erst gegen die
# erste halten muss.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: whoami-allow-ingress-from-controller
  namespace: {{ $.Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: whoami
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 80
{{- end }}

{{- if eq .Values.service.type "NodePort" }}
---
# Erlaubt eingehenden Traffic für den NodePort-Zugriff aus dem LAN.
#
# Ohne Quellen-Einschränkung - aber nicht aus dem Grund, der hier früher stand.
#
# Die alte Begründung lautete, Cilium werte ipBlock-Regeln bei NodePort-Traffic
# nicht aus. Das war aus einem anderen Fall übertragen: Die Einschränkung
# betrifft die reservierten Identitäten "host" und "remote-node", also Pods,
# die den Node selbst ansprechen. Ein
# LAN-Client an einem NodePort ist dagegen "world", und dagegen greift ipBlock
# - auf talos-cp1 nachgemessen, siehe vm/talos/README.md.
#
# Eine IP-Beschränkung wäre hier also möglich. Sie bleibt trotzdem weg: whoami
# ist der Testdienst, an dem sich zeigen soll, dass der Weg von außen
# funktioniert - eine zweite Bedingung, die beim Debuggen mitgedacht werden
# muss, kostet hier mehr, als sie schützt. Es gibt keine schützenswerten Daten,
# und die eigentliche Grenze ist "nur aus dem LAN erreichbar", nicht "nur von
# bestimmten LAN-Clients".
#
# Sobald ein zweiter Node dazukommt, ist die Messung neu zu machen: Wird
# Verkehr über einen anderen Node maskiert, kann die Quelle zu "remote-node"
# werden - dann greift ipBlock tatsächlich nicht mehr.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: whoami-allow-ingress-nodeport
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: whoami
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 80
{{- end }}

---
# whoami braucht selbst keine Verbindungen nach außen, außer DNS-Auflösung
# (z.B. für spätere gesundheits-/Update-Checks). Alles andere bleibt verboten.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: whoami-allow-egress-dns
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: whoami
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
