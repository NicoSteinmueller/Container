apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: whoami
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
