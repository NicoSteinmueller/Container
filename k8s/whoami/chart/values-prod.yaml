# Produktiv-Cluster (talos-cp1).
#
# Erster Schritt: NodePort 30083, direkt im LAN erreichbar, ohne
# Ingress-Controller/TLS/Hostname. Ingress kommt als eigener Schritt (siehe
# unten) - Traefik statt NGINX, ingressClassName "internal" statt "public",
# weil dieser Cluster nur die Traefik-basierten IngressClasses
# "public"/"internal" aus k8s/platform/charts/homelab-base kennt (siehe
# k8s/platform/charts/homelab-base/templates/ingressclasses.yaml und die
# Kyverno-Regel restrict-public-ingress-class).

service:
  type: NodePort
  nodePort: 30083

