# Produktiv-Cluster (talos-cp1).
#
# NodePort 30083, direkt im LAN erreichbar, ohne Ingress-Controller, TLS oder
# Hostname. Das ist kein Zwischenschritt aus Bequemlichkeit: In diesem Cluster
# läuft derzeit überhaupt kein Ingress-Controller, es gibt also auch keine
# IngressClass, in die ein Ingress hier zeigen könnte.
#
# Die auskommentierte Variante unten wartet darauf. "internal" ist dabei eine
# Erwartung an den kommenden Traefik, kein Objekt im Cluster - der Name stammt
# aus dem Klassenpaar "public"/"internal", das der entfernte Plattform-Stack
# mitbrachte und das beim Wiederaufbau als Flux-Manifest wiederkommen soll.

service:
  type: NodePort
  nodePort: 30083

