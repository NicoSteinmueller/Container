# Produktiv-Cluster (talos-cp1).
#
# Kein Ingress-Objekt: Die Route `whoami.k8s.nico-steinmueller.de` steht in
# k8s/flux/network/ingress-internal/DynamicConfig.yaml. Das Chart liefert hier
# nur Deployment, Service und die NetworkPolicy für den internen Controller.
# Es gibt per ?env=true seine Umgebung aus.
#
# Der interne Hostname muss im Heimnetz auf .231 zeigen (AdGuard oder
# Fritzbox) und hat im öffentlichen DNS nichts verloren.

service:
  type: ClusterIP

ingress:
  enabled: false

networkPolicy:
  # Ohne diese Zeile greift nur das Default-Deny des Charts, und der
  # Controller käme nicht an whoami heran. Nur der interne: whoami ist nicht
  # öffentlich.
  ingressControllerNamespaces:
    - traefik-internal

ingressPublic:
  enabled: false

#
# Der Namespace steht in k8s/flux/core/namespaces/Restricted.yaml (mit
# `homelab.io/zone: internal`), wie alle anderen.
#
createNamespace: false
