# Produktiv-Cluster (talos-cp1).
#
# Ingress statt NodePort, seit ingress-internal steht
# (k8s/flux/clusters/talos-cp1/ingress-internal.yaml). whoami ist der
# Testdienst, an dem sich der Weg von außen zeigen soll - und der Weg ist
# jetzt der über den Controller, nicht mehr der über Port 30083.
#
# `tls.enabled` bleibt aus, und das ist hier kein Mangel: Das Zertifikat
# hängt am Entrypoint von ingress-internal — ein Wildcard von Let's Encrypt
# für `*.k8s.nico-steinmueller.de`, das jeder Router dort bekommt. Ein
# `tls:`-Block hier verwiese auf ein Secret, das niemand füllt.
#
# Der Hostname muss im Heimnetz auf die LAN-Adresse des Nodes zeigen (AdGuard
# oder Fritzbox) und hat im öffentlichen DNS nichts verloren.

service:
  type: ClusterIP

ingress:
  enabled: true
  className: internal
  host: whoami.k8s.nico-steinmueller.de
  # Kein tls-Block nötig — siehe oben.

networkPolicy:
  # Ohne diese Zeilen greift nur das Default-Deny des Charts, und die
  # Controller kämen nicht an whoami heran. Seit ingress-public sind es zwei.
  ingressControllerNamespaces:
    - traefik-internal
    - traefik-public

#
# Der öffentliche Weg - whoami ist der Testdienst, an dem sich zeigen soll,
# dass er trägt, bevor Immich und Nextcloud daran hängen.
#
# Der Name steht im öffentlichen DNS, anders als `whoami.k8s....`, und muss
# dort auf die WAN-Adresse zeigen, sobald die Fritzbox weiterleitet
# (Schritt 11). Bis dahin ist er nur über die LB-Adresse .232 erreichbar -
# im LAN also per Split-DNS oder `curl --resolve`.
#
# Kein tls-Block: Das Zertifikat holt ingress-public selbst per DNS-01,
# je Name. Das braucht keinen A-Record und funktioniert deshalb schon,
# bevor die Portfreigabe steht.
#
ingressPublic:
  enabled: true
  className: public
  host: whoami.nico-steinmueller.de

#
# Und damit wird der Namespace `public`.
#
# Das ist keine Kosmetik. Die Kyverno-Regel aus Schritt 9 der Inbetriebnahme
# soll `ingressClassName: public` nur in Namespaces mit
# `homelab.io/zone: public` zulassen - bliebe der Wert hier auf `internal`,
# wäre whoami genau der Fall, den die Regel fangen soll, und sie ließe sich
# nicht einführen, ohne den Testdienst mitzunehmen.
#
# whoami hängt an beiden Controllern, hat also beide Zonen. Die Zuordnung
# nimmt trotzdem die stärkere: Ein Namespace mit einem einzigen öffentlichen
# Ingress ist öffentlich, und die Regel muss die Zone gegen die riskantere
# Seite auslegen, nicht gegen die häufigere.
#
zone: public
