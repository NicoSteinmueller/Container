# Produktiv-Cluster (talos-cp1).
#
# Kein Ingress-Objekt: Beide Controller lesen keine Kubernetes-Objekte, die
# Routen stehen in k8s/flux/network/ingress-*/DynamicConfig.yaml -
# `whoami.k8s.nico-steinmueller.de` intern, `whoami.nico-steinmueller.de`
# öffentlich. Das Chart liefert hier nur Deployment, Service und die
# NetworkPolicy, die beide Controller hereinlässt.
#
# Der interne Hostname muss im Heimnetz auf .231 zeigen (AdGuard oder
# Fritzbox) und hat im öffentlichen DNS nichts verloren.

service:
  type: ClusterIP

ingress:
  enabled: false

networkPolicy:
  # Ohne diese Zeilen greift nur das Default-Deny des Charts, und die
  # Controller kämen nicht an whoami heran. Seit ingress-public sind es zwei.
  ingressControllerNamespaces:
    - traefik-internal
    - traefik-public

ingressPublic:
  enabled: false

#
# Der Namespace steht in k8s/flux/core/namespaces/Restricted.yaml (mit
# `homelab.io/zone: public`), wie alle anderen.
#
createNamespace: false
