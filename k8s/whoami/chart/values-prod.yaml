# Produktiv-Cluster (talos-cp1).
#
# Ingress statt NodePort, seit ingress-internal steht
# (k8s/flux/clusters/talos-cp1/ingress-internal.yaml). whoami ist der
# Testdienst, an dem sich der Weg von außen zeigen soll - und der Weg ist
# jetzt der über den Controller, nicht mehr der über Port 30083.
#
# Das Zertifikat ist vorerst das selbstsignierte, das Traefik ohne
# konfigurierten Aussteller ausliefert; der Browser warnt. `tls.enabled`
# bleibt deshalb aus: Es verwiese auf ein Secret, das niemand füllt, und
# Traefik fiele auf dasselbe Zertifikat zurück. Beides kommt mit cert-manager
# und step-ca.
#
# Der Hostname muss im Heimnetz auf die LAN-Adresse des Nodes zeigen (AdGuard
# oder Fritzbox) und hat im öffentlichen DNS nichts verloren.

service:
  type: ClusterIP

ingress:
  enabled: true
  className: internal
  host: whoami.k8s.nico-steinmueller.de
  # TODO: aktivieren, sobald cert-manager und step-ca im Cluster stehen
  # annotations:
  #   cert-manager.io/cluster-issuer: step-ca
  # tls:
  #   enabled: true
  #   secretName: whoami-tls

networkPolicy:
  # Ohne diese Zeile greift nur das Default-Deny des Charts, und der
  # Controller käme nicht an whoami heran.
  ingressControllerNamespace: traefik-internal
