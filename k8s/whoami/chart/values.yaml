# Sichere Voreinstellung: kein Ingress, kein Netzwerkzugriff von außen.
# Umgebungen aktivieren das gezielt über values-<env>.yaml (siehe README).

namespace: whoami

# "internal" = nur aus dem Heimnetz erreichbar, "public" = aus dem Internet.
# Bestimmt, welche IngressClass in diesem Namespace zulässig sein soll.
zone: internal

image:
  repository: traefik/whoami
  tag: v1.12.0
  digest: sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44

replicaCount: 1

service:
  # NodePort für direkten LAN-Zugriff ohne Ingress-Controller (siehe
  # values-prod.yaml). ClusterIP + Ingress bleibt der Regelfall für alles,
  # was einen Hostnamen/TLS braucht.
  type: ClusterIP
  nodePort: null

resources:
  requests:
    cpu: 10m
    memory: 8Mi
  limits:
    cpu: 100m
    memory: 24Mi

networkPolicy:
  # Namespace des zuständigen Ingress-Controllers, von dem eingehender
  # Traffic erlaubt wird. Leer = niemand darf whoami ansprechen, auch nicht
  # der Ingress-Controller - der sichere Default ohne ingress.enabled.
  ingressControllerNamespaces: []

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""

#
# Der oeffentliche Ingress. Aus, und das ist die richtige Vorgabe: Ein
# Standardwert, der einen Dienst ins Internet stellt, ist der falsche - er
# wirkt in jeder Umgebung, in der ihn niemand ausdruecklich abgeschaltet hat.
#
ingressPublic:
  enabled: false
  className: ""
  host: ""
  annotations: {}
