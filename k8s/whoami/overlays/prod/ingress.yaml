apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: whoami
  annotations:
    # Entspricht der "local-only" Traefik-Middleware im Docker-Compose-Setup.
    nginx.ingress.kubernetes.io/whitelist-source-range: "192.168.178.0/24"
    # TODO: aktivieren, sobald cert-manager im Ziel-Cluster installiert ist
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - whoami.nico-steinmueller.de
      secretName: whoami-tls
  rules:
    - host: whoami.nico-steinmueller.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  name: http
