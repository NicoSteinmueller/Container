# ============================================
# KONFIGURIERBARE VARIABLEN (in Portainer ändern)
# ============================================
# | Variable                   | Beschreibung                    | Default       |
# |----------------------------|---------------------------------|---------------|
# | POSTGRES_PASSWORD          | Datenbank-Passwort              | changeme      |
# | NEXTCLOUD_DATA             | Pfad für Nextcloud-Daten        | ./data        |
# | PAPERLESS_DATA             | Pfad für Paperless-Daten        | ./data        |
# ============================================

services:
  # https://github.com/docker-library/docs/blob/master/nextcloud/README.md
  nextcloud:
    image: nextcloud:32.0.6-apache@sha256:5c4e09f72f096cd68379a8ae69f71e61d13da5a07430fc4a17c702a14e6a4267
    container_name: nextcloud
    restart: unless-stopped
#    ports:
#      - "38080:80"
    environment:
      POSTGRES_HOST: database
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}

      # Aktualisiert die htaccess-Datei (Sicherheitsregeln) automatisch, beim Starten des Containers.
      NEXTCLOUD_INIT_HTACCESS: true

      # Redis
      REDIS_HOST: redis

      # PHP-Limits
      # Maximale Speichergröße für PHP-Skripte (default: 512M)
#      PHP_MEMORY_LIMIT: 512M
      # Upload-Limit für große Dateien (setzt post_max_size und upload_max_filesize) (default: 512M)
      # evtl. müssen weitere Werte angepasst werden
      # https://docs.nextcloud.com/server/latest/admin_manual/configuration_files/big_file_upload_configuration.html
      PHP_UPLOAD_LIMIT: 50G

      # Apache-Limits
      # Maximale Größe des HTTP-Request-Body (default: 1073741824 = 1GiB, 0 = unbegrenzt)
      # https://docs.nextcloud.com/server/latest/admin_manual/configuration_files/big_file_upload_configuration.html#apache
      APACHE_BODY_LIMIT: 53687091200

    volumes:
      # gleiche wie cron Container, damit die Cron-Jobs Zugriff auf die gleichen Daten haben
      - nextcloud:/var/www/html # Main folder, needed for updating
      - ${NEXTCLOUD_DATA:-./data}/apps:/var/www/html/custom_apps # installed / modified apps
      - ${NEXTCLOUD_DATA:-./data}/config:/var/www/html/config # local configuration
      - ${NEXTCLOUD_DATA:-./data}/themes:/var/www/html/themes # theming/branding
      - ${NEXTCLOUD_DATA:-./data}/data:/var/www/html/data # the actual data of your Nextcloud
      - ${PAPERLESS_DATA:-./paperless}:/paperless-consume
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -f /var/www/html/status.php > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      nextcloud-network:
      proxy:
    labels:
      traefik.enable: true
      traefik.http.routers.nextcloud.rule: Host(`cloud.nico-steinmueller.de`)
      traefik.http.routers.nextcloud.entrypoints: websecure
      traefik.http.routers.nextcloud.middlewares: crowdsec@file, geoblock@file, compress@file
      traefik.http.routers.nextcloud.service: nextcloud
      traefik.http.services.nextcloud.loadbalancer.server.port: 80

  cron:
    image: nextcloud:32.0.6-apache@sha256:5c4e09f72f096cd68379a8ae69f71e61d13da5a07430fc4a17c702a14e6a4267
    container_name: nextcloud_cron
    restart: unless-stopped
    volumes:
      # gleiche wie nextcloud Container, damit die Cron-Jobs Zugriff auf die gleichen Daten haben
      - nextcloud:/var/www/html # Main folder, needed for updating
      - ${NEXTCLOUD_DATA:-./data}/apps:/var/www/html/custom_apps # installed / modified apps
      - ${NEXTCLOUD_DATA:-./data}/config:/var/www/html/config # local configuration
      - ${NEXTCLOUD_DATA:-./data}/themes:/var/www/html/themes # theming/branding
      - ${NEXTCLOUD_DATA:-./data}/data:/var/www/html/data # the actual data of your Nextcloud
      - ${PAPERLESS_DATA:-./paperless}:/paperless-consume
    entrypoint: /cron.sh
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f cron.sh || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - nextcloud-network

  database:
    image: postgres:17.9-alpine3.23@sha256:6f30057d31f5861b66f3545d4821f987aacf1dd920765f0acadea0c58ff975b1
    container_name: nextcloud_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - nextcloud-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  redis:
    image: docker.io/valkey/valkey:9.0.3-alpine3.23@sha256:ad4541b28b017bf4cd83ee057c51aafb21ea32e898e3f3b8b75e268650f2ac20
    container_name: nextcloud_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - nextcloud-network

volumes:
  nextcloud:
  postgres:

networks:
  nextcloud-network:
    name: nextcloud-network
  proxy:
    external: true
