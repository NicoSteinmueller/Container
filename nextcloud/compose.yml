name: nextcloud

services:
  # https://docs.linuxserver.io/images/docker-nextcloud
  nextcloud:
    # ------------ Identität ------------------------
    image: lscr.io/linuxserver/nextcloud:34.0.0@sha256:2e3e84d5f6fd09c4fce586a2de66a39990eb74e985463827387ad7434b82dd66
    container_name: nextcloud

    # ------------ Abhängigkeiten & Start -----------
    init: false
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f -k https://localhost/status.php || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 1.5
          memory: 2G
          pids: 128
        reservations:
          cpus: 0.1
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true
#    cap_drop:
#      - ALL
#    cap_add:
#      - CHOWN
#      - DAC_OVERRIDE
#      - SETGID
#      - SETUID


    # ---------- Environment -----------
    environment:
      # Configeinstellungen direkt in config vornehmen
      TZ: Europe/Berlin

  database:
    # ------------ Identität ------------------------
    image: postgres:18.4-alpine3.23@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
    container_name: nextcloud_postgres

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
          pids: 32
        reservations:
          memory: 50M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true
#    cap_drop:
#      - ALL

    # ---------- Environment -----------
    environment:
      TZ: Europe/Berlin
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud


  redis:
    # ------------ Identität ------------------------
    container_name: nextcloud_redis
    image: docker.io/valkey/valkey:9.1.0-alpine3.23@sha256:a35428eba9043cc0b79dbe54100f0c92784f2de00ad09b01182bfb1c5c83d1bd

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
          pids: 32
        reservations:
          memory: 16M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true
#    cap_drop:
#      - ALL
#    cap_add:
#      - CHOWN
#      - SETGID
#      - SETUID

    # ----------- Speicher -----------
    read_only: true
    tmpfs:
      - /data:rw,noexec,nosuid,size=8M

