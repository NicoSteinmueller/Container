name: nextcloud

services:
  # https://docs.linuxserver.io/images/docker-nextcloud
  nextcloud:
    # ------------ Identität ------------------------
    image: lscr.io/linuxserver/nextcloud:34.0.1@sha256:397d5e5bdf1d626ab3f160575f6b8415b6479f5f258607c902385e48c92f2045
    container_name: nextcloud

    # ------------ Abhängigkeiten & Start -----------
    init: false
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f -k https://localhost/status.php || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 1.5
          memory: 2G
          pids: 128
        reservations:
          cpus: 0.1
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true
#    cap_drop:
#      - ALL
#    cap_add:
#      - CHOWN
#      - DAC_OVERRIDE
#      - SETGID
#      - SETUID


    # ---------- Environment -----------
    environment:
      # Configeinstellungen direkt in config vornehmen
      TZ: Europe/Berlin

  database:
    # ------------ Identität ------------------------
    image: postgres:18.4-alpine3.23@sha256:865a3cfdac164ea2608bea36342a9bb5c11e99b5aa8ed9b83b662185e556e178
    container_name: nextcloud_postgres

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
          pids: 32
        reservations:
          memory: 50M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true
#    cap_drop:
#      - ALL

    # ---------- Environment -----------
    environment:
      TZ: Europe/Berlin
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud


  redis:
    # ------------ Identität ------------------------
    container_name: nextcloud_redis
    image: docker.io/valkey/valkey:9.1.0-alpine3.23@sha256:a35428eba9043cc0b79dbe54100f0c92784f2de00ad09b01182bfb1c5c83d1bd

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
          pids: 32
        reservations:
          memory: 16M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true
#    cap_drop:
#      - ALL
#    cap_add:
#      - CHOWN
#      - SETGID
#      - SETUID

    # ----------- Speicher -----------
    read_only: true
    tmpfs:
      - /data:rw,noexec,nosuid,size=8M

