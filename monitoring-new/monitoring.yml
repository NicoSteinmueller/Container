#https://signoz.io/guides/how-to-install-prometheus-and-grafana-on-docker/
# https://last9.io/blog/grafana-and-docker/
# https://grafana.com/oss/alloy-opentelemetry-collector/
services:
  # Das Gehirn: Visualisierung
  # https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/
  grafana:
    image: grafana/grafana:13.0.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - # https://grafana.com/docs/grafana/latest/setup-grafana/configure-docker/
      # TODO Daten Pfad (Appdata)
      - grafana-data:/var/lib/grafana
    environment:
      # https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/
      # https://grafana.com/grafana/plugins
      GF_PLUGINS_PREINSTALL: grafana-clock-panel
#      GF_SERVER_ROOT_URL:
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: grafana # TODO ändern
      GF_ANALYTICS_REPORTING_ENABLED: false # Telemetrie deaktivieren
      GF_ANALYTICS_CHECK_FOR_UPDATES: false # Update-Checks deaktivieren
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: false # Plugin-Update-Checks deaktivieren
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: true # Admin-User wird über Umgebungsvariablen erstellt
      # GF_SECURITY_ADMIN_PASSWORD: admin # Bitte später ändern
      GF_USERS_DEFAULT_LANGUAGE: de
      GF_AUTH_DISABLE_LOGIN_FORM: true # Login-Formular deaktivieren
      GF_AUTH_SIGNOUT_REDIRECT_URL: http://localhost:8087/realms/grafana/protocol/openid-connect/logout?post_logout_redirect_uri=http%3A%2F%2Flocalhost%3A3000%2Flogin # TODO: auf Keycloak anpassen

      # oauth2: https://grafana.com/docs/grafana/latest/setup-grafana/configure-access/configure-authentication/keycloak/
      GF_AUTH_GENERIC_OAUTH_ENABLED: true
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: true
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: grafana # TODO ändern
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile offline_access roles
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_NAME: email
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_NAME: username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_NAME: full_name
      # TODO URLs anpassen
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://<PROVIDER_DOMAIN>/realms/<REALM_NAME>/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://<PROVIDER_DOMAIN>/realms/<REALM_NAME>/protocol/openid-connect/token
      # Optional, falls alle User-Infos über das ID-Token kommen, ansonsten wird die Userinfo-URL benötigt (kann latency beim Login erhöhen)
      GF_AUTH_GENERIC_OAUTH_API_URL: https://<PROVIDER_DOMAIN>/realms/<REALM_NAME>/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || 'Viewer'

      # smtp

      GF_DATE_FORMATS_FULL_DATE: DD.MM.YYYY HH:mm:ss
      GF_DATE_FORMATS_INTERVAL_SECOND: HH:mm:ss
      GF_DATE_FORMATS_INTERVAL_MINUTE: HH:mm
      GF_DATE_FORMATS_INTERVAL_HOUR: DD.MM. HH:mm
      GF_DATE_FORMATS_INTERVAL_DAY: DD.MM.
      GF_DATE_FORMATS_INTERVAL_MONTH: MM.YYYY
      GF_DATE_FORMATS_INTERVAL_YEAR: YYYY
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Europe/Berlin


    networks:
      - monitoring

  # Die Datenbank für Metriken (Performance)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver' # WICHTIG: Damit Alloy Daten schicken darf
    networks:
      - monitoring

  # Die Datenbank für Logs
  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring

  # Der Sammler: Grafana Alloy
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # Für Container-Infos
      - /var/lib/docker/containers:/var/lib/docker/containers:ro # Für Logs
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    networks:
      - monitoring

  # Liefert Hardware-Daten (CPU, RAM) vom Host
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    networks:
      - monitoring

volumes:
  grafana-data:

networks:
  monitoring: