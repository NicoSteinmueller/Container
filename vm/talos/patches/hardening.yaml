#
# Härtung über die Talos-Defaults hinaus.
#
# Talos ist ab Werk CIS-konform (read-only rootfs, kein SSH, keine Shell,
# KSPP-Kernel, PodSecurity-Admission aktiv). Hier steht nur, was Talos
# standardmäßig anders setzt, als es für einen Cluster hinter einer ins
# Internet exponierten Edge-VM sinnvoll ist.
#
cluster:
  #
  # Cluster-Member-Discovery komplett aus. Übernommen aus vm/talos-test, dort
  # ausführlich begründet:
  #
  #   service    - meldet Cluster-Metadaten an discovery.talos.dev. Client-
  #                seitig verschlüsselt, verlässt aber das eigene Netz.
  #   kubernetes - laut Talos-Doku deprecated und nicht kompatibel mit
  #                Kubernetes 1.32+; erzeugt eine Endlosschleife aus
  #                "nodes is forbidden"-Warnungen.
  #
  # Nodes treten über ihre Machine-Config bei, nicht über Discovery. Es
  # entfallen nur `talosctl get members` und KubeSpan.
  #
  # Beide Registries werden zusätzlich einzeln abgeschaltet: das globale
  # enabled:false allein stoppt den KubernetesPullController nicht. Die
  # Änderung greift erst nach einem Reboot.
  #
  discovery:
    enabled: false

    registries:
      kubernetes:
        disabled: true
      service:
        disabled: true

machine:
  #
  # Talos hält den Kernel bereits nach KSPP-Empfehlung. Ergänzt wird nur, was
  # für einen Node mit zwei Beinen zählt:
  #
  sysctls:
    #
    # Anders als auf der Edge-VM bleibt ip_forward hier an - ein Kubernetes-
    # Node ist per Definition ein Router für seine Pods, und Kubelet wie
    # Cilium setzen den Wert ohnehin. Die Grenze zwischen DMZ und LAN wird
    # deshalb nicht über den Weiterleitungsschalter gezogen, sondern über
    # zwei andere Kontrollen:
    #
    #   - die Talos-Ingress-Firewall (patches/ingress-firewall.yaml.tftpl):
    #     eingehend nur die drei DMZ-Ports von der Edge-VM
    #   - Default-Deny-NetworkPolicies pro Namespace mit ipBlock-Ausschluss
    #     der privaten Netze (k8s/platform)
    #
    # Was das ausdrücklich nicht ist: eine Trennung auf Netzebene. Wer im
    # Cluster Node-Rechte erlangt, hat beide Beine - das steht so auch im
    # Konzept unter Restrisiken.

    # Reverse-Path-Filter strikt: Pakete, deren Quelle über ein anderes
    # Interface zurückliefe, werden verworfen. Verhindert, dass eine
    # gefälschte LAN-Quelladresse über das DMZ-Bein hereinkommt.
    net.ipv4.conf.all.rp_filter: "1"
    net.ipv4.conf.default.rp_filter: "1"

    # Keine Redirects annehmen oder senden - beides ist ein Weg, die
    # Routingtabelle von außen zu beeinflussen.
    net.ipv4.conf.all.accept_redirects: "0"
    net.ipv4.conf.default.accept_redirects: "0"
    net.ipv4.conf.all.send_redirects: "0"
    net.ipv4.conf.default.send_redirects: "0"
    net.ipv4.conf.all.accept_source_route: "0"

    # IPv6 aus. Wie auf der Edge-VM: Die Fritzbox filtert v6 unabhängig von
    # v4, und eine globale v6-Adresse wäre an jeder v4-Regel vorbei
    # erreichbar. Erst einschalten, wenn der v6-Pfad bewusst durchdacht ist -
    # dann aber auch in vm/edge und in der Ingress-Firewall.
    net.ipv6.conf.all.disable_ipv6: "1"
    net.ipv6.conf.default.disable_ipv6: "1"

    #
    # Erlaubt unprivilegierten Prozessen das Binden von Ports unter 1024.
    #
    # Gebraucht wird das von den beiden Ingress-Controllern: Sie laufen mit
    # hostNetwork (unvermeidlich, siehe k8s/platform/values/traefik-*.tftpl)
    # und binden 80 und 443 selbst, dabei als UID 65532.
    #
    # Der naheliegende Weg - capabilities.add: [NET_BIND_SERVICE] - trägt
    # nicht. Ein Nicht-Root-Prozess behält Capabilities über execve hinweg nur
    # per File-Capability auf dem Binary oder per Ambient Capabilities; das
    # Traefik-Image hat keine, und Ambient Caps kann Kubernetes in dieser
    # Version noch nicht setzen. Der Start scheitert sonst an:
    #
    #   error opening listener: listen tcp 192.168.178.222:443:
    #     bind: permission denied
    #
    # Zur Reichweite, denn die ist der Grund, warum das hier vertretbar ist:
    # Der Wert ist pro Netzwerk-Namespace. Gewöhnliche Pods haben ihren
    # eigenen und behalten dort die 1024. Betroffen ist nur der Namespace des
    # Hosts - und dort dürfen ohnehin nur Pods hinein, deren Namespace auf
    # PodSecurity "privileged" steht. Die Alternative wäre, Traefik als root
    # laufen zu lassen; das wäre die deutlich größere Zugeständnis.
    #
    net.ipv4.ip_unprivileged_port_start: "0"

  kubelet:
    #
    # Seccomp-Default für alle Container ohne eigenes Profil. Ohne das läuft
    # ein Pod ohne securityContext mit ungefiltertem Syscall-Zugang.
    #
    defaultRuntimeSeccompProfileEnabled: true

    #
    # Nicht hier, sondern in patches/kubelet-server-certs.yaml:
    # serverTLSBootstrap.
    #
    # Es gehört sachlich in diese Datei, steht aber in einer eigenen, weil es
    # als einziger Punkt der Härtung eine Gegenstelle im Cluster braucht -
    # einen Genehmiger für die Zertifikatsanträge des Kubelets. Ohne ihn ist
    # die Einstellung nicht bloß wirkungslos, sondern schädlich, und der
    # Talos-Health-Check bricht den Lauf ab.
    #
    # Deshalb ist sie schaltbar (var.kubelet_server_certs) und nicht Teil
    # dieser Datei, die immer gilt.
