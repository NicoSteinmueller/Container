#
# Entfernt das HostnameConfig-Dokument, das Talos bei der Config-Erzeugung
# selbst anlegt (kind: HostnameConfig, auto: stable). Der Hostname steht in
# node.yaml.tftpl unter machine.network.hostname.
#
# Der Hostname wird zum Kubernetes-Node-Namen und für Kubelet-Zertifikate
#  und etcd genutzt.
#
apiVersion: v1alpha1
kind: HostnameConfig
$patch: delete
