---
- name: Install Terraform on Ubuntu/Debian
  hosts: all
  become: true

  vars:
    terraform_keyring: "/usr/share/keyrings/hashicorp-archive-keyring.gpg"
    terraform_repo: "https://apt.releases.hashicorp.com"

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true

    - name: Create keyring directory
      ansible.builtin.file:
        path: "{{ terraform_keyring | dirname }}"
        state: directory
        mode: "0755"

    - name: Download HashiCorp signing key
      ansible.builtin.get_url:
        url: "{{ terraform_repo }}/gpg"
        dest: /tmp/hashicorp-gpg
        mode: "0644"

    - name: Dearmor HashiCorp signing key
      ansible.builtin.command:
        cmd: >-
          gpg --dearmor --yes
          --output {{ terraform_keyring }}
          /tmp/hashicorp-gpg
        creates: "{{ terraform_keyring }}"
      changed_when: false

    - name: Remove temporary signing key
      ansible.builtin.file:
        path: /tmp/hashicorp-gpg
        state: absent

    - name: Add HashiCorp apt repository
      ansible.builtin.deb822_repository:
        name: hashicorp
        types:
          - deb
        uris:
          - "{{ terraform_repo }}"
        suites:
          - "{{ ansible_facts['distribution_release'] }}"
        components:
          - main
        signed_by: "{{ terraform_keyring }}"

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Terraform
      ansible.builtin.apt:
        name: terraform
        state: present

    - name: Show installed Terraform version
      ansible.builtin.command:
        cmd: terraform version -json
      register: terraform_version_output
      changed_when: false

    - name: Print Terraform version
      ansible.builtin.debug:
        msg: "Terraform installed: {{ terraform_version_output.stdout }}"


