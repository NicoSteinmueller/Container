#
# Acquisition: Traefik-Access-Log - von Terraform ausgerollt nach
# /etc/crowdsec/acquis.d/traefik.yaml. NICHT auf der VM bearbeiten.
#
# Das ist die Datengrundlage von Stufe 2: 404-Stürme, CVE-Scans und
# 401-Muster. Der Parser der Collection crowdsecurity/traefik liest das
# JSON-Format, das in traefik.yml eingestellt ist.
#
# Die Client-IP in diesen Zeilen ist die echte Peer-Adresse - Traefik verwirft
# am EntryPoint alles, was der Client an X-Forwarded-* mitschickt. Steht hier
# je die Adresse der Edge-VM selbst, ist genau der Fehler passiert, vor dem das
# Konzept warnt: Dann bannt CrowdSec am Ende den gesamten Zugang.
#
# Bewusst nicht mit aufgenommen: /var/log/traefik/traefik.log. Für Traefiks
# eigenes Systemlog gibt es keinen Parser, es enthält keine Client-IPs und
# würde nur Rauschen erzeugen.
#
filenames:
  - /var/log/traefik/access.log
labels:
  type: traefik
