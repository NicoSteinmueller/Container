#
# Härtung über die Talos-Defaults hinaus.
#
# Talos ist ab Werk CIS-konform (read-only rootfs, kein SSH, KSPP-Kernel,
# PodSecurity-Admission aktiv). Hier stehen nur die Punkte, die Talos
# standardmäßig anders setzt, als es für einen ins Internet exponierten
# Cluster sinnvoll ist.
#
cluster:
  # Cluster-Member-Discovery komplett aus.
  #
  # Beide verfügbaren Registries scheiden aus:
  #
  #   service    - meldet Cluster-Metadaten (Cluster-ID, Node-IPs, Talos-
  #                Version) an den öffentlichen Endpoint discovery.talos.dev.
  #                Clientseitig verschlüsselt, verlässt aber das eigene Netz.
  #
  #   kubernetes - laut Talos-Doku deprecated und "not compatible with
  #                Kubernetes 1.32+" (siderolabs/talos#9980). Der
  #                KubernetesPullController listet Nodes mit der
  #                Kubelet-Identität system:node:<name>; der Node-Authorizer
  #                verbietet das per Design. Ergebnis ist eine Endlosschleife
  #                aus "nodes is forbidden"-Warnungen im Talos-Log.
  #
  # Discovery ist für den Clusterbetrieb nicht erforderlich - Nodes treten
  # über ihre Machine-Config bei, nicht über Discovery. Es entfallen lediglich
  # die Member-Liste in `talosctl get members` und KubeSpan. Beides wird hier
  # nicht gebraucht; bei einem späteren Multi-Node-Cluster ist das neu
  # abzuwägen.
  # Beide Registries werden zusätzlich einzeln abgeschaltet: das globale
  # enabled:false allein stoppt den KubernetesPullController nicht - er läuft
  # weiter und produziert die "nodes is forbidden"-Warnungen.
  #
  # Wichtig: Die Änderung greift erst nach einem Reboot. `talosctl apply-config`
  # bzw. talos_machine_configuration_apply im Modus "auto" schreibt sie zwar
  # live in die Config (nachprüfbar per `talosctl get machineconfig`), der
  # bereits laufende Controller wird davon aber nicht beendet. Nach dem Patch
  # also `talosctl reboot --wait`.
  discovery:
    enabled: false

    registries:
      kubernetes:
        disabled: true
      service:
        disabled: true
