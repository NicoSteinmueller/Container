#cloud-config
hostname: ${hostname}
manage_etc_hosts: true

timezone: ${timezone}

package_update: true
package_upgrade: true
packages:
  - qemu-guest-agent

users:
  - default
  - name: ${username}
    groups: [adm, sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ssh_public_key}

ssh_pwauth: false
disable_root: true

runcmd:
  - systemctl enable --now qemu-guest-agent

