name: sftpgo

services:
  sftpgo:
    # ------------ Identität ------------------------
    container_name: sftpgo
    image: drakkan/sftpgo:v2.7.4-alpine@sha256:85d3e628625b487dea0a1950d18b7ad76a9f9736e1e10ce5b932b0065b770163

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      database:
        condition: service_healthy

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512M
          pids: 64
        reservations:
          cpus: 0.05
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE

    # ----------- Speicher -----------
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    # ---------- Environment -----------
    environment:
      TZ: Europe/Berlin
      # Zeit nach der ein inaktiver Benutzer automatisch abgemeldet wird (in Minuten, 0 = deaktiviert)
      SFTPGO_COMMON__IDLE_TIMEOUT: 15
      # Upload Mode:
      #   0 = Dateien werden direkt im Ziel abgelegt (kann zu korrupten Dateien bei Abbrüchen führen)
      #   1 = Dateien werden in temporären Pfad hochgeladen und im Anschluss ins Zielverzeichnis umbenannt
      #   2 = atomic mit Resume-Support (verhindert korrupte Dateien bei Abbrüchen + ermöglicht Wiederaufnahme)
      SFTPGO_COMMON__UPLOAD_MODE: 2
      # Berechtigungsänderungen:
      #   0 = normal mode (Änderungen werden ausgeführt)
      #   1 = ignore mode (Änderungen werden ignoriert)
      SFTPGO_COMMON__SETSTAT_MODE: 0
      # Proxy Protocol:
      #   0 = deaktiviert (Standard)
      #   1 = aktiviert. Proxy Header wird versucht zu lesen, aber ignoriert wenn upstream IP nicht erlaubt ist
      #   2 = erforderlich. Verbindung wird abgelehnt wenn upstream IP nicht erlaubt ist aber Proxy Header gefunden wird
      # Traefik sendet kein PROXY Protocol über HTTP-Backends
      SFTPGO_COMMON__PROXY_PROTOCOL: 1
      # Liste erlaubter Proxy-IPs (Kommasepariert).
      # 172.16.0.0/12 = alle Docker-Standard-Netzwerke (172.16.0.0 bis 172.31.255.255)
      # Kann überschrieben werden mit PROXY_ALLOWED Umgebungsvariable
      SFTPGO_COMMON__PROXY_ALLOWED: 172.16.0.0/12
      # IPs, die von Proxy-Checks übersprungen werden sollen (optional)
      # Localhost (::1, 127.0.0.1) überspringen für Healthchecks
      SFTPGO_COMMON__PROXY_SKIPPED: ::1,127.0.0.1
      # Maximale Anzahl gleichzeitiger Verbindungen (0 = unbegrenzt)
      SFTPGO_COMMON__MAX_TOTAL_CONNECTIONS: 300
      # Maximale Anzahl gleichzeitiger Verbindungen pro Host (0 = unbegrenzt)
      SFTPGO_COMMON__MAX_PER_HOST_CONNECTIONS: 30
      # ------------------------------------------------------------------
      # Defender Einstellungen (Brute-Force Schutz)
      # Defender aktivieren/deaktivieren
      SFTPGO_COMMON__DEFENDER__ENABLED: true
      # Treiber:
      #   memory = im Speicher (Standard, schneller bei einer Instanz)
      #   provider = Datenbank (MySQL, Postgres)
      SFTPGO_COMMON__DEFENDER__DRIVER: memory
      # Zeit (in Minuten), die eine IP gesperrt bleibt
      SFTPGO_COMMON__DEFENDER__BAN_TIME: 30
      # Erhöhung der Sperrzeit in Prozent für jede weitere Sperrung
      SFTPGO_COMMON__DEFENDER__BAN_TIME_INCREMENT: 50
      # Schwellenwert für das Sperren eines Clients
      SFTPGO_COMMON__DEFENDER__THRESHOLD: 15
      # Score für ungültige Login-Versuche (nicht existierende Benutzer)
      SFTPGO_COMMON__DEFENDER__SCORE_INVALID: 1
      # Score für gültige Login-Versuche (existierende Benutzer mit falschem Passwort)
      SFTPGO_COMMON__DEFENDER__SCORE_VALID: 1
      # Score für Hosts, die Rate Limits oder max. Verbindungen überschritten haben
      SFTPGO_COMMON__DEFENDER__SCORE_LIMIT_EXCEEDED: 3
      # Score für Clients, die ohne Authentifizierungsversuch getrennt wurden
      SFTPGO_COMMON__DEFENDER__SCORE_NO_AUTH: 0
      # Beobachtungszeitraum in Minuten (Zeit für Fehler-Tracking)
      SFTPGO_COMMON__DEFENDER__OBSERVATION_TIME: 60
      # Soft Limit für Einträge im Speicher (nur für memory driver)
      SFTPGO_COMMON__DEFENDER__ENTRIES_SOFT_LIMIT: 100
      # Hard Limit für Einträge im Speicher (memory driver) bzw. max. zurückgegebene Einträge (provider driver)
      SFTPGO_COMMON__DEFENDER__ENTRIES_HARD_LIMIT: 150
      # Verzögerung bei erfolgreichen Logins in Millisekunden (0 = deaktiviert)
      SFTPGO_COMMON__DEFENDER__LOGIN_DELAY__SUCCESS: 0
      # Verzögerung bei fehlgeschlagenen Passwort-Logins in Millisekunden (Brute-Force Schutz)
      SFTPGO_COMMON__DEFENDER__LOGIN_DELAY__PASSWORD_FAILED: 1000
      # -------------------------------------------------------------------
      # Rate Limiting Einstellungen
      # Maximale durchschnittliche Anzahl von Anfragen pro Zeitraum (0 = deaktiviert)
      SFTPGO_COMMON__RATE_LIMITERS__0__AVERAGE: 100
      # Zeitraum in Millisekunden für Rate Limiting (Standard: 1000ms = 1 Sekunde)
      SFTPGO_COMMON__RATE_LIMITERS__0__PERIOD: 1000
      # Burst = maximale Anzahl zusätzlicher Anfragen in sehr kurzer Zeit
      SFTPGO_COMMON__RATE_LIMITERS__0__BURST: 10
      # Typ:
      #  1 = global
      #  2 = pro IP
      SFTPGO_COMMON__RATE_LIMITERS__0__TYPE: 2
      # Protokolle, auf die das Rate Limiting angewendet wird (Kommaseparierte Liste)
      SFTPGO_COMMON__RATE_LIMITERS__0__PROTOCOLS: SSH,FTP,DAV,HTTP
      # Generiere Defender Events bei Überschreitung des Rate Limits
      SFTPGO_COMMON__RATE_LIMITERS__0__GENERATE_DEFENDER_EVENTS: false
      # Wenn diese Anzahl überschritten wird, beginnt SFTPGo alte Einträge aufzuräumen
      SFTPGO_COMMON__RATE_LIMITERS__0__ENTRIES_SOFT_LIMIT: 100
      # Absolute Obergrenze für Einträge im Speicher. Älteste Einträge werden entfernt, wenn diese Grenze erreicht wird
      SFTPGO_COMMON__RATE_LIMITERS__0__ENTRIES_HARD_LIMIT: 150
      # ------------------------------------------------------
      # SFTP Server Einstellungen
      # SFTP Port (0 = deaktiviert)
      SFTPGO_SFTPD__BINDINGS__0__PORT: 2022
      # SFTP Adresse (leer lassen für alle Interfaces)
      SFTPGO_SFTPD__BINDINGS__0__ADDRESS: 0.0.0.0
      # Maximale Anzahl von Authentifizierungsversuchen pro Verbindung
      SFTPGO_SFTPD__MAX_AUTH_TRIES: 3
      # Passwort Authentifizierung aktivieren/deaktivieren
      # Mit false ist nur Public-Key-Authentifizierung möglich. Multi-Faktor-Authentifizierung wird ebenfalls deaktiviert.
      SFTPGO_SFTPD__PASSWORD_AUTHENTICATION: false
      # ------------------------------------------------------
      # FTP Server Einstellungen
      # FTP Port (0 = deaktiviert)
      SFTPGO_FTPD__BINDINGS__0__PORT: 0
      # Deaktiviere den aktiven FTP-Modus (nur passiver Modus erlaubt)
      SFTPGO_FTPD__DISABLE_ACTIVE_MODE: true
      # ------------------------------------------------------
      # WebDAV Server Einstellungen
      # WebDAV Port (0 = deaktiviert)
      SFTPGO_WEBDAV__BINDINGS__0__PORT: 0
      # ------------------------------------------------------
      # Provider Einstellungen
      # Datenbank-Treiber: sqlite, mysql, postgresql, cockroachdb, bolt, memory
      SFTPGO_DATA_PROVIDER__DRIVER: postgresql
      # Datenbank-Name
      SFTPGO_DATA_PROVIDER__NAME: sftpgo
      # Datenbank-Host
      SFTPGO_DATA_PROVIDER__HOST: database
      # Datenbank-Port
      SFTPGO_DATA_PROVIDER__PORT: 5432
      # Datenbank-Benutzer
      SFTPGO_DATA_PROVIDER__USERNAME: sftpgo
      # Track Quota:
      #   0 = deaktiviert
      #   1 = aktiviert mit Quota-Update bei Uploads/Downloads
      #   2 = aktiviert mit verzögertem Quota-Update (empfohlen für Performance)
      SFTPGO_DATA_PROVIDER__TRACK_QUOTA: 2
      # Basis-Verzeichnis für Benutzerdaten (leer = /srv/sftpgo/data)
      SFTPGO_DATA_PROVIDER__USERS_BASE_DIR: /srv/sftpgo/data
      # Pfad für Backups
      SFTPGO_DATA_PROVIDER__BACKUPS_PATH: /srv/sftpgo/backups
      # ------------------------------------------------------
      # HTTP Server Einstellungen (REST API, WebAdmin, WebClient)
      # Binding 0: WebClient (öffentlich über NPM, Port 8080)
      SFTPGO_HTTPD__BINDINGS__0__PORT: 8080
      # Adresse für HTTP Server (leer lassen für alle Interfaces)
      SFTPGO_HTTPD__BINDINGS__0__ADDRESS: 0.0.0.0
      # WebAdmin Interface deaktivieren (nur auf Binding 1)
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_ADMIN: true
      # WebClient Interface aktivieren
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_CLIENT: true
      # REST API deaktivieren (nur auf Binding 1)
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_REST_API: false
      # Proxy Mode
      #   0 = deaktiviert (Standard)
      #   1 = Einstellung aus Common Section verwenden
      SFTPGO_HTTPD__BINDINGS__0__PROXY_MODE: 1
      # Liste erlaubter Proxy-IPs für dieses Binding (optional, überschreibt Common-Einstellung)
      SFTPGO_HTTPD__BINDINGS__0__PROXY_ALLOWED: 172.16.0.0/12
      # Header, der die echte Client-IP enthält (z.B. X-Forwarded-For, X-Real-IP, CF-Connecting-IP)
      SFTPGO_HTTPD__BINDINGS__0__CLIENT_IP_PROXY_HEADER: X-Forwarded-For
      # Anzahl der vertrauenswürdigen Proxies (von rechts gezählt)
      # 1 = nur letzter Proxy ist vertrauenswürdig (Standard für NPM)
      # 2+ = mehrere Proxies in der Kette
      SFTPGO_HTTPD__BINDINGS__0__CLIENT_IP_HEADER_DEPTH: 1
      # Hide Login URL:
      #   0 = Login-Links werden auf beiden Seiten angezeigt (Standard)
      #   1 = Link zur WebClient-Login-Seite wird auf Admin-Login-Seite versteckt
      #   2 = Link zur WebAdmin-Login-Seite wird auf Client-Login-Seite versteckt
      #   3 = beide Login-Links werden versteckt
      SFTPGO_HTTPD__BINDINGS__0__HIDE_LOGIN_URL: 0
      # OpenAPI Schema aktivieren
      SFTPGO_HTTPD__BINDINGS__0__RENDER_OPENAPI: false
      # Sprache (unterstützt: en, it, de, fr)
      SFTPGO_HTTPD__BINDINGS__0__LANGUAGES: de
      # --------------------------------------------------------
      # Sicherheitseinstellungen für HTTPD
      # Sicherheitskonfiguration aktivieren/deaktivieren
      SFTPGO_HTTPD__BINDINGS__0__SECURITY__ENABLED: true
      # Erlaubte Hostnamen (leer = alle erlaubt, empfohlen: Ihre Domain angeben)
      # Beispiel: example.com,sftpgo.example.com
      SFTPGO_HTTPD__BINDINGS__0__SECURITY__ALLOWED_HOSTS: sftpgo.nico-steinmueller.de,localhost:8080
      # Liste an Header Keys, die die tatsächliche Hostname-Information enthalten (z.B. X-Forwarded-Host)
      SFTPGO_HTTPD__BINDINGS__0__SECURITY__HOSTS_PROXY_HEADERS: X-Forwarded-Host
      # HTTPS Redirect aktivieren (nur wenn hinter Reverse Proxy mit HTTPS)
      SFTPGO_HTTPD__BINDINGS__0__SECURITY__HTTPS_REDIRECT: false
      # Liste an Header Keys für HTTPS-Erkennung
      SFTPGO_HTTPD__BINDINGS__0__SECURITY__HTTPS_PROXY_HEADERS: X-Forwarded-Proto
      # HTTP Strict Transport Security (HSTS) in Sekunden (0 = deaktiviert)
      # Empfohlen: 31536000 (1 Jahr) nur wenn Sie sicher sind, dass HTTPS immer verfügbar ist
      SFTPGO_HTTPD__BINDINGS__0__SECURITY__STS_SECONDS: 31536000
      # HSTS auch für Subdomains aktivieren
      SFTPGO_HTTPD__BINDINGS__0__SECURITY__STS_INCLUDE_SUBDOMAINS: false
      # HSTS Preload aktivieren (nur mit STS_SECONDS >= 31536000)
      SFTPGO_HTTPD__BINDINGS__0__SECURITY__STS_PRELOAD: true
      # X-Content-Type-Options Header setzen (verhindert MIME-Sniffing Angriffe)
      SFTPGO_HTTPD__BINDINGS__0__SECURITY__CONTENT_TYPE_NOSNIFF: true
      # Content Security Policy (CSP) - kontrolliert, welche Ressourcen geladen werden dürfen
      SFTPGO_HTTPD__BINDINGS__0__SECURITY__CONTENT_SECURITY_POLICY: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'"
      # Permissions Policy - beschränkt Browser-Features (Kamera, Mikrofon, etc.)
      SFTPGO_HTTPD__BINDINGS__0__SECURITY__PERMISSIONS_POLICY: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      # Cross-Origin Opener Policy - verhindert Cross-Origin-Zugriffe auf das Fenster
      SFTPGO_HTTPD__BINDINGS__0__SECURITY__CROSS_ORIGIN_OPENER_POLICY: "same-origin"
      # Cross-Origin Resource Policy - schützt Ressourcen vor Cross-Origin-Zugriffen
      SFTPGO_HTTPD__BINDINGS__0__SECURITY__CROSS_ORIGIN_RESOURCE_POLICY: "same-origin"
      # Cross-Origin Embedder Policy - verhindert Laden von Cross-Origin-Ressourcen ohne CORS
      SFTPGO_HTTPD__BINDINGS__0__SECURITY__CROSS_ORIGIN_EMBEDDER_POLICY: "require-corp"
      # Referrer Policy - kontrolliert, welche Referrer-Informationen gesendet werden
      SFTPGO_HTTPD__BINDINGS__0__SECURITY__REFERRER_POLICY: "strict-origin-when-cross-origin"
      # Cache Control - verhindert Caching sensibler Daten
      SFTPGO_HTTPD__BINDINGS__0__SECURITY__CACHE_CONTROL: "private, no-store, no-cache, must-revalidate"
      # --------------------------------------------------------
      # Branding Einstellungen
      # WebAdmin Branding
      # Name
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_ADMIN__NAME: SFTPGo Admin-Server
      # Kurzname
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_ADMIN__SHORT_NAME: SFTPGo Admin
      # Favicon Datei Pfad (in Static Files Verzeichnis)
      #SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_ADMIN__FAVICON_PATH: /var/lib/favicon.ico
      # Logo Datei Pfad 256x256 px empfohlen (in Static Files Verzeichnis)
      #SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_ADMIN__LOGO_PATH: /var/lib/logo.png
      # WebClient Branding
      # Name
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_CLIENT__NAME: SFTPGo Server
      # Kurzname
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_CLIENT__SHORT_NAME: SFTPGo
      # Favicon Datei Pfad (in Static Files Verzeichnis)
      #SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_CLIENT__FAVICON_PATH: /var/lib/favicon.ico
      # Logo Datei Pfad 256x256 px empfohlen (in Static Files Verzeichnis)
      #SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_CLIENT__LOGO_PATH: /var/lib/logo.png
      # --------------------------------------------------------
      # Sponsoren Link verstecken
      SFTPGO_HTTPD__HIDE_SUPPORT_LINK: true
      ###########################################################
      # TODO: Telemetrie
      # bietet die Endpunkte /healthz und /metrics (opt. /debug/pprof/ bei Profiler aktiv)
      # Telemetrie Port (0 = deaktiviert)
      SFTPGO_TELEMETRY__BIND_PORT: 0
      # Telemetrie Adresse (leer lassen für alle Interfaces, Standard: 127.0.0.1)
      SFTPGO_TELEMETRY__BIND_ADDRESS: 127.0.0.1
      # Profiler aktivieren
      SFTPGO_TELEMETRY__ENABLE_PROFILER: false
      ###############################################################
      # MFA Einstellungen
      # Name der TOTP-Konfiguration (sollte nicht geändert werden, wenn bereits Benutzer sie verwenden)
      SFTPGO_MFA__TOTP__0__NAME: Default
      # Name der ausstellenden Organisation (wird in der Authenticator-App angezeigt)
      SFTPGO_MFA__TOTP__0__ISSUER: SFTPGo
      # Algorithmus für HMAC (sha1, sha256, sha512)
      SFTPGO_MFA__TOTP__0__ALGO: sha1
      ###############################################################
      # SMTP Einstellungen (E-Mail Versand)
      # SMTP Server Adresse (Leer lassen um E-Mail Versand zu deaktivieren)
      SFTPGO_SMTP__HOST:

  database:
    # ------------ Identität ------------------------
    image: postgres:18.4-alpine3.23@sha256:865a3cfdac164ea2608bea36342a9bb5c11e99b5aa8ed9b83b662185e556e178
    container_name: sftpgo_postgres

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sftpgo -d sftpgo" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 5s

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
          pids: 32
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # ---------- Environment -----------
    environment:
      POSTGRES_USER: sftpgo
      POSTGRES_DB: sftpgo
      POSTGRES_INITDB_ARGS: '--data-checksums'
      TZ: Europe/Berlin
