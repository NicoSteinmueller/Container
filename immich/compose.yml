name: immich

services:
  immich:
    # ------------ Identität ------------------------
    container_name: immich
    image: ghcr.io/immich-app/immich-server:v2.7.5@sha256:c15bff75068effb03f4355997d03dc7e0fc58720c2b54ad6f7f10d1bc57efaa5

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      disable: false
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
      immich-machine-learning:
        condition: service_healthy

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 2G
          pids: 128
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Speicher -----------
    read_only: true
    volumes:
      - /etc/localtime:/etc/localtime:ro

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # ---------- Environment -----------
    environment:
      TZ: Europe/Berlin
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich


  immich-machine-learning:
    # ------------ Identität ------------------------
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v2.7.5@sha256:a2501141440f10516d329fdfba2c68082e19eb9ba6016c061ac80d23beadf7f3

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      disable: false

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 2G
          pids: 256
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # ----------- Speicher -----------
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m


  redis:
    # ------------ Identität ------------------------
    container_name: immich_redis
    # TODO - Alpine
    image: docker.io/valkey/valkey:9.1.0-trixie@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
          pids: 32
        reservations:
          memory: 16M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

    # ----------- Speicher -----------
    read_only: true
    tmpfs:
      - /data:rw,noexec,nosuid,size=8M

  database:
    # ------------ Identität ------------------------
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3-pgvector0.8.1@sha256:65538806314b93e2a8efea4acd78d2b348606eb2bd921b1494ce5b241f6ffbdf

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      disable: false

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 1.5
          memory: 1G
          pids: 64
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # ----------- Speicher -----------
    shm_size: 128mb

    # ---------- Environment -----------
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
      TZ: Europe/Berlin

