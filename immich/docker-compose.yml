# WARNING: To install Immich, follow our guide: https://docs.immich.app/install/docker-compose
#
# Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.
#
# https://docs.immich.app/install/environment-variables
# Environment variables:
#   DB_PASSWORD: Password for the Postgres database user (default: postgres)
#   UPLOAD_LOCATION: Location to store Immich data (default: ./immich-data
#                     relative to the location of this docker-compose.yml file)

name: immich

services:
  immich-server:
    container_name: immich_server
    # https://github.com/immich-app/immich/pkgs/container/immich-server
    image: ghcr.io/immich-app/immich-server:v2.7.5@sha256:c15bff75068effb03f4355997d03dc7e0fc58720c2b54ad6f7f10d1bc57efaa5
    volumes:
      - /mnt/user/data/immich/media:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      # Please use only the characters `A-Za-z0-9`, without special characters or spaces
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      TZ: Europe/Berlin
#    ports:
#      - '34517:2283'
    depends_on:
      - redis
      - database
    restart: always
    networks:
      internal:
      proxy:
    healthcheck:
      disable: false
    labels:
      traefik.enable: true
      # Router
      traefik.http.routers.immich.rule: Host(`immich.nico-steinmueller.de`)
      traefik.http.routers.immich.entrypoints: websecure
      traefik.http.routers.immich.middlewares: crowdsec-appsec@file, compress@file #, immich-buffering@docker
      traefik.http.routers.immich.service: immich
      # Service
      traefik.http.services.immich.loadbalancer.server.port: 2283
      traefik.http.services.immich.loadbalancer.responseForwarding.flushInterval: 100ms
      traefik.http.services.immich.loadbalancer.passHostHeader: true
      traefik.http.services.immich.loadbalancer.serversTransport: long-timeout@file
      # Buffering: Große Uploads erlauben (50000MB), aber in Memory nur 10MB, damit nicht zu viel RAM verbraucht wird. Bei Netzwerkfehlern bis zu 3x retryen.
#      traefik.http.middlewares.immich-buffering.buffering.maxRequestBodyBytes: 52428800000
#      traefik.http.middlewares.immich-buffering.buffering.memRequestBodyBytes: 10485760
#      traefik.http.middlewares.immich-buffering.buffering.retryExpression: "IsNetworkError() && Attempts() < 3"

  immich-machine-learning:
    container_name: immich_machine_learning
    # https://github.com/immich-app/immich/pkgs/container/immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:v2.7.5@sha256:a2501141440f10516d329fdfba2c68082e19eb9ba6016c061ac80d23beadf7f3
    volumes:
      - /mnt/user/appdata/immich/model-cache:/cache
    restart: always
    networks:
      internal:
    healthcheck:
      disable: false

  redis:
#    TODO: evtl. Update to alpine version later
    container_name: immich_redis
    image: docker.io/valkey/valkey:9.1.0-trixie@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always
    networks:
      internal:

  database:
    container_name: immich_postgres
    # https://github.com/immich-app/base-images/pkgs/container/postgres/versions?filters%5Bversion_type%5D=tagged
    image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3-pgvector0.8.1@sha256:8c10f8fd501a5dadbaf0b05acd1405ed20de93e69a1a01b3174e28428d7f3e12
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - postgres:/var/lib/postgresql
    shm_size: 128mb
    restart: always
    networks:
      internal:

volumes:
  postgres:

networks:
  proxy:
    external: true
  internal:
    internal: true

