# WARNING: To install Immich, follow our guide: https://docs.immich.app/install/docker-compose
#
# Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.
#
# https://docs.immich.app/install/environment-variables
# Environment variables:
#   DB_PASSWORD: Password for the Postgres database user (default: postgres)
#   UPLOAD_LOCATION: Location to store Immich data (default: ./immich-data
#                     relative to the location of this docker-compose.yml file)

name: immich

services:
  immich-server:
    container_name: immich_server
    # https://github.com/immich-app/immich/pkgs/container/immich-server
    image: ghcr.io/immich-app/immich-server:v2.5.5@sha256:161b1ec8af9e0478797cfd75ea857c7e55af271fa7cea103cb30ab1ba5b418d8
    volumes:
      - ${UPLOAD_LOCATION:-./immich-data}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      # Please use only the characters `A-Za-z0-9`, without special characters or spaces
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      TZ: Europe/Berlin
    ports:
      - '34517:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    # https://github.com/immich-app/immich/pkgs/container/immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:v2.5.5@sha256:2e17e15855907ece0d5b3a7bf625b12f6d987a5854fa71d888641acae28b0323
    volumes:
      - model-cache:/cache
    restart: always
    healthcheck:
      disable: false

  redis:
#    TODO: evtl. Update to alpine version later
    container_name: immich_redis
    image: docker.io/valkey/valkey:9.0.2-trixie@sha256:930b41430fb727f533c5982fe509b6f04233e26d0f7354e04de4b0d5c706e44e
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    # https://github.com/immich-app/base-images/pkgs/container/postgres/versions?filters%5Bversion_type%5D=tagged
    image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3-pgvector0.8.1@sha256:fb5d39e22bdda0950eec2786f57b1ef580161237e92684db261119662a6d4670
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - postgres:/var/lib/postgresql
    shm_size: 128mb
    restart: always

volumes:
  model-cache:
  postgres:
