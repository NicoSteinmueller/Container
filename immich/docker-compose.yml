# WARNING: To install Immich, follow our guide: https://docs.immich.app/install/docker-compose
#
# Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.
#
# https://docs.immich.app/install/environment-variables
# Environment variables:
#   DB_PASSWORD: Password for the Postgres database user (default: postgres)
#   UPLOAD_LOCATION: Location to store Immich data (default: ./immich-data
#                     relative to the location of this docker-compose.yml file)

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v2.4.1
    volumes:
      - ${UPLOAD_LOCATION:-./immich-data}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      # Please use only the characters `A-Za-z0-9`, without special characters or spaces
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      TZ: Europe/Berlin
    ports:
      - '34517:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v2.4.1
    volumes:
      - model-cache:/cache
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:fb8d272e529ea567b9bf1302245796f21a2672b8368ca3fcb938ac334e613c8f
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always

volumes:
  model-cache:
  postgres:
