# Privates Git und OpenTofu-State-Backend.
#
# Zwei Aufgaben in einem Dienst:
#   1. privates Repo für die terraform.tfvars
#   2. State-Registry (backend "http") mit echtem Locking
#      Der State landet dabei NICHT in der git-Historie, sondern im Package-Store.
name: gitea

services:
  # https://docs.gitea.com/installation/install-with-docker-rootless
  gitea:
    # ------------ Identität ------------------------
    # Das rootless-Image, nicht das Standard-Image: Es läuft ohne s6-Overlay
    # als unprivilegierter Benutzer und bindet 3000/2222 statt 22 - damit
    # kommt es ohne NET_BIND_SERVICE aus und verträgt cap_drop: ALL.
    image: gitea/gitea:1.27.2-rootless@sha256:c7953964c6e8fe532cf7fc3f3efdea1d0b161d7859c47e04f5e05489d494dea0
    container_name: gitea

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    # Gitea beendet laufende git-Prozesse beim Stop; 30 s reichen dafür und
    # verhindern, dass ein Push mitten im Schreiben abgeschnitten wird.
    stop_grace_period: 30s
    healthcheck:
      # busybox-wget, weil das Alpine-Image kein curl mitbringt.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 500M
          # Jeder Clone/Push forkt git-Prozesse - 256 ist bei parallelen
          # Zugriffen zu knapp.
          pids: 512
        reservations:
          cpus: 0.1
          memory: 192M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # ----------- Speicher -----------
    # Geschrieben wird nur in die beiden Bind-Mounts aus override/prod und
    # nach /tmp. Falls der Container damit nicht startet: README.md,
    # Abschnitt "Wenn es nicht startet".
    read_only: true
    tmpfs:
      # exec bleibt aus - Gitea führt aus /tmp nichts aus. Die Größe ist für
      # die Packfiles beim Push bemessen, nicht für Dauerdaten.
      - /tmp:rw,noexec,nosuid,size=512M

    # ---------- Environment -----------
    # Gitea übersetzt GITEA__<sektion>__<SCHLÜSSEL> beim ersten Start in die
    # app.ini.
    environment:
      TZ: Europe/Berlin

      # Pflicht, sobald INSTALL_LOCK an ist. docker-setup.sh schreibt beim
      # ersten Start RUN_USER=${USER:-"git"} in die app.ini, und Gitea
      # vergleicht das später gegen $USER - das Image selbst setzt die
      # Variable aber nicht. Ohne diese Zeile stirbt der Start mit
      #   [F] Expect user 'git' (RUN_USER in app.ini) but current user is:
      # Ein reiner String-Vergleich zweier Umgebungsvariablen: Mit welcher
      # UID der Container tatsächlich läuft (1000 in dev, 99 in prod), spielt
      # dafür keine Rolle.
      USER: git

      # --- Datenbank ---
      # SQLite und nicht Postgres: ein Container weniger, ~100 MB weniger RAM,
      # und - der eigentliche Grund - die Sicherung ist ein Verzeichnis statt
      # Verzeichnis plus Dump. Hier liegt der State, mit dem der Cluster
      # wiederhergestellt wird; die Wiederherstellung muss trivial sein.
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /var/lib/gitea/data/gitea.db

      # --- Zugang ---
      # Kein Web-Installer. Mit INSTALL_LOCK ist /install ab dem ersten Start
      # tot; der Admin wird auf der Kommandozeile angelegt (README.md).
      GITEA__security__INSTALL_LOCK: true
      # Ein-Personen-Instanz: keine Registrierung, und ohne Anmeldung ist
      # nichts sichtbar - auch keine Repo-Namen.
      GITEA__service__DISABLE_REGISTRATION: true
      GITEA__service__REQUIRE_SIGNIN_VIEW: true
      GITEA__service__ENABLE_BASIC_AUTHENTICATION: true
      GITEA__openid__ENABLE_OPENID_SIGNIN: false
      GITEA__openid__ENABLE_OPENID_SIGNUP: false

      # Neue Repos sind privat, auch die per `git push` angelegten. Das ist
      # die Leitplanke, die den ganzen Zweck trägt.
      GITEA__repository__DEFAULT_PRIVATE: private
      GITEA__repository__DEFAULT_PUSH_CREATE_PRIVATE: true
      GITEA__repository__FORCE_PRIVATE: true

      # --- Packages / State-Registry ---
      # Der Terraform-State hängt an der Package-Registry. Ohne das hier gibt
      # es kein http-Backend.
      GITEA__packages__ENABLED: true

      # --- Abgeschaltetes ---
      # Actions ist eine CI-Engine samt Runner-Protokoll - für ein Repo mit
      # tfvars nutzlos und nur Angriffsfläche.
      GITEA__actions__ENABLED: false
      # Kein Mailer: Es gibt keinen Empfänger außer dem einzigen Konto, und
      # die Zugangsdaten eines Relays wären ein Geheimnis mehr im Stack.
      GITEA__mailer__ENABLED: false
      GITEA__server__DISABLE_SSH: true
      GITEA__server__LFS_START_SERVER: false
      GITEA__service__ENABLE_TIMETRACKING: false

      # --- Betrieb ---
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__PROTOCOL: http
      # Nach stdout, damit das json-file-Logging oben greift und nicht
      # zusätzlich Dateien im Datenverzeichnis wachsen.
      GITEA__log__MODE: console
      GITEA__log__LEVEL: Info
      GITEA__cron__ENABLED: true
      GITEA__ui__DEFAULT_THEME: gitea-auto
