services:
  backrest:
    image: garethgeorge/backrest:latest@sha256:aeb0e208365981a645e94ef38e44ef5a98c6d2c8049787254db0480a4a7bc84f
    container_name: backrest
    hostname: backrest
    restart: unless-stopped
    ports:
      - "9898:9898"
    volumes:
      # Backrest Konfiguration und Daten
      - ./config:/config
      - ./cache:/cache

      # Quellordner - hier die Daten die gesichert werden sollen
      # Passen Sie den Pfad links vom Doppelpunkt an Ihren Hauptordner an
      - ./daten:/source:ro

      # Backup-Zielordner - hier werden die Backups gespeichert
      # Passen Sie den Pfad links vom Doppelpunkt an Ihren Backup-Ordner an
      - ./backup:/backup
    environment:
      - TZ=Europe/Berlin
      - BACKREST_DATA=/config
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache

