#https://signoz.io/guides/how-to-install-prometheus-and-grafana-on-docker/
# https://last9.io/blog/grafana-and-docker/
# https://grafana.com/oss/alloy-opentelemetry-collector/

# DB_PASSWORD
# KEYCLOAK_SECRET

services:
  # Das Gehirn: Visualisierung
  # https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/
  grafana:
    image: grafana/grafana:13.1.0@sha256:eee9924b40da0a2c0e3174d164baa5a63a48c9ff10bac3eb02b7d6d7cb274968
    container_name: grafana
    restart: unless-stopped
    volumes:
      # https://grafana.com/docs/grafana/latest/setup-grafana/configure-docker/
      - /mnt/user/appdata/monitoring/grafana:/var/lib/grafana
    environment:
      # https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/
      # https://grafana.com/grafana/plugins
      GF_PLUGINS_PREINSTALL: grafana-clock-panel
      GF_SERVER_ROOT_URL: https://grafana.local.nico-steinmueller.de
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: grafana_postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: ${DB_PASSWORD:-changeme}
      GF_ANALYTICS_REPORTING_ENABLED: false # Telemetrie deaktivieren
      GF_ANALYTICS_CHECK_FOR_UPDATES: false # Update-Checks deaktivieren
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: false # Plugin-Update-Checks deaktivieren
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: true # Admin-User wird über Umgebungsvariablen erstellt
      # GF_SECURITY_ADMIN_PASSWORD: admin # Bitte später ändern
      GF_USERS_DEFAULT_LANGUAGE: de
      GF_AUTH_DISABLE_LOGIN_FORM: true # Login-Formular deaktivieren
      GF_AUTH_SIGNOUT_REDIRECT_URL: https://keycloak.nico-steinmueller.de/realms/mein-realm/protocol/openid-connect/logout?post_logout_redirect_uri=https://grafana.local.nico-steinmueller.de/login

      # oauth2: https://grafana.com/docs/grafana/latest/setup-grafana/configure-access/configure-authentication/keycloak/
      GF_AUTH_GENERIC_OAUTH_ENABLED: true
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: true
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${KEYCLOAK_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile offline_access roles
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_NAME: email
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_NAME: username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_NAME: full_name
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://keycloak.nico-steinmueller.de/realms/mein-realm/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://keycloak.nico-steinmueller.de/realms/mein-realm/protocol/openid-connect/token
      # Optional, falls alle User-Infos über das ID-Token kommen, ansonsten wird die Userinfo-URL benötigt (kann latency beim Login erhöhen)
      GF_AUTH_GENERIC_OAUTH_API_URL: https://keycloak.nico-steinmueller.de/realms/mein-realm/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: contains(realm_access.roles[*], 'admin') && 'GrafanaAdmin' || contains(realm_access.roles[*], 'editor') && 'Editor' || 'Viewer'
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: true

      # smtp

      GF_DATE_FORMATS_FULL_DATE: DD.MM.YYYY HH:mm:ss
      GF_DATE_FORMATS_INTERVAL_SECOND: HH:mm:ss
      GF_DATE_FORMATS_INTERVAL_MINUTE: HH:mm
      GF_DATE_FORMATS_INTERVAL_HOUR: DD.MM. HH:mm
      GF_DATE_FORMATS_INTERVAL_DAY: DD.MM.
      GF_DATE_FORMATS_INTERVAL_MONTH: MM.YYYY
      GF_DATE_FORMATS_INTERVAL_YEAR: YYYY
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Europe/Berlin

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - monitoring
      - proxy

    labels:
      traefik.enable: true
      traefik.http.routers.grafana.rule: Host(`grafana.local.nico-steinmueller.de`)
      traefik.http.routers.grafana.entrypoints: websecure
      traefik.http.routers.grafana.middlewares: local-only@file, compress@file
      traefik.http.routers.grafana.service: grafana
      traefik.http.services.grafana.loadbalancer.server.port: 3000

  database:
    image: postgres:18.3-alpine3.23@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    container_name: grafana_postgres
    environment:
      POSTGRES_DB: grafana
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres:/var/lib/postgresql
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafana -d grafana"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  # Die Datenbank für Metriken (Performance)
  prometheus:
    image: prom/prometheus:v3.11.3@sha256:e4254400b85610324913f0dc4acf92603d9984e7519414c5a12811aa6146acc3
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver' # WICHTIG: Damit Alloy Daten schicken darf
      - '--storage.tsdb.retention.time=30d' # Speicherzeit der Metriken (hier 30 Tage)
      - '--storage.tsdb.retention.size=10GB' # Optional: Maximale Größe der Datenbank (hier 10GB)
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - /mnt/user/appdata/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /mnt/user/data/monitoring/prometheus:/prometheus
    networks:
      - monitoring
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    labels:
      traefik.enable: true
      traefik.http.routers.prometheus.rule: Host(`prometheus.local.nico-steinmueller.de`)
      traefik.http.routers.prometheus.entrypoints: websecure
      traefik.http.routers.prometheus.middlewares: local-only@file, compress@file
      traefik.http.routers.prometheus.service: prometheus
      traefik.http.services.prometheus.loadbalancer.server.port: 9090

  # Die Datenbank für Logs
  loki:
    image: grafana/loki:3.7.1
    container_name: loki
    restart: unless-stopped
    volumes:
      - /mnt/user/data/monitoring/loki:/loki
#      - ./loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring
      - proxy
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  # Der Sammler: Grafana Alloy
  alloy:
    image: grafana/alloy:v1.16.0 # Version 1.6+ ist aktuell (2026)
    container_name: alloy
    restart: unless-stopped
    # WICHTIG: Alloy läuft standardmäßig als User "alloy".
    # Damit er den Docker-Socket und die Logs lesen kann,
    # muss er oft als root laufen oder der Gruppe "docker" angehören.
    user: root
    volumes:
      - /mnt/user/appdata/monitoring/alloy:/etc/alloy:ro
      # System-Metriken/Infos vom Host (CPU, RAM, Netzwerk, Prozesse, Docker-Stats, etc.)
      - /proc:/rootproc:ro # Host-Prozesse/Metriken
      - /var/run/docker.sock:/var/run/docker.sock:ro # Docker-API
      - /sys:/sys:ro # Kernel-/HW-Infos
      - /:/rootfs:ro # Host-Dateisystem
      - /dev/disk/:/dev/disk:ro # Disk-IDs/Devices
      - /var/lib/docker/:/var/lib/docker:ro # Docker-Daten/Logs
      - /var/log:/var/host-log:ro # Host-Logs (z.B. Syslog, Auth, etc.)
      # Hier alle Host-Pfade, in die Apps Logs schreiben.
      - /mnt/user/logs:/var/docker_logs:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/
    networks:
      - monitoring
      - proxy
    healthcheck:
      test: "bash -c '(exec 3<>/dev/tcp/localhost/12345 && printf \"HEAD /-/healthy HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && timeout 2 head -1 <&3 | grep -q \"200\") && exit 0 || exit 1'"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    labels:
      traefik.enable: true
      traefik.http.routers.alloy.rule: Host(`alloy.local.nico-steinmueller.de`)
      traefik.http.routers.alloy.entrypoints: websecure
      traefik.http.routers.alloy.middlewares: local-only@file, compress@file
      traefik.http.routers.alloy.service: alloy
      traefik.http.services.alloy.loadbalancer.server.port: 12345

volumes:
  grafana-data:
  postgres:

networks:
  monitoring:
    name: monitoring
  proxy:
    external: true