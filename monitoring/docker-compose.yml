# Monitoring Stack: Prometheus + Grafana + Loki + Promtail
# Überwacht Traefik Metriken und Logs
services:
  prometheus:
    image: prom/prometheus:v3.10.0@sha256:4a61322ac1103a0e3aea2a61ef1718422a48fa046441f299d71e660a3bc71ae9
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
      - proxy
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.6.7@sha256:13e00a4f6aa64db624e78365d11ce2ee868cf49e202e511cadbd6fbc6c8b0e3a
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yml
    networks:
      - monitoring
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.6.7@sha256:d5c160912b35cd658b82bff2d06554e38f868fd46141562b9b4da7a7408cc179
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ../traefik/logs:/var/log/traefik:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.0.0@sha256:95c1d725c9be089f7db623f7284395a7c1b7843da7027319f8b2a3eeb0ce68bf
    container_name: grafana
    restart: unless-stopped
    networks:
      - monitoring
      - proxy
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  monitoring:

