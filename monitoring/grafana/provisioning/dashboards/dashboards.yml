# Grafana Dashboard Provisioning
apiVersion: 1

providers:
  - name: 'Traefik Dashboards'
    orgId: 1
    folder: 'Traefik'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/traefik
      foldersFromFilesStructure: true

