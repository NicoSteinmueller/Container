name: whoami

services:
  whoami:
    # ------------ Identität ------------------------
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    container_name: whoami

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    stop_grace_period: 10s

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 0.1
          memory: 6M
          pids: 16
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # ----------- Speicher -----------
    read_only: true

    # ---------- Environment -----------
    environment:
      TZ: Europe/Berlin
