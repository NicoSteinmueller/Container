# Einstellungen für Development- und Testumgebungen

service:
  example:
    user: 1000:1000
    ports:
      - name: web
        target: 80
        host_ip: 127.0.0.1
        published: 8080
        protocol: tcp
        app_protocol: http
        mode: host
    volumes:
      - type: volume
        source: db-data
        target: /data
        read_only: false
        volume:
          nocopy: true
          subpath: sub

volumes:
  data:
    name: db-data