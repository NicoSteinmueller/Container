# Project Name
name: example

services:
  example:
    # ------------ Identität ------------------------
    image: nginx:alpine
    container_name: example

    # ------------ Abhängigkeiten & Start -----------
    # für ordentliche Signalweiterleitung und Prozessverwaltung
    init: true
    # Überschreibt den Standardbefehl des Images
    command:
      - nginx -g "daemon off;"
    restart: on-failure:3
    # Wartezeit nach Stop signal vor Kill
    stop_grace_period: 1m
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s
    depends_on:
      db:
        # automatischer Neustart des abhängigen Service, wenn er aktualisiert wurde.
        restart: true
        # service_started, service_healthy, service_completed_successfully
        condition: service_healthy
        required: true


    # ----------- Ressourcen -----------
    # docker stats <container_name> zeigt die aktuelle Ressourcennutzung an
    # max. 5% der verfügbaren CPU-Leistung
    cpu_percent: 5
    # max. RAM Nutzung
    mem_limit: 100M
    # reservierter RAM bei Start
    mem_reservation: 50M
    # gesamter RAM --> 1G = 100M im RAM und 900M im Swap
    # 0 = ignoriert
    memswap_limit: 1G
    # Container darf bei RAM Mangel nicht automatisch getötet werden
    oom_kill_disable: true
    # Priorität bei OOM Killer (niedriger Wert = höhere Priorität, Standard: 0, Bereich: -1000 bis 1000)
    oom_score_adj: -100
    # begrenzt die Anzahl der Prozesse, die ausgeführt werden können
    pids_limit: 20
    # https://docs.docker.com/reference/cli/docker/container/run/#set-ulimits-in-container---ulimit
#    TODO: anschauen, ob sinnvoll
#      ulimits:
#      # Maximale Anzahl von Prozessen, die der Container\-User starten darf
#      nproc: 65535
#      nofile:
#        # Soft\-Limit: Standardgrenze für gleichzeitig offene Dateien
#        soft: 20000
#        # Hard\-Limit: Absolute Obergrenze für offene Dateien
#        hard: 40000
    # Logging begrenzen
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3


    # ----------- Sicherheit -----------
    # deaktiviert bestimmte Privilegien und Funktionen
    # https://docs.docker.com/reference/cli/docker/container/run/#security-opt
    security_opt:
      - no-new-privileges:true
    # entfernt alle Linux-Kapazitäten und fügt nur notwendige hinzu
    # https://dockerlabs.collabnix.com/advanced/security/capabilities/
    # https://man7.org/linux/man-pages/man7/capabilities.7.html
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN


    # ----------- Speicher -----------
    # Definiert die Geräte, die dem Container zur Verfügung stehen sollen, und wie sie im Container gemountet werden sollen
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    # Read-Only-Dateisystem
    # docker diff (https://tmp.bearblog.dev/secure-filesystem-in-docker/)
    # A - added file/directory
    # C - changed file/directory
    # D - deleted file/directory
    read_only: true
    # Mountet ein temporäres Dateisystem im Container
    # rw erlaubt Schreibzugriff
    # noexec verhindert die Ausführung von Binärdateien
    # nosuid blockiert das Setzen von SUID/SGID-Bits
    # size begrenzt den verfügbaren Speicherplatz (z.B. 64 MB für /tmp)
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /data:mode=755,uid=1009,gid=1009
      - /run


    # ---------- Environment -----------
    environment:
      TZ: Europe/Berlin
