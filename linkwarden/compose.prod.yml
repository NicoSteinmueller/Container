# Einstellungen für die Produktion

services:
  linkwarden:
    user: 99:100
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      DATABASE_URL: postgresql://linkwarden:${POSTGRES_PASSWORD:-}@postgres:5432/linkwarden
      # MeiliSearch
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      # Authentifizierung
      NEXT_PUBLIC_DISABLE_REGISTRATION: true
      NEXT_PUBLIC_CREDENTIALS_ENABLED: false
      # SSO (Keycloak)
      DISABLE_NEW_SSO_USERS: false
      NEXT_PUBLIC_KEYCLOAK_ENABLED: true
      KEYCLOAK_CUSTOM_NAME: Keycloak
      KEYCLOAK_ISSUER: https://keycloak.nico-steinmueller.de/realms/mein-realm
      KEYCLOAK_CLIENT_ID: linkwarden
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    networks:
      proxy:
    volumes:
      - type: bind
        source: /mnt/user/data/linkwarden/data
        target: /data/data
        read_only: false
        bind:
          create_host_path: false
    labels:
      traefik.enable: true
      traefik.http.routers.linkwarden.rule: Host(`linkwarden.nico-steinmueller.de`)
      traefik.http.routers.linkwarden.entrypoints: websecure
      traefik.http.routers.linkwarden.middlewares: crowdsec@file, compress@file
      traefik.http.routers.linkwarden.service: linkwarden
      traefik.http.services.linkwarden.loadbalancer.server.port: 3000

  postgres:
    user: 99:100
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - type: bind
        source: /mnt/user/appdata/linkwarden/postgres
        target: /var/lib/postgresql
        read_only: false
        bind:
          create_host_path: false

  meilisearch:
    user: 99:100
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    tmpfs:
      - /meili_data:rw,noexec,nosuid,size=128M,uid=99,gid=100

networks:
  proxy:
    external: true
