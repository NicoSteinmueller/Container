name: linkwarden

services:
  # https://github.com/linkwarden/linkwarden
  linkwarden:
    # ------------ Identität ------------------------
    image: ghcr.io/linkwarden/linkwarden:v2.15.0@sha256:5f70dc3fce3da22913329507748777a3c7c9201c6db1ec310367c20e2b93712a
    container_name: linkwarden

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [ "CMD-SHELL", "curl -fS http://localhost:3000/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      linkwarden-init:
        condition: service_completed_successfully

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 2G
          pids: 374
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true

#    # ----------- Speicher -----------
#    read_only: true
#    tmpfs:
#      - /tmp:rw,exec,nosuid,size=64M
#      - /home/node/.cache:rw,noexec,nosuid,size=64M
    # ---------- Environment -----------
    environment:
      # https://docs.linkwarden.app/self-hosting/environment-variables
      TZ: Europe/Berlin
      
      # Fix corepack permission issues
      COREPACK_HOME: /tmp/corepack

      # MeiliSearch
      MEILI_HOST: http://meilisearch:7700
      # Persist Playwright browsers to a bind-mounted path so worker restarts survive.
      PLAYWRIGHT_BROWSERS_PATH: /data/data/ms-playwright

  # Init service to ensure Playwright browsers are installed into the bind-mounted data path.
  linkwarden-init:
    # ------------ Identität ------------------------
    image: ghcr.io/linkwarden/linkwarden:v2.15.0@sha256:5f70dc3fce3da22913329507748777a3c7c9201c6db1ec310367c20e2b93712a
    container_name: linkwarden_playwright_init
    # ------------ Abhängigkeiten & Start -----------
    init: true
    command: sh -lc 'if [ ! -d /data/data/ms-playwright ] || [ -z "$(ls -A /data/data/ms-playwright 2>/dev/null)" ]; then echo "Installing Playwright browsers..."; npx playwright install chromium || true; else echo "Playwright browsers already present"; fi'
    restart: no
    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          # max. 0.5 Kerne der CPU
          cpus: 1
          # max. RAM Nutzung
          memory: 1G
          # begrenzt die Anzahl der Prozesse, die ausgeführt werden können
          pids: 512
        reservations:
          # reservierte CPU-Kerne
          cpus: 0.5
          # reservierter RAM
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ----------- Speicher --------------
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512M
    # ---------- Environment -----------
    environment:
      COREPACK_HOME: /tmp/corepack
      PLAYWRIGHT_BROWSERS_PATH: /data/data/ms-playwright

  postgres:
    # ------------ Identität ------------------------
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
    container_name: linkwarden_postgres

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkwarden -d linkwarden"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 128M
          pids: 64
        reservations:
          memory: 50M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true

    # ---------- Environment -----------
    environment:
      TZ: Europe/Berlin
      POSTGRES_DB: linkwarden
      POSTGRES_USER: linkwarden
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C

  # https://www.meilisearch.com/docs/guides/docker
  meilisearch:
    # ------------ Identität ------------------------
    image: getmeili/meilisearch:v1.49.0@sha256:bdc7d7e7939911c40d88d6bcd01f9c72c81f7293135916d48bce241569f721bd
    container_name: linkwarden_meilisearch

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fS http://localhost:7700/health | grep -q '\"available\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
          pids: 64
        reservations:
          memory: 70M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true

    # ----------- Speicher -----------
#    read_only: true

    # ---------- Environment -----------
    environment:
      TZ: Europe/Berlin
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: true
