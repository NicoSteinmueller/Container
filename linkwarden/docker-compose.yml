# ============================================
# KONFIGURIERBARE VARIABLEN
# ============================================
# NEXTAUTH_SECRET                 - Secret für NextAuth (default: changeme)
# POSTGRES_PASSWORD               - PostgreSQL Passwort (default: changeme)
# MEILI_MASTER_KEY                - MeiliSearch Master-Key (default: changeme)
# KEYCLOAK_CLIENT_SECRET          - Keycloak Client-Secret für Linkwarden (default: leer)
# ============================================

services:
  # https://github.com/linkwarden/linkwarden
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:v2.14.0@sha256:c5b9b4db571c468270cd916acebd5e6490b54393d90c1a2ccb9919a194ed7d51
    container_name: linkwarden
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      # https://docs.linkwarden.app/self-hosting/environment-variables
      TZ: Europe/Berlin
      DATABASE_URL: postgresql://linkwarden:${POSTGRES_PASSWORD:-changeme}@postgres:5432/linkwarden

      # Reverse Proxy / Auth
      NEXTAUTH_URL: https://linkwarden.nico-steinmueller.de/api/v1/auth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-changeme}

      # MeiliSearch
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-changeme}

      # Authentifizierung
      NEXT_PUBLIC_DISABLE_REGISTRATION: true
      NEXT_PUBLIC_CREDENTIALS_ENABLED: false
      DISABLE_NEW_SSO_USERS: false
      # SSO (Keycloak)
      NEXT_PUBLIC_KEYCLOAK_ENABLED: true
      KEYCLOAK_CUSTOM_NAME: Keycloak
      KEYCLOAK_ISSUER: https://keycloak.nico-steinmueller.de/realms/mein-realm
      KEYCLOAK_CLIENT_ID: linkwarden
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}

      # AI für Tags (optional)
#      NEXT_PUBLIC_OLLAMA_ENDPOINT_URL: http://localhost:11434
#      OLLAMA_MODEL: phi3:mini-4k

    volumes:
      - /mnt/user/data/linkwarden/data:/data/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fS http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - linkwarden
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.linkwarden.rule: Host(`linkwarden.nico-steinmueller.de`)
      traefik.http.routers.linkwarden.entrypoints: websecure
      traefik.http.routers.linkwarden.middlewares: crowdsec@file, compress@file
      traefik.http.routers.linkwarden.service: linkwarden
      traefik.http.services.linkwarden.loadbalancer.server.port: 3000

  postgres:
    image: postgres:18.3-alpine3.23@sha256:52098013b4b64a746626437d38afc03cabff6cdeb4d3d92e2342aa95f0ce56ea
    container_name: linkwarden_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: linkwarden
      POSTGRES_USER: linkwarden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - postgres:/var/lib/postgresql
    networks:
      - linkwarden
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkwarden -d linkwarden"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# https://www.meilisearch.com/docs/guides/docker
  meilisearch:
    image: getmeili/meilisearch:v1.42.1@sha256:e13a16ddc45f66fd065b3416230c2669426cfa8907f4a43f14a9c09a17691fa4
    container_name: linkwarden_meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-changeme}
      MEILI_NO_ANALYTICS: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fS http://localhost:7700/health | grep -q '\"available\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - linkwarden

networks:
  linkwarden:
  proxy:
    external: true

volumes:
  postgres:
