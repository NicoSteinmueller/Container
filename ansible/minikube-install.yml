---
- name: Minikube auf Ubuntu installieren
  hosts: localhost
  connection: local
  become: true

  vars:
    # Ermittelt den echten Benutzer über die Umgebung des ansible-playbook-Prozesses
    # (ansible_facts['user_id']/['env'] würden hier fälschlich "root" liefern, da
    # das Play bereits mit become:true Facts sammelt; lookup('env', ...) läuft
    # dagegen auf dem Controller außerhalb des Become-Kontexts)
    target_user: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"
    target_home: "/home/{{ target_user }}"

    # Gepinnte Versionen für reproduzierbare Installationen.
    # Bei Bedarf aktualisieren: https://github.com/kubernetes/minikube/releases
    # bzw. https://kubernetes.io/releases/
    minikube_release_version: "v1.38.1"
    kubectl_release_version: "v1.36.4"

    # Addons zur Vorbereitung auf einen produktiven Kubernetes-Umzug
    minikube_addons:
      - ingress # NGINX Ingress Controller
      - metrics-server
      - dashboard
      - registry
      - ingress-dns

    # Ingress-Hostnamen der nach Kubernetes migrierten Dienste (k8s/<dienst>/overlays/minikube/ingress.yaml).
    # Bei jedem neu migrierten Dienst hier den Host ergänzen - der Eintrag in
    # /etc/hosts wird automatisch verwaltet und bei jedem Playbook-Lauf aktuell gehalten.
    k8s_local_hosts:
      - whoami.k8s.local

    # Calico statt des Minikube-Standard-CNI (kindnet), damit NetworkPolicies
    # auch lokal tatsächlich durchgesetzt werden - fürs Testen möglichst nah
    # am späteren Produktiv-Cluster.
    minikube_cni: "calico"

  tasks:
    # -------------------------------------------------------------
    # 1. System-Vorbereitung & Paket-Installationen
    # -------------------------------------------------------------
    - name: System-Abhängigkeiten installieren
      ansible.builtin.apt:
        name:
          - curl
          - apt-transport-https
          - ca-certificates
          - conntrack
          - socat
          - docker.io
        state: latest
        update_cache: yes

    - name: Docker-Dienst starten und aktivieren
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    - name: Aktuellen Benutzer zur Docker-Gruppe hinzufügen
      ansible.builtin.user:
        name: "{{ target_user }}"
        groups: docker
        append: yes

    # -------------------------------------------------------------
    # 2. Docker-Kontext für den Benutzer reparieren (verhindert Warnungen)
    # -------------------------------------------------------------
    - name: Docker .docker Verzeichnis im Home-Ordner sicherstellen
      ansible.builtin.file:
        path: "{{ target_home }}/.docker"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0755'

    - name: Docker default-Kontext aktivieren/erstellen
      ansible.builtin.shell: |
        docker context use default || docker context create default
      become: true
      become_user: "{{ target_user }}"
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------------
    # 3. Binaries herunterladen
    # -------------------------------------------------------------
    - name: Minikube Binary herunterladen
      ansible.builtin.get_url:
        url: "https://github.com/kubernetes/minikube/releases/download/{{ minikube_release_version }}/minikube-linux-amd64"
        checksum: "sha256:https://github.com/kubernetes/minikube/releases/download/{{ minikube_release_version }}/minikube-linux-amd64.sha256"
        dest: /usr/local/bin/minikube
        mode: '0755'

    - name: kubectl Binary herunterladen
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_release_version }}/bin/linux/amd64/kubectl"
        checksum: "sha256:https://dl.k8s.io/release/{{ kubectl_release_version }}/bin/linux/amd64/kubectl.sha256"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    # -------------------------------------------------------------
    # Helm via offiziellem Skript installieren
    # -------------------------------------------------------------
    - name: Helm-Installationsskript herunterladen
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4
        dest: /tmp/get_helm.sh
        mode: '0700'

    - name: Helm-Installationsskript ausführen
      ansible.builtin.command: /tmp/get_helm.sh
      register: helm_install_out
      changed_when: "'Helm v' in helm_install_out.stdout"

    - name: Temporäres Helm-Skript löschen
      ansible.builtin.file:
        path: /tmp/get_helm.sh
        state: absent

    # -------------------------------------------------------------
    # 4. Funktionsprüfungen (Checks)
    # -------------------------------------------------------------
    - name: Minikube Version prüfen
      ansible.builtin.command: minikube version
      register: minikube_version
      changed_when: false

    - name: kubectl Version prüfen
      ansible.builtin.command: kubectl version --client
      register: kubectl_version
      changed_when: false

    # -------------------------------------------------------------
    # 5. Minikube starten & Cluster-Prüfungen
    # -------------------------------------------------------------
    # Minikube und kubectl müssen als normaler Benutzer laufen (ohne sudo/root)
    - name: Minikube starten
      ansible.builtin.shell: |
        minikube start --driver=docker --cni={{ minikube_cni }}
      become: true
      become_user: "{{ target_user }}"
      register: minikube_start
      changed_when: "'Done! kubectl is now configured' in minikube_start.stdout"

    - name: Prüfen ob Calico im Cluster läuft
      ansible.builtin.shell: |
        kubectl get pods -A -l k8s-app=calico-node --no-headers 2>/dev/null | wc -l
      become: true
      become_user: "{{ target_user }}"
      register: minikube_calico_pods
      changed_when: false
      failed_when: false
      when: minikube_start is succeeded

    - name: Warnen, falls bestehender Cluster noch mit altem CNI läuft
      ansible.builtin.debug:
        msg: >-
          Der Cluster wurde ursprünglich ohne Calico erstellt (--cni wirkt nur beim
          erstmaligen 'minikube start'). Das CNI lässt sich bei einem laufenden
          Cluster nicht nachträglich wechseln - dafür ist einmalig 'minikube delete'
          und ein erneuter Playbook-Lauf nötig, damit NetworkPolicies auch lokal
          durchgesetzt werden.
      when:
        - minikube_start is succeeded
        - (minikube_calico_pods.stdout | default('0') | trim | int) == 0

    - name: Minikube-Addons aktivieren
      ansible.builtin.shell: |
        minikube addons enable {{ item }}
      loop: "{{ minikube_addons }}"
      become: true
      become_user: "{{ target_user }}"
      register: minikube_addons_enable
      changed_when: "'was successfully enabled' in minikube_addons_enable.stdout"
      when: minikube_start is succeeded

    # -------------------------------------------------------------
    # 5a. Lokale DNS-Auflösung für Ingress-Hosts (/etc/hosts)
    # -------------------------------------------------------------
    - name: Minikube-IP ermitteln
      ansible.builtin.command: minikube ip
      become: true
      become_user: "{{ target_user }}"
      register: minikube_ip
      changed_when: false
      when: minikube_start is succeeded

    - name: Ingress-Hosts in /etc/hosts eintragen
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Minikube Ingress Hosts"
        block: |
          {% for host in k8s_local_hosts %}
          {{ minikube_ip.stdout }} {{ host }}
          {% endfor %}
      when: minikube_start is succeeded

    - name: Minikube Status prüfen
      ansible.builtin.shell: |
        minikube status
      become: true
      become_user: "{{ target_user }}"
      register: minikube_status
      changed_when: false
      failed_when: false

    - name: Kubernetes Cluster Nodes prüfen
      ansible.builtin.shell: |
        kubectl get nodes
      become: true
      become_user: "{{ target_user }}"
      register: kubectl_nodes
      changed_when: false
      failed_when: false
      when: minikube_start is succeeded

    # -------------------------------------------------------------
    # 6. Zusammenfassung & Ergebnisse im Terminal ausgeben
    # -------------------------------------------------------------
    - name: Zusammenfassung der Installation
      ansible.builtin.debug:
        msg:
          - "--- Minikube Installation abgeschlossen ---"
          - "Minikube Version: {{ minikube_version.stdout }}"
          - "kubectl Version: {{ kubectl_version.stdout }}"
          - "Minikube Status: {{ minikube_status.stdout }}"
          - "Kubernetes Cluster Nodes: {{ kubectl_nodes.stdout | default('nicht abgefragt, da Minikube-Start fehlgeschlagen') }}"
          - "Aktivierte Addons: {{ minikube_addons | join(', ') }}"
          - "Hinweis: 'ingress-dns' erfordert manuell einen DNS-Eintrag auf dem Host (Nameserver = Minikube-IP, siehe 'minikube addons configure ingress-dns' / 'minikube ip')."
