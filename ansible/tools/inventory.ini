# Hosts, auf denen der Soll-Zustand aus group_vars/all.yml hergestellt wird.
#
# group_vars/all.yml gilt fuer alle Hosts. Abweichungen gehoeren nach
# group_vars/<gruppe>.yml bzw. host_vars/<hostname>.yml - dann kann ein Host
# zusaetzliche Tools bekommen, ohne die gemeinsame Basis zu verlassen.

[workstations]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3
# zweiter-host ansible_host=192.168.1.21 ansible_user=ansible
