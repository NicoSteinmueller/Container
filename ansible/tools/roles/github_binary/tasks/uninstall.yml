---
- name: "Remove {{ github_binary_name }}"
  ansible.builtin.file:
    path: "{{ github_binary_dest_dir }}/{{ github_binary_name }}"
    state: absent

# Anders als bei einem apt-Paket gibt es keine Abhaengigkeiten aufzuraeumen -
# es war eine einzelne Datei.

# Unter --check wurde nichts entfernt, die Restpruefung waere dort irrefuehrend.
- name: "Check for remaining {{ github_binary_name }} binary"
  ansible.builtin.command:
    cmd: which {{ github_binary_name }}
  register: github_binary_check
  failed_when: false
  changed_when: false
  when: not ansible_check_mode

- name: Print uninstall result
  ansible.builtin.debug:
    msg: >-
      {{
        github_binary_name ~ ' entfernt.'
        if github_binary_check.rc != 0
        else 'Achtung: ' ~ github_binary_name ~ ' ist weiterhin unter '
             ~ github_binary_check.stdout | trim
             ~ ' vorhanden (manuelle Installation in ~/.local/bin?).'
      }}
  when: not ansible_check_mode
