---
# Duenner Wrapper auf distro_package - libsecret-tools kommt fertig aus den
# Distributionsquellen, es gibt also kein Repository und keine Keys einzurichten.
#
# Gebraucht wird daraus `secret-tool`: tools/tf im Container-Repo holt damit den
# Gitea-Token und die Passphrase der State-Verschluesselung aus dem
# GNOME-Schluesselbund, statt sie in der Shell-Umgebung stehen zu haben. Ohne das
# Paket bricht der Wrapper mit einem Hinweis ab - siehe gitea/README.md.
- name: Manage libsecret-tools as a distribution package
  ansible.builtin.include_role:
    name: distro_package
  vars:
    distro_package_state: "{{ tool_state }}"
    distro_package_name: libsecret-tools
    distro_package_tool: libsecret-tools

    # Paketname und Binary fallen hier auseinander: das Paket bringt
    # `secret-tool` mit. Ohne das liefe die Restpruefung nach dem Entfernen
    # gegen ein `libsecret-tools`, das es nie gab, und meldete faelschlich Erfolg.
    distro_package_binary: secret-tool
