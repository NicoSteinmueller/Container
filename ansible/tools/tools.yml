---
- name: Manage tools and their automatic updates
  hosts: all
  become: true

  vars:
    # Wird bei jedem Lauf von Grund auf neu aufgebaut: jede Rolle traegt beim
    # Installieren ihre apt-Origins ein. Dadurch fallen Tools, die auf 'absent'
    # gesetzt wurden, von selbst wieder aus der unattended-upgrades-Konfiguration
    # heraus - ohne dass die Uninstall-Tasks daran denken muessen.
    tool_update_coverage: {}

    # Das Gegenstueck fuer Tools aus den Distributionsquellen: Deren
    # Update-Kanal ist bereits in 50unattended-upgrades konfiguriert. Hier wird
    # deshalb nur festgehalten, worauf sie sich verlassen - auto_updates prueft
    # anschliessend nach, dass der Kanal wirklich erlaubt ist. Eine zweite
    # Deklaration waere doppelte Wahrheit.
    tool_update_sources: {}

    # Dritte Sorte: Binaries aus GitHub Releases, fuer die es ueberhaupt kein
    # apt-Repository gibt. Sie landen bewusst NICHT in der
    # unattended-upgrades-Konfiguration - es gaebe keinen Origin einzutragen,
    # und ein erfundener waere schlimmer als keiner. Der Kanal ist hier der
    # Versions-Pin in der jeweiligen Rolle, den Renovate anhebt und der
    # naechste Lauf nachzieht. Festgehalten wird er, damit der Assert unten
    # nicht zwischen "hat keinen Kanal" und "hat einen anderen Kanal"
    # verwechselt.
    tool_update_pinned: {}

  pre_tasks:
    - name: Validate requested tool states
      ansible.builtin.assert:
        that:
          - item.value in ['present', 'absent']
        fail_msg: >-
          Ungueltiger Zustand '{{ item.value }}' fuer '{{ item.key }}'.
          Erlaubt sind nur 'present' und 'absent'.
        quiet: true
      loop: "{{ managed_tools | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

  tasks:
    - name: Apply tool roles
      ansible.builtin.include_role:
        name: "{{ item.key }}"
      vars:
        tool_state: "{{ item.value }}"
      loop: "{{ managed_tools | dict2items }}"
      loop_control:
        label: "{{ item.key }} -> {{ item.value }}"

    # Schutzgeruest gegen halb fertige Rollen: ohne registrierte Origins wuerde
    # ein Tool zwar installiert, aber nie automatisch aktualisiert. Das faellt
    # sonst erst Monate spaeter auf - deshalb bricht der Lauf hier hart ab.
    - name: Ensure every installed tool registered an update source
      ansible.builtin.assert:
        that:
          - >-
            item.key in tool_update_coverage
            or item.key in tool_update_sources
            or item.key in tool_update_pinned
        fail_msg: >-
          Die Rolle '{{ item.key }}' hat keinen Update-Kanal registriert. Jede
          Rolle muss beim Installieren genau eine der drei Buchfuehrungen
          ergaenzen: tool_update_coverage um ihre eigenen apt-Origins (eigenes
          Repository), tool_update_sources um den Kanal, auf den sie sich
          verlaesst (Distributionspaket), oder tool_update_pinned um die
          gepinnte Version (Binary aus GitHub Releases). Sonst gibt es fuer das
          Tool keinen Update-Pfad.
        quiet: true
      loop: "{{ managed_tools | dict2items | selectattr('value', 'equalto', 'present') | list }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Configure unattended-upgrades for all managed tools
      ansible.builtin.include_role:
        name: auto_updates

    #
    # auto_updates sieht die gepinnten Binaries nicht - sie stehen in keiner
    # apt-Konfiguration. Ohne diese Zeile endete der Lauf mit einer
    # Zusammenfassung, in der sie schlicht fehlen, und das laese sich als
    # "wird automatisch aktualisiert" missverstehen.
    #
    - name: Summarise pinned release binaries
      ansible.builtin.debug:
        msg: >-
          Ueber gepinnte Versionen (Renovate hebt an, der naechste Playbook-Lauf
          zieht nach - kein Timer):
          {{ tool_update_pinned.items() | map('join', ' ') | join(', ') }}.
      when: tool_update_pinned | length > 0
