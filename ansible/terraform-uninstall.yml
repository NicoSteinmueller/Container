---
- name: Uninstall Terraform on Ubuntu/Debian
  hosts: all
  become: true

  vars:
    terraform_keyring: "/usr/share/keyrings/hashicorp-archive-keyring.gpg"
    # Setze auf false, wenn das HashiCorp-Repository erhalten bleiben soll
    # (z. B. weil andere HashiCorp-Pakete wie Vault oder Packer installiert sind)
    terraform_remove_repository: true

  tasks:
    - name: Remove Terraform package
      ansible.builtin.apt:
        name: terraform
        state: absent
        purge: true
        autoremove: true

    - name: Remove HashiCorp apt repository
      ansible.builtin.deb822_repository:
        name: hashicorp
        state: absent
      when: terraform_remove_repository | bool

    # Aeltere Installationen legen das Repo im klassischen Ein-Zeilen-Format an.
    # Bleibt die Datei liegen, schlaegt jedes apt update fehl, sobald der
    # referenzierte Keyring geloescht ist.
    - name: Remove legacy HashiCorp apt repository file
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/hashicorp.list
        state: absent
      when: terraform_remove_repository | bool

    - name: Remove HashiCorp signing key
      ansible.builtin.file:
        path: "{{ terraform_keyring }}"
        state: absent
      when: terraform_remove_repository | bool

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      when: terraform_remove_repository | bool

    - name: Check for remaining Terraform binary
      ansible.builtin.command:
        cmd: which terraform
      register: terraform_binary_check
      failed_when: false
      changed_when: false

    - name: Print uninstall result
      ansible.builtin.debug:
        msg: >-
          {{
            'Terraform entfernt.'
            if terraform_binary_check.rc != 0
            else 'Achtung: Terraform ist weiterhin unter '
                 ~ terraform_binary_check.stdout | trim
                 ~ ' vorhanden (manuelle Installation?).'
          }}
