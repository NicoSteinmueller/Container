name: adguard

services:
  adguard:
    # ------------ Identität ------------------------
    image: adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    container_name: adguard

    # ------------ Abhängigkeiten & Start -----------
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 2500M
          pids: 256
        reservations:
          cpus: 0.1
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_RAW
      - NET_ADMIN

    # ----------- Speicher -----------
    read_only: false

    environment:
      TZ: Europe/Berlin