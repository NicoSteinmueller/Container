name: adguard

services:
  adguard:
    # ------------ Identität ------------------------
    image: adguard/adguardhome:v0.107.77@sha256:e6f2b8bcda06064ab055b44933a4f0e983c35558b9cdb8d2e7ab1efcee36d890
    container_name: adguard

    # ------------ Abhängigkeiten & Start -----------
    restart: on-failure
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 1500M
          pids: 128
        reservations:
          cpus: 0.1
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_RAW
      - NET_ADMIN

    # ----------- Speicher -----------
    read_only: false

    environment:
      TZ: Europe/Berlin