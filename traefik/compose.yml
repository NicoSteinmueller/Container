name: traefik

services:
  # TODO https://doc.traefik.io/traefik/setup/docker/
  traefik:
    # ------------ Identität ------------------------
    image: traefik:3.7.12@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf
    container_name: traefik

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    # stop_grace_period gibt Docker genug Zeit, die bond0-IP (192.168.178.5) sauber
    # freizugeben, bevor der neue Container beim Update/Neustart dieselbe IP anfordert.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      crowdsec:
        condition: service_healthy
        restart: true
      docker-proxy:
        condition: service_healthy
        restart: true

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 1.5
          memory: 512M
          pids: 256
        reservations:
          cpus: 0.1
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true
#    cap_drop:
#      - ALL
##    cap_add:
##      - NET_ADMIN

    # ---------- Ports ----------------
    ports:
      - name: http
        target: 80
        host_ip: 127.0.0.1
        published: 80
        protocol: tcp
        app_protocol: http
      - name: https
        target: 443
        host_ip: 127.0.0.1
        published: 443
        protocol: tcp
        app_protocol: https
      - name: https-udp
        target: 443
        host_ip: 127.0.0.1
        published: 443
        protocol: udp
      - name: dashboard
        target: 8080
        host_ip: 127.0.0.1
        published: 8080
        protocol: tcp
        app_protocol: http
      - name: ssh
        target: 2022
        host_ip: 127.0.0.1
        published: 2022
        protocol: tcp

    # ----------- Speicher -----------
    read_only: true

    volumes:
      - /etc/localtime:/etc/localtime:ro

    # ---------- Environment -----------
    # Documentation: https://doc.traefik.io/traefik/v3.0/
    # nur statische Konfiguration über Environment-Variablen
    environment:
      TZ: Europe/Berlin

      # Global Settings
      TRAEFIK_GLOBAL_CHECKNEWVERSION: true
      TRAEFIK_GLOBAL_SENDANONYMOUSUSAGE: false

      # API & Dashboard
      TRAEFIK_API_DASHBOARD: true
      TRAEFIK_API_DISABLEDASHBOARDAD: true
      # TODO
      TRAEFIK_API_INSECURE: false
      TRAEFIK_API_DEBUG: false

      # Ping / Health Check
      TRAEFIK_PING: true
#      TRAEFIK_PING_ENTRYPOINT: ping

      # Entrypoints - Ping
      TRAEFIK_ENTRYPOINTS_PING_ADDRESS: :88

      # Entrypoints - Web (HTTP)
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: :80
      TRAEFIK_ENTRYPOINTS_WEB_TRANSPORT_RESPONDINGTIMEOUTS_READTIMEOUT: 1800s
      TRAEFIK_ENTRYPOINTS_WEB_TRANSPORT_RESPONDINGTIMEOUTS_WRITETIMEOUT: 1800s
      TRAEFIK_ENTRYPOINTS_WEB_TRANSPORT_RESPONDINGTIMEOUTS_IDLETIMEOUT: 180s
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_TO: websecure
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_SCHEME: https
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_PERMANENT: true

      # Entrypoints - WebSecure (HTTPS)
      TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: :443
      TRAEFIK_ENTRYPOINTS_WEBSECURE_TRANSPORT_RESPONDINGTIMEOUTS_READTIMEOUT: 1800s
      TRAEFIK_ENTRYPOINTS_WEBSECURE_TRANSPORT_RESPONDINGTIMEOUTS_WRITETIMEOUT: 1800s
      TRAEFIK_ENTRYPOINTS_WEBSECURE_TRANSPORT_RESPONDINGTIMEOUTS_IDLETIMEOUT: 180s
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP3: true
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS_CERTRESOLVER: letsencrypt
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS_OPTIONS: intermediate@file
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_MIDDLEWARES: secure-headers

      # Entrypoints - SFTPGo
      TRAEFIK_ENTRYPOINTS_SFTPGO_ADDRESS: :2022

      # Entrypoints - Metrics
      TRAEFIK_ENTRYPOINTS_METRICS_ADDRESS: :8082

      # Providers - Docker
      TRAEFIK_PROVIDERS_DOCKER: true
      TRAEFIK_PROVIDERS_DOCKER_ENDPOINT: tcp://docker-proxy:2375
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: false
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: proxy
      TRAEFIK_PROVIDERS_DOCKER_WATCH: true

      # Providers - File
      TRAEFIK_PROVIDERS_FILE_DIRECTORY: /config/dynamic
      TRAEFIK_PROVIDERS_FILE_WATCH: true

      # Logging
      TRAEFIK_LOG_LEVEL: INFO
      TRAEFIK_LOG_FILEPATH: /logs/traefik.log
      TRAEFIK_LOG_FORMAT: json
      TRAEFIK_LOG_MAXSIZE: 20
      TRAEFIK_LOG_MAXBACKUPS: 10
      TRAEFIK_LOG_MAXAGE: 21

      # Access Logging
      TRAEFIK_ACCESSLOG_FILEPATH: /logs/access.log
      TRAEFIK_ACCESSLOG_FORMAT: json
      TRAEFIK_ACCESSLOG_FIELDS_DEFAULTMODE: keep
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_CLIENTUSERNAME: drop
      TRAEFIK_ACCESSLOG_FIELDS_HEADERS_DEFAULTMODE: keep
      TRAEFIK_ACCESSLOG_FIELDS_HEADERS_NAMES_USER_AGENT: keep
      TRAEFIK_ACCESSLOG_FIELDS_HEADERS_NAMES_X_FORWARDED_FOR: keep
      TRAEFIK_ACCESSLOG_FIELDS_HEADERS_NAMES_X_REAL_IP: keep
      TRAEFIK_ACCESSLOG_FIELDS_HEADERS_NAMES_CF_CONNECTING_IP: keep
      TRAEFIK_ACCESSLOG_FIELDS_HEADERS_NAMES_REFERRER: keep
      TRAEFIK_ACCESSLOG_FIELDS_HEADERS_NAMES_CONTENT_TYPE: keep
      TRAEFIK_ACCESSLOG_FIELDS_HEADERS_NAMES_ACCEPT: keep
      TRAEFIK_ACCESSLOG_FIELDS_HEADERS_NAMES_AUTHORIZATION: redact
      TRAEFIK_ACCESSLOG_FIELDS_HEADERS_NAMES_COOKIE: redact
      TRAEFIK_ACCESSLOG_FIELDS_HEADERS_NAMES_SET_COOKIE: redact

      # Metrics - Prometheus
      TRAEFIK_METRICS_PROMETHEUS_ENTRYPOINT: metrics
      TRAEFIK_METRICS_PROMETHEUS_ADDENTRYPOINTSLABELS: true
      TRAEFIK_METRICS_PROMETHEUS_ADDROUTERSLABELS: true
      TRAEFIK_METRICS_PROMETHEUS_ADDSERVICESLABELS: true

#      # Experimental - Plugins
      TRAEFIK_EXPERIMENTAL_PLUGINS_CROWDSEC-BOUNCER_MODULENAME: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      TRAEFIK_EXPERIMENTAL_PLUGINS_CROWDSEC-BOUNCER_VERSION: "v1.6.0"

    labels:
      traefik.enable: true

      # Middlewares
      # CrowdSec Bouncer Middleware (ohne AppSec)
      traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer.enabled: true
      traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer.crowdsecMode: live
      traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer.crowdsecLapiScheme: http
      traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer.crowdsecLapiHost: crowdsec:8080
      traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer.clientTrustedIPs: "192.168.178.0/24"
      traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer.logLevel: INFO

      # CrowdSec Bouncer Middleware (mit AppSec)
      traefik.http.middlewares.crowdsec-appsec.plugin.crowdsec-bouncer.enabled: true
      traefik.http.middlewares.crowdsec-appsec.plugin.crowdsec-bouncer.crowdsecMode: live
      traefik.http.middlewares.crowdsec-appsec.plugin.crowdsec-bouncer.crowdsecLapiScheme: http
      traefik.http.middlewares.crowdsec-appsec.plugin.crowdsec-bouncer.crowdsecLapiHost: crowdsec:8080
      traefik.http.middlewares.crowdsec-appsec.plugin.crowdsec-bouncer.crowdsecAppsecEnabled: true
      traefik.http.middlewares.crowdsec-appsec.plugin.crowdsec-bouncer.crowdsecAppsecHost: crowdsec:7422
      traefik.http.middlewares.crowdsec-appsec.plugin.crowdsec-bouncer.crowdsecAppsecFailureBlock: true
      traefik.http.middlewares.crowdsec-appsec.plugin.crowdsec-bouncer.crowdsecAppsecUnreachableBlock: true
      traefik.http.middlewares.crowdsec-appsec.plugin.crowdsec-bouncer.clientTrustedIPs: "192.168.178.0/24"
      traefik.http.middlewares.crowdsec-appsec.plugin.crowdsec-bouncer.logLevel: INFO

      # Middleware für lokale IP-Beschränkung
      traefik.http.middlewares.local-only.ipallowlist.sourcerange: 192.168.178.0/24

      # Middleware für sichere Headers
      traefik.http.middlewares.secure-headers.headers.frameDeny: true
      traefik.http.middlewares.secure-headers.headers.sslRedirect: true
      traefik.http.middlewares.secure-headers.headers.browserXssFilter: true
      traefik.http.middlewares.secure-headers.headers.contentTypeNosniff: true
      traefik.http.middlewares.secure-headers.headers.forceSTSHeader: true
      traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains: true
      traefik.http.middlewares.secure-headers.headers.stsPreload: true
      traefik.http.middlewares.secure-headers.headers.stsSeconds: 31536000
      traefik.http.middlewares.secure-headers.headers.customFrameOptionsValue: SAMEORIGIN
      traefik.http.middlewares.secure-headers.headers.customResponseHeaders.X-Forwarded-Proto: https

      # Rate Limiting Middleware
      traefik.http.middlewares.rate-limit.ratelimit.average: 100
      traefik.http.middlewares.rate-limit.ratelimit.burst: 50
      traefik.http.middlewares.rate-limit.ratelimit.period: 30s

      # Compress Middleware
      traefik.http.middlewares.compress.compress: true

      # Cache Headers für statische Assets (Bilder, CSS, JS)
      traefik.http.middlewares.cache-static-assets.headers.customResponseHeaders.Cache-Control: "public, max-age=31536000,immutable"
      traefik.http.middlewares.cache-static-assets.headers.customRequestHeaders.Cache-Control: ""
      traefik.http.middlewares.cache-static-assets.headers.customRequestHeaders.Pragma: ""

      # Cache Headers für dynamische Inhalte (kürzere Zeit)
      traefik.http.middlewares.cache-dynamic.headers.customResponseHeaders.Cache-Control: "public, max-age=300, must-revalidate"

      # Kein Caching für sensible Inhalte
      traefik.http.middlewares.no-cache.headers.customResponseHeaders.Cache-Control: "no-store, no-cache, must-revalidate, proxy-revalidate"
      traefik.http.middlewares.no-cache.headers.customResponseHeaders.Pragma: "no-cache"
      traefik.http.middlewares.no-cache.headers.customResponseHeaders.Expires: 0


  docker-proxy:
    # ------------ Identität ------------------------
    image: lscr.io/linuxserver/socket-proxy:3.4.4@sha256:cba12c42b1df30a6446856028f5ab726e9d8921f1ea74be509216c5e41357d42
    container_name: traefik_docker-proxy

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2375/_ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 5s

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 0.20
          memory: 64M
        reservations:
          cpus: 0.05
          memory: 16M
    # Logging begrenzen
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true

    # ----------- Speicher -----------
    read_only: true
    tmpfs:
      - /run
    volumes:
      - /var/run/docker.sock:/run/docker.sock:ro

      # ---------- Environment -----------
    environment:
      CONTAINERS: 1    # Benötigt für Traefik
      NETWORKS: 1      # Benötigt für Traefik
      PING: 1          # Aktiviert den /_ping Endpunkt (Standard: 1)
      VERSION: 1       # Erlaubt Traefik die API-Version abzufragen


  traefik-logrotate:
    # ------------ Identität ------------------------
    container_name: traefik_logrotate
    # Eigenes Mini-Image mit vorinstalliertem logrotate (kein Paketdownload zur Laufzeit).
    build:
      context: ./logrotate
      dockerfile: Dockerfile
    image: traefik-logrotate:local

    # ------------ Abhängigkeiten & Start -----------
    init: true
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        while true; do
          logrotate -s /state/status /etc/logrotate.d/access.logrotate
          sleep 86400
        done
    restart: unless-stopped
    healthcheck:
      # Gesund wenn Traefik im geteilten PID-NS erreichbar ist und logrotate kuerzlich lief.
      test: ["CMD-SHELL", "kill -0 1 && test -f /state/status && find /state/status -mtime -2 | grep -q /state/status"]
      interval: 30m
      timeout: 10s
      retries: 3
      start_period: 2m
    depends_on:
      traefik:
        condition: service_started
        restart: true
    # Gemeinsamer PID-Namespace mit traefik → Traefik laeuft als PID 1 → kill -USR1 1 moeglich,
    # ohne Docker-Socket im Sidecar zu benoetigen.
    pid: "service:traefik"
    network_mode: none

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 0.1
          memory: 64M
          pids: 64
        reservations:
          memory: 16M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true
#    cap_drop:
#      - ALL

    # ---------- Environment -----------
    environment:
      TZ: Europe/Berlin

    # ----------- Speicher -----------
    read_only: true


  crowdsec:
    # ------------ Identität ------------------------
    image: crowdsecurity/crowdsec:v1.7.8@sha256:2f527c9bb8b367120eb08b82890aa912ce96bfa1ada93dda0721700e4b4e0dde
    container_name: traefik_crowdsec

    # ------------ Abhängigkeiten & Start -----------
    init: true
    restart: unless-stopped
    depends_on:
      docker-proxy:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "sh", "-c", "cscli version && wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 180s

    # ----------- Ressourcen -----------
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
          pids: 128
        reservations:
          cpus: 0.1
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    # ----------- Sicherheit -----------
    security_opt:
      - no-new-privileges:true
#    cap_drop:
#      - ALL

    # ---------- Environment -----------
    environment:
      # Prüfen für neue Anwendung: https://app.crowdsec.net/hub/conecllections
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/appsec-crs crowdsecurity/appsec-crs-exclusion-plugin-nextcloud crowdsecurity/sshd crowdsecurity/linux crowdsecurity/iptables crowdsecurity/base-http-scenarios crowdsecurity/http-dos crowdsecurity/whitelist-good-actors crowdsecurity/nextcloud gauth-fr/immich"
      TZ: Europe/Berlin

    # ----------- Speicher -----------
    volumes:
      - /etc/localtime:/etc/localtime:ro


