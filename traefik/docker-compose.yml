# docker-compose.yml
#
# Umgebungsvariablen:
# ┌──────────────────────────┬────────────────────────────────┬──────────────────────────────────────────────────────────┐
# │ Variable                 │ Beispiel                       │ Erklärung                                                │
# ├──────────────────────────┼────────────────────────────────┼──────────────────────────────────────────────────────────┤
# │ IONOS_API_KEY            │ abc123def456ghi789...          │ API-Key für IONOS DNS Challenge                          │
# │ CROWDSEC_ENROLL_KEY      │ abc123def456ghi789...          │ Enrollment Key für CrowdSec Console (optional)           │
# │                          │                                │ Erstellen : https://app.crowdsec.net/security-engines    │
# │                          │                                │ Entspricht: cscli console enroll <KEY>                   │
# └──────────────────────────┴────────────────────────────────┴──────────────────────────────────────────────────────────┘
#
# CrowdSec Bouncer API Key Setup:
# Nach dem ersten Start von CrowdSec:
# 1. docker exec crowdsec cscli bouncers add traefik-bouncer
# 2. Den generierten API-Key in config/dynamic/middlewares.yml bei crowdsecLapiKey eintragen
#
services:
  traefik:
    image: traefik:3.7.0@sha256:84425c2c9a4c37f97ace3ff24705422162d5550bba43227990a3be026aab3dbb
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    # stop_grace_period gibt Docker genug Zeit, die bond0-IP (192.168.178.5) sauber
    # freizugeben, bevor der neue Container beim Update/Neustart dieselbe IP anfordert.
    stop_grace_period: 30s

    networks:
      proxy:
      bond0:
        ipv4_address: 192.168.178.5
#      monitoring:

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "443:443/tcp"
      - "8080:8080"
      - "2022:2022"

    environment:
      # IONOS DNS Challenge
      # API Key erstellen unter: https://developer.hosting.ionos.de/keys
      # Nur Berechtigung TXT-Record (DNS) erforderlich (kein Zugriff auf z.B. A-Records oder andere Ressourcen notwendig)
      IONOS_API_KEY: ${IONOS_API_KEY}

      TZ: Europe/Berlin

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - geoblock:/data/geoblock
      - /mnt/user/appdata/traefik/traefik.yml:/traefik.yml:ro
      - /mnt/user/appdata/traefik/dynamic:/config/dynamic:ro
      - /mnt/user/logs/traefik:/logs

    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    depends_on:
      crowdsec:
        condition: service_started
        restart: true

    labels:
      traefik.enable: true
      # Router
      traefik.http.routers.traefik-dashboard.rule: Host(`traefik.local.nico-steinmueller.de`)
      traefik.http.routers.traefik-dashboard.entrypoints: websecure
      traefik.http.routers.traefik-dashboard.middlewares: local-only@file
      # Service → internes Dashboard API
      traefik.http.routers.traefik-dashboard.service: api@internal
      traefik.http.services.traefik-dashboard.loadbalancer.server.port: 8080


  traefik-logrotate:
    # Kein eigenes Image – direkt alpine; logrotate wird beim Start einmalig installiert.
    image: alpine:3.22
    container_name: traefik-logrotate
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    network_mode: none
    # Gemeinsamer PID-Namespace mit traefik → Traefik laeuft als PID 1 → kill -USR1 1 moeglich,
    # ohne Docker-Socket im Sidecar zu benoetigen.
    pid: "service:traefik"

    depends_on:
      traefik:
        condition: service_started

    environment:
      TZ: Europe/Berlin

    volumes:
      - /mnt/user/logs/traefik:/logs
      - traefik-logrotate-state:/state

    command:
      - /bin/sh
      - -c
      - |
        set -eu
        apk add --no-cache logrotate --quiet
        cat > /tmp/access.logrotate <<'EOF'
        /logs/access.log {
            daily
            rotate 21
            missingok
            notifempty
            compress
            delaycompress
            sharedscripts
            postrotate
                kill -USR1 1 || true
            endscript
        }
        EOF
        while true; do
          logrotate -s /state/status /tmp/access.logrotate
          sleep 86400
        done


  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.6@sha256:63b595fef92de1778573b375897a45dd226637ee9a3d3db9f57ac7355c369493
    container_name: crowdsec
    restart: unless-stopped

    networks:
      proxy:

    # genutzte Ports
    # 6060/tcp: Prometheus metrics port
    # 8080/tcp: API port
    # https://docs.crowdsec.net/u/getting_started/intro/

    environment:
      # Prüfen für neue Anwendung: https://app.crowdsec.net/hub/conecllections
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/appsec-crs  crowdsecurity/appsec-crs-exclusion-plugin-nextcloud crowdsecurity/sshd crowdsecurity/linux crowdsecurity/iptables crowdsecurity/base-http-scenarios crowdsecurity/http-dos crowdsecurity/whitelist-good-actors crowdsecurity/nextcloud"
      GID: "1000"
      TZ: Europe/Berlin
      # ENROLL_KEY auskommentiert - Instanz bereits enrolled, Key verursacht "Forbidden"-Fehler
      ENROLL_KEY: ${CROWDSEC_ENROLL_KEY:-}
      ENROLL_INSTANCE_NAME: traefik

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - crowdsec-data:/var/lib/crowdsec/data/
      - crowdsec-config:/etc/crowdsec/
      - /mnt/user/logs/traefik:/var/log/traefik:ro
      - /mnt/user/appdata/traefik/crowdsec:/etc/crowdsec/acquis.d:ro

    healthcheck:
      test: ["CMD", "sh", "-c", "cscli version && wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 180s


volumes:
  letsencrypt:
  geoblock:
  crowdsec-data:
  crowdsec-config:
  traefik-logrotate-state:

networks:
  proxy:
    # TODO: evtl. direkt anlegen mit "docker network create proxy" und dann hier "external: true" setzen
    name: proxy
  bond0:
    external: true
    ipam:
      config:
        - subnet: 192.168.178.0/24
#  monitoring:
#    external: true
