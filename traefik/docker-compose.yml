# docker-compose.yml
#
# Umgebungsvariablen:
# ┌──────────────────────────┬────────────────────────────────┬──────────────────────────────────────────────────────────┐
# │ Variable                 │ Beispiel                       │ Erklärung                                                │
# ├──────────────────────────┼────────────────────────────────┼──────────────────────────────────────────────────────────┤
# │ IONOS_API_KEY            │ abc123def456ghi789...          │ API-Key für IONOS DNS Challenge                          │
# │ CROWDSEC_ENROLL_KEY      │ abc123def456ghi789...          │ Enrollment Key für CrowdSec Console (optional)           │
# │                          │                                │ Erstellen : https://app.crowdsec.net/security-engines    │
# │                          │                                │ Entspricht: cscli console enroll <KEY>                   │
# │ TRAEFIK_LOCATION         │ ./config                       │ Pfad zur Traefik-Hauptkonfiguration                      │
# └──────────────────────────┴────────────────────────────────┴──────────────────────────────────────────────────────────┘
#
# CrowdSec Bouncer API Key Setup:
# Nach dem ersten Start von CrowdSec:
# 1. docker exec crowdsec cscli bouncers add traefik-bouncer
# 2. Den generierten API-Key in config/dynamic/middlewares.yml bei crowdsecLapiKey eintragen
#
services:
  traefik:
    image: traefik:v3.6.8@sha256:90099f8948c828ecf0ababd711a4359a2443eba12261c1df2f548a3b1d815938
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    labels:
      traefik.enable: true
      # Router
      traefik.http.routers.traefik-dashboard.rule: Host(`traefik.local.nico-steinmueller.de`)
      traefik.http.routers.traefik-dashboard.entrypoints: websecure
      traefik.http.routers.traefik-dashboard.middlewares: secure-local@file
      # Service → internes Dashboard API
      traefik.http.routers.traefik-dashboard.service: api@internal
      traefik.http.services.traefik-dashboard.loadbalancer.server.port: 8080

    networks:
      proxy:
      bond0:
        ipv4_address: 192.168.178.5
#      monitoring:

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "443:443/tcp"
      - "8080:8080"

    environment:
      # IONOS DNS Challenge
      # API Key erstellen unter: https://developer.hosting.ionos.de/keys
      # Nur Berechtigung TXT-Record (DNS) erforderlich (kein Zugriff auf z.B. A-Records oder andere Ressourcen notwendig)
      IONOS_API_KEY: ${IONOS_API_KEY}

      TZ: Europe/Berlin

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - geoblock:/data/geoblock
      - ${TRAEFIK_LOCATION:-./config}/traefik.yml:/traefik.yml:ro
      - ${TRAEFIK_LOCATION:-./config}/dynamic:/config/dynamic:ro
      - ${TRAEFIK_LOCATION:-.}/logs:/logs

    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    depends_on:
      crowdsec:
        condition: service_started
        restart: true

  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.6@sha256:63b595fef92de1778573b375897a45dd226637ee9a3d3db9f57ac7355c369493
    container_name: crowdsec
    restart: unless-stopped

    networks:
      proxy:

    # genutzte Ports
    # 6060/tcp: Prometheus metrics port
    # 8080/tcp: API port
    # https://docs.crowdsec.net/u/getting_started/intro/

    environment:
      # Prüfen für neue Anwendung: https://app.crowdsec.net/hub/collections
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/appsec-crs crowdsecurity/sshd crowdsecurity/linux crowdsecurity/iptables crowdsecurity/base-http-scenarios crowdsecurity/http-dos crowdsecurity/whitelist-good-actors crowdsecurity/nextcloud crowdsecurity/appsec-crs-exclusion-plugin-nextcloud"
      PARSER: "crowdsecurity/nextcloud-whitelist"
#      GID: "1000"
      TZ: Europe/Berlin
      ENROLL_KEY: ${CROWDSEC_ENROLL_KEY:-}
      ENROLL_INSTANCE_NAME: traefik

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - crowdsec-data:/var/lib/crowdsec/data/
      - crowdsec-config:/etc/crowdsec/
      - ${TRAEFIK_LOCATION:-.}/logs:/var/log/traefik:ro
      - ${TRAEFIK_LOCATION:-./config}/crowdsec:/etc/crowdsec/acquis.d:ro
      # Überschreibt die CRS AppSec-Config um das Nextcloud-Plugin einzubinden
      - ${TRAEFIK_LOCATION:-./config}/crowdsec/appsec-config-crs.yaml:/etc/crowdsec/appsec-configs/crs.yaml:ro

    healthcheck:
      test: ["CMD", "sh", "-c", "cscli version && wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 180s


volumes:
  letsencrypt:
  geoblock:
  crowdsec-data:
  crowdsec-config:

networks:
  proxy:
    # TODO: evtl. direkt anlegen mit "docker network create proxy" und dann hier "external: true" setzen
    name: proxy
  bond0:
    external: true
    ipam:
      config:
        - subnet: 192.168.178.0/24
#  monitoring:
#    external: true
