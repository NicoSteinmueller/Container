# docker-compose.yml
services:
  traefik:
    image: traefik:v3.6@sha256:a9890c898f379c1905ee5b28342f6b408dc863f08db2dab20e46c267d1ff463a
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    networks:
      - proxy
      - bond0

    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

    command:
      # Global
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      # Log
      - --log.level=DEBUG  # TODO change to INFO or ERROR in production
      # API
      - --api.dashboard=true
      - --api.insecure=true
      # Providers
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=proxy
      # EntryPoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Let's Encrypt configuration
      - --certificatesresolvers.le.acme.email=nico.steinmueller@gmx.net
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web

volumes:
  letsencrypt:

networks:
  proxy:
    name: proxy
  bond0:
    external: true