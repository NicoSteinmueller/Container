# docker-compose.yml
#
# Umgebungsvariablen:
# ┌──────────────────────────┬────────────────────────────────┬──────────────────────────────────────────────────────────┐
# │ Variable                 │ Beispiel                       │ Erklärung                                                │
# ├──────────────────────────┼────────────────────────────────┼──────────────────────────────────────────────────────────┤
# │ IONOS_API_KEY            │ abc123def456ghi789...          │ API-Key für IONOS DNS Challenge                          │
# │ CROWDSEC_ENROLL_KEY      │ abc123def456ghi789...          │ Enrollment Key für CrowdSec Console (optional)           │
# │                          │                                │ Erstellen : https://app.crowdsec.net/security-engines    │
# │                          │                                │ Entspricht: cscli console enroll <KEY>                   │
# │ TRAEFIK_LOCATION         │ ./config                       │ Pfad zur Traefik-Hauptkonfiguration                      │
# └──────────────────────────┴────────────────────────────────┴──────────────────────────────────────────────────────────┘
#
# CrowdSec Bouncer API Key Setup:
# Nach dem ersten Start von CrowdSec:
# 1. docker exec crowdsec cscli bouncers add traefik-bouncer
# 2. Den generierten API-Key in config/dynamic/middlewares.yml bei crowdsecLapiKey eintragen
#
services:
  traefik:
    image: traefik:v3.6.8
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    networks:
      proxy:
      bond0:
        ipv4_address: 192.168.178.5
#      monitoring:

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "443:443/tcp"
      - "8080:8080"

    environment:
      # IONOS DNS Challenge
      # API Key erstellen unter: https://developer.hosting.ionos.de/keys
      # Nur Berechtigung TXT-Record (DNS) erforderlich (kein Zugriff auf z.B. A-Records oder andere Ressourcen notwendig)
      IONOS_API_KEY: ${IONOS_API_KEY}


      TZ: Europe/Berlin

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - ${TRAEFIK_LOCATION:-./config}/traefik.yml:/traefik.yml:ro
      - ${TRAEFIK_LOCATION:-./config}/dynamic:/config/dynamic:ro
      - ${TRAEFIK_LOCATION:-.}/logs:/logs

    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    depends_on:
      - crowdsec

  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.6
    container_name: crowdsec
    restart: unless-stopped

    networks:
      proxy:

    environment:
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve"
#      GID: "1000"
      TZ: Europe/Berlin
      ENROLL_KEY: ${CROWDSEC_ENROLL_KEY:-}
      ENROLL_INSTANCE_NAME: traefik

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - crowdsec-data:/var/lib/crowdsec/data/
      - crowdsec-config:/etc/crowdsec/
      - ${TRAEFIK_LOCATION:-.}/logs:/var/log/traefik:ro
      - ${TRAEFIK_LOCATION:-./config}/crowdsec:/etc/crowdsec/acquis.d:ro


volumes:
  letsencrypt:
  crowdsec-data:
  crowdsec-config:

networks:
  proxy:
    # TODO: evtl. direkt anlegen mit "docker network create proxy" und dann hier "external: true" setzen
    name: proxy
  bond0:
    external: true
    ipam:
      config:
        - subnet: 192.168.178.0/24
#  monitoring:
#    external: true
