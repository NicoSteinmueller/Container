# ============================================
# TRAEFIK STATISCHE KONFIGURATION
# ============================================
# Dokumentation: https://doc.traefik.io/traefik/

# ============================================
# API & Dashboard
# ============================================
api:
  dashboard: true
  insecure: true  # Dashboard über Port 8080 (für Development)
  # Für Produktion: insecure: false und Dashboard über HTTPS

# ============================================
# Entry Points (Ports)
# ============================================
entryPoints:
  web:
    address: ":80"
    # HTTP zu HTTPS Redirect (global)
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        # Standard TLS-Optionen
        options: default
        certResolver: letsencrypt
    # HTTP/3 aktivieren (optional)
    # http3:
    #   advertisedPort: 443

# ============================================
# Certificate Resolvers (Let's Encrypt)
# ============================================
certificatesResolvers:
  # Let's Encrypt mit HTTP Challenge
  letsencrypt:
    acme:
      email: your-email@example.com  # BITTE ÄNDERN!
      storage: /letsencrypt/acme.json
      # Staging für Tests (keine Rate Limits)
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      httpChallenge:
        entryPoint: web

  # Let's Encrypt mit DNS Challenge (Cloudflare)
  # cloudflare:
  #   acme:
  #     email: your-email@example.com
  #     storage: /letsencrypt/acme-cloudflare.json
  #     # Staging für Tests
  #     # caServer: https://acme-staging-v02.api.letsencrypt.org/directory
  #     dnsChallenge:
  #       provider: cloudflare
  #       delayBeforeCheck: 0
  #       resolvers:
  #         - "1.1.1.1:53"
  #         - "8.8.8.8:53"

# ============================================
# Providers
# ============================================
providers:
  # Docker Provider (Auto-Discovery)
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false  # Nur Container mit traefik.enable=true
    network: proxy           # Standard-Netzwerk
    watch: true              # Auto-Update bei Container-Änderungen

  # File Provider (für zusätzliche statische Konfiguration)
  file:
    filename: /config.yml
    watch: true

# ============================================
# Logs
# ============================================
log:
  level: INFO  # DEBUG, INFO, WARN, ERROR
  filePath: /logs/traefik.log
  format: json  # json oder common

# Access Logs
accessLog:
  filePath: /logs/access.log
  format: json
  bufferingSize: 100
  filters:
    statusCodes:
      - "200"
      - "300-302"
      - "400-499"
      - "500-599"

# ============================================
# Global Configuration
# ============================================
global:
  checkNewVersion: true
  sendAnonymousUsage: false

