# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3.json
# Traefik v3 Configuration
# Documentation: https://doc.traefik.io/traefik/v3.0/
# TODO: nach Aktualisierung auf server laden
global:
  checkNewVersion: true
  sendAnonymousUsage: false

api:
  dashboard: true
  # TODO prüfen
  insecure: true
  # TODO prüfen
  debug: true

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy
  file:
    directory: /config/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: nico.steinmueller@gmx.net
      storage: /letsencrypt/acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory # Let's Encrypt Production Server
#      caServer: https://acme-staging-v02.api.letsencrypt.org/directory # Let's Encrypt Staging Server (für Tests)
      dnsChallenge:
        provider: ionos
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
        delayBeforeCheck: "30"

entryPoints:
  ping:
    address: :88
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: :443
    http3: {}
    http:
      tls:
        certResolver: letsencrypt
        options: minimal@file
      middlewares:
        - secure-headers@file

ping:
    entryPoint: ping


log:
  level: DEBUG # TODO change to INFO or ERROR in production
  filePath: /logs/traefik.log
  format: json
  maxSize: 10
  maxBackups: 10
  maxAge: 14

accessLog:
  filePath: /logs/access.log
  format: json
#  filters:
#    statusCodes:
#      - "200"
#      - "400-404"
#      - "500-503"
  fields:
    # modes are "keep", "drop" or "redact"
    defaultMode: keep
    names:
      # https://doc.traefik.io/traefik/reference/install-configuration/observability/logs-and-accesslogs/#json-format-fields
      ClientUsername: drop
    headers:
      defaultMode: keep
      names:
        User-Agent: keep
        X-Forwarded-For: keep
        X-Real-Ip: keep
        CF-Connecting-IP: keep
        Referrer: keep
        Content-Type: keep
        Accept: keep
        Authorization: redact
        Cookie: redact          # Zeigt "REDACTED" wenn Cookie vorhanden
        Set-Cookie: redact

