# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3.json
# Traefik v3 Configuration
# Documentation: https://doc.traefik.io/traefik/v3.0/
# TODO: nach Aktualisierung auf server laden
global:
  checkNewVersion: true
  sendAnonymousUsage: false

api:
  dashboard: true
  # TODO prüfen
  insecure: true
  # TODO prüfen
  debug: true

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy

certificatesResolvers:
  letsencrypt:
    acme:
      email: nico.steinmueller@gmx.net
      storage: /letsencrypt/acme.json # TODO: evtl. auf Server speichern statt volume
      #caServer: https://acme-v02.api.letsencrypt.org/directory # TODO: Let's Encrypt Production Server
      caServer: https://acme-staging-v02.api.letsencrypt.org/directory # Let's Encrypt Staging Server (für Tests)
      dnsChallenge:
        provider: ionos
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
        delayBeforeCheck: "30"

entryPoints:
  ping:
    address: :88
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: :443
    http3: {}
    http:
      tls:
        certResolver: letsencrypt
      middlewares:
        - secure-headers

ping:
    entryPoint: ping

# Middleware für lokale IP-Beschränkung
http:
  middlewares:
    local-only:
      ipAllowList:
        sourceRange:
          - "127.0.0.1/32"      # Localhost
          - "192.168.0.0/16"    # Privates Netzwerk 192.168.x.x
          - "10.0.0.0/8"        # Privates Netzwerk 10.x.x.x
          - "172.16.0.0/12"     # Privates Netzwerk 172.16-31.x.x
          # TODO: Hier Ihre spezifischen lokalen IP-Bereiche eintragen
    secure-headers:
      headers:
        frameDeny: true
        sslRedirect: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: SAMEORIGIN
        customResponseHeaders:
          X-Forwarded-Proto: https
#    secure-local-only:
#      chain:
#        middlewares:
#          - secure-headers
#          - local-only

log:
  level: DEBUG # TODO change to INFO or ERROR in production
#  filePath: /logs/traefik.log
  format: json
  maxSize: 10
  maxBackups: 10
  maxAge: 14

accessLog:
  filePath: /logs/access.log
  format: json
  fields:
    defaultMode: keep
    names:
      ClientUsername: drop
      ClientPassword: drop
#      RequestHeaderNames: drop
#      ResponseHeaderNames: drop
#      RequestBody: drop
#      ResponseBody: drop
    headers:
      defaultMode: keep
      names:
        User-Agent: keep
        X-Forwarded-For: keep
        X-Real-Ip: keep
        CF-Connecting-IP: keep
        Referrer: keep
        Content-Type: keep
        Accept: keep
        Authorization: redact
        Cookie: redact
        Set-Cookie: redact
