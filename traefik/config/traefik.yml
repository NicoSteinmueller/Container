# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3.json
# Traefik v3 Configuration
# Documentation: https://doc.traefik.io/traefik/v3.0/
# TODO: nach Aktualisierung auf server laden
global:
  checkNewVersion: true
  sendAnonymousUsage: false

api:
  dashboard: true
  disabledashboardad: true
  # TODO
  insecure: true
  debug: false

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy
  file:
    directory: /config/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: nico.steinmueller@gmx.net
      storage: /letsencrypt/acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory # Let's Encrypt Production Server
#      caServer: https://acme-staging-v02.api.letsencrypt.org/directory # Let's Encrypt Staging Server (für Tests)
      dnsChallenge:
        provider: ionos
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
        delayBeforeCheck: "30"

entryPoints:
  ping:
    address: :88
  web:
    address: :80
    transport:
      respondingTimeouts:
        readTimeout: 1800s
        writeTimeout: 1800s
        idleTimeout: 180s
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: :443
    transport:
      respondingTimeouts:
        readTimeout: 1800s
        writeTimeout: 1800s
        idleTimeout: 180s
    http3: {}
    http:
      tls:
        certResolver: letsencrypt
        options: modern@file
      middlewares:
        - secure-headers@file
  sftpgo:
    address: :2022

ping:
    entryPoint: ping


log:
  level: INFO
  filePath: /logs/traefik.log
  format: json
  maxSize: 20
  maxBackups: 10
  maxAge: 21

accessLog:
  filePath: /logs/access.log
  format: json
  # Rotation & 14-Tage-Retention ueber logrotate-Sidecar in docker-compose.yml.
  # Traefik oeffnet die Datei nach USR1 sauber neu (kill -USR1 1 im Sidecar).
#  filters:
#    statusCodes:
#      - "200"
#      - "400-404"
#      - "500-503"
  fields:
    # modes are "keep", "drop" or "redact"
    defaultMode: keep
    names:
      # https://doc.traefik.io/traefik/reference/install-configuration/observability/logs-and-accesslogs/#json-format-fields
      ClientUsername: drop
    headers:
      defaultMode: keep
      names:
        User-Agent: keep
        X-Forwarded-For: keep
        X-Real-Ip: keep
        CF-Connecting-IP: keep
        Referrer: keep
        Content-Type: keep
        Accept: keep
        Authorization: redact
        Cookie: redact          # Zeigt "REDACTED" wenn Cookie vorhanden
        Set-Cookie: redact

#metrics:
#  prometheus:
#    addEntryPointsLabels: true
#    addRoutersLabels: true
#    addServicesLabels: true
#    entryPoint: traefik  # Metriken verfügbar auf Port 8080



experimental:
  plugins:
    # https://plugins.traefik.io/plugins
    # https://plugins.traefik.io/plugins/6335346ca4caa9ddeffda116/crowdsec-bouncer-traefik-plugin
    crowdsec-bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.5.0
    # https://plugins.traefik.io/plugins/67f17dc768f0062a5d501e5e/LICENSE
    geoblock:
      moduleName: github.com/david-garcia-garcia/traefik-geoblock
      version: v1.1.4
      settings:
        useunsafe: true
