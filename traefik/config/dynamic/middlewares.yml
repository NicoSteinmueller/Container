# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3-dynamic.json
# Traefik v3 Dynamic Configuration - Middlewares
# Documentation: https://doc.traefik.io/traefik/v3.0/middlewares/overview/

http:
  middlewares:
    # CrowdSec Bouncer Middleware
    crowdsec:
      plugin:
        crowdsec-bouncer:
          enabled: true
          crowdsecMode: live
          crowdsecLapiScheme: http
          crowdsecLapiHost: crowdsec:8080
          # Generieren mit: docker exec crowdsec cscli bouncers add traefik-bouncer
          crowdsecLapiKey: # TODO Key hinzufügen bevor auf Server laden
          crowdsecAppsecEnabled: true
          crowdsecAppsecHost: crowdsec:7422
          crowdsecAppsecFailureBlock: true
          crowdsecAppsecUnreachableBlock: true
          CrowdsecAppsecBodyLimit: 10485760 # (= 10MB) TODO evtl. anpassen
#          forwardedHeadersTrustedIPs:
#            - "192.168.178.0/24"
          clientTrustedIPs:
            - "192.168.178.0/24"
          logLevel: INFO

    geoblock:
      plugin:
        geoblock:
          enabled: true
          # Alle Länder blockieren, außer den explizit erlaubten
          defaultAllow: false
          allowedCountries:
            - DE # Deutschland

          # Sicherheit & Performance Einstellungen
          allowPrivate: true # Erlaubt interne Zugriffe (RFC 1918), z.B. Health-Checks

          # IP Extraktion
          ipHeaders:
            - x-forwarded-for           # check X-Forwarded-For header first
            - x-real-ip                 # check X-Real-IP header second
          ipHeaderStrategy: CheckAll

          # Blockiert bei Fehlern in der Geoblock-Überprüfung (z.B. Datenbankfehler)
          banIfError: true
          disallowedStatusCode: 403

          # Log Configuration
          logLevel: info
          logFormat: json
          logPath: # leer für Standard-Logging von Traefik, oder Pfad für eigenes Logfile (z.B. /logs/geoblock.log)
          logBannedRequests: false # logStatusHeader + logStatusDetailHeader nutzen

          # Hält die Länderdatenbank automatisch aktuell
          databaseAutoUpdate: true
          # Directory to store updated databases. This must be a persistent volume in the traefik pod.
          databaseAutoUpdateDir: /data/geoblock
          databaseFilePath: /data/geoblock

          # Observability: Status in die Traefik Access Logs schreiben
          countryHeader: X-IPCountry
          logStatusHeader: X-Geoblock-Status
          logStatusDetailHeader: X-Geoblock-Detail

    # Middleware für lokale IP-Beschränkung
    local-only:
      ipAllowList:
        sourceRange:
          - "192.168.178.0/24"    # Privates Netzwerk 192.168.178.x

    # Middleware für sichere Headers
    secure-headers:
      headers:
        frameDeny: true
        sslRedirect: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: SAMEORIGIN
        # referrerPolicy: "strict-origin-when-cross-origin"
        # contentSecurityPolicy: "default-src 'self'"
        customResponseHeaders:
          X-Forwarded-Proto: https

    # Kombinierte Middleware für sichere lokale Zugriffe
    secure-local-only:
      chain:
        middlewares:
          - secure-headers
          - local-only

    # Rate Limiting Middleware (optional)
    rate-limit:
      rateLimit:
        average: 100
        period: 1s
        burst: 50

    # Basic Auth Middleware (Beispiel - Credentials müssen angepasst werden)
    # Generieren mit: htpasswd -nb user password
    # basic-auth:
    #   basicAuth:
    #     users:
    #       - "admin:$apr1$..." # TODO: Anpassen

    # Compress Middleware für bessere Performance
    compress:
      compress: {}

    # Cache Headers für statische Assets (Bilder, Fonts, CSS, JS mit Hash/Version)
    cache-static-assets:
      headers:
        customResponseHeaders:
          Cache-Control: "public, max-age=31536000, immutable"
        customRequestHeaders:
          # Entferne potenzielle No-Cache Headers
          Cache-Control: ""
          Pragma: ""

    # Cache Headers für dynamische Inhalte (kürzere Cache-Zeit)
    cache-dynamic:
      headers:
        customResponseHeaders:
          Cache-Control: "public, max-age=3600, must-revalidate"

    # Kein Cache für sensible Bereiche
    no-cache:
      headers:
        customResponseHeaders:
          Cache-Control: "no-store, no-cache, must-revalidate, proxy-revalidate"
          Pragma: "no-cache"
          Expires: "0"
